# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: order-flow-types-match
    kind: matching
    prompt:
      en: "Match each order flow concept to its role in market mechanics."
      es: "Empareja cada concepto de flujo de órdenes con su papel en la mecánica del mercado."
    pairs:
      - id: passive
        left: { en: "Passive Liquidity", es: "Liquidez Pasiva" }
        right:
          en: "Limit orders residing on the order book awaiting execution (provides liquidity)."
          es: "Órdenes límite en el libro a la espera de ejecución (proporcionan liquidez)."
      - id: aggressive
        left: { en: "Aggressive Orders", es: "Órdenes Agresivas" }
        right:
          en: "Market orders executing immediately against resting limit orders (consumes liquidity)."
          es: "Órdenes a mercado ejecutadas inmediatamente contra límite existentes (consumen liquidez)."
      - id: absorption
        left: { en: "Order Absorption", es: "Absorción de Órdenes" }
        right:
          en: "Heavy market order volume failing to push price past a large resting limit wall."
          es: "Gran volumen de órdenes a mercado que no logra mover el precio tras un muro de límite."
    explanation:
      en: "Market prices move when aggressive market orders consume all resting passive limit orders at a given price level."
      es: "Los precios se mueven cuando las órdenes a mercado agresivas consumen todas las órdenes límite pasivas existentes en un nivel."

  - id: absorption-signals
    kind: multi_select
    prompt:
      en: "Which of the following indicate that passive absorption is taking place?"
      es: "¿Cuáles de los siguientes indican que está habiendo absorción pasiva?"
    options:
      - id: a
        correct: true
        text:
          en: "High volume while price stays stuck at a key level."
          es: "Alto volumen con el precio atascado en un nivel clave."
      - id: b
        correct: true
        text:
          en: "Aggressive buy market orders failing to make Higher Highs."
          es: "Órdenes de compra agresivas que no crean Máximos Más Altos."
      - id: c
        correct: false
        text:
          en: "Declining volume during a rapid breakout through a thin patch of liquidity."
          es: "Volumen decreciente durante una rotura rápida por una zona de poca liquidez."
      - id: d
        correct: true
        text:
          en: "Cumulative delta rising sharply while price moves sideways."
          es: "Delta acumulado subiendo con fuerza mientras el precio va de lado."
    explanation:
      en: "Absorption happens when passive buyers or sellers absorb large market orders without allowing price to progress: heavy aggression meeting an unmoved price. The thin-liquidity breakout is the opposite picture — little aggression moving price a long way — which is why it says nothing about absorption."
      es: "La absorción ocurre cuando compradores o vendedores pasivos absorben grandes órdenes a mercado sin permitir que el precio avance: agresión intensa contra un precio que no se mueve. La rotura con poca liquidez es la imagen contraria —poca agresión moviendo mucho el precio— y por eso no dice nada sobre absorción."

  - id: taker-vs-maker-truth
    kind: true_false
    prompt:
      en: "A buyer using a market order is guaranteed to be an informed institutional trader."
      es: "Un comprador que usa una orden a mercado tiene garantizado ser un trader institucional informado."
    answer: false
    explanation:
      en: "Taker market order flow includes retail panic buying, stop-loss executions, and forced liquidations. Institutional size often builds via passive limit orders."
      es: "El flujo taker a mercado incluye compras de pánico minoristas, ejecuciones de stop-loss y liquidaciones forzosas. El tamaño institucional a menudo se construye vía órdenes límite pasivas."

  - id: aggressor-misconception
    kind: single_choice
    prompt:
      en: "Why is a high negative delta combined with price refusing to fall a bullish signal?"
      es: "¿Por qué un delta negativo elevado combinado con un precio que se niega a caer es una señal alcista?"
    options:
      - id: a
        text:
          en: "Negative delta means every short trader is being forced to buy back in."
          es: "Delta negativo significa que todos los cortos están obligados a recomprar."
      - id: b
        text:
          en: "Price always follows the delta, so a negative delta will drag it down."
          es: "El precio siempre sigue al delta, así que un delta negativo lo arrastrará."
      - id: c
        correct: true
        text:
          en: "Passive limit buyers are quietly absorbing all of the sell pressure there."
          es: "Compradores límite pasivos absorben la presión vendedora."
      - id: d
        text:
          en: "Heavy selling with no fall means the venue is reporting inflated volume."
          es: "Vender fuerte sin caída significa que el venue reporta volumen inflado."
    explanation:
      en: "Heavy aggressive selling that produces zero price breakdown indicates absorption on the bid side: someone with size is quietly taking every market sell without letting price through. Note the trap — delta is pressure, not a forecast, so 'price follows delta' gets this exactly backwards, and the interesting signal is precisely the divergence."
      es: "Ventas agresivas intensas que producen cero caída de precio indican absorción en el lado de la compra: alguien con tamaño se queda en silencio con cada venta a mercado sin dejar pasar el precio. Ojo a la trampa: el delta es presión, no pronóstico, así que «el precio sigue al delta» lo entiende justo al revés, y la señal interesante es precisamente la divergencia."

  - id: order-execution-sequence
    kind: ordering
    prompt:
      en: "Order the mechanics of a market order filling on an exchange order book."
      es: "Ordena la mecánica del llenado de una orden a mercado en el libro de un exchange."
    items:
      - id: step-1
        position: 1
        text:
          en: "Trader sends aggressive market buy order to the exchange."
          es: "El trader envía una orden de compra a mercado agresiva al exchange."
      - id: step-2
        position: 2
        text:
          en: "Engine matches the market buy with the lowest available ask limit order."
          es: "El motor empareja la compra a mercado con la orden límite de venta más baja disponible."
      - id: step-3
        position: 3
        text:
          en: "If size exceeds the lowest ask, remaining contracts sweep higher ask price tiers (slippage)."
          es: "Si el tamaño supera la venta más baja, los contratos restantes barren niveles de venta superiores (slippage)."
      - id: step-4
        position: 4
        text:
          en: "Trade executes, delta records net positive aggressive volume, and last price updates."
          es: "La operación se ejecuta, el delta registra volumen agresivo positivo neto y el último precio se actualiza."
    explanation:
      en: "Market orders consume order book depth sequentially from best price upward, causing slippage if size exceeds top of book."
      es: "Las órdenes a mercado consumen la profundidad del libro secuencialmente desde el mejor precio hacia arriba, causando slippage si el tamaño supera el top del libro."

  - id: limit-order-wall-impact
    kind: single_choice
    prompt:
      en: "How does a massive passive limit order wall on the ask side affect market aggressive buyers?"
      es: "¿Cómo afecta un muro masivo de órdenes límite pasivas de venta a los compradores agresivos del mercado?"
    options:
      - id: a
        text:
          en: "It forces market orders to be re-routed as limit orders automatically."
          es: "Obliga a que las órdenes a mercado se reenvíen como límite automáticamente."
      - id: b
        correct: true
        text:
          en: "Aggressive buys fill at the wall price, halting progress until it is consumed."
          es: "Las compras agresivas se llenan al precio del muro hasta consumirlo."
      - id: c
        text:
          en: "It widens the spread, so aggressive buyers pay a higher taker fee instead."
          es: "Ensancha el spread, así que los compradores agresivos pagan más comisión."
      - id: d
        text:
          en: "It prevents new short positions from opening while the wall is resting."
          es: "Impide que se abran nuevos cortos mientras el muro esté en reposo."
    explanation:
      en: "A large resting limit order wall acts as an absorption barrier: every aggressive buy is filled at the wall's price, and price cannot progress upward until that liquidity is exhausted or the wall is pulled. It changes what your order fills against, not what type of order it is or what it costs."
      es: "Un gran muro de órdenes límite en reposo actúa como barrera de absorción: cada compra agresiva se llena al precio del muro, y el precio no puede avanzar hasta que esa liquidez se agote o el muro se retire. Cambia contra qué se llena tu orden, no de qué tipo es ni cuánto cuesta."

  - id: market-order-slippage-cause
    kind: single_choice
    prompt:
      en: "Why do large market orders experience severe slippage during low-liquidity news releases?"
      es: "¿Por qué las órdenes a mercado grandes sufren un slippage severo durante publicaciones de noticias con baja liquidez?"
    options:
      - id: a
        text:
          en: "The matching engine queues orders during volatility and fills them later."
          es: "El motor encola las órdenes durante la volatilidad y las llena después."
      - id: b
        text:
          en: "Taker fees rise during news events, and the extra fee shows up as slippage."
          es: "Las comisiones taker suben con las noticias y el extra aparece como slippage."
      - id: c
        text:
          en: "The liquidation engine takes priority and pushes your order back in the queue."
          es: "El motor de liquidaciones tiene prioridad y retrasa tu orden en la cola."
      - id: d
        correct: true
        text:
          en: "Market makers pull their resting orders, thinning the book."
          es: "Los market makers retiran sus órdenes y adelgazan el libro."
    explanation:
      en: "Market makers pull liquidity before major news to avoid getting picked off, so the book is thin across every price level and a market order sweeps a deep range to fill. Slippage is a fill price, not a fee or a delay — nothing about your order changed, only what was left to trade against."
      es: "Los market makers retiran liquidez antes de noticias importantes para evitar ser atrapados, así que el libro queda fino en todos los niveles y una orden a mercado barre un rango amplio para llenarse. El slippage es un precio de ejecución, no una comisión ni un retraso: tu orden no cambió, cambió lo que quedaba enfrente."

  - id: order-flow-delta-divergence-read
    kind: single_choice
    prompt:
      en: "What is the order flow interpretation of positive delta accompanied by declining price?"
      es: "¿Cuál es la interpretación de flujo de órdenes de un delta positivo acompañado de una caída de precio?"
    options:
      - id: a
        correct: true
        text:
          en: "Passive sellers are overpowering the aggressive buyers with heavy limit walls."
          es: "Los vendedores pasivos superan a los compradores agresivos."
      - id: b
        text:
          en: "The exchange has throttled limit buy orders, so the delta is misreported."
          es: "El exchange ha limitado las compras límite y el delta está mal reportado."
      - id: c
        text:
          en: "Longs are being paid funding, which mechanically caps the upside in price."
          es: "A los largos les pagan funding, lo que limita mecánicamente la subida."
      - id: d
        text:
          en: "Delta lags price: it will turn negative once the prints are reclassified."
          es: "El delta va con retraso: girará a negativo al reclasificar las impresiones."
    explanation:
      en: "When aggressive buy delta fails to produce price gains, passive limit sell liquidity is dominating and absorbing the buyer interest — the mirror image of bid-side absorption. The divergence is the signal, not a data error: delta and price are measuring different things, so they are allowed to disagree."
      es: "Cuando el delta comprador agresivo no produce ganancias de precio, la liquidez pasiva de venta límite domina y absorbe el interés comprador: la imagen especular de la absorción en el lado de la compra. La divergencia es la señal, no un error de datos: el delta y el precio miden cosas distintas, así que pueden discrepar."
