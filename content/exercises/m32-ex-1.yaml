# SPDX-License-Identifier: AGPL-3.0-only
# round: 3 is deliberate — at 2 decimal places the "divide by the other venue" distractor collapses
# onto the correct answer for premiums of this size and gets deduped away.
type: calculation
formula: venue_premium_pct
prompt:
  en: "At the same instant, BTC trades at **{price_a} USDT** on the reference venue and at **{price_b} USDT** (converted) on a regional venue. What is the regional venue's premium, as a percentage?"
  es: "En el mismo instante, BTC cotiza a **{price_a} USDT** en el exchange de referencia y a **{price_b} USDT** (convertido) en un exchange regional. ¿Cuál es la prima del exchange regional, en porcentaje?"
params:
  # price_a is pinned to one round reference: params sample independently, so a friendly premium
  # for EVERY draw needs a fixed denominator (this is also the explanation's own 60,000 / 900 /
  # 1.5% worked example). price_b's grid keeps the premium on clean half-percent steps, 1%-2.5%.
  price_a: { kind: choice, values: ["60000"] }
  price_b: { kind: int_range, min: 60600, max: 61500, step: 300 }
tolerance: { rel: "0.001" }
round: 3
unit: "%"
explanation:
  en: "Divide the gap by the *reference* venue's price, then multiply by 100. The percentage is what makes premiums comparable at all — an absolute gap of 900 means nothing until you know whether it sits on a 60,000 coin or a 6,000 one, and comparing 1.5% today with 1.5% two years ago is meaningful in a way comparing 900 with 900 is not. What the number does not tell you is which of the two causes you are looking at: eager regional demand (informative) or the cost of getting capital in and out (structural). That distinction, not the size of the figure, is the reading."
  es: "Divide el hueco por el precio del exchange de *referencia* y multiplica por 100. El porcentaje es lo que hace comparables las primas: un hueco absoluto de 900 no significa nada hasta que sabes si está sobre una moneda de 60.000 o de 6.000, y comparar el 1,5 % de hoy con un 1,5 % de hace dos años tiene un sentido que comparar 900 con 900 no tiene. Lo que el número no te dice es cuál de las dos causas estás mirando: demanda regional ansiosa (informativa) o el coste de meter y sacar capital (estructural). Esa distinción, y no el tamaño de la cifra, es la lectura."
