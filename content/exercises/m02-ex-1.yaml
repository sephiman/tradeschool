# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: cex-custody
    prompt:
      en: "On a centralised exchange (CEX), who controls the private keys to the coins shown in your account balance?"
      es: "En un exchange centralizado (CEX), ¿quién controla las claves privadas de las monedas que muestra tu saldo?"
    options:
      - id: a
        text:
          en: "You do — a CEX issues every user their own private keys at signup."
          es: "Tú: un CEX entrega a cada usuario sus propias claves privadas al registrarse."
      - id: b
        correct: true
        text:
          en: "The exchange — your balance is a claim on the company, not the coins."
          es: "El exchange: tu saldo es un derecho sobre la empresa, no las monedas."
      - id: c
        text:
          en: "Nobody — the coins sit locked in a smart contract until you trade."
          es: "Nadie: las monedas quedan bloqueadas en un contrato inteligente hasta que operas."
      - id: d
        text:
          en: "A government regulator that holds exchange customer keys in escrow."
          es: "Un regulador gubernamental que custodia en depósito las claves de los clientes."
    explanation:
      en: "On a CEX the company holds the keys and your balance is an IOU — there is no per-user key, no contract holding the coins on your behalf and no regulator standing in the middle. That is exactly why deposits are convenient but carry counterparty risk."
      es: "En un CEX la empresa guarda las claves y tu saldo es un pagaré: no hay una clave por usuario, ni un contrato que guarde las monedas por ti, ni un regulador en medio. Por eso depositar es cómodo pero conlleva riesgo de contraparte."
  - id: dex-nature
    prompt:
      en: "What is the defining feature of a decentralised exchange (DEX)?"
      es: "¿Cuál es el rasgo que define a un exchange descentralizado (DEX)?"
    options:
      - id: a
        text:
          en: "An exchange with no fees of any kind, because there is no company to pay."
          es: "Un exchange sin comisiones de ningún tipo, porque no hay empresa a la que pagar."
      - id: b
        text:
          en: "A normal CEX that has passed an independent decentralisation audit."
          es: "Un CEX normal que ha pasado una auditoría independiente de descentralización."
      - id: c
        text:
          en: "A chat group where traders swap coins by private agreement and trust."
          es: "Un grupo de chat donde los traders intercambian monedas por acuerdo y confianza."
      - id: d
        correct: true
        text:
          en: "You trade from your own wallet; no company takes custody of your funds."
          es: "Operas desde tu propia cartera; ninguna empresa custodia tus fondos."
    explanation:
      en: "A DEX runs on smart contracts and lets you trade from your own wallet — self-custody by design, not a certificate a custodial venue can earn. It still charges you: network fees and pool fees apply, and it carries its own risks."
      es: "Un DEX funciona con contratos inteligentes y te deja operar desde tu propia cartera: autocustodia por diseño, no un certificado que un venue custodial pueda obtener. Sigue costándote: hay comisiones de red y de pool, y tiene sus propios riesgos."
  - id: model-custody-match
    kind: matching
    prompt:
      en: "Match each term to what it means for who controls your coins."
      es: "Empareja cada término con lo que significa para quién controla tus monedas."
    pairs:
      - id: cex
        left: { en: "Centralised exchange (CEX)", es: "Exchange centralizado (CEX)" }
        right:
          en: "Custodial: the company holds the private keys"
          es: "Custodial: la empresa guarda las claves privadas"
      - id: dex
        left: { en: "Decentralised exchange (DEX)", es: "Exchange descentralizado (DEX)" }
        right:
          en: "Self-custody: you trade from your own wallet"
          es: "Autocustodia: operas desde tu propia cartera"
      - id: balance
        left: { en: "Your on-exchange balance", es: "Tu saldo en el exchange" }
        right:
          en: "A promise to pay from the company (an IOU)"
          es: "Una promesa de pago de la empresa (un pagaré)"
      - id: wallet
        left: { en: "Coins in a wallet you control", es: "Monedas en una cartera que controlas" }
        right:
          en: "The actual coins, held by no one but you"
          es: "Las monedas en sí, que no guarda nadie más que tú"
    explanation:
      en: "A CEX is custodial and your balance is an IOU; a DEX leaves you in self-custody. The distinction is about who holds the keys, not about which is 'safer' in the abstract."
      es: "Un CEX es custodial y tu saldo es un pagaré; un DEX te deja en autocustodia. La distinción va de quién guarda las claves, no de cuál es 'más seguro' en abstracto."
  - id: cex-keys-myth
    kind: true_false
    prompt:
      en: "On a centralised exchange the company keeps the keys, and what you get is a login and a balance."
      es: "En un exchange centralizado la empresa guarda las claves, y lo que tú obtienes es un login y un saldo."
    answer: true
    explanation:
      en: "True. A CEX account is a row in the company's database, not a key in your hands. Only self-custody — or a DEX you trade from your own wallet — puts the key where you can use it without asking anyone."
      es: "Cierto. Una cuenta en un CEX es una fila en la base de datos de la empresa, no una clave en tus manos. Solo la autocustodia — o un DEX desde tu propia cartera — pone la clave donde puedes usarla sin pedir permiso."
  - id: dex-fees-myth
    kind: true_false
    prompt:
      en: "Trading on a DEX is free because there is no company to charge fees."
      es: "Operar en un DEX es gratis porque no hay ninguna empresa que cobre comisiones."
    answer: false
    explanation:
      en: "A DEX still costs money: network (gas) fees and pool fees apply, and you carry risks like buggy contracts and final, self-signed mistakes. 'No company' is not the same as 'no cost'."
      es: "Un DEX sigue costando dinero: hay comisiones de red (gas) y de pool, y asumes riesgos como contratos con fallos y errores definitivos que firmas tú. 'Sin empresa' no es lo mismo que 'sin coste'."
  - id: deposit-effect
    prompt:
      en: "You deposit 500 USDC onto a centralised exchange. In custody terms, what just happened?"
      es: "Depositas 500 USDC en un exchange centralizado. En cuanto a la custodia, ¿qué acaba de pasar?"
    options:
      - id: a
        text:
          en: "The coins moved into a personal wallet that only your login can access."
          es: "Las monedas pasaron a una cartera personal a la que solo entra tu login."
      - id: b
        text:
          en: "Nothing changed — the coins stay yours until you place a trade."
          es: "No cambió nada: las monedas siguen siendo tuyas hasta que operes."
      - id: c
        text:
          en: "The coins were converted into shares of the exchange, redeemable at par."
          es: "Las monedas se convirtieron en acciones del exchange, canjeables a la par."
      - id: d
        correct: true
        text:
          en: "The exchange now holds the coins; your balance became a claim on it."
          es: "Ahora el exchange guarda las monedas; tu saldo pasó a ser un derecho sobre él."
    explanation:
      en: "Depositing hands custody over at the moment of the transfer, not at the moment you trade: the exchange holds the keys and your balance becomes an IOU. That is the trade-off you accept for the convenience of trading there."
      es: "Depositar entrega la custodia en el momento de la transferencia, no cuando operas: el exchange guarda las claves y tu saldo se convierte en un pagaré. Ese es el compromiso que aceptas a cambio de la comodidad de operar allí."
  - id: dex-features
    kind: multi_select
    prompt:
      en: "Select ALL statements that are TRUE of a decentralised exchange (DEX)."
      es: "Selecciona TODAS las afirmaciones que son CIERTAS sobre un exchange descentralizado (DEX)."
    options:
      - id: a
        correct: true
        text:
          en: "You trade directly from the wallet you already control."
          es: "Operas directamente desde la cartera que ya controlas."
      - id: b
        correct: true
        text:
          en: "No company takes custody of the funds while they trade."
          es: "Ninguna empresa custodia los fondos mientras operan."
      - id: c
        text:
          en: "There is a support desk that can reset your password."
          es: "Hay atención al cliente que puede restablecer tu contraseña."
      - id: d
        text:
          en: "Trades cost nothing, because there is no company charging fees."
          es: "Las operaciones no cuestan nada, porque no hay empresa que cobre."
    explanation:
      en: "A DEX runs on smart contracts: you keep custody and trade from your wallet. Removing the company removes the support desk too, and the trades still incur network and pool fees."
      es: "Un DEX funciona con contratos inteligentes: mantienes la custodia y operas desde tu cartera. Quitar la empresa quita también la atención al cliente, y las operaciones siguen teniendo comisiones de red y de pool."
  - id: cex-reset
    prompt:
      en: "Why can a centralised exchange reset your password and undo its own mistakes, when nobody can do that for a self-custody wallet?"
      es: "¿Por qué un exchange centralizado puede restablecer tu contraseña y deshacer sus propios errores, cuando nadie puede hacerlo con una wallet de autocustodia?"
    options:
      - id: a
        correct: true
        text:
          en: "Because it controls the coins, so it can simply edit its own ledger."
          es: "Porque controla las monedas, así que puede editar su propio libro."
      - id: b
        text:
          en: "Because an operator can reverse a confirmed blockchain transaction on request."
          es: "Porque un operador puede revertir a petición una transacción confirmada en blockchain."
      - id: c
        text:
          en: "Because regulators require every exchange to offer account recovery by law."
          es: "Porque los reguladores obligan por ley a todo exchange a ofrecer recuperación de cuenta."
      - id: d
        text:
          en: "Because it keeps a backup copy of the private key it issued to you at signup."
          es: "Porque guarda una copia de la clave privada que te emitió al registrarte."
    explanation:
      en: "Custodial convenience and custodial risk are one fact seen from two sides: the company can fix things precisely because your balance is a number in its database and the coins are in its wallets. The same power that lets it help you also lets it freeze, lose or spend them — and it never touches the chain to do any of it."
      es: "La comodidad y el riesgo custodial son un mismo hecho visto de dos lados: la empresa puede arreglar cosas precisamente porque tu saldo es un número en su base de datos y las monedas están en sus wallets. El mismo poder que le permite ayudarte le permite congelarlas, perderlas o gastarlas, y no toca la cadena para nada de eso."
  - id: dex-swap-steps
    kind: ordering
    prompt:
      en: "Put the steps of a swap on a decentralised exchange in order."
      es: "Ordena los pasos de un swap en un exchange descentralizado."
    items:
      - id: connect
        position: 1
        text:
          en: "You connect your own wallet — there is no account to open."
          es: "Conectas tu propia wallet: no hay ninguna cuenta que abrir."
      - id: approve
        position: 2
        text:
          en: "You approve the smart contract that will handle the swap."
          es: "Apruebas el contrato inteligente que ejecutará el swap."
      - id: sign
        position: 3
        text:
          en: "You sign the swap yourself and pay the network fee."
          es: "Firmas el swap tú mismo y pagas la comisión de red."
      - id: settle
        position: 4
        text:
          en: "The trade settles on-chain and the tokens land in your wallet seconds later."
          es: "La operación se liquida on-chain y los tokens llegan a tu wallet segundos después."
    explanation:
      en: "Every step is yours: no account, no operator, no support desk. That is the appeal and also the exposure — the approval in step 2 is what a malicious contract abuses."
      es: "Cada paso es tuyo: sin cuenta, sin operador, sin atención al cliente. Ahí está el atractivo y también la exposición: la aprobación del paso 2 es lo que abusa un contrato malicioso."
  - id: dex-recourse
    prompt:
      en: "On a DEX you approve a contract that turns out to be malicious and it drains your wallet. What is your recourse?"
      es: "En un DEX apruebas un contrato que resulta ser malicioso y te vacía la wallet. ¿Qué recurso tienes?"
    options:
      - id: a
        text:
          en: "The DEX's support desk can claw the funds back if you report it fast."
          es: "El soporte del DEX puede recuperar los fondos si lo denuncias rápido."
      - id: b
        text:
          en: "The network refunds transactions that enough nodes flag as malicious."
          es: "La red reembolsa las transacciones que suficientes nodos marcan como maliciosas."
      - id: c
        correct: true
        text:
          en: "None — you signed it yourself and it settled on-chain, with no operator to undo it."
          es: "Ninguno: lo firmaste tú y se liquidó on-chain, sin operador que lo deshaga."
      - id: d
        text:
          en: "Your wallet provider insures approvals up to a limit."
          es: "El proveedor de tu wallet asegura las aprobaciones hasta cierto límite."
    explanation:
      en: "A DEX removes the company and with it the safety net. Finality applies to signing too: approve one bad contract and the wallet can be emptied with no way back — nodes validate rules, they do not adjudicate intent, and no insurer sits behind your signature."
      es: "Un DEX elimina la empresa y con ella la red de seguridad. La irreversibilidad también aplica al firmar: aprueba un contrato malo y la wallet puede quedar vacía sin vuelta atrás. Los nodos validan reglas, no juzgan intenciones, y ninguna aseguradora está detrás de tu firma."
