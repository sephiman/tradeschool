# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: move-stop-away
    prompt:
      en: "You are long from 60.300 with a stop at 59.300. Price falls to 59.500 and looks likely to hit the stop. You slide the stop down to 58.000 to 'give it room'. What did you just do?"
      es: "Estás largo desde 60.300 con el stop en 59.300. El precio cae a 59.500 y parece que va a tocar el stop. Deslizas el stop a 58.000 para «darle espacio». ¿Qué acabas de hacer?"
    options:
      - id: a
        correct: true
        text:
          en: "Abandoned the plan and uncapped the risk — the cardinal sin of live management."
          es: "Abandonar el plan y quitar el tope al riesgo: el pecado capital de la gestión en vivo."
      - id: b
        text:
          en: "Sound risk management — giving a good trade more room to work."
          es: "Buena gestión del riesgo: darle a una buena operación más espacio para funcionar."
      - id: c
        text:
          en: "Nothing important; the stop is just a suggestion anyway."
          es: "Nada importante; al fin y al cabo el stop es solo una sugerencia."
      - id: d
        text:
          en: "Reduced the risk, because a wider stop means a smaller loss."
          es: "Reducir el riesgo, porque un stop más ancho significa una pérdida menor."
    explanation:
      en: "Moving a stop away from price turns a known, budgeted loss into an open-ended one. The stop only ever moves in the trade's favour; widening it is how a 1% risk becomes a liquidation."
      es: "Mover el stop en contra convierte una pérdida conocida y presupuestada en una abierta. El stop solo se mueve a favor de la operación; ensancharlo es como un riesgo del 1% se vuelve una liquidación."
  - id: breakeven-legit
    prompt:
      en: "Long from 60.300, stop 59.300. Price rises to 62.300, then pulls back and forms a clear higher low at 61.200. Moving your stop up to break-even (60.300) is:"
      es: "Largo desde 60.300, stop 59.300. El precio sube a 62.300, luego retrocede y forma un mínimo más alto claro en 61.200. Subir tu stop a break-even (60.300) es:"
    options:
      - id: a
        correct: true
        text:
          en: "Legitimate — new structure (a higher low) now protects the entry, so the stop follows the chart."
          es: "Legítimo: la nueva estructura (un mínimo más alto) ahora protege la entrada, así que el stop sigue al gráfico."
      - id: b
        text:
          en: "Fear — you should never move a stop once it is set."
          es: "Miedo: nunca deberías mover un stop una vez colocado."
      - id: c
        text:
          en: "The cardinal sin, because any stop move abandons the plan."
          es: "El pecado capital, porque cualquier movimiento del stop abandona el plan."
      - id: d
        text:
          en: "Pointless — break-even stops guarantee you never make money."
          es: "Inútil: los stops en break-even garantizan que nunca ganes dinero."
    explanation:
      en: "The stop moving in the trade's favour, justified by fresh structure, is exactly the legitimate case. The rule forbids moving a stop AWAY, not moving it up behind a confirmed higher low."
      es: "El stop moviéndose a favor de la operación, justificado por estructura nueva, es justo el caso legítimo. La regla prohíbe mover el stop EN CONTRA, no subirlo tras un mínimo más alto confirmado."
  - id: breakeven-fear
    prompt:
      en: "Long from 60.300, stop 59.300, target 64.000. One green candle prints to 60.600 (still well inside the range, no new structure). You snap the stop to break-even. Most likely result?"
      es: "Largo desde 60.300, stop 59.300, objetivo 64.000. Se imprime una vela verde hasta 60.600 (aún dentro del rango, sin estructura nueva). Pegas el stop a break-even. ¿Resultado más probable?"
    options:
      - id: a
        correct: true
        text:
          en: "Normal noise wicks back to 60.300, stops you out for zero, and the trade then runs to target without you."
          es: "El ruido normal vuelve con una mecha a 60.300, te saca por cero, y la operación corre al objetivo sin ti."
      - id: b
        text:
          en: "You have locked in a guaranteed profit."
          es: "Has asegurado un beneficio garantizado."
      - id: c
        text:
          en: "Nothing changes; the stop position never affects the outcome."
          es: "Nada cambia; la posición del stop nunca afecta al resultado."
      - id: d
        text:
          en: "The trade is now mathematically certain to hit the target."
          es: "Ahora es matemáticamente seguro que la operación toca el objetivo."
    explanation:
      en: "Moving to break-even before any new structure chokes the trade: you tighten the stop into the noise band and get shaken out for nothing. Break-even is earned by a higher low, not by the first green candle."
      es: "Mover a break-even antes de cualquier estructura nueva ahoga la operación: aprietas el stop dentro de la banda de ruido y te sacan por nada. El break-even se gana con un mínimo más alto, no con la primera vela verde."
  - id: do-nothing
    prompt:
      en: "Your trade is open and drifting sideways between entry and target. Nothing about the structure has changed. What is usually the correct action?"
      es: "Tu operación está abierta y deambula de lado entre la entrada y el objetivo. Nada de la estructura ha cambiado. ¿Cuál suele ser la acción correcta?"
    options:
      - id: a
        correct: true
        text:
          en: "Nothing — the plan is made; the trade needs room and time to work."
          es: "Ninguna: el plan está hecho; la operación necesita espacio y tiempo para funcionar."
      - id: b
        text:
          en: "Close it — flat price means the idea failed."
          es: "Cerrarla: un precio plano significa que la idea falló."
      - id: c
        text:
          en: "Add to the position to speed things up."
          es: "Añadir a la posición para acelerar las cosas."
      - id: d
        text:
          en: "Tighten the stop right under price to lock in the tiny gain."
          es: "Apretar el stop justo bajo el precio para asegurar la ganancia mínima."
    explanation:
      en: "Most of the time the right live-management action is none. Boredom is not a signal; the plan already set the stop and target, so let them do their job."
      es: "La mayor parte del tiempo la acción de gestión correcta es ninguna. El aburrimiento no es una señal; el plan ya fijó el stop y el objetivo, así que déjalos hacer su trabajo."
  - id: stop-direction-tf
    kind: true_false
    prompt:
      en: "Once a trade is live, it is fine to move the stop in either direction as long as you have a good reason."
      es: "Una vez que la operación está en vivo, está bien mover el stop en cualquier dirección mientras tengas una buena razón."
    answer: false
    explanation:
      en: "The stop only ever moves in the trade's favour — up for a long, down for a short. Moving it away from price, however good the story feels, uncaps your risk and breaks the plan."
      es: "El stop solo se mueve a favor de la operación: arriba en un largo, abajo en un corto. Moverlo en contra, por muy buena que suene la historia, quita el tope al riesgo y rompe el plan."
  - id: legit-actions-multi
    kind: multi_select
    prompt:
      en: "Select ALL of the following that are legitimate live-management actions (not fear or improvisation)."
      es: "Selecciona TODAS las siguientes que sean acciones de gestión en vivo legítimas (no miedo ni improvisación)."
    options:
      - id: a
        correct: true
        text:
          en: "Trailing the stop up to break-even after a confirmed higher low."
          es: "Subir el stop a break-even tras un mínimo más alto confirmado."
      - id: b
        correct: true
        text:
          en: "Taking a partial exit at a milestone you decided in the plan."
          es: "Tomar una salida parcial en un hito que decidiste en el plan."
      - id: c
        correct: true
        text:
          en: "Doing nothing while price drifts and the structure is unchanged."
          es: "No hacer nada mientras el precio deambula y la estructura no cambia."
      - id: d
        text:
          en: "Widening the stop so a losing trade has 'more room'."
          es: "Ensanchar el stop para que una operación perdedora tenga «más espacio»."
    explanation:
      en: "Break-even behind new structure, a planned partial, and doing nothing are all valid. Widening the stop is the one move that is never legitimate — it is the cardinal sin."
      es: "Break-even tras estructura nueva, un parcial planificado y no hacer nada son todos válidos. Ensanchar el stop es el único movimiento que nunca es legítimo: es el pecado capital."
  - id: partial-tradeoff
    prompt:
      en: "You take half your position off at +2R and let the rest run. What is the honest trade-off of this partial exit?"
      es: "Quitas la mitad de tu posición en +2R y dejas correr el resto. ¿Cuál es el compromiso honesto de esta salida parcial?"
    options:
      - id: a
        correct: true
        text:
          en: "It banks progress and lowers emotional stakes, but also lowers your average result — a choice, not a free win."
          es: "Asegura avance y baja la carga emocional, pero también baja tu resultado medio: una elección, no un regalo."
      - id: b
        text:
          en: "It strictly increases your expectancy with no downside."
          es: "Aumenta tu esperanza matemática sin ninguna desventaja."
      - id: c
        text:
          en: "It is the same as moving the stop away from price."
          es: "Es lo mismo que mover el stop en contra del precio."
      - id: d
        text:
          en: "It guarantees the remaining position hits the target."
          es: "Garantiza que la posición restante toca el objetivo."
    explanation:
      en: "Partials are a legitimate tool but not free: they cap the upside on the portion you sold, lowering the average R. That is why the decision belongs in the plan, not in the heat of the moment."
      es: "Los parciales son una herramienta legítima pero no gratis: limitan el recorrido de la parte que vendiste y bajan la R media. Por eso la decisión pertenece al plan, no al calor del momento."
  - id: daily-stop-scenario
    prompt:
      en: "Your plan says: risk 1% per trade (100 USDT on a 10.000 USDT account) and a daily stop at −2% (200 USDT). Today you have taken two full stop-outs, so you are −200 USDT. An hour later a textbook setup appears. What does the plan say you do?"
      es: "Tu plan dice: arriesgar el 1% por operación (100 USDT en una cuenta de 10.000 USDT) y un freno diario en −2% (200 USDT). Hoy has encajado dos stops completos, así que estás en −200 USDT. Una hora después aparece un setup de manual. ¿Qué dice el plan que hagas?"
    options:
      - id: a
        correct: true
        text:
          en: "Stop for the day — the daily stop is hit, so you close the charts regardless of how good this setup looks."
          es: "Parar por hoy: el freno diario está alcanzado, así que cierras los gráficos por buena que parezca esta operación."
      - id: b
        text:
          en: "Take it at normal size — the daily stop only bans oversized trades."
          es: "Tomarla al tamaño normal: el freno diario solo prohíbe las operaciones sobredimensionadas."
      - id: c
        text:
          en: "Take it at double size — a high-quality setup is the fastest way back to break-even."
          es: "Tomarla al doble de tamaño: un setup de calidad es la vía más rápida de volver a cero."
      - id: d
        text:
          en: "Take it, but move the daily stop to −4% first so the trade fits inside the budget."
          es: "Tomarla, pero moviendo primero el freno diario a −4% para que la operación entre en el presupuesto."
    explanation:
      en: "The daily stop is not a suggestion and it does not judge setups: once realised PnL hits −X% you are done for the day. Its whole value is that it does not consult you at the moment you are least able to answer, and the quality of the next setup is exactly the argument it exists to overrule."
      es: "El freno diario no es una sugerencia y no juzga setups: cuando el PnL realizado toca el −X%, has terminado por hoy. Todo su valor es que no te consulta en el momento en que menos capaz eres de responder, y la calidad del siguiente setup es justo el argumento que existe para desautorizar."
  - id: daily-stop-adjust-tf
    kind: true_false
    prompt:
      en: "Because the daily stop is your own rule, raising X from 2% to 4% in the middle of a losing day is fine as long as you write the new number down."
      es: "Como el freno diario es tu propia regla, subir la X del 2% al 4% en medio de un día perdedor está bien mientras apuntes el nuevo número."
    answer: false
    explanation:
      en: "X is a personal parameter, but it is set in the plan BEFORE the losing day and never during one. Editing it while you are down is the override the rule was built to prevent — the person who just lost 3% is the least qualified person to decide how much more they may lose."
      es: "La X es un parámetro personal, pero se fija en el plan ANTES del día malo y nunca durante él. Editarla mientras vas perdiendo es exactamente la excepción que la regla existe para evitar: quien acaba de perder un 3% es la persona menos cualificada para decidir cuánto más puede perder."
