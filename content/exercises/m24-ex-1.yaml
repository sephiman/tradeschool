# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: market-tradeoff
    prompt:
      en: "You use a market order instead of a limit order. What are you choosing?"
      es: "Usas una orden de mercado en lugar de una de límite. ¿Qué estás eligiendo?"
    options:
      - id: a
        text:
          en: "A guaranteed better price than the one the market is showing now."
          es: "Un precio garantizado mejor que el que muestra ahora el mercado."
      - id: b
        text:
          en: "To wait in the book until price comes down to your chosen level."
          es: "Esperar en el libro hasta que el precio baje a tu nivel elegido."
      - id: c
        text:
          en: "Lower fees, because market orders are always the cheaper option."
          es: "Menos comisiones, porque las órdenes de mercado son siempre más baratas."
      - id: d
        correct: true
        text:
          en: "Immediacy — you fill now, at whatever the book offers."
          es: "Inmediatez: te ejecutas ya, al precio que ofrezca el libro."
    explanation:
      en: "A market order trades price control for immediacy: it fills right away at whatever the book offers. It gives no price guarantee, it does not rest waiting for a level, and as a taker it usually costs more in fees, not less."
      es: "Una orden de mercado cambia control del precio por inmediatez: se ejecuta al instante al precio que ofrezca el libro. No garantiza precio, no espera puesta en el libro a un nivel y, como taker, suele costar más en comisiones, no menos."
  - id: maker-taker
    prompt:
      en: "A resting limit order that adds liquidity to the book makes you a…"
      es: "Una orden de límite puesta en el libro que aporta liquidez te convierte en…"
    options:
      - id: a
        text:
          en: "Taker — you remove liquidity from the book and fill immediately."
          es: "Taker: retiras liquidez del libro y te ejecutas de inmediato."
      - id: b
        correct: true
        text:
          en: "Maker — price control, but no guarantee of being filled."
          es: "Maker: control del precio, pero sin garantía de ejecutarte."
      - id: c
        text:
          en: "Maker — and you are guaranteed to fill at exactly your price."
          es: "Maker, y tienes garantizada la ejecución exactamente a tu precio."
      - id: d
        text:
          en: "Neither — orders resting in the book are cancelled automatically."
          es: "Ninguno: las órdenes en reposo se cancelan automáticamente."
    explanation:
      en: "Adding liquidity with a resting limit order makes you a maker: you control the price, but the market may never reach it, so there is no fill guarantee. A taker, by contrast, removes liquidity and fills at once — and a resting order stays put until it fills or you cancel it."
      es: "Aportar liquidez con una orden de límite puesta te convierte en maker: controlas el precio, pero el mercado puede no alcanzarlo nunca, así que no hay garantía de ejecución. El taker, en cambio, retira liquidez y se ejecuta al instante, y una orden en reposo se queda ahí hasta ejecutarse o hasta que la canceles."
  - id: limit-tradeoff
    prompt:
      en: "You use a limit order instead of a market order. What are you accepting in exchange for price control?"
      es: "Usas una orden de límite en lugar de una de mercado. ¿Qué aceptas a cambio del control del precio?"
    options:
      - id: a
        text:
          en: "Guaranteed immediacy — a limit order always fills right away."
          es: "Inmediatez garantizada: una orden límite siempre se ejecuta al momento."
      - id: b
        text:
          en: "A worse price than the one the market is currently showing you."
          es: "Un precio peor que el que te muestra ahora mismo el mercado."
      - id: c
        text:
          en: "Higher fees, because a resting limit order counts as a taker order."
          es: "Más comisiones, porque una orden límite en reposo cuenta como taker."
      - id: d
        correct: true
        text:
          en: "The risk of not filling at all if price never reaches you."
          es: "El riesgo de no ejecutarte si el precio nunca llega a ti."
    explanation:
      en: "A limit order gives price control but no certainty of filling: if price never reaches your level, you sit unfilled while the move happens without you. The price you name is your own, usually better than market, and a resting limit order is a maker order, which normally pays lower fees rather than higher."
      es: "Una orden de límite da control del precio pero ninguna certeza de ejecución: si el precio nunca llega a tu nivel, te quedas sin ejecutar mientras el movimiento ocurre sin ti. El precio que fijas es el tuyo, normalmente mejor que el de mercado, y una orden límite en reposo es maker, que suele pagar comisiones más bajas y no más altas."
  - id: taker-maker-fees
    kind: true_false
    prompt:
      en: "On most exchanges a taker pays more than a maker — but a fee saved on a limit order that never fills is no saving at all."
      es: "En la mayoría de exchanges el taker paga más que el maker, pero una comisión ahorrada en una orden límite que nunca se ejecuta no es ningún ahorro."
    answer: true
    explanation:
      en: "True on both halves. Most venues charge takers more and sometimes rebate makers, and the gap adds up over hundreds of trades — but price control is only worth what it costs you in fills you never get."
      es: "Cierto en ambas mitades. La mayoría de venues cobran más al taker y a veces bonifican al maker, y la diferencia se acumula a lo largo de cientos de operaciones, pero el control del precio solo vale lo que te cuesta en ejecuciones que nunca consigues."
  - id: order-role-match
    kind: matching
    prompt:
      en: "Match each execution concept to its behaviour."
      es: "Empareja cada concepto de ejecución con su comportamiento."
    pairs:
      - id: mkt
        left: { en: "Market order", es: "Orden de mercado" }
        right: { en: "Fills now at whatever the book offers; you give up price control", es: "Se ejecuta ya al precio que ofrezca el libro; renuncias al control del precio" }
      - id: lmt
        left: { en: "Limit order", es: "Orden de límite" }
        right: { en: "Fills only at your price or better; may never fill", es: "Se ejecuta solo a tu precio o mejor; puede no ejecutarse nunca" }
      - id: mkr
        left: { en: "Maker", es: "Maker" }
        right: { en: "Adds liquidity with a resting order", es: "Aporta liquidez con una orden puesta en el libro" }
      - id: tkr
        left: { en: "Taker", es: "Taker" }
        right: { en: "Removes liquidity by filling against resting orders", es: "Retira liquidez ejecutándose contra las órdenes puestas" }
    explanation:
      en: "A market order takes immediacy and gives up price control; a limit order names your price but may never fill. Resting a limit order makes you a maker (you add liquidity); filling against the book makes you a taker (you remove it)."
      es: "Una orden de mercado toma inmediatez y renuncia al control del precio; una orden de límite fija tu precio pero puede no ejecutarse nunca. Poner una orden de límite en el libro te hace maker (aportas liquidez); ejecutarte contra el libro te hace taker (la retiras)."
  - id: limit-missed-move
    prompt:
      en: "You place a limit buy just below the market and wait. Price jumps up and runs without ever dipping to your level. What did the limit order cost you?"
      es: "Colocas una compra de límite justo por debajo del mercado y esperas. El precio salta y se dispara sin bajar nunca a tu nivel. ¿Qué te costó la orden de límite?"
    options:
      - id: a
        correct: true
        text:
          en: "The trade itself — you never filled and missed the move."
          es: "La operación misma: no te ejecutaste y perdiste el movimiento."
      - id: b
        text:
          en: "Extra taker fees charged on the order that was eventually cancelled."
          es: "Comisiones taker extra por la orden que acabó cancelándose."
      - id: c
        text:
          en: "Nothing — a limit order guarantees a fill once price comes close enough."
          es: "Nada: una orden límite garantiza ejecución si el precio se acerca."
      - id: d
        text:
          en: "A forced liquidation of the rest of your account's positions."
          es: "Una liquidación forzosa del resto de posiciones de tu cuenta."
    explanation:
      en: "A limit order controls your price but carries no fill guarantee. If the market never trades at your level, you simply do not get in, and the move happens without you while your order sits there. That missed entry — not a fee and not a liquidation — is the cost of insisting on price."
      es: "Una orden de límite controla tu precio pero no da garantía de ejecución. Si el mercado nunca opera a tu nivel, sencillamente no entras, y el movimiento ocurre sin ti mientras tu orden sigue ahí. Esa entrada perdida —no una comisión ni una liquidación— es el coste de insistir en el precio."
  - id: market-price-guarantee
    kind: true_false
    prompt:
      en: "A market order guarantees you fill at the price shown on your screen at the moment you click."
      es: "Una orden de mercado garantiza que te ejecutas al precio que muestra tu pantalla en el momento en que haces clic."
    answer: false
    explanation:
      en: "A market order guarantees a fill, not a price. It takes whatever the book offers, which can differ from the last printed price — especially in a thin book, where it walks through resting orders and fills at progressively worse prices."
      es: "Una orden de mercado garantiza la ejecución, no el precio. Toma lo que ofrezca el libro, que puede diferir del último precio impreso, sobre todo en un libro poco profundo, donde atraviesa las órdenes puestas y se ejecuta a precios cada vez peores."
  - id: btc-order-choice
    prompt:
      en: "You want to buy 1 BTC and the best ask is 60,000. What does each order type actually get you?"
      es: "Quieres comprar 1 BTC y el mejor ask está en 60.000. ¿Qué consigue realmente cada tipo de orden?"
    options:
      - id: a
        text:
          en: "Both fill at 60,000; the limit order simply pays the lower fee."
          es: "Ambas se ejecutan en 60.000; la límite solo paga la comisión menor."
      - id: b
        text:
          en: "The limit order fills first, because it is placed inside the spread."
          es: "La límite se ejecuta primero, porque se coloca dentro del spread."
      - id: c
        correct: true
        text:
          en: "Market fills now near 60,000; a limit at 59,850 fills only on a dip."
          es: "La de mercado ejecuta ya cerca de 60.000; una límite en 59.850, solo si baja."
      - id: d
        text:
          en: "A market order fills at the last printed price, whatever the book holds."
          es: "La de mercado ejecuta al último precio impreso, tenga lo que tenga el libro."
    explanation:
      en: "The market order fills instantly at 60,000 — a little worse if 1 BTC exceeds the size at the top ask — while the limit buy at 59,850 saves 150 if price dips and never fills if price runs away. Same idea, two outcomes chosen entirely by the order type: cheaper-or-nothing versus now-at-market. That trade-off, immediacy against price, is the whole distinction."
      es: "La orden de mercado se ejecuta al instante en 60.000 —algo peor si 1 BTC supera el tamaño del mejor ask—, mientras que la compra límite en 59.850 ahorra 150 si el precio baja y no se ejecuta nunca si el precio se escapa. La misma idea, dos resultados elegidos únicamente por el tipo de orden: más barato o nada, frente a ahora a mercado. Ese equilibrio, inmediatez contra precio, es toda la distinción."
  - id: order-roles
    kind: multi_select
    prompt:
      en: "Select ALL statements about makers and takers that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre makers y takers."
    options:
      - id: a
        correct: true
        text:
          en: "Every order you send either takes a resting order or becomes one."
          es: "Cada orden que envías o toma una orden en reposo o se convierte en una."
      - id: b
        correct: true
        text:
          en: "A market order makes you a taker: immediacy, no price control."
          es: "Una orden de mercado te hace taker: inmediatez, sin control del precio."
      - id: c
        correct: true
        text:
          en: "A resting limit order makes you a maker: price control, no certainty."
          es: "Una límite en reposo te hace maker: control del precio, sin certeza."
      - id: d
        correct: true
        text:
          en: "Most exchanges charge takers more, sometimes rebating makers."
          es: "La mayoría de exchanges cobran más al taker y a veces bonifican al maker."
      - id: e
        text:
          en: "A limit order is always the better choice, because the fee is lower."
          es: "Una orden límite siempre es mejor opción, porque la comisión es menor."
    explanation:
      en: "The fee gap is small per trade and large over hundreds of trades — one reason scalpers fight to use limit orders. But a fee saved on an order that never fills is not a saving, so 'always better' is exactly the conclusion the trade-off forbids."
      es: "La diferencia de comisiones es pequeña por operación y grande a lo largo de cientos: una razón por la que los scalpers luchan por usar órdenes límite. Pero una comisión ahorrada en una orden que nunca se ejecuta no es un ahorro, así que 'siempre mejor' es justo la conclusión que el compromiso prohíbe."
  - id: fee-saved-nofill
    kind: true_false
    prompt:
      en: "Choosing a limit order to capture the lower maker fee is a saving even when the order never fills."
      es: "Elegir una orden límite para aprovechar la comisión maker más baja es un ahorro incluso si la orden no se ejecuta nunca."
    answer: false
    explanation:
      en: "A fee saved on an order that never fills is not a saving — it is a missed trade. Price control is only worth what it costs you in fills you do not get."
      es: "Una comisión ahorrada en una orden que nunca se ejecuta no es un ahorro: es una operación perdida. El control del precio solo vale lo que te cuesta en ejecuciones que no consigues."
