# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: order-of-steps
    kind: ordering
    prompt:
      en: "Put the steps of one complete trade into the correct order, from first decision to last."
      es: "Ordena los pasos de una operación completa en el orden correcto, de la primera decisión a la última."
    items:
      - id: ctx
        position: 1
        text: { en: "Read the context (trend / structure)", es: "Leer el contexto (tendencia / estructura)" }
      - id: setup
        position: 2
        text: { en: "Identify the setup at a level (confluence)", es: "Identificar el setup en un nivel (confluencia)" }
      - id: trigger
        position: 3
        text: { en: "Wait for the reaction (entry trigger)", es: "Esperar la reacción (detonante de entrada)" }
      - id: stop
        position: 4
        text: { en: "Place the stop where the idea is wrong", es: "Colocar el stop donde la idea es errónea" }
      - id: size
        position: 5
        text: { en: "Size the position from the stop", es: "Dimensionar la posición desde el stop" }
    explanation:
      en: "Context → setup → trigger → stop → size. The stop comes from the chart and the size comes from the stop, so risk is decided before you ever commit money. Reversing stop and size (pick a size, then a stop) is gambling."
      es: "Contexto → setup → disparador → stop → tamaño. El stop sale del gráfico y el tamaño sale del stop, así que el riesgo se decide antes de comprometer dinero. Invertir stop y tamaño (elegir un tamaño y luego un stop) es apostar."
  - id: stop-only-favour-tf
    kind: true_false
    prompt:
      en: "The one inviolable rule of managing a live trade: the stop only ever moves in the trade's favour."
      es: "La única regla inviolable de gestionar una operación en vivo: el stop solo se mueve a favor de la operación."
    answer: true
    explanation:
      en: "Up for a long, down for a short, never away. This single rule is what keeps a planned loss capped at the amount you budgeted."
      es: "Arriba en un largo, abajo en un corto, nunca en contra. Esta única regla es lo que mantiene una pérdida planificada topada en la cantidad que presupuestaste."
  - id: where-stop
    prompt:
      en: "Where does a stop belong?"
      es: "¿Dónde pertenece un stop?"
    options:
      - id: a
        correct: true
        text:
          en: "At the price that invalidates the setup — where the trade idea is proven wrong."
          es: "En el precio que invalida el setup: donde la idea de la operación queda demostrada errónea."
      - id: b
        text:
          en: "At the dollar amount you are comfortable losing."
          es: "En la cantidad de dinero que te sientes cómodo perdiendo."
      - id: c
        text:
          en: "A fixed 2% below entry, always, on every trade."
          es: "Un 2% fijo por debajo de la entrada, siempre, en toda operación."
      - id: d
        text:
          en: "Wherever leaves the roundest position size."
          es: "Donde deje el tamaño de posición más redondo."
    explanation:
      en: "The stop marks where the idea is dead (structure), not a money figure. Placed there, being stopped means something real; the size then adjusts so that loss equals your budget."
      es: "El stop marca dónde muere la idea (estructura), no una cifra de dinero. Colocado ahí, que te salten significa algo real; el tamaño se ajusta luego para que esa pérdida iguale tu presupuesto."
  - id: why-trigger
    prompt:
      en: "Why wait for a reaction candle at the level instead of buying the moment price touches it?"
      es: "¿Por qué esperar una vela de reacción en el nivel en vez de comprar en cuanto el precio lo toca?"
    options:
      - id: a
        correct: true
        text:
          en: "The reaction makes the market prove buyers actually showed up before you commit."
          es: "La reacción obliga al mercado a demostrar que los compradores aparecieron de verdad antes de comprometerte."
      - id: b
        text:
          en: "It guarantees the level will hold."
          es: "Garantiza que el nivel aguantará."
      - id: c
        text:
          en: "Touching the level is illegal on most exchanges."
          es: "Tocar el nivel es ilegal en la mayoría de exchanges."
      - id: d
        text:
          en: "There is no reason; buying the touch is always better."
          es: "No hay razón; comprar el toque siempre es mejor."
    explanation:
      en: "Buying the touch assumes the level holds; waiting for the reaction demands evidence and lets you refuse the trade if the reaction never comes. You pay a little price for proof."
      es: "Comprar el toque da por hecho que el nivel aguanta; esperar la reacción exige pruebas y te deja rechazar la operación si la reacción nunca llega. Pagas un poco de precio a cambio de pruebas."
  - id: r-multiple
    prompt:
      en: "You risk 1R and your target is 3,7R away. Entry 60.300, stop 59.300 (risk 1.000). Roughly where is the target?"
      es: "Arriesgas 1R y tu objetivo está a 3,7R. Entrada 60.300, stop 59.300 (riesgo 1.000). ¿Dónde está aproximadamente el objetivo?"
    options:
      - id: a
        correct: true
        text: { en: "Around 64.000 (about 3.700 above entry)", es: "Alrededor de 64.000 (unos 3.700 por encima de la entrada)" }
      - id: b
        text: { en: "Around 60.700", es: "Alrededor de 60.700" }
      - id: c
        text: { en: "Around 59.300 (at the stop)", es: "Alrededor de 59.300 (en el stop)" }
      - id: d
        text: { en: "Around 71.000", es: "Alrededor de 71.000" }
    explanation:
      en: "1R is the stop distance, 1.000. 3,7R ≈ 3.700 above the 60.300 entry ≈ 64.000. Expressing targets in R keeps every trade comparable regardless of price."
      es: "1R es la distancia del stop, 1.000. 3,7R ≈ 3.700 por encima de la entrada de 60.300 ≈ 64.000. Expresar objetivos en R mantiene toda operación comparable sin importar el precio."
  - id: context-first
    prompt:
      en: "Before looking for an entry, the first question of a complete trade is:"
      es: "Antes de buscar una entrada, la primera pregunta de una operación completa es:"
    options:
      - id: a
        correct: true
        text:
          en: "What is the market doing, and does it offer a clean trade at all? (Often the answer is no.)"
          es: "¿Qué hace el mercado y ofrece siquiera una operación limpia? (A menudo la respuesta es no.)"
      - id: b
        text:
          en: "How much leverage can I use to maximise the win?"
          es: "¿Cuánto apalancamiento puedo usar para maximizar la ganancia?"
      - id: c
        text:
          en: "Which coin is being talked about most on social media today?"
          es: "¿De qué moneda se habla más hoy en redes sociales?"
      - id: d
        text:
          en: "What round number is price closest to right now?"
          es: "¿A qué número redondo está el precio más cerca ahora mismo?"
    explanation:
      en: "Context decides whether there is a trade. In a range or against the trend the same setup is a worse bet, and most of the time the honest answer — and the best trade — is no trade."
      es: "El contexto decide si hay operación. En un rango o contra la tendencia el mismo setup es peor apuesta, y la mayor parte del tiempo la respuesta honesta —y la mejor operación— es ninguna."
  - id: top-down-bias-entry
    prompt:
      en: "In the top-down protocol, which chart decides what?"
      es: "En el protocolo de arriba abajo, ¿qué decide cada gráfico?"
    options:
      - id: a
        correct: true
        text:
          en: "The higher timeframe dictates the bias and the levels; the lower timeframe dictates the trigger and the stop."
          es: "La temporalidad superior dicta el sesgo y los niveles; la inferior dicta el disparador y el stop."
      - id: b
        text:
          en: "The lower timeframe dictates the bias, because it shows the freshest price action."
          es: "La temporalidad inferior dicta el sesgo, porque muestra la acción del precio más reciente."
      - id: c
        text:
          en: "Whichever timeframe currently agrees with your idea decides both."
          es: "La temporalidad que ahora mismo coincida con tu idea decide las dos cosas."
      - id: d
        text:
          en: "Both frames must give the same signal, or the trade is invalid regardless of direction."
          es: "Ambos marcos deben dar la misma señal, o la operación es inválida sea cual sea la dirección."
    explanation:
      en: "Bias and levels come from the macro frame; timing and stop placement from the micro frame. The order is not reversible — the fast chart prints signals in both directions constantly, so letting it choose the direction means always finding a reason for the trade you already wanted."
      es: "El sesgo y los niveles salen del marco macro; el timing y la colocación del stop, del marco micro. El orden no es reversible: el gráfico rápido imprime señales en las dos direcciones constantemente, así que dejarle elegir la dirección significa encontrar siempre una razón para la operación que ya querías."
  - id: micro-against-macro
    prompt:
      en: "The 4-hour chart is in a clear downtrend. On the 5-minute you get a clean long trigger at a level. What is the correct action?"
      es: "El gráfico de 4 horas está en una tendencia bajista clara. En el de 5 minutos obtienes un trigger largo limpio en un nivel. ¿Cuál es la acción correcta?"
    options:
      - id: a
        correct: true
        text:
          en: "Skip it — a micro-frame signal against the macro bias is a trade you do not take."
          es: "Descartarla: una señal del marco micro contra el sesgo macro es una operación que no tomas."
      - id: b
        text:
          en: "Take the long, but with a tighter stop to compensate for the conflict."
          es: "Tomar el largo, pero con un stop más ajustado para compensar el conflicto."
      - id: c
        text:
          en: "Take the long — the 5-minute is closer to the current price, so it is more accurate."
          es: "Tomar el largo: el de 5 minutos está más cerca del precio actual, así que es más preciso."
      - id: d
        text:
          en: "Take the long at half size, since the two frames each get half a vote."
          es: "Tomar el largo a la mitad de tamaño, ya que cada marco tiene medio voto."
    explanation:
      en: "The higher timeframe owns the direction, so a conflicting micro signal is a skipped trade, not a counter-trade opportunity. A tighter stop or a smaller size does not fix a trade taken against the dominant flow — it only makes the bad bet cheaper per attempt."
      es: "La temporalidad superior manda en la dirección, así que una señal micro que la contradice es una operación descartada, no una oportunidad de operar en contra. Un stop más ajustado o un tamaño menor no arreglan una operación tomada contra el flujo dominante: solo abaratan la mala apuesta por intento."
  - id: daily-stop-why-mechanical
    prompt:
      en: "Why is the daily stop written as a fixed number in the plan instead of being judged in the moment?"
      es: "¿Por qué el freno diario se escribe como un número fijo en el plan en vez de decidirse en el momento?"
    options:
      - id: a
        correct: true
        text:
          en: "Because the person deciding after a −3% day is tilted and anchored on getting back to even — the least qualified person to judge their own state."
          es: "Porque quien decide tras un día de −3% está en tilt y anclado en volver a cero: la persona menos cualificada para juzgar su propio estado."
      - id: b
        text:
          en: "Because exchanges enforce daily loss limits automatically, so the number must match theirs."
          es: "Porque los exchanges aplican límites de pérdida diaria automáticamente, así que el número debe coincidir con el suyo."
      - id: c
        text:
          en: "Because a fixed percentage guarantees you cannot have a losing week."
          es: "Porque un porcentaje fijo garantiza que no puedas tener una semana perdedora."
      - id: d
        text:
          en: "Because judgement is only unreliable for beginners; experienced traders can decide live."
          es: "Porque el criterio solo es poco fiable en principiantes; los traders con experiencia pueden decidirlo en vivo."
    explanation:
      en: "This is m23's pre-commitment made mechanical: the rule is decided when nothing is at stake precisely because willpower is what fails under pressure. It caps the day, not the week, and no exchange rule replaces it."
      es: "Es el compromiso previo de m23 hecho mecánico: la regla se decide cuando no hay nada en juego precisamente porque la fuerza de voluntad es lo que falla bajo presión. Limita el día, no la semana, y ninguna regla del exchange lo sustituye."
