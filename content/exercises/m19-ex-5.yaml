# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: low-stops
    prompt:
      en: "Just below a recent swing low that has held twice, what kind of resting orders tend to pile up?"
      es: "Justo debajo de un mínimo reciente que ha aguantado dos veces, ¿qué tipo de órdenes en reposo tienden a apilarse?"
    options:
      - id: a
        text:
          en: "Short stop-losses waiting to buy, because the shorts defend the low."
          es: "Stop-loss de cortos esperando comprar, porque los cortos defienden el mínimo."
      - id: b
        text:
          en: "Only limit buy orders, since that is where the buyers want to enter."
          es: "Solo órdenes limitadas de compra, ya que ahí quieren entrar los compradores."
      - id: c
        correct: true
        text:
          en: "Long stop-losses and long liquidation prices — a shelf of sell orders."
          es: "Stop-loss y liquidaciones de largos: una repisa de órdenes de venta."
      - id: d
        text:
          en: "Nothing predictable at all — orders scatter evenly across every price."
          es: "Nada predecible: las órdenes se reparten por igual en todos los precios."
    explanation:
      en: "A long's protective sell (its stop-loss) goes just under the low, and leveraged longs' liquidation prices sit below entry in the same zone. Both are sell orders, which is what makes the shelf. Shorts' stops sit above a high, not below a low, and orders are anything but evenly scattered — they bunch at exactly the obvious levels."
      es: "La venta protectora de un largo (su stop-loss) va justo debajo del mínimo, y los precios de liquidación de los largos apalancados quedan por debajo de la entrada, en la misma zona. Ambos son órdenes de venta, y eso forma la repisa. Los stops de los cortos están encima de un máximo, no debajo de un mínimo, y las órdenes no se reparten por igual: se agrupan justo en los niveles obvios."
  - id: high-stops
    prompt:
      en: "Just above a recent swing high, what kind of resting orders tend to pile up?"
      es: "Justo encima de un máximo reciente, ¿qué tipo de órdenes en reposo tienden a apilarse?"
    options:
      - id: a
        correct: true
        text:
          en: "Short stop-losses and short liquidation prices — a shelf of buy orders."
          es: "Stop-loss y liquidaciones de cortos: una repisa de órdenes de compra."
      - id: b
        text:
          en: "Only limit sell orders placed by traders taking their profits there."
          es: "Solo órdenes limitadas de venta de quienes toman ganancias ahí."
      - id: c
        text:
          en: "Long stop-losses waiting to sell, because that is where longs give up."
          es: "Stop-loss de largos esperando vender, porque ahí es donde se rinden."
      - id: d
        text:
          en: "Orders spread evenly; a high is no more special than any other price."
          es: "Órdenes repartidas por igual; un máximo no es especial frente a otro precio."
    explanation:
      en: "A short's protective buy (its stop-loss) goes just above the high, and leveraged shorts' liquidation prices sit above entry in the same band. Both are buy orders. Longs' stops sit below a low, and traders crowd their orders at obvious levels — highs and lows are exactly the special ones."
      es: "La compra protectora de un corto (su stop-loss) va justo encima del máximo, y los precios de liquidación de los cortos apalancados quedan por encima de la entrada, en la misma banda. Ambos son órdenes de compra. Los stops de los largos están debajo de un mínimo, y los traders amontonan sus órdenes en los niveles obvios: los máximos y mínimos son justo los especiales."
  - id: why-sweep
    prompt:
      en: "A large player wants to accumulate a big long position. Why might price be pushed down through the shelf of stops just below an obvious low before rallying?"
      es: "Un jugador grande quiere acumular una posición larga grande. ¿Por qué podría empujarse el precio hacia abajo a través de la repisa de stops justo debajo de un mínimo obvio antes de subir?"
    options:
      - id: a
        text:
          en: "To punish the retail longs for their poor positioning on the level."
          es: "Para castigar a los largos minoristas por su mal posicionamiento."
      - id: b
        text:
          en: "Because breaking a low always confirms that a new downtrend has begun."
          es: "Porque romper un mínimo siempre confirma que empezó una bajista."
      - id: c
        correct: true
        text:
          en: "The stops triggered there are forced sells — cheap liquidity to buy into."
          es: "Los stops disparados ahí son ventas forzadas: liquidez barata que comprar."
      - id: d
        text:
          en: "The exchange moves price to that level in order to collect extra fees."
          es: "El exchange lleva el precio a ese nivel para cobrar comisiones extra."
    explanation:
      en: "Filling a large buy needs sellers on the other side. The shelf of stops and liquidations below the low is a pool of sell orders waiting to trigger, so nudging price into it produces cheap forced selling to buy against — then, with sellers exhausted, price snaps back. It is not punishment, not a confirmed trend, and nothing to do with fees."
      es: "Ejecutar una compra grande necesita vendedores enfrente. La repisa de stops y liquidaciones debajo del mínimo es una bolsa de órdenes de venta esperando a dispararse, así que empujar el precio hacia ella produce venta forzada barata contra la que comprar; luego, con los vendedores agotados, el precio rebota. No es un castigo, ni una tendencia confirmada, ni una cuestión de comisiones."
  - id: terms-liquidity
    kind: matching
    prompt:
      en: "Match each term to what it means."
      es: "Empareja cada término con lo que significa."
    pairs:
      - id: liq
        left:
          en: "Liquidity"
          es: "Liquidez"
        right:
          en: "Resting orders waiting to be filled"
          es: "Órdenes en reposo esperando a ejecutarse"
      - id: liqn
        left:
          en: "Liquidation"
          es: "Liquidación"
        right:
          en: "The exchange forcibly closing a leveraged position"
          es: "El cierre forzoso de una posición apalancada por el exchange"
      - id: swp
        left:
          en: "Sweep"
          es: "Barrido"
        right:
          en: "Poking through a level to trigger and take the pool of stops"
          es: "Perforar un nivel para disparar y tomar la bolsa de stops"
      - id: cls
        left:
          en: "Cluster"
          es: "Clúster"
        right:
          en: "A shelf of orders stacked near one price"
          es: "Una repisa de órdenes apiladas cerca de un mismo precio"
    explanation:
      en: "Liquidity and liquidation are not the same word: liquidity is resting orders to trade against, while a liquidation is strictly a forced close. A sweep is price poking through a level to take that resting pool; a cluster is the pool itself, stacked near one price."
      es: "Liquidez y liquidación no son la misma palabra: la liquidez son órdenes en reposo contra las que operar, mientras que una liquidación es estrictamente un cierre forzoso. Un barrido es el precio perforando un nivel para tomar esa bolsa en reposo; un clúster es la propia bolsa, apilada cerca de un mismo precio."
  - id: random-myth
    kind: true_false
    prompt:
      en: "Stop and liquidation clusters form at the levels everyone can see, which is what makes the pools predictable rather than random."
      es: "Los clústeres de stops y liquidaciones se forman en los niveles que todo el mundo ve, y eso hace que las bolsas sean predecibles en vez de aleatorias."
    answer: true
    explanation:
      en: "True. Obvious swing highs and lows, round numbers, levels that held before: because traders reason alike and place stops just beyond those points, thousands of orders end up on the same handful of ticks."
      es: "Cierto. Máximos y mínimos obvios, números redondos, niveles que aguantaron antes: como los traders razonan igual y ponen los stops justo pasados esos puntos, miles de órdenes acaban en los mismos pocos ticks."
  - id: sweep-vs-break
    kind: true_false
    prompt:
      en: "Price pokes a few ticks below an obvious swing low and then reclaims it within one or two candles. This behaviour fits a liquidity sweep better than a genuine breakdown."
      es: "El precio perfora unos ticks por debajo de un mínimo obvio y luego lo recupera en una o dos velas. Este comportamiento encaja mejor con un barrido de liquidez que con una ruptura genuina."
    answer: true
    explanation:
      en: "A genuine break holds beyond the level; a sweep pokes through to trigger the pool of stops and then snaps back, reclaiming the level within a candle or two. The quick reclaim is exactly the tell that the low was swept, not broken."
      es: "Una ruptura genuina aguanta más allá del nivel; un barrido lo perfora para disparar la bolsa de stops y luego rebota, recuperando el nivel en una o dos velas. La recuperación rápida es justo la pista de que el mínimo fue barrido, no roto."
  - id: below-low-multi
    kind: multi_select
    prompt:
      en: "Select ALL of the following that add to the shelf of resting SELL orders sitting just below a recent swing low."
      es: "Selecciona TODO lo siguiente que se suma a la repisa de órdenes de VENTA en reposo situada justo debajo de un mínimo reciente."
    options:
      - id: a
        correct: true
        text:
          en: "Stop-loss orders placed by longs."
          es: "Órdenes stop-loss colocadas por los largos."
      - id: b
        correct: true
        text:
          en: "The liquidation prices of leveraged longs."
          es: "Los precios de liquidación de los largos apalancados."
      - id: c
        text:
          en: "Stop-loss orders placed by shorts, which sit above a high."
          es: "Stop-loss colocados por los cortos, que están encima de un máximo."
      - id: d
        text:
          en: "A wave of new market buy orders arriving at the level."
          es: "Una oleada de nuevas órdenes de compra a mercado llegando al nivel."
    explanation:
      en: "Below a low, both longs' stop-losses and leveraged longs' liquidation prices are sell orders — they add to the shelf. Shorts' stops sit above a high and are buys, and market buy orders are the opposite side entirely, not resting sell pressure below the low."
      es: "Debajo de un mínimo, tanto los stop-loss de los largos como los precios de liquidación de los largos apalancados son órdenes de venta: se suman a la repisa. Los stops de los cortos están encima de un máximo y son compras, y las órdenes de compra a mercado son justo el otro lado, no presión de venta en reposo debajo del mínimo."
  - id: sweep-worked
    prompt:
      en: "BTC has a swing low at 60,000 that has held twice. What sits in the band just beneath it?"
      es: "BTC tiene un mínimo relevante en 60.000 que ha aguantado dos veces. ¿Qué hay en la banda justo por debajo?"
    options:
      - id: a
        text:
          en: "A shelf of resting buy orders, since buyers defended that low twice."
          es: "Una repisa de compras en reposo, ya que los compradores lo defendieron dos veces."
      - id: b
        text:
          en: "Nothing in particular — orders are spread evenly below the current price."
          es: "Nada en particular: las órdenes se reparten por igual bajo el precio actual."
      - id: c
        correct: true
        text:
          en: "A dense shelf of sell orders: long stops and liquidations near 59,700–59,900."
          es: "Una repisa densa de ventas: stops y liquidaciones de largos en 59.700-59.900."
      - id: d
        text:
          en: "Only exchange insurance-fund orders, which are invisible to everyone."
          es: "Solo órdenes del fondo de seguros del exchange, invisibles para todos."
    explanation:
      en: "Long stop-losses cluster around 59,900 and the liquidation prices of leveraged longs sit just beneath them — all sell orders. The buyers who defended the low are already positioned, so what rests below is the exit door, not more demand. The map is not random; it is built by shared, predictable reasoning: 'put your stop just beyond the level that held twice' sends thousands of orders to the same handful of ticks."
      es: "Los stop-loss de largos se agrupan en torno a 59.900 y los precios de liquidación de los largos apalancados quedan justo debajo: todo son órdenes de venta. Los compradores que defendieron el mínimo ya están posicionados, así que lo que descansa debajo es la puerta de salida, no más demanda. El mapa no es aleatorio: lo construye un razonamiento compartido y predecible: 'pon el stop justo más allá del nivel que aguantó dos veces' envía miles de órdenes a los mismos pocos ticks."
  - id: sweep-steps
    kind: ordering
    prompt:
      en: "A large player wants to accumulate a big long near 60,000. Put the stages of the sweep in order."
      es: "Un gran participante quiere acumular un largo grande cerca de 60.000. Ordena las etapas del barrido."
    items:
      - id: nudge
        position: 1
        text:
          en: "Price is nudged down to 59,850 — below the shelf of stops."
          es: "El precio se empuja hasta 59.850, por debajo de la plataforma de stops."
      - id: stops
        position: 2
        text:
          en: "Long stop-losses trigger as market sells."
          es: "Los stop-loss de los largos se disparan como ventas a mercado."
      - id: liq
        position: 3
        text:
          en: "Leveraged longs down there are liquidated, adding more forced selling."
          es: "Los largos apalancados de esa zona son liquidados, añadiendo más venta forzosa."
      - id: absorb
        position: 4
        text:
          en: "All of that selling is absorbed by the large player's resting buy orders."
          es: "Toda esa venta es absorbida por las órdenes de compra en reposo del gran participante."
      - id: snap
        position: 5
        text:
          en: "Price wicks to 59,700 and snaps straight back above 60,000."
          es: "El precio hace una mecha hasta 59.700 y vuelve de golpe por encima de 60.000."
    explanation:
      en: "The people who were stopped out and liquidated sold the exact low, and their orders were the liquidity someone else filled into. The tell is the snap-back: a genuine break holds beyond the level; a sweep pokes through and reclaims within a candle or two."
      es: "Quienes fueron stopeados y liquidados vendieron exactamente el mínimo, y sus órdenes fueron la liquidez que otro absorbió. La señal es el regreso: una ruptura genuina se sostiene más allá del nivel; un barrido lo atraviesa y lo recupera en una o dos velas."
  - id: stop-outside-pool
    prompt:
      en: "You are long and want to place your stop sensibly relative to an obvious swing low and round number. What is the rule?"
      es: "Estás largo y quieres colocar el stop de forma sensata respecto a un mínimo obvio y un número redondo. ¿Cuál es la regla?"
    options:
      - id: a
        correct: true
        text:
          en: "Put it beyond the round number and the swing extreme, outside the crowd."
          es: "Ponlo más allá del número redondo y del extremo, fuera de la multitud."
      - id: b
        text:
          en: "Put it exactly at the swing low, so that you are out before the sweep runs."
          es: "Ponlo exactamente en el mínimo, para salir antes de que corra el barrido."
      - id: c
        text:
          en: "Put it just inside the pool, where liquidity is deepest and fills are better."
          es: "Ponlo dentro del grupo, donde hay más liquidez y mejor ejecución."
      - id: d
        text:
          en: "Do not use a stop at all — sweeps make stop orders counterproductive."
          es: "No uses stop: los barridos hacen contraproducentes las órdenes de stop."
    explanation:
      en: "If you can see the shelf, so can whoever benefits from sweeping it. A stop parked one tick inside an obvious pool — or sitting exactly on the level everyone else used — is fuel for the sweep that takes it. Beyond the level costs a little more when you are wrong and spares you from being the liquidity someone else fills into. Abandoning the stop entirely just replaces a bounded loss with an unbounded one."
      es: "Si tú ves la repisa, también la ve quien se beneficia de barrerla. Un stop colocado un tick dentro de un grupo obvio —o justo en el nivel que usó todo el mundo— es combustible para el barrido que lo toma. Más allá del nivel cuesta algo más cuando te equivocas y evita que seas la liquidez que otro absorbe. Renunciar al stop solo cambia una pérdida acotada por una sin límite."
