type: quiz
variants:
  - id: weaker-mechanism
    prompt:
      en: "m31-l1 calls the diagonal the weakest instrument in the course. What is the mechanical reason?"
      es: "m31-l1 llama a la diagonal el instrumento más débil del curso. ¿Cuál es la razón mecánica?"
    options:
      - id: a
        text:
          en: "Diagonals are computed from fewer candles, so they carry a smaller sample."
          es: "Las diagonales se calculan con menos velas, así que llevan una muestra menor."
      - id: b
        correct: true
        text:
          en: "No order can rest at a price that moves, so nothing remembers where it was."
          es: "Ninguna orden descansa en un precio que se mueve: nada recuerda dónde estaba."
      - id: c
        text:
          en: "They only work on daily charts, and crypto trades around the clock every day."
          es: "Solo funcionan en gráficos diarios, y las cripto cotizan a todas horas cada día."
      - id: d
        text:
          en: "Exchanges do not publish the data a sloped line would need to be drawn from."
          es: "Los exchanges no publican los datos con los que habría que trazar una inclinada."
    explanation:
      en: "A horizontal level works because orders rest at prices: a shelf that held twice may hold again because some of those same orders are still sitting there. A diagonal names a price that changes every bar, and nobody's stop or limit is parked at 'wherever the line is next Tuesday'. What the line describes is a regularity of demand that has held so far, which nobody is obliged to maintain."
      es: "Un nivel horizontal funciona porque las órdenes descansan en precios: un estante que aguantó dos veces puede volver a aguantar porque algunas de esas mismas órdenes siguen ahí. Una diagonal nombra un precio que cambia cada barra, y el stop o el límite de nadie está aparcado en «donde esté la línea el martes que viene». Lo que describe la línea es una regularidad de la demanda que se ha cumplido hasta ahora, y nadie está obligado a mantenerla."
  - id: two-traders
    kind: true_false
    prompt:
      en: "Two competent traders can draw different trendlines on the same chart and both be following the rules."
      es: "Dos operadores competentes pueden trazar líneas de tendencia distintas en el mismo gráfico y estar los dos siguiendo las reglas."
    answer: true
    explanation:
      en: "True, and it is the honest reason to hold a diagonal loosely. The line depends on which extremes you count and whether you anchor on wicks or bodies — both defensible choices. The discipline is not that there is one right line; it is that you declare your criterion, keep it, and do not redraw the line to keep a thesis alive."
      es: "Cierto, y es la razón honesta para no aferrarse a lo que dice una diagonal. La línea depende de qué extremos cuentas y de si te anclas en mechas o en cuerpos, dos elecciones defendibles las dos. La disciplina no es que haya una única línea correcta: es que declares tu criterio, lo mantengas y no redibujes la línea para mantener viva una tesis."
  - id: wick-through
    prompt:
      en: "A single candle's wick pierces a validated trendline and the candle closes back above it. What have you learned?"
      es: "La mecha de una sola vela atraviesa una línea de tendencia validada y la vela cierra otra vez por encima. ¿Qué has aprendido?"
    options:
      - id: a
        text:
          en: "The trendline is broken: any trade through the line ends its validity for good."
          es: "La línea está rota: cualquier operación a través de ella acaba con su validez."
      - id: b
        text:
          en: "The trendline is confirmed, since price defended it inside that very candle."
          es: "La línea queda confirmada, ya que el precio la defendió dentro de esa misma vela."
      - id: c
        correct: true
        text:
          en: "Very little — a wick through a diagonal is even weaker evidence than usual."
          es: "Muy poco: una mecha a través de una diagonal es evidencia aún más débil que de costumbre."
      - id: d
        text:
          en: "That the anchors were wrong and the whole line has to be redrawn from scratch."
          es: "Que los anclajes estaban mal y hay que volver a trazar la línea entera desde cero."
    explanation:
      en: "The body decides, which is m08-l1's rule unchanged. And a wick through a diagonal is worth even less than a wick through a horizontal level: at a horizontal level, price at least traded where a pool of real orders was sitting. Here it traded where a line somebody drew happened to be. It is not a break, and it is not a defence either."
      es: "Decide el cuerpo, que es la regla de m08-l1 sin cambios. Y una mecha a través de una diagonal vale aún menos que una a través de un nivel horizontal: en un nivel horizontal, al menos el precio negoció donde había una bolsa de órdenes reales. Aquí negoció donde estaba una línea que alguien dibujó. No es una ruptura, y tampoco es una defensa."
  - id: not-here
    prompt:
      en: "Price has been going sideways between two horizontal bounds for six weeks. Where does a trendline fit?"
      es: "El precio lleva seis semanas lateral entre dos límites horizontales. ¿Dónde encaja una línea de tendencia?"
    options:
      - id: a
        correct: true
        text:
          en: "Nowhere: with no rate of advance there is no rhythm for a diagonal to describe."
          es: "En ningún sitio: sin ritmo de avance no hay regularidad que una diagonal describa."
      - id: b
        text:
          en: "Draw a very shallow one across the lows to catch the trend forming underneath it."
          es: "Traza una muy plana por los mínimos para pillar la tendencia que se forma debajo."
      - id: c
        text:
          en: "Draw two, one per bound, so the range is expressed in the same language as a trend."
          es: "Traza dos, una por límite, para expresar el rango en el mismo lenguaje que una tendencia."
      - id: d
        text:
          en: "Use the diagonal to time the exit, since a range always ends in a trend eventually."
          es: "Usa la diagonal para cronometrar la salida, ya que un rango siempre acaba en tendencia."
    explanation:
      en: "A range has horizontal bounds and no rate of advance, and a diagonal's only claim is a rate of advance. Reaching for a near-flat trendline to describe a sideways market means swapping a tool with a mechanism — resting orders at a price, m03-l2 — for one without. The horizontal level was the right instrument and it was already there."
      es: "Un rango tiene límites horizontales y ningún ritmo de avance, y la única afirmación de una diagonal es un ritmo de avance. Recurrir a una línea casi plana para describir un mercado lateral es cambiar una herramienta con mecanismo —órdenes en reposo en un precio, m03-l2— por otra sin él. El nivel horizontal era el instrumento correcto y ya estaba ahí."
  - id: what-each-claims
    kind: matching
    prompt:
      en: "Match each drawn object to the claim it actually makes."
      es: "Empareja cada objeto trazado con la afirmación que hace de verdad."
    pairs:
      - id: horiz
        left:
          en: "Horizontal level"
          es: "Nivel horizontal"
        right:
          en: "This price mattered, and resting orders can still be sitting at it."
          es: "Este precio importó, y todavía puede haber órdenes en reposo en él."
      - id: diag
        left:
          en: "Trendline"
          es: "Línea de tendencia"
        right:
          en: "Demand has been arriving at a steady rate that nothing obliges it to keep."
          es: "La demanda llega a un ritmo constante que nada obliga a mantener."
      - id: chan
        left:
          en: "Channel"
          es: "Canal"
        right:
          en: "That rhythm has had a width as well as a slope, so far."
          es: "Ese ritmo ha tenido también una anchura además de una pendiente, hasta ahora."
      - id: proj
        left:
          en: "The projection past the last touch"
          es: "La proyección más allá del último toque"
        right:
          en: "Where the line would be, if it continued — the part a break is judged against."
          es: "Dónde estaría la línea si continuara: la parte contra la que se juzga una ruptura."
    explanation:
      en: "Reading them side by side is the point of the lesson. Only the first names something that exists in the order book. The other three are descriptions of a regularity plus an extrapolation of it, which is why the same break evidence — a body, and participation — is demanded more strictly here, not less."
      es: "Leerlos en paralelo es el sentido de la lección. Solo el primero nombra algo que existe en el libro de órdenes. Los otros tres son descripciones de una regularidad más una extrapolación de ella, y por eso la misma evidencia de ruptura —un cuerpo y participación— se exige aquí con más rigor, no con menos."
  - id: stop-pocket
    prompt:
      en: "Everyone is watching the same obvious rising support. Why does that make the line more dangerous, not safer?"
      es: "Todo el mundo mira el mismo soporte ascendente evidente. ¿Por qué eso hace la línea más peligrosa y no más segura?"
    options:
      - id: a
        text:
          en: "A crowded line stops working the moment more than a handful of people watch it."
          es: "Una línea concurrida deja de funcionar en cuanto la miran más de unos pocos."
      - id: b
        text:
          en: "Crowded lines are recalculated by the exchanges, which moves them without warning."
          es: "Los exchanges recalculan las líneas concurridas, y eso las mueve sin previo aviso."
      - id: c
        text:
          en: "The more people watch a line, the wider the spread gets at exactly that price."
          es: "Cuantos más miran una línea, más se ensancha el spread justo en ese precio."
      - id: d
        correct: true
        text:
          en: "Everyone's stop goes just under it, which is a known pocket of forced sell orders."
          es: "El stop de todos va justo debajo, y eso es una bolsa conocida de ventas forzadas."
    explanation:
      en: "This is m17-l2 arriving at a diagonal. A visible line concentrates protective stops immediately beneath it, and a pocket of resting sell orders at a known price is exactly what a sweep goes looking for. The move into it triggers them and the forced selling can print a candle clean through the line before price closes back above. The defence is the same as everywhere: wait for the close, and check whether anyone came with it."
      es: "Esto es m17-l2 llegando a una diagonal. Una línea visible concentra stops de protección justo debajo, y una bolsa de órdenes de venta en reposo en un precio conocido es exactamente lo que va buscando un barrido. El movimiento hasta ahí las dispara y las ventas forzadas pueden imprimir una vela limpiamente a través de la línea antes de que el precio cierre otra vez por encima. La defensa es la de siempre: espera al cierre y comprueba si vino alguien detrás."
