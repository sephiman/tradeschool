# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: cluster-magnet
    prompt:
      en: "A liquidation cluster sits just below the current price. In practice, what does that tend to mean?"
      es: "Un clúster de liquidaciones está justo debajo del precio actual. En la práctica, ¿qué suele significar eso?"
    options:
      - id: a
        correct: true
        text:
          en: "Price is often drawn toward the cluster, and the move can accelerate as the forced closes there trigger — a magnet and an accelerant, not a certainty."
          es: "El precio suele verse atraído hacia el clúster, y el movimiento puede acelerarse cuando se disparan los cierres forzosos de ahí: un imán y un acelerador, no una certeza."
      - id: b
        text:
          en: "Price will reliably avoid the cluster, because the exchange protects the positions parked there."
          es: "El precio evitará el clúster de forma fiable, porque el exchange protege las posiciones aparcadas ahí."
      - id: c
        text:
          en: "It just marks a zone of high trading volume and has no effect on where price goes."
          es: "Solo marca una zona de alto volumen de operaciones y no tiene ningún efecto sobre a dónde va el precio."
      - id: d
        text:
          en: "It means the market has run out of liquidity there and price will stop moving."
          es: "Significa que el mercado se ha quedado sin liquidez ahí y el precio dejará de moverse."
    explanation:
      en: "Liquidation clusters act like magnets: reaching one triggers forced closes whose orders pull price the last stretch in and can accelerate the move through it. It is a probability and a source of volatility, not a guaranteed target — and it is a forced-close zone, not a comment on 'liquidity.'"
      es: "Los clústeres de liquidación actúan como imanes: alcanzar uno dispara cierres forzosos cuyas órdenes arrastran el precio el último tramo y pueden acelerar el movimiento a través de él. Es una probabilidad y una fuente de volatilidad, no un objetivo garantizado, y es una zona de cierres forzosos, no un comentario sobre la 'liquidez'."
  - id: short-squeeze
    prompt:
      en: "In a short squeeze, why does price accelerate upward?"
      es: "En un short squeeze, ¿por qué se acelera el precio hacia arriba?"
    options:
      - id: a
        correct: true
        text:
          en: "Shorts being force-closed have to buy to close, and that forced buying pushes price higher, liquidating still more shorts — a cascade up."
          es: "Los cortos que se cierran por la fuerza tienen que comprar para cerrar, y esa compra forzada empuja el precio más arriba, liquidando aún más cortos: una cascada hacia arriba."
      - id: b
        text:
          en: "The short sellers start selling even more aggressively, which somehow drives the price up."
          es: "Los vendedores en corto empiezan a vender aún más agresivamente, lo que de algún modo empuja el precio hacia arriba."
      - id: c
        text:
          en: "The exchange raises the price to punish traders who bet against the market."
          es: "El exchange sube el precio para castigar a los traders que apuestan contra el mercado."
      - id: d
        text:
          en: "New buyers calmly step in once the shorts have quietly finished closing."
          es: "Compradores nuevos entran con calma una vez que los cortos han terminado de cerrarse tranquilamente."
    explanation:
      en: "A liquidation is a forced close. Closing a short means buying back, so a wave of short liquidations is a wave of forced buying — which lifts price, liquidates more shorts, and cascades upward. A long squeeze is the mirror image: forced selling cascading down."
      es: "Una liquidación es un cierre forzoso. Cerrar un corto significa recomprar, así que una oleada de liquidaciones de cortos es una oleada de compra forzada, que sube el precio, liquida más cortos y forma una cascada hacia arriba. Un long squeeze es la imagen especular: venta forzada en cascada hacia abajo."
  - id: liquidation-def
    prompt:
      en: "Which of these best describes a liquidation on a futures exchange?"
      es: "¿Cuál de estas opciones describe mejor una liquidación en un exchange de futuros?"
    options:
      - id: a
        correct: true
        text:
          en: "The exchange forcibly closing a leveraged position once its margin can no longer cover the loss."
          es: "El cierre forzoso de una posición apalancada por parte del exchange cuando su margen ya no puede cubrir la pérdida."
      - id: b
        text:
          en: "Any large wave of selling that pushes the price down sharply."
          es: "Cualquier oleada grande de ventas que empuja el precio bruscamente hacia abajo."
      - id: c
        text:
          en: "A trader choosing to sell their position to lock in a profit."
          es: "Un trader que decide vender su posición para asegurar una ganancia."
      - id: d
        text:
          en: "The market running out of buyers so that orders can no longer fill."
          es: "El mercado que se queda sin compradores, de modo que las órdenes ya no se pueden ejecutar."
    explanation:
      en: "A liquidation is strictly a forced close: the exchange shuts a leveraged position when its margin can't cover the loss. It is not ordinary selling, not a voluntary profit-take, and not 'liquidity' — those are separate things that get muddled with the word."
      es: "Una liquidación es estrictamente un cierre forzoso: el exchange cierra una posición apalancada cuando su margen no puede cubrir la pérdida. No es una venta corriente, ni una toma de ganancias voluntaria, ni la 'liquidez': son cosas distintas que se confunden con la palabra."
  - id: repel-myth
    kind: true_false
    prompt:
      en: "A liquidation cluster repels price, pushing it away from that level."
      es: "Un clúster de liquidaciones repele el precio, empujándolo lejos de ese nivel."
    answer: false
    explanation:
      en: "It's the opposite: a cluster acts like a magnet. Reaching it triggers forced closes whose orders pull price the last stretch in and can accelerate the move through it. Clusters attract price and add volatility — they don't repel it."
      es: "Es al revés: un clúster actúa como un imán. Alcanzarlo dispara cierres forzosos cuyas órdenes arrastran el precio el último tramo hacia dentro y pueden acelerar el movimiento a través de él. Los clústeres atraen el precio y añaden volatilidad; no lo repelen."
  - id: cluster-tiers
    prompt:
      en: "Longs opened at 60,000 at 100×, 50× and 20×, with a 0.5% maintenance margin, have liquidation prices of 59,700, 59,100 and 57,300 respectively. Price wicks down to 59,000 and recovers. Which clusters did that wick harvest?"
      es: "Largos abiertos en 60.000 a 100×, 50× y 20×, con un margen de mantenimiento del 0,5%, tienen precios de liquidación de 59.700, 59.100 y 57.300 respectivamente. El precio hace una mecha hasta 59.000 y se recupera. ¿Qué clústeres cosechó esa mecha?"
    options:
      - id: a
        correct: true
        text:
          en: "The 100× and 50× clusters, but not the 20× one — and the forced selling from the first two is exactly what can carry price down toward the third."
          es: "Los clústeres de 100× y 50×, pero no el de 20×, y la venta forzosa de los dos primeros es precisamente lo que puede llevar el precio hacia el tercero."
      - id: b
        text:
          en: "All three — a cascade force-closes every leveraged position at once."
          es: "Los tres: una cascada cierra por la fuerza todas las posiciones apalancadas a la vez."
      - id: c
        text:
          en: "Only the 100× cluster; the 50× liquidation sits at 58,800, below the wick."
          es: "Solo el de 100×; la liquidación del 50× está en 58.800, por debajo de la mecha."
      - id: d
        text:
          en: "None — a 1.7% move cannot liquidate anything, because liquidation needs the full 1/leverage distance."
          es: "Ninguno: un movimiento del 1,7% no puede liquidar nada, porque la liquidación exige la distancia completa de 1/apalancamiento."
    explanation:
      en: "This is why clusters stack densest right under price and go off on tiny moves: the higher the leverage, the closer liquidation sits to entry. Option C is the classic slip of dropping the maintenance-margin term (60,000 × (1 − 0.02) = 58,800 instead of 59,100), which moves the level further from price than it really is."
      es: "Por esto los clústeres se acumulan más densos justo debajo del precio y se disparan con movimientos mínimos: cuanto mayor es el apalancamiento, más cerca de la entrada queda la liquidación. La opción C es el desliz clásico de olvidar el término de margen de mantenimiento (60.000 × (1 − 0,02) = 58.800 en vez de 59.100), que aleja el nivel del precio más de lo que está en realidad."
  - id: terms-match
    kind: matching
    prompt:
      en: "Match each term to what it describes."
      es: "Empareja cada término con lo que describe."
    pairs:
      - id: ss
        left:
          en: "Short squeeze"
          es: "Short squeeze"
        right:
          en: "Forced buying that cascades price upward"
          es: "Compra forzada que forma una cascada del precio hacia arriba"
      - id: ls
        left:
          en: "Long squeeze"
          es: "Long squeeze"
        right:
          en: "Forced selling that cascades price downward"
          es: "Venta forzada que forma una cascada del precio hacia abajo"
      - id: cl
        left:
          en: "Liquidation cluster"
          es: "Clúster de liquidaciones"
        right:
          en: "A price zone that acts like a magnet for volatile moves"
          es: "Una zona de precio que actúa como un imán para los movimientos violentos"
    explanation:
      en: "A short squeeze is forced buying (shorts buying to close) cascading up; a long squeeze is forced selling (longs selling to close) cascading down; a liquidation cluster is the pool of would-be forced closes near one price that draws price toward it and turns volatile."
      es: "Un short squeeze es compra forzada (cortos que compran para cerrar) en cascada hacia arriba; un long squeeze es venta forzada (largos que venden para cerrar) en cascada hacia abajo; un clúster de liquidaciones es la bolsa de cierres forzosos potenciales cerca de un mismo precio que atrae el precio hacia sí y lo vuelve volátil."
  - id: squeeze-fuel-signs
    kind: multi_select
    prompt:
      en: "Select ALL of the following that together tell you a market is primed for a squeeze."
      es: "Selecciona TODO lo que en conjunto te dice que un mercado está preparado para un squeeze."
    options:
      - id: a
        correct: true
        text:
          en: "Funding has gone clearly one-sided, so the crowded side is paying to hold."
          es: "El funding se ha vuelto claramente unilateral, así que el lado saturado paga por mantener."
      - id: b
        correct: true
        text:
          en: "Open interest has climbed on that same crowded side."
          es: "El interés abierto ha subido en ese mismo lado saturado."
      - id: c
        correct: true
        text:
          en: "A fat cluster of stops and liquidation prices sits on the crowded side."
          es: "Un grupo denso de stops y precios de liquidación se sitúa en el lado saturado."
      - id: d
        text:
          en: "The data tells you when the spark will arrive."
          es: "Los datos te dicen cuándo llegará la chispa."
      - id: e
        text:
          en: "The cluster tells you which direction the day will end."
          es: "El grupo te dice en qué dirección terminará el día."
    explanation:
      en: "One-sided funding plus a fat cluster on the crowded side is loaded fuel. The data still does not predict the spark; it shows you a market primed to burn."
      es: "Un funding unilateral más un grupo denso en el lado saturado es combustible cargado. Los datos siguen sin predecir la chispa: te muestran un mercado listo para arder."
  - id: cluster-not-target
    prompt:
      en: "How should a liquidation map be used?"
      es: "¿Cómo debería usarse un mapa de liquidaciones?"
    options:
      - id: a
        correct: true
        text:
          en: "As zones of volatility and likely sweeps — a cluster tells you where it may get violent, not which way the day ends."
          es: "Como zonas de volatilidad y probables barridos: un grupo te dice dónde puede volverse violento, no en qué dirección termina el día."
      - id: b
        text:
          en: "As price targets to trade toward, since price is drawn to clusters."
          es: "Como objetivos de precio hacia los que operar, ya que el precio se siente atraído por los grupos."
      - id: c
        text:
          en: "As support and resistance levels that hold price back."
          es: "Como niveles de soporte y resistencia que contienen el precio."
      - id: d
        text:
          en: "As a place to park your own stop, where liquidity is deepest."
          es: "Como lugar donde colocar tu propio stop, donde la liquidez es mayor."
    explanation:
      en: "None of this predicts direction — it maps the fuel and shows you where the market tends to burn it. And keep your own stops outside the obvious pool, beyond the level rather than one tick inside it."
      es: "Nada de esto predice la dirección: cartografía el combustible y te muestra dónde suele quemarlo el mercado. Y mantén tus propios stops fuera del grupo obvio, más allá del nivel y no un tick por dentro."
  - id: leverage-density
    prompt:
      en: "Why do liquidation clusters in crypto go off on such small moves?"
      es: "¿Por qué los grupos de liquidación en cripto se disparan con movimientos tan pequeños?"
    options:
      - id: a
        correct: true
        text:
          en: "Perps allow 50–100×+, so liquidation prices sit right next to entry — a roughly 1% wick can liquidate a 100× position, so the trigger needs almost nothing."
          es: "Los perps permiten 50-100× o más, así que los precios de liquidación quedan justo al lado de la entrada: una mecha de en torno al 1% puede liquidar una posición a 100×, así que el disparador casi no necesita nada."
      - id: b
        text:
          en: "Exchanges deliberately trigger clusters at fixed times of day."
          es: "Los exchanges disparan los grupos deliberadamente a horas fijas del día."
      - id: c
        text:
          en: "Because maintenance margin is larger in crypto than in other markets."
          es: "Porque el margen de mantenimiento es mayor en cripto que en otros mercados."
      - id: d
        text:
          en: "Because funding is charged three times a day, which moves price."
          es: "Porque el funding se cobra tres veces al día, y eso mueve el precio."
    explanation:
      en: "Dense clusters plus no closing bell plus thin books is the whole reason cascades are worse here: they fire at 3am, run unopposed, and overshoot because there was nothing there to absorb them."
      es: "Grupos densos, sin campana de cierre y libros finos: esa es toda la razón de que las cascadas sean peores aquí. Se disparan a las 3 de la madrugada, corren sin oposición y se exceden porque no había nada que las absorbiera."
