# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: why-they-work
    prompt:
      en: "Why do Fibonacci retracement levels have any predictive value in markets at all?"
      es: "¿Por qué tienen los niveles de retroceso de Fibonacci algún valor predictivo en los mercados?"
    options:
      - id: a
        text:
          en: "Because the golden ratio governs natural growth, so it must govern price too."
          es: "Porque el número áureo rige el crecimiento natural, así que debe regir el precio."
      - id: b
        correct: true
        text:
          en: "Because a crowd watches them, and they can overlap real structure."
          es: "Porque una multitud los vigila y pueden solaparse con estructura real."
      - id: c
        text:
          en: "Because price is mathematically forced to respect 61.8% of any move."
          es: "Porque el precio está obligado matemáticamente a respetar el 61,8 % de un movimiento."
      - id: d
        text:
          en: "Because the exchanges program the levels into the matching engine itself."
          es: "Porque los exchanges programan los niveles en el propio motor de emparejamiento."
    explanation:
      en: "There is no mechanism forcing a market to respect a ratio: prices are set by orders. The levels do something because so many traders watch them and rest orders there — making them briefly self-fulfilling — and because they add confluence with real structure like prior support. Never because a spiral in a sunflower, or a line of exchange code, controls order flow."
      es: "No hay ningún mecanismo que obligue a un mercado a respetar una ratio: los precios los fijan las órdenes. Los niveles hacen algo porque muchísimos traders los vigilan y dejan órdenes ahí —lo que los vuelve autocumplidos por un momento— y porque aportan confluencia con estructura real como un soporte previo. Nunca porque una espiral en un girasol, o una línea de código del exchange, controle el flujo de órdenes."
  - id: golden-pullback
    prompt:
      en: "Which statement about the 0.618 'golden' pullback is correct?"
      es: "¿Qué afirmación sobre el retroceso 'dorado' del 0,618 es correcta?"
    options:
      - id: a
        text:
          en: "Price has to reverse exactly at the 0.618 level when it reaches it."
          es: "El precio tiene que girar exactamente en el nivel 0,618 al llegar a él."
      - id: b
        text:
          en: "In an uptrend the 0.618 always holds; a break through it never happens."
          es: "En una tendencia alcista el 0,618 siempre aguanta; nunca se rompe."
      - id: c
        correct: true
        text:
          en: "It marks a zone where a reversal is likelier; wait for a reaction."
          es: "Marca una zona donde el giro es más probable; espera una reacción."
      - id: d
        text:
          en: "The 0.618 is only valid when no other support or resistance is nearby."
          es: "El 0,618 solo vale cuando no hay ningún otro soporte o resistencia cerca."
    explanation:
      en: "0.618 is a zone, not a laser line: price routinely wicks past it or stops short, and plenty of pullbacks slice straight through. It is strongest, not weakest, as confluence with other structure — a fib that lands on an old support shelf is three reasons stacked in one spot. Treat it as a place to watch and confirm, never as a point where a turn is guaranteed."
      es: "El 0,618 es una zona, no una línea de láser: el precio suele mechar más allá o quedarse corto, y muchos retrocesos lo atraviesan de largo. Es más fuerte, no más débil, como confluencia con otra estructura: un fib que cae sobre un soporte antiguo son tres razones apiladas en un punto. Trátalo como un sitio donde mirar y confirmar, nunca como un punto donde el giro esté garantizado."
  - id: exact-reversal
    kind: true_false
    prompt:
      en: "Price must reverse exactly at the 0.618 level."
      es: "El precio tiene que girar exactamente en el nivel 0,618."
    answer: false
    explanation:
      en: "0.618 is a zone, not a laser line. Price routinely overshoots, wicks through, or stops short. Read it as 'a reversal is more likely around here' and wait for a real reaction — a stop placed one tick beyond a 'perfect' turn gets taken out by normal noise."
      es: "El 0,618 es una zona, no una línea de láser. El precio se pasa de largo, mecha a través o se queda corto con toda naturalidad. Léelo como 'aquí es más probable un giro' y espera una reacción real: un stop puesto un tick más allá de un giro 'perfecto' lo saca el ruido normal."
  - id: reasons-work
    kind: multi_select
    prompt:
      en: "Select ALL the reasons a Fibonacci level can actually produce a reaction in price."
      es: "Selecciona TODAS las razones por las que un nivel de Fibonacci puede producir realmente una reacción en el precio."
    options:
      - id: a
        correct: true
        text:
          en: "A crowd of traders and algos rest orders at the same level."
          es: "Una multitud de traders y algoritmos deja órdenes en el mismo nivel."
      - id: b
        correct: true
        text:
          en: "It coincides with structure that already mattered, like old support."
          es: "Coincide con estructura que ya importaba, como un soporte antiguo."
      - id: c
        text:
          en: "The golden ratio governs natural growth, so it governs order flow too."
          es: "El número áureo rige el crecimiento natural, luego rige el flujo de órdenes."
      - id: d
        text:
          en: "Exchanges program the ratios directly into the matching engine."
          es: "Los exchanges programan las ratios en el motor de emparejamiento."
    explanation:
      en: "Fib levels do something for two honest reasons: a watching crowd makes them briefly self-fulfilling, and they gain weight when they overlap real structure. No sunflower spiral and no exchange code forces price to a ratio — the level has no power of its own, only borrowed power from the people looking at it."
      es: "Los niveles de fib hacen algo por dos razones honestas: una multitud que los vigila los vuelve autocumplidos por un momento, y ganan peso cuando se solapan con estructura real. Ninguna espiral de girasol ni código de exchange obliga al precio a una ratio: el nivel no tiene poder propio, solo el prestado por quienes lo miran."
  - id: no-guarantee
    kind: true_false
    prompt:
      en: "There is a real mechanism in the market that forces price to respect 61.8% of a move."
      es: "Existe un mecanismo real en el mercado que obliga al precio a respetar el 61,8 % de un movimiento."
    answer: false
    explanation:
      en: "Nothing forces a market to a ratio — prices are set by orders, not by a spiral in a sunflower. Fib levels only do something because a crowd watches them and because they can line up with structure that already mattered."
      es: "Nada obliga a un mercado a una ratio: los precios los fijan las órdenes, no una espiral en un girasol. Los niveles de fib solo hacen algo porque una multitud los vigila y porque pueden coincidir con estructura que ya importaba."
  - id: fib-alone
    prompt:
      en: "You spot a 0.618 level sitting in open space, with no prior support, round number, or moving average anywhere near it. How much weight should it carry?"
      es: "Detectas un nivel 0,618 en espacio abierto, sin ningún soporte previo, número redondo ni media móvil cerca. ¿Cuánto peso debería tener?"
    options:
      - id: a
        text:
          en: "Full weight — 0.618 is the golden level, so it works wherever it lands."
          es: "Todo el peso: el 0,618 es el nivel dorado, así que funciona caiga donde caiga."
      - id: b
        text:
          en: "None at all — fib levels are useless unless an indicator confirms them."
          es: "Ninguno: los niveles de fib son inútiles salvo que un indicador los confirme."
      - id: c
        correct: true
        text:
          en: "Little on its own — a lone fib is a guess with a decimal attached."
          es: "Poco por sí solo: un fib aislado es una conjetura con un decimal pegado."
      - id: d
        text:
          en: "It guarantees a bounce for as long as the wider trend is still up."
          es: "Garantiza un rebote mientras la tendencia general siga siendo alcista."
    explanation:
      en: "A fib in empty space is just a line; it did not create anything, and the golden ratio confers no authority by itself. Its value comes from confluence — sitting on a level that already mattered — plus a real reaction from price. That is a much lower bar than 'an indicator must confirm it', and a much higher one than 'the trend is up'."
      es: "Un fib en espacio vacío es solo una línea; no creó nada, y el número áureo no le da autoridad por sí mismo. Su valor viene de la confluencia —caer sobre un nivel que ya importaba— más una reacción real del precio. Eso es un listón mucho más bajo que 'un indicador debe confirmarlo' y mucho más alto que 'la tendencia es alcista'."
  - id: stop-at-618
    prompt:
      en: "You expect a bounce near the 0.618 pullback and want to act sensibly. What is the best approach?"
      es: "Esperas un rebote cerca del retroceso 0,618 y quieres actuar con sensatez. ¿Cuál es el mejor enfoque?"
    options:
      - id: a
        correct: true
        text:
          en: "Treat the level as an alert: wait for a reaction and give the zone room."
          es: "Trata el nivel como un aviso: espera una reacción y da margen a la zona."
      - id: b
        text:
          en: "Put a limit buy exactly at 0.618 with a stop placed one tick below it."
          es: "Pon una compra límite exactamente en 0,618 con el stop un tick por debajo."
      - id: c
        text:
          en: "Go all-in at the instant price first touches the 0.618 line."
          es: "Entra con todo en el instante en que el precio toque por primera vez el 0,618."
      - id: d
        text:
          en: "Ignore the level entirely unless price sits exactly on it, to the cent."
          es: "Ignora el nivel del todo salvo que el precio esté encima, al céntimo."
    explanation:
      en: "0.618 is a zone and price wicks around it, so a one-tick stop gets taken out by normal noise and an instant full-size entry has no confirmation behind it at all. Use the level as an alert, wait for a reaction, and size and stop with room for the overshoot the level almost always produces — the slack is the point, not a failure of the level."
      es: "El 0,618 es una zona y el precio mecha a su alrededor, así que un stop de un tick lo saca el ruido normal y una entrada completa e instantánea no tiene ninguna confirmación detrás. Usa el nivel como aviso, espera una reacción y dimensiona y coloca el stop con margen para el exceso que el nivel casi siempre produce: la holgura es el punto, no un fallo del nivel."
  - id: use-without-trusting
    kind: ordering
    prompt:
      en: "Put the four habits for using a Fibonacci level without trusting it in order."
      es: "Ordena los cuatro hábitos para usar un nivel de Fibonacci sin fiarte de él."
    items:
      - id: anchor
        position: 1
        text:
          en: "Anchor the tool start-to-end on one clean impulse leg."
          es: "Ancla la herramienta de inicio a fin en un tramo de impulso limpio."
      - id: zone
        position: 2
        text:
          en: "Watch the 0.5–0.618 golden zone — where most trend pullbacks find a floor."
          es: "Vigila la zona dorada 0,5-0,618: donde la mayoría de retrocesos de tendencia encuentran suelo."
      - id: confluence
        position: 3
        text:
          en: "Ask what else lines up there — old support, a round number. A fib alone is a guess."
          es: "Pregunta qué más coincide ahí: un soporte antiguo, un número redondo. Un fib solo es una conjetura."
      - id: react
        position: 4
        text:
          en: "Wait for price to react at the level — the level is an alert, not a trigger."
          es: "Espera a que el precio reaccione en el nivel: el nivel es una alerta, no un detonante."
    explanation:
      en: "The order matters: the level only earns attention once something else agrees with it, and it only earns a trade once price actually reacts there. Skip either step and you are trading a decimal."
      es: "El orden importa: el nivel solo merece atención cuando algo más coincide con él, y solo merece una operación cuando el precio reacciona ahí de verdad. Si te saltas cualquiera de los dos pasos, estás operando un decimal."
  - id: fib-weight-match
    kind: matching
    prompt:
      en: "Match each Fibonacci situation to what it is worth."
      es: "Empareja cada situación de Fibonacci con lo que vale."
    pairs:
      - id: confluence
        left:
          en: "A 0.618 at 63,820, a hair below a round number at 64,000, right on an old support shelf"
          es: "Un 0,618 en 63.820, justo por debajo de un número redondo en 64.000 y sobre un soporte antiguo"
        right:
          en: "Three separate reasons to buy stacked in one spot — the fib didn't create the level, it agreed with levels that already mattered."
          es: "Tres razones distintas para comprar apiladas en un punto: el fib no creó el nivel, coincidió con niveles que ya importaban."
      - id: empty
        left:
          en: "A 0.618 floating in empty air — no prior support, no round number, no reaction on the way up"
          es: "Un 0,618 flotando en el vacío: sin soporte previo, sin número redondo, sin reacción en la subida"
        right:
          en: "A guess with a decimal attached — treat it as noise, not a level."
          es: "Una conjetura con un decimal pegado: trátalo como ruido, no como un nivel."
      - id: ext
        left: { en: "An extension at 1.618", es: "Una extensión en 1,618" }
        right:
          en: "A projection of where the next leg might reach if the trend pushes past the old extreme."
          es: "Una proyección de hasta dónde podría llegar el siguiente tramo si la tendencia supera el extremo anterior."
    explanation:
      en: "There is no mechanism forcing a market to respect 61.8% of a move. The levels do something because they are widely watched and because they sometimes coincide with levels that have their own reason to exist."
      es: "No hay ningún mecanismo que obligue a un mercado a respetar el 61,8% de un movimiento. Los niveles hacen algo porque están muy vigilados y porque a veces coinciden con niveles que tienen su propia razón de existir."
  - id: crypto-repeated-tests
    prompt:
      en: "How does a 24/7 market change what you should expect from a fib level?"
      es: "¿Cómo cambia un mercado 24/7 lo que deberías esperar de un nivel de Fibonacci?"
    options:
      - id: a
        text:
          en: "Expect one clean test per day, since the daily close resets the level."
          es: "Espera una prueba limpia al día, ya que el cierre diario reinicia el nivel."
      - id: b
        correct: true
        text:
          en: "Expect it wicked through and reclaimed several times, not respected once."
          es: "Espera que lo atraviesen y recuperen varias veces, no que se respete una vez."
      - id: c
        text:
          en: "Expect the level to hold more precisely, with more eyes on it at all hours."
          es: "Espera que aguante con más precisión, con más ojos encima a todas horas."
      - id: d
        text:
          en: "Expect fib levels to stop working entirely outside weekday trading hours."
          es: "Espera que los niveles dejen de funcionar fuera del horario laboral."
    explanation:
      en: "Stocks get one shot at a level per session, then the close resets everything. Crypto never closes, so a single level can be probed over and over, and the overshoots are larger in thin off-hours liquidity rather than tighter. That is one more reason to treat 0.618 as a zone with slack, not a line — the level keeps working, it just gets tested more sloppily."
      es: "Las acciones tienen un intento por sesión y luego el cierre lo reinicia todo. El cripto nunca cierra, así que un mismo nivel puede ser sondeado una y otra vez, y los excesos son mayores en la liquidez escasa de horas muertas, no menores. Es una razón más para tratar el 0,618 como una zona con holgura y no como una línea: el nivel sigue funcionando, solo que se pone a prueba de forma más sucia."
