# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: support-def
    prompt:
      en: "What is a support zone?"
      es: "¿Qué es una zona de soporte?"
    options:
      - id: a
        correct: true
        text:
          en: "A price area where buying has previously been strong enough to stop a fall."
          es: "Una zona de precio donde antes la compra ha sido lo bastante fuerte como para frenar una caída."
      - id: b
        text:
          en: "An exact price line at which price is guaranteed to reverse."
          es: "Una línea de precio exacta en la que el precio va a girar seguro."
      - id: c
        text:
          en: "The lowest price the asset has ever traded at."
          es: "El precio más bajo al que el activo ha cotizado nunca."
      - id: d
        text:
          en: "A floor below which price can never fall."
          es: "Un suelo por debajo del cual el precio nunca puede caer."
    explanation:
      en: "Support is an area where buyers have stepped in before — a zone, not an exact line, and never a guaranteed or permanent floor. Every support can and eventually does break."
      es: "El soporte es una zona donde los compradores han entrado antes: una zona, no una línea exacta, y nunca un suelo garantizado ni permanente. Todo soporte puede romperse y acaba rompiéndose."
  - id: always-holds-myth
    kind: true_false
    prompt:
      en: "A support zone, once it has held a few times, will always hold."
      es: "Una zona de soporte, una vez que ha aguantado unas cuantas veces, aguantará siempre."
    answer: false
    explanation:
      en: "No level always holds. A level is a probability, not a wall — and each test consumes the orders defending it, so a well-tested zone is often closer to breaking, not safer."
      es: "Ningún nivel aguanta siempre. Un nivel es una probabilidad, no un muro, y cada test consume las órdenes que lo defienden, así que una zona muy testeada suele estar más cerca de romperse, no más segura."
  - id: exact-line-myth
    kind: true_false
    prompt:
      en: "Support and resistance are best drawn as a single, exact price line."
      es: "Los soportes y las resistencias se dibujan mejor como una única línea de precio exacta."
    answer: false
    explanation:
      en: "They are zones, because the orders that create them are spread across a band of prices. Drawing an exact line produces constant false 'it broke!' alarms every time a wick pokes a fraction past it."
      es: "Son zonas, porque las órdenes que las crean están repartidas por una banda de precios. Dibujar una línea exacta genera constantes falsas alarmas de '¡se rompió!' cada vez que una mecha asoma una fracción más allá."
  - id: sr-match
    kind: matching
    prompt:
      en: "Match each term to its meaning."
      es: "Empareja cada término con su significado."
    pairs:
      - id: sup
        left: { en: "Support", es: "Soporte" }
        right:
          en: "A zone where buying has halted a fall."
          es: "Una zona donde la compra ha frenado una caída."
      - id: res
        left: { en: "Resistance", es: "Resistencia" }
        right:
          en: "A zone where selling has halted a rise."
          es: "Una zona donde la venta ha frenado una subida."
      - id: flip
        left: { en: "Role reversal (flip)", es: "Cambio de rol (giro)" }
        right:
          en: "A broken resistance later acting as support."
          es: "Una resistencia rota que luego actúa como soporte."
      - id: zone
        left: { en: "Zone", es: "Zona" }
        right:
          en: "A band of prices, not one exact number."
          es: "Una banda de precios, no un número exacto."
    explanation:
      en: "Support halts falls, resistance halts rises; both are bands of prices, and when one breaks convincingly it often flips into the other."
      es: "El soporte frena caídas, la resistencia frena subidas; ambos son bandas de precios, y cuando uno se rompe de forma convincente suele girarse en el otro."
  - id: zone-truths
    kind: multi_select
    prompt:
      en: "Select ALL statements about support/resistance zones that are TRUE."
      es: "Selecciona TODAS las afirmaciones sobre zonas de soporte/resistencia que sean VERDADERAS."
    options:
      - id: a
        correct: true
        text:
          en: "They are bands of prices, not single exact lines."
          es: "Son bandas de precios, no líneas exactas únicas."
      - id: b
        correct: true
        text:
          en: "A break is more trustworthy after a candle closes beyond the zone with real volume."
          es: "Una ruptura es más fiable después de que una vela cierre más allá de la zona con volumen real."
      - id: c
        correct: true
        text:
          en: "A broken resistance can later act as support."
          es: "Una resistencia rota puede luego actuar como soporte."
      - id: d
        text:
          en: "A zone that has been tested many times can never break."
          es: "Una zona testeada muchas veces no puede romperse nunca."
      - id: e
        text:
          en: "Support is a guaranteed floor that price cannot pass."
          es: "El soporte es un suelo garantizado que el precio no puede rebasar."
    explanation:
      en: "Zones are bands; a break earns trust from a close-with-volume, not a lone wick; and broken levels often flip roles. 'Never breaks' and 'guaranteed floor' are exactly the beliefs that blow up accounts."
      es: "Las zonas son bandas; una ruptura se gana la confianza con un cierre con volumen, no con una mecha suelta; y los niveles rotos suelen cambiar de rol. 'Nunca se rompe' y 'suelo garantizado' son justo las creencias que revientan cuentas."
  - id: false-break
    prompt:
      en: "BTC has a support zone at 60,000–60,300. On a quiet Sunday, price wicks down to 59,500 on light volume, then closes the candle back at 60,450. What is the best read?"
      es: "BTC tiene una zona de soporte en 60.000–60.300. Un domingo tranquilo, el precio hace una mecha hasta 59.500 con poco volumen y luego cierra la vela de nuevo en 60.450. ¿Cuál es la mejor lectura?"
    options:
      - id: a
        correct: true
        text:
          en: "Likely a false break on a thin weekend book — wait for a close below the zone with real volume before trusting it."
          es: "Probablemente una falsa ruptura en un libro fino de fin de semana: espera un cierre por debajo de la zona con volumen real antes de fiarte."
      - id: b
        text:
          en: "Support broke, so go short immediately."
          es: "El soporte se rompió, así que ponte corto de inmediato."
      - id: c
        text:
          en: "The zone is now invalid and should be deleted from the chart."
          es: "La zona ya no vale y hay que borrarla del gráfico."
      - id: d
        text:
          en: "A level always holds, so nothing happened at all."
          es: "Un nivel siempre aguanta, así que no pasó nada de nada."
    explanation:
      en: "The wick pierced the zone but the candle closed back inside it, on light volume, on a thin weekend — the signature of a false break or stop hunt. The zone still stands; a real break needs a close beyond it with volume."
      es: "La mecha perforó la zona pero la vela cerró de nuevo dentro, con poco volumen, en un fin de semana fino: la firma de una falsa ruptura o barrido de stops. La zona sigue en pie; una ruptura real necesita un cierre más allá con volumen."
  - id: role-reversal
    prompt:
      en: "Price breaks convincingly above a long-standing resistance zone, then pulls back to it. What often happens?"
      es: "El precio rompe de forma convincente por encima de una zona de resistencia de mucho tiempo y luego retrocede hacia ella. ¿Qué suele pasar?"
    options:
      - id: a
        correct: true
        text:
          en: "The old resistance can now act as support on the retest."
          es: "La vieja resistencia puede actuar ahora como soporte en el retest."
      - id: b
        text:
          en: "The old resistance becomes irrelevant and never matters again."
          es: "La vieja resistencia se vuelve irrelevante y ya nunca importa."
      - id: c
        text:
          en: "The break guarantees price will keep rising with no pullback."
          es: "La ruptura garantiza que el precio seguirá subiendo sin ningún retroceso."
      - id: d
        text:
          en: "The zone must be redrawn far lower on the chart."
          es: "Hay que redibujar la zona mucho más abajo en el gráfico."
    explanation:
      en: "This is role reversal: traders who missed the breakout buy the retest, so the old ceiling tends to act as a new floor. It is a tendency, not a guarantee, and it certainly does not promise an uninterrupted rise."
      es: "Esto es el cambio de rol: los traders que se perdieron la ruptura compran el retest, así que el viejo techo tiende a actuar como nuevo suelo. Es una tendencia, no una garantía, y desde luego no promete una subida ininterrumpida."
  - id: confirm-break-order
    kind: ordering
    prompt:
      en: "Order the checks before trusting that a support zone has truly broken, first to last."
      es: "Ordena las comprobaciones antes de fiarte de que una zona de soporte se ha roto de verdad, de la primera a la última."
    items:
      - id: reach
        position: 1
        text:
          en: "Price trades down into the support zone."
          es: "El precio baja hasta la zona de soporte."
      - id: wick
        position: 2
        text:
          en: "A wick pokes below the zone."
          es: "Una mecha asoma por debajo de la zona."
      - id: close
        position: 3
        text:
          en: "Wait for a candle to CLOSE below the zone, rather than reacting to the wick."
          es: "Espera a que una vela CIERRE por debajo de la zona, en vez de reaccionar a la mecha."
      - id: volume
        position: 4
        text:
          en: "Confirm the breakdown has real volume behind it."
          es: "Confirma que la ruptura tiene volumen real detrás."
      - id: retest
        position: 5
        text:
          en: "On the pullback, check the old support now caps price as resistance."
          es: "En el retroceso, comprueba que el viejo soporte ahora frena el precio como resistencia."
    explanation:
      en: "A lone wick below a zone is not a break — especially on a thin book. Trust it only after a close beyond the zone, backed by volume, and confirmed by the old support flipping to resistance on the retest."
      es: "Una mecha suelta por debajo de una zona no es una ruptura, sobre todo en un libro fino. Fíate solo tras un cierre más allá de la zona, con volumen detrás, y confirmado por el viejo soporte girándose a resistencia en el retest."
