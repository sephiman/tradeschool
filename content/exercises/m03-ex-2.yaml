# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: what-one-candle-is
    prompt:
      en: "On a 4-hour chart, what does a single candle represent?"
      es: "En un gráfico de 4 horas, ¿qué representa una sola vela?"
    options:
      - id: a
        text:
          en: "The price exactly four hours ago, sampled on the hour by the venue's clock."
          es: "El precio exactamente hace cuatro horas, tomado en punto por el venue."
      - id: b
        text:
          en: "Four individual trades, one for each hour it covers."
          es: "Cuatro operaciones individuales, una por cada hora que cubre."
      - id: c
        correct: true
        text:
          en: "Four hours of trading: its open, high, low and close over that window."
          es: "Cuatro horas de operativa: su apertura, máximo, mínimo y cierre en esa ventana."
      - id: d
        text:
          en: "A forecast of where price will be four hours from now."
          es: "Una previsión de dónde estará el precio dentro de cuatro horas."
    explanation:
      en: "A candle summarises one slice of time equal to its timeframe. On a 4-hour chart that slice is four hours; all four of its values are measured inside that window, not sampled at its edges, and however many trades happen in it, they collapse into those four numbers. It forecasts nothing."
      es: "Una vela resume una porción de tiempo igual a su temporalidad. En un gráfico de 4 horas esa porción son cuatro horas; sus cuatro valores se miden dentro de la ventana, no en sus bordes, y por muchas operaciones que ocurran, se resumen en esos cuatro números. No predice nada."
  - id: timeframe-weight
    prompt:
      en: "Why treat a signal on a 1-minute candle more cautiously than the same signal on a daily candle?"
      es: "¿Por qué tratar con más cautela una señal en una vela de 1 minuto que la misma señal en una vela diaria?"
    options:
      - id: a
        text:
          en: "Lower timeframes show more candles, so they give more reliable information."
          es: "Las temporalidades bajas muestran más velas, así que dan información más fiable."
      - id: b
        correct: true
        text:
          en: "A daily candle is formed by far more participants and volume."
          es: "Una vela diaria la forman muchos más participantes y volumen."
      - id: c
        text:
          en: "One-minute candles are calculated with a different formula."
          es: "Las velas de 1 minuto se calculan con una fórmula distinta."
      - id: d
        text:
          en: "Daily candles cannot have wicks, which is what makes them cleaner."
          es: "Las velas diarias no pueden tener mechas, y por eso son más limpias."
    explanation:
      en: "Higher timeframes concentrate more participation into each bar, so their levels matter more. The intuition that a lower timeframe gives 'more information' usually just means more noise — the candle formula is identical at every timeframe, wicks and all."
      es: "Las temporalidades altas concentran más participación en cada vela, por eso sus niveles importan más. La intuición de que una temporalidad baja da 'más información' suele significar solo más ruido: la fórmula de la vela es idéntica en todas las temporalidades, mechas incluidas."
  - id: tf-window-order
    kind: ordering
    prompt:
      en: "Order these candles by how much trading each one packs into a single bar, from least to most."
      es: "Ordena estas velas según cuánta operativa concentra cada una en una sola barra, de menos a más."
    items:
      - id: m1
        position: 1
        text: { en: "A 1-minute candle", es: "Una vela de 1 minuto" }
      - id: m5
        position: 2
        text: { en: "A 5-minute candle", es: "Una vela de 5 minutos" }
      - id: h1
        position: 3
        text: { en: "A 1-hour candle", es: "Una vela de 1 hora" }
      - id: h4
        position: 4
        text: { en: "A 4-hour candle", es: "Una vela de 4 horas" }
      - id: d1
        position: 5
        text: { en: "A daily candle", es: "Una vela diaria" }
    explanation:
      en: "The longer the window, the more participants and volume go into a single bar. That is exactly why higher-timeframe levels carry more weight than lower ones."
      es: "Cuanto más larga es la ventana, más participantes y volumen entran en una sola vela. Por eso precisamente los niveles de temporalidad alta tienen más peso que los de temporalidad baja."
  - id: tf-noise-myth
    kind: true_false
    prompt:
      en: "More candles on a lower timeframe mostly means more noise, not more reliable information."
      es: "Más velas en una temporalidad baja significa sobre todo más ruido, no información más fiable."
    answer: true
    explanation:
      en: "True. The extra bars subdivide the same tape without adding participation, and each one is formed by fewer people. Higher timeframes concentrate more participation into each bar, which is why their levels matter more."
      es: "Cierto. Las velas extra subdividen la misma cinta sin añadir participación, y cada una la forma menos gente. Las temporalidades altas concentran más participación en cada vela, y por eso sus niveles importan más."
  - id: same-day-zoom
    prompt:
      en: "A trading day shows up as one modest red candle on the daily chart. On the 5-minute chart of that same day, what will you see?"
      es: "Una jornada aparece como una modesta vela roja en el gráfico diario. En el gráfico de 5 minutos de esa misma jornada, ¿qué verás?"
    options:
      - id: a
        text:
          en: "One red candle, identical in every respect to the daily one."
          es: "Una vela roja, idéntica en todo a la diaria."
      - id: b
        text:
          en: "A confirmed downtrend, since the daily candle closed red."
          es: "Una tendencia bajista confirmada, ya que la diaria cerró en rojo."
      - id: c
        text:
          en: "The 'true' version of the day that the daily chart was hiding."
          es: "La versión 'verdadera' de la jornada que el diario ocultaba."
      - id: d
        correct: true
        text:
          en: "Hundreds of candles: the same data at a finer zoom."
          es: "Cientos de velas: los mismos datos con un zoom más fino."
    explanation:
      en: "Timeframes are zoom levels of the same data; neither is 'the truth' and neither hides anything. One daily candle is hundreds of 5-minute candles — rallies, dips, panic and recovery, all of which the daily bar summarises into four numbers. And a single red daily candle is not by itself a downtrend."
      es: "Las temporalidades son niveles de zoom sobre los mismos datos; ninguno es 'la verdad' ni oculta nada. Una vela diaria son cientos de velas de 5 minutos —subidas, caídas, pánico y recuperación—, que la barra diaria resume en cuatro números. Y una sola vela diaria roja no es por sí sola una tendencia bajista."
  - id: tf-multi
    kind: multi_select
    prompt:
      en: "Select ALL statements about timeframes that are true."
      es: "Selecciona TODAS las afirmaciones sobre temporalidades que sean ciertas."
    options:
      - id: a
        correct: true
        text:
          en: "The same market can look calm or violent depending on the timeframe."
          es: "El mismo mercado puede parecer tranquilo o violento según la temporalidad."
      - id: b
        correct: true
        text:
          en: "Higher-timeframe levels weigh more because more participation formed them."
          es: "Los niveles de temporalidad alta pesan más porque los formó más participación."
      - id: c
        text:
          en: "The OHLC values use a different formula on the lower timeframes."
          es: "Los valores OHLC usan una fórmula distinta en las temporalidades bajas."
      - id: d
        text:
          en: "A lower timeframe is objectively more informative, since it has more bars."
          es: "Una temporalidad baja es objetivamente más informativa, porque tiene más velas."
    explanation:
      en: "The formula is identical at every timeframe; only the width of the window changes. Higher timeframes carry more weight because more people formed them, and a lower timeframe mostly adds noise rather than information."
      es: "La fórmula es idéntica en todas las temporalidades; solo cambia la anchura de la ventana. Las altas pesan más porque las formó más gente, y una baja añade sobre todo ruido en vez de información."
  - id: crypto-daily-close
    prompt:
      en: "In crypto, what is the 'daily close' that traders talk about?"
      es: "En cripto, ¿qué es el 'cierre diario' del que hablan los traders?"
    options:
      - id: a
        correct: true
        text:
          en: "A convention — the price at a fixed clock cutoff, usually 00:00 UTC."
          es: "Una convención: el precio en un corte fijo de reloj, normalmente 00:00 UTC."
      - id: b
        text:
          en: "A closing auction, the way a stock exchange rings its bell."
          es: "Una subasta de cierre, como cuando una bolsa toca la campana."
      - id: c
        text:
          en: "The moment the venue pays out that day's settlement."
          es: "El momento en que el venue paga la liquidación de ese día."
      - id: d
        text:
          en: "The last trade before the market's weekend break."
          es: "La última operación antes del parón del fin de semana."
    explanation:
      en: "Crypto never closes: a 'daily' candle simply spans a fixed 24-hour window. There is no bell, no auction, no settlement moment and no weekend break — the price at the cutoff is a genuine price, but nothing whatsoever happens at it."
      es: "El cripto nunca cierra: una vela 'diaria' solo cubre una ventana fija de 24 horas. No hay campana, ni subasta, ni momento de liquidación, ni parón de fin de semana: el precio en el corte es un precio real, pero ahí no ocurre absolutamente nada."
  - id: tz-shift
    kind: true_false
    prompt:
      en: "Two traders whose charting tools use different timezones see slightly different daily candles for the same market. That means one of the charts is wrong."
      es: "Dos traders cuyas herramientas de gráficos usan husos horarios distintos ven velas diarias algo diferentes del mismo mercado. Eso significa que uno de los gráficos está mal."
    answer: false
    explanation:
      en: "Nothing is broken. Because the cutoff is just a clock time, they have simply cut the same continuous tape at different points. It is a reminder that timeframe boundaries in crypto are arbitrary."
      es: "Nada está roto. Como el corte es solo una hora de reloj, simplemente han cortado la misma cinta continua en puntos distintos. Es un recordatorio de que los límites de temporalidad en cripto son arbitrarios."
  - id: weekend-thin
    prompt:
      en: "Why should you read a dramatic-looking weekend candle with extra caution?"
      es: "¿Por qué deberías leer con más cautela una vela de fin de semana de aspecto muy pronunciado?"
    options:
      - id: a
        text:
          en: "Weekend candles cover a shorter window than weekday candles do."
          es: "Las velas de fin de semana cubren una ventana más corta."
      - id: b
        text:
          en: "Exchanges pause matching at weekends."
          es: "Los exchanges pausan el matching los fines de semana."
      - id: c
        correct: true
        text:
          en: "A thinner weekend book lets the same order push price further."
          es: "Un libro más fino de fin de semana deja que la misma orden empuje más el precio."
      - id: d
        text:
          en: "Weekend prices are excluded from the daily candle entirely."
          es: "Los precios del fin de semana se excluyen de la vela diaria."
    explanation:
      en: "Much professional and institutional flow steps back on Saturdays and Sundays. Nothing about the candle changes — same window, same formula, same inclusion in the daily bar — but far fewer people stand behind a move of the same size. Read it with the volume caveat firmly in mind."
      es: "Buena parte del flujo profesional e institucional se retira sábados y domingos. Nada cambia en la vela —misma ventana, misma fórmula, se incluye igual en la diaria—, pero hay mucha menos gente detrás de un movimiento del mismo tamaño. Léela teniendo muy presente la advertencia del volumen."
  - id: tf-participants-match
    kind: matching
    prompt:
      en: "Match each timeframe to what one of its candles can realistically represent."
      es: "Empareja cada temporalidad con lo que una de sus velas puede representar realmente."
    pairs:
      - id: m1
        left: { en: "One 1-minute candle", es: "Una vela de 1 minuto" }
        right:
          en: "Possibly a single large order in a quiet moment — fast to form and easy to fake."
          es: "Posiblemente una sola orden grande en un momento tranquilo: se forma rápido y es fácil de falsear."
      - id: h4
        left: { en: "One 4-hour candle", es: "Una vela de 4 horas" }
        right:
          en: "Four hours of trading compressed into one bar — more participants than a minute, fewer than a day."
          es: "Cuatro horas de negociación comprimidas en una barra: más participantes que un minuto, menos que un día."
      - id: d1
        left: { en: "One daily candle", es: "Una vela diaria" }
        right:
          en: "The settled verdict of everyone who traded that day — slow to form, hard to fake."
          es: "El veredicto asentado de todos los que operaron ese día: lento de formar y difícil de falsear."
    explanation:
      en: "The higher the timeframe, the more participants and more money went into forming the candle. That is the whole reason higher-timeframe levels carry more weight."
      es: "Cuanto mayor es la temporalidad, más participantes y más dinero han formado la vela. Esa es toda la razón por la que los niveles de temporalidad alta pesan más."
