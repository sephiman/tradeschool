# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: market-order
    prompt:
      en: "You place a market order to buy in a thin market with a wide spread. What are you actually guaranteed?"
      es: "Colocas una orden de mercado para comprar en un mercado con poca profundidad y un spread amplio. ¿Qué tienes garantizado en realidad?"
    options:
      - id: a
        text:
          en: "That you buy at the last traded price printed on the screen."
          es: "Que compras al último precio negociado que aparece en pantalla."
      - id: b
        correct: true
        text:
          en: "That the order fills right away, but not at any particular price."
          es: "Que la orden se ejecuta de inmediato, pero no a un precio concreto."
      - id: c
        text:
          en: "That you get the best price of the day, since it takes the top of the book."
          es: "Que consigues el mejor precio del día, porque toma la cima del libro."
      - id: d
        text:
          en: "That it fills only once the price has moved in your favour."
          es: "Que solo se ejecuta cuando el precio se ha movido a tu favor."
    explanation:
      en: "A market order guarantees execution, not price. The last trade is history, not an offer; the top of the book is only its first fill. In a thin book the order walks up the asks and can fill well above the price you last saw — that gap is slippage."
      es: "Una orden de mercado garantiza ejecución, no precio. La última operación es historia, no una oferta; la cima del libro es solo su primera ejecución. En un libro con poca profundidad la orden recorre los asks y puede ejecutarse muy por encima del precio que viste: esa diferencia es el slippage."
  - id: order-book-spread
    prompt:
      en: "In an order book, what is the 'spread'?"
      es: "En un libro de órdenes, ¿qué es el 'spread'?"
    options:
      - id: a
        text:
          en: "The total quantity of coins resting on the book to buy right now."
          es: "La cantidad total de monedas que descansan en el libro para comprar ahora."
      - id: b
        text:
          en: "The difference between the day's highest and lowest traded price."
          es: "La diferencia entre el precio máximo y el mínimo negociados del día."
      - id: c
        text:
          en: "The fee the exchange charges per trade."
          es: "La comisión que cobra el exchange por operación."
      - id: d
        correct: true
        text:
          en: "The gap between the best bid and the best ask."
          es: "La diferencia entre el mejor bid y el mejor ask."
    explanation:
      en: "The spread is the distance between the highest bid and the lowest ask — a snapshot of the book right now, not of the session and not of the fee schedule. Total resting size is depth, and confusing depth with spread is a common beginner slip."
      es: "El spread es la distancia entre el bid más alto y el ask más bajo: una foto del libro ahora mismo, no de la sesión ni de la tarifa. La cantidad total que descansa en el libro es la profundidad, y confundir profundidad con spread es un error común de principiante."
  - id: book-terms-match
    kind: matching
    prompt:
      en: "Match each order-book term to what it describes."
      es: "Empareja cada término del libro de órdenes con lo que describe."
    pairs:
      - id: bid
        left: { en: "Bid", es: "Bid" }
        right:
          en: "A buy order; the book stacks these highest-first"
          es: "Una orden de compra; el libro las apila de mayor a menor"
      - id: ask
        left: { en: "Ask", es: "Ask" }
        right:
          en: "A sell order; the book stacks these lowest-first"
          es: "Una orden de venta; el libro las apila de menor a mayor"
      - id: spread
        left: { en: "Spread", es: "Spread" }
        right:
          en: "The gap between the best bid and the best ask"
          es: "La diferencia entre el mejor bid y el mejor ask"
      - id: slippage
        left: { en: "Slippage", es: "Slippage" }
        right:
          en: "The gap between the price you expected and the price you got"
          es: "La diferencia entre el precio que esperabas y el que conseguiste"
    explanation:
      en: "Bids and asks are the two sides of the book; the spread is the gap between their best prices; slippage is how far your actual fill lands from what you expected."
      es: "Los bids y los asks son los dos lados del libro; el spread es la diferencia entre sus mejores precios; el slippage es cuánto se aleja tu ejecución real de lo que esperabas."
  - id: limit-fill-myth
    kind: true_false
    prompt:
      en: "A limit order can sit unfilled forever if the market never reaches the price you named."
      es: "Una orden limitada puede quedarse sin ejecutar para siempre si el mercado nunca alcanza el precio que fijaste."
    answer: true
    explanation:
      en: "True — and leaving it open longer changes nothing. A limit order fills at your price or better, so you control the price but not whether it trades at all. That is the exact mirror of a market order, which controls execution but not price."
      es: "Cierto, y dejarla abierta más tiempo no cambia nada. Una orden limitada se ejecuta a tu precio o mejor, así que controlas el precio pero no si llega a operar. Es el espejo exacto de una orden de mercado, que controla la ejecución pero no el precio."
  - id: order-choice
    prompt:
      en: "The book is thin and you care more about the price you pay than about filling this second. Which order fits?"
      es: "El libro tiene poca profundidad y te importa más el precio que pagas que ejecutar en este segundo. ¿Qué orden encaja?"
    options:
      - id: a
        correct: true
        text:
          en: "A limit order at the price you are willing to pay."
          es: "Una orden limitada al precio que estás dispuesto a pagar."
      - id: b
        text:
          en: "A market order, so it fills at once at the best price available."
          es: "Una orden de mercado, para que se ejecute ya al mejor precio disponible."
      - id: c
        text:
          en: "A market order, because limit orders are charged a higher fee tier."
          es: "Una orden de mercado, porque las limitadas pagan un tramo de comisión mayor."
      - id: d
        text:
          en: "Either one — in a thin book the two behave the same way."
          es: "Cualquiera: en un libro con poca profundidad se comportan igual."
    explanation:
      en: "When price matters more than speed, a limit order lets you name your price and avoid slippage — at the cost of maybe not filling. A thin book is exactly where the two stop behaving alike: it is where a market order slips most, and resting a limit order is usually the cheaper side of the fee schedule, not the dearer."
      es: "Cuando el precio importa más que la velocidad, una orden limitada te deja fijar tu precio y evitar el slippage, a costa de quizá no ejecutarse. Un libro con poca profundidad es justo donde las dos dejan de comportarse igual: es donde más se desliza una orden de mercado, y dejar descansando una limitada suele ser el lado barato de la tarifa, no el caro."
  - id: slippage-def
    prompt:
      en: "What is 'slippage'?"
      es: "¿Qué es el 'slippage' (deslizamiento)?"
    options:
      - id: a
        text:
          en: "The fee the exchange charges for the convenience of a market order."
          es: "La comisión que cobra el exchange por la comodidad de una orden de mercado."
      - id: b
        text:
          en: "The delay between clicking 'buy' and the screen showing your fill."
          es: "El retraso entre pulsar 'comprar' y que la pantalla muestre tu ejecución."
      - id: c
        correct: true
        text:
          en: "The gap between the price you expected and the price your order filled at."
          es: "La diferencia entre el precio que esperabas y aquel al que se ejecutó tu orden."
      - id: d
        text:
          en: "The difference between the day's high and the day's low price."
          es: "La diferencia entre el máximo y el mínimo del día."
    explanation:
      en: "Slippage is the gap between expected and actual fill price — a cost you pay in price, not a line on the fee schedule and not a lag in the interface. It grows when a market order walks a thin book, taking each worse level in turn."
      es: "El slippage es la diferencia entre el precio esperado y el de ejecución real: un coste que pagas en precio, no una línea de la tarifa ni un retraso de la interfaz. Crece cuando una orden de mercado recorre un libro con poca profundidad, tomando cada nivel peor por turno."
  - id: depth-thin-tf
    kind: true_false
    prompt:
      en: "A large market order in a thin book tends to fill at progressively worse prices as it goes."
      es: "Una orden de mercado grande en un libro con poca profundidad tiende a ejecutarse a precios cada vez peores a medida que avanza."
    answer: true
    explanation:
      en: "A market order walks the book level by level. With little depth, each successive level is further from the first, so a big order fills worse and worse — that's slippage in action."
      es: "Una orden de mercado recorre el libro nivel a nivel. Con poca profundidad, cada nivel sucesivo está más lejos del primero, así que una orden grande se ejecuta cada vez peor: es el slippage en acción."
  - id: book-walk
    kind: ordering
    prompt:
      en: "The asks on a thin altcoin read: 500 units at 2.00, then 800 at 2.02, then 1,500 at 2.05. You send a market buy for 2,000 units. Put the fills in the order they happen."
      es: "Los asks de una altcoin ilíquida son: 500 unidades a 2,00, luego 800 a 2,02 y luego 1.500 a 2,05. Envías una orden de mercado de compra por 2.000 unidades. Ordena las ejecuciones según ocurren."
    items:
      - id: l1
        position: 1
        text: { en: "500 units fill at 2.00 — the best ask is taken first.", es: "500 unidades se ejecutan a 2,00: el mejor ask se toma primero." }
      - id: l2
        position: 2
        text: { en: "800 units fill at 2.02 — the next level up.", es: "800 unidades se ejecutan a 2,02: el siguiente nivel." }
      - id: l3
        position: 3
        text: { en: "The remaining 700 units fill at 2.05.", es: "Las 700 unidades restantes se ejecutan a 2,05." }
      - id: avg
        position: 4
        text:
          en: "The order is complete: 4,051 USDT for 2,000 units, an average of 2.026."
          es: "La orden se completa: 4.051 USDT por 2.000 unidades, una media de 2,026."
    explanation:
      en: "A market order walks the book, taking each level in turn from best to worst. That is why size in a thin book prices itself progressively worse — the order eats its own liquidity."
      es: "Una orden de mercado recorre el libro, tomando cada nivel por turno del mejor al peor. Por eso el tamaño en un libro ilíquido se ejecuta cada vez peor: la orden se come su propia liquidez."
  - id: slippage-calc
    prompt:
      en: "You saw 2.00 on screen — 500 units were on offer there — and your market buy for 2,000 units filled at an average of 2.026. What was the slippage, and what would a limit buy at 2.00 have done instead?"
      es: "Veías 2,00 en pantalla —con 500 unidades ofrecidas ahí— y tu compra a mercado de 2.000 unidades se ejecutó a una media de 2,026. ¿Cuál fue el slippage y qué habría hecho en su lugar una compra límite a 2,00?"
    options:
      - id: a
        text:
          en: "About 1.3%; the limit buy would have filled all 2,000 units at 2.00."
          es: "Alrededor del 1,3%; la compra límite habría ejecutado las 2.000 unidades a 2,00."
      - id: b
        correct: true
        text:
          en: "About 1.3% before fees; the limit buy would have taken only the 500 units at 2.00."
          es: "Alrededor del 1,3% antes de comisiones; la límite solo habría tomado las 500 a 2,00."
      - id: c
        text:
          en: "About 2.6%; the limit buy would have filled nothing at all, since 2.00 was not offered."
          es: "Alrededor del 2,6%; la límite no habría ejecutado nada, porque 2,00 no se ofrecía."
      - id: d
        text:
          en: "No slippage — 2.026 sits inside the spread you were quoted."
          es: "No hubo slippage: 2,026 está dentro del spread que te cotizaron."
    explanation:
      en: "Slippage is the gap between the price you expected and the average you got: 2.026 against 2.00 is ~1.3%, and 2.00 was on offer — for 500 units only. That is the whole choice in one picture: the market order got all 2,000 at a worse average, and the limit order protects the price but may never complete."
      es: "El slippage es la diferencia entre el precio que esperabas y la media que obtuviste: 2,026 frente a 2,00 es ~1,3%, y 2,00 sí se ofrecía, pero solo para 500 unidades. Ahí está toda la elección: la orden de mercado consiguió las 2.000 a peor media, y la límite protege el precio pero puede no completarse nunca."
  - id: market-order-facts
    kind: multi_select
    prompt:
      en: "Select ALL statements that are TRUE of a market order."
      es: "Selecciona TODAS las afirmaciones ciertas sobre una orden de mercado."
    options:
      - id: a
        correct: true
        text:
          en: "It is guaranteed to execute, whatever the price."
          es: "Tiene la ejecución garantizada, sea cual sea el precio."
      - id: b
        correct: true
        text:
          en: "It takes the offers already resting in the book, level by level."
          es: "Toma las ofertas que ya descansan en el libro, nivel a nivel."
      - id: c
        correct: true
        text:
          en: "In a thin book it can fill far from the price you just saw."
          es: "En un libro ilíquido puede ejecutarse lejos del precio que viste."
      - id: d
        text:
          en: "It guarantees the price you saw quoted on screen."
          es: "Garantiza el precio que veías cotizado en pantalla."
      - id: e
        text:
          en: "It always pays lower fees than an equivalent limit order."
          es: "Siempre paga menos comisiones que una orden límite equivalente."
    explanation:
      en: "A market order buys certainty of execution at the cost of certainty of price; a limit order does the reverse. Neither is 'safer' — they trade different risks — and taking liquidity is usually the dearer side of the fee schedule, not the cheaper."
      es: "Una orden de mercado compra certeza de ejecución a costa de certeza de precio; una límite hace lo contrario. Ninguna es 'más segura' — cambian un riesgo por otro — y tomar liquidez suele ser el lado caro de la tarifa, no el barato."
  - id: always-open
    kind: multi_select
    prompt:
      en: "Crypto trades 24/7 with no closing bell. Select ALL consequences that follow for your orders."
      es: "El cripto opera 24/7 sin campana de cierre. Selecciona TODAS las consecuencias que eso tiene para tus órdenes."
    options:
      - id: a
        correct: true
        text:
          en: "There are no circuit breakers — no central operator to pause trading."
          es: "No hay circuit breakers: no hay operador central que pause el mercado."
      - id: b
        correct: true
        text:
          en: "Liquidity thins overnight and at weekends, so the same order slips more."
          es: "La liquidez se adelgaza de noche y en fin de semana, así que se desliza más."
      - id: c
        correct: true
        text:
          en: "Price can gap hard while you are asleep."
          es: "El precio puede hacer un gap fuerte mientras duermes."
      - id: d
        text:
          en: "Spreads stay constant, because the market never has to reopen."
          es: "Los spreads se mantienen constantes, porque el mercado nunca reabre."
      - id: e
        text:
          en: "Thin alt books behave like BTC books at every hour of the day."
          es: "Los libros ilíquidos de alts se comportan como los de BTC a toda hora."
    explanation:
      en: "No closing bell also means no pause when things break, and 'always open' is not the same as 'always the same'. The practical effect is worst where depth is thinnest: a size that is trivial on BTC can move a small-cap several percent at 4am."
      es: "Que no haya campana de cierre también significa que no hay pausa cuando algo se rompe, y 'siempre abierto' no es lo mismo que 'siempre igual'. El efecto práctico es peor donde hay menos profundidad: un tamaño trivial en BTC puede mover un small-cap varios puntos porcentuales a las 4 de la mañana."
