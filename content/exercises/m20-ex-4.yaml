# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: unlock-vs-breakout
    prompt:
      en: "You spot a clean bullish breakout on a token, but a large unlock releasing 20% of the supply is scheduled for tomorrow. How should the unlock affect your read?"
      es: "Detectas una ruptura alcista limpia en un token, pero mañana está programado un desbloqueo grande que libera el 20% de la oferta. ¿Cómo debería afectar el desbloqueo a tu lectura?"
    options:
      - id: a
        text:
          en: "Ignore it — unlocks are always priced in, so only the chart matters here."
          es: "Ignóralo: los desbloqueos siempre se descuentan y solo importa el gráfico."
      - id: b
        text:
          en: "It does not matter, because market cap and FDV are the same thing anyway."
          es: "Da igual, porque el market cap y la FDV son lo mismo de todas formas."
      - id: c
        correct: true
        text:
          en: "With caution — a wave of fresh supply can invalidate the breakout entirely."
          es: "Con cautela: la oferta nueva puede invalidar la ruptura."
      - id: d
        text:
          en: "It makes the breakout safer, since more tokens means more buyers arriving."
          es: "Hace la ruptura más segura, ya que más tokens implica más compradores."
    explanation:
      en: "A scheduled unlock is a fundamental force the chart cannot show: a big tranche of new supply hitting the market can cap or reverse an otherwise clean breakout, regardless of what the pattern says. There is no guarantee it is priced in, market cap and FDV are not the same number — that confusion is exactly what hides the incoming supply — and more tokens is more potential sellers, not more buyers."
      es: "Un desbloqueo programado es una fuerza fundamental que el gráfico no puede mostrar: un tramo grande de oferta nueva llegando al mercado puede frenar o girar una ruptura por lo demás limpia, diga lo que diga el patrón. No hay garantía de que esté descontado, el market cap y la FDV no son el mismo número —esa confusión es justo lo que oculta la oferta que llega— y más tokens son más vendedores potenciales, no más compradores."
  - id: why-in-ta
    prompt:
      en: "Why does a token's unlock calendar belong inside your technical analysis rather than beside it?"
      es: "¿Por qué el calendario de desbloqueo de un token forma parte de tu análisis técnico en lugar de ir aparte?"
    options:
      - id: a
        text:
          en: "It does not: tokenomics and technical analysis should never be mixed at all."
          es: "No forma parte: la tokenómica y el análisis técnico nunca deben mezclarse."
      - id: b
        text:
          en: "Because an unlock raises the max supply, so the chart's levels move up too."
          es: "Porque un desbloqueo eleva la oferta máxima y los niveles del gráfico suben."
      - id: c
        correct: true
        text:
          en: "It adds sell-side supply that can override a clean chart pattern."
          es: "Añade oferta vendedora que puede anular un patrón limpio del gráfico."
      - id: d
        text:
          en: "Because once an unlock happens, market cap and FDV become one number."
          es: "Porque tras un desbloqueo el market cap y la FDV pasan a ser un solo número."
    explanation:
      en: "An unlock moves tokens from locked to circulating — it does not change the max supply, and market cap and FDV remain distinct. What it does add is real sell-side supply, a fundamental force that can invalidate a technically clean setup. That is exactly why it belongs in the analysis rather than in a separate box beside it."
      es: "Un desbloqueo mueve tokens de bloqueados a circulantes: no cambia la oferta máxima, y el market cap y la FDV siguen siendo distintos. Lo que sí añade es oferta vendedora real, una fuerza fundamental que puede invalidar un setup técnicamente limpio. Por eso precisamente forma parte del análisis y no de una casilla aparte."
  - id: unlock-raises-maxsupply
    kind: true_false
    prompt:
      en: "A scheduled token unlock raises the token's maximum supply."
      es: "Un desbloqueo programado de tokens eleva el oferta máxima del token."
    answer: false
    explanation:
      en: "An unlock only moves tokens from locked to circulating — the max supply (and the FDV built on it) already counted those tokens. What changes is the tradable supply hitting the market, which is why an unlock can add real sell-side pressure."
      es: "Un desbloqueo solo mueve tokens de bloqueados a circulantes: el oferta máxima (y la FDV que se apoya en él) ya contaban esos tokens. Lo que cambia es la oferta negociable que llega al mercado, y por eso un desbloqueo puede añadir presión vendedora real."
  - id: unlock-priced-in
    kind: true_false
    prompt:
      en: "A large scheduled unlock can put more supply on the market in a day than normal trading absorbs, whatever the chart shows."
      es: "Un desbloqueo grande programado puede volcar al mercado en un día más oferta de la que absorbe el trading normal, muestre lo que muestre el gráfico."
    answer: true
    explanation:
      en: "True, and there is no guarantee it is priced in ahead of time. That is a fundamental force the candles cannot display: it can cap or reverse an otherwise clean setup on the day it lands."
      es: "Cierto, y no hay garantía de que esté descontado con antelación. Es una fuerza fundamental que las velas no pueden mostrar: puede frenar o girar un setup por lo demás limpio el día en que llega."
  - id: unlock-effects
    kind: multi_select
    prompt:
      en: "A large token unlock (a 'cliff') is about to land. Select ALL the statements about it that are true."
      es: "Está a punto de llegar un desbloqueo grande (un 'cliff'). Selecciona TODAS las afirmaciones ciertas sobre él."
    options:
      - id: a
        correct: true
        text:
          en: "It moves tokens from locked to circulating, so more becomes tradable."
          es: "Mueve tokens de bloqueados a circulantes: pasa a ser negociable más oferta."
      - id: b
        correct: true
        text:
          en: "It can add more supply than normal trading absorbs, capping a clean move."
          es: "Puede añadir más oferta de la que absorbe el trading y frenar un movimiento."
      - id: c
        text:
          en: "It guarantees that the price will crash on the unlock date itself."
          es: "Garantiza que el precio se desplomará en la propia fecha del desbloqueo."
      - id: d
        text:
          en: "It makes a bullish setup safer, since more tokens means more buyers."
          es: "Hace más seguro un setup alcista, ya que más tokens implica más compradores."
    explanation:
      en: "An unlock shifts locked tokens into the tradable float and can add heavy sell-side supply — enough to override a clean chart. But nothing is guaranteed: most unlocks pass quietly, and more tokens is more potential supply, not more buyers."
      es: "Un desbloqueo pasa tokens bloqueados al float negociable y puede añadir mucha oferta vendedora, la suficiente para anular un gráfico limpio. Pero nada está garantizado: la mayoría de los desbloqueos pasan sin ruido, y más tokens es más oferta potencial, no más compradores."
  - id: emission-inflation
    prompt:
      en: "A token's emission schedule inflates its circulating supply by about 30% a year. All else equal, what does price have to do just to hold the same total market value?"
      es: "El calendario de emisión de un token infla su oferta circulante alrededor de un 30% al año. En igualdad de condiciones, ¿qué tiene que hacer el precio solo para mantener el mismo valor total de mercado?"
    options:
      - id: a
        text:
          en: "Nothing at all — inflation affects max supply, not the market value."
          es: "Nada: la inflación afecta a la oferta máxima, no al valor de mercado."
      - id: b
        text:
          en: "Fall about 30%, because more supply always drags price down in step."
          es: "Bajar un 30%, porque más oferta siempre arrastra el precio en la misma medida."
      - id: c
        text:
          en: "Rise about 30%, which already shows as a downtrend on the candles."
          es: "Subir un 30%, algo que ya se ve como una bajista en las velas."
      - id: d
        correct: true
        text:
          en: "Rise about 30%, just to offset the new supply arriving."
          es: "Subir alrededor de un 30%, solo para compensar la oferta nueva."
    explanation:
      en: "Market value is price × circulating supply, so if supply grows 30%, price must climb ~30% just to keep the same total — an inflation headwind you only see by reading the schedule. It is not automatically a price drop, and it does not show up on a candlestick chart by itself, which is precisely what makes it easy to miss."
      es: "El valor de mercado es precio × oferta circulante, así que si la oferta crece un 30%, el precio debe subir ~30% solo para mantener el mismo total: un viento en contra que solo ves leyendo el calendario. No es automáticamente una caída del precio, y no aparece por sí solo en un gráfico de velas, que es justo lo que lo hace fácil de pasar por alto."
  - id: cliff-numbers
    prompt:
      en: "A token has 100 million circulating at $2.00 and trades about 8 million tokens a day. A cliff unlocks a 20-million-token investor tranche on one date. What has just happened to the book?"
      es: "Un token tiene 100 millones circulando a 2,00 $ y negocia unos 8 millones de tokens al día. Un desbloqueo de golpe libera un tramo de 20 millones de tokens de inversores en una sola fecha. ¿Qué le acaba de pasar al libro?"
    options:
      - id: a
        text:
          en: "Nothing measurable — 20 million is small next to 100 million circulating."
          es: "Nada medible: 20 millones es poco frente a 100 millones circulando."
      - id: b
        text:
          en: "The max supply of the token rose by exactly 20 million tokens."
          es: "La oferta máxima del token subió en exactamente 20 millones de tokens."
      - id: c
        correct: true
        text:
          en: "The float jumped 20% overnight — two and a half days of volume at once."
          es: "El float saltó un 20% de golpe: dos días y medio de volumen a la vez."
      - id: d
        text:
          en: "The market cap fell by 20%, while the float itself is unchanged."
          es: "La capitalización cayó un 20%, mientras el float no ha cambiado."
    explanation:
      en: "Even if only a third of the tranche sells, ~6.7 million tokens hunt for bids against a book that clears 8 million in a day — price gets pushed down by the arithmetic of supply, not by anything the pattern did wrong. The max supply already counted those tokens, and the market cap does not fall on its own; the float is exactly what changed. That is why tokenomics belongs inside your technical analysis, not beside it."
      es: "Incluso si solo vende un tercio del tramo, ~6,7 millones de tokens buscan demanda contra un libro que absorbe 8 millones al día: el precio baja por la aritmética de la oferta, no porque el patrón hiciera nada mal. La oferta máxima ya contaba esos tokens, y la capitalización no cae por sí sola; lo que cambió es justamente el float. Por eso la tokenómica va dentro de tu análisis técnico, no al lado."
  - id: unlock-front-run
    prompt:
      en: "The unlock calendar is published to the day and everyone has it. What does that do to when the price weakness shows up?"
      es: "El calendario de desbloqueos se publica al día y todo el mundo lo tiene. ¿Qué efecto tiene eso en cuándo aparece la debilidad del precio?"
    options:
      - id: a
        text:
          en: "Nothing until the tokens hit wallets, since only real selling moves price."
          es: "Nada hasta que los tokens llegan a las wallets: solo la venta real mueve."
      - id: b
        text:
          en: "The weakness arrives exactly on the unlock date, to the hour, every time."
          es: "La debilidad llega exactamente en la fecha, a la hora, siempre."
      - id: c
        correct: true
        text:
          en: "It tends to be front-run: price often weakens in the days before."
          es: "Tiende a anticiparse: el precio suele debilitarse en los días previos."
      - id: d
        text:
          en: "Being public means it is fully priced in and never moves price at all."
          es: "Ser público significa que está descontado y nunca mueve el precio."
    explanation:
      en: "Because the shock is known, informed players position ahead of it and the move can be half over before the tokens actually move. Front-running is a tendency, not a guarantee that the event is harmless — the unlock still hits a live 24/7 order book at whatever hour it lands, with no session to digest it, and 'public' is a long way from 'fully priced in'."
      es: "Como el shock es conocido, los participantes informados se posicionan antes y el movimiento puede estar medio hecho antes de que los tokens se muevan. Anticiparse es una tendencia, no una garantía de que el evento sea inocuo: el desbloqueo golpea igualmente un libro vivo 24/7 a la hora que caiga, sin sesión que lo digiera, y 'público' está lejos de 'totalmente descontado'."
  - id: supply-source-match
    kind: matching
    prompt:
      en: "Match each source of new supply to how it hits the market."
      es: "Empareja cada fuente de nueva oferta con cómo golpea el mercado."
    pairs:
      - id: cliff
        left: { en: "A cliff unlock", es: "Un desbloqueo de golpe (cliff)" }
        right:
          en: "A big tranche releasing on a single date — more supply in a day than normal trading absorbs."
          es: "Un tramo grande liberado en una sola fecha: más oferta en un día de la que absorbe la negociación normal."
      - id: emissions
        left: { en: "Staking and mining emissions", es: "Emisiones de staking y minería" }
        right:
          en: "Minted continuously, with farmers routinely selling to cover costs — a steady, mechanical background sell independent of sentiment."
          es: "Se emiten continuamente, y los farmers suelen vender para cubrir costes: una venta de fondo constante y mecánica, independiente del sentimiento."
      - id: thin
        left: { en: "The same tranche landing on a thin alt book", es: "El mismo tramo cayendo en un libro poco profundo de alts" }
        right:
          en: "What a deep BTC-scale book would absorb can gap a small alt several percent in minutes."
          es: "Lo que un libro profundo de escala BTC absorbería puede hacer que una alt pequeña salte varios puntos porcentuales en minutos."
    explanation:
      en: "A scheduled unlock is a supply shock the chart cannot show. When a large one is near it overrides the technicals — treat the pattern as provisional until the new supply has been absorbed."
      es: "Un desbloqueo programado es un shock de oferta que el gráfico no puede mostrar. Cuando hay uno grande cerca, se impone sobre lo técnico: trata el patrón como provisional hasta que la nueva oferta se haya absorbido."
