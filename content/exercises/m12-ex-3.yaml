# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: divergence-types-match
    kind: matching
    prompt:
      en: "Match each divergence type to its structural chart definition."
      es: "Empareja cada tipo de divergencia con su definición estructural en el gráfico."
    pairs:
      - id: reg-bull
        left: { en: "Regular Bullish Divergence", es: "Divergencia Alcista Regular" }
        right:
          en: "Price makes Lower Lows while Indicator makes Higher Lows (Signals Reversal)."
          es: "El precio hace Mínimos Más Bajos mientras el Indicador hace Mínimos Más Altos (Señala Inversión)."
      - id: reg-bear
        left: { en: "Regular Bearish Divergence", es: "Divergencia Bajista Regular" }
        right:
          en: "Price makes Higher Highs while Indicator makes Lower Highs (Signals Reversal)."
          es: "El precio hace Máximos Más Altos mientras el Indicador hace Máximos Más Bajos (Señala Inversión)."
      - id: hid-bull
        left: { en: "Hidden Bullish Divergence", es: "Divergencia Alcista Oculta" }
        right:
          en: "Price makes Higher Lows while Indicator makes Lower Lows (Signals Continuation)."
          es: "El precio hace Mínimos Más Altos mientras el Indicador hace Mínimos Más Bajos (Señala Continuación)."
      - id: hid-bear
        left: { en: "Hidden Bearish Divergence", es: "Divergencia Bajista Oculta" }
        right:
          en: "Price makes Lower Highs while Indicator makes Higher Highs (Signals Continuation)."
          es: "El precio hace Máximos Más Bajos mientras el Indicador hace Máximos Más Altos (Señala Continuación)."
    explanation:
      en: "Regular divergences signal trend reversals at extremes; hidden divergences signal trend continuation during pullbacks."
      es: "Las divergencias regulares señalan inversiones de tendencia en extremos; las divergencias ocultas señalan continuación de tendencia durante retrocesos."

  - id: divergence-validation-steps
    kind: ordering
    prompt:
      en: "Order the steps to correctly identify and validate a divergence."
      es: "Ordena los pasos para identificar y validar correctamente una divergencia."
    items:
      - id: step-1
        position: 1
        text:
          en: "Identify clear price swings (Highs or Lows) at a key support or resistance level."
          es: "Identificar oscilaciones claras de precio (Máximos o Mínimos) en un nivel clave de soporte o resistencia."
      - id: step-2
        position: 2
        text:
          en: "Compare the corresponding peaks or troughs on the indicator (RSI / MACD)."
          es: "Comparar los picos o valles correspondientes en el indicador (RSI / MACD)."
      - id: step-3
        position: 3
        text:
          en: "Check for slope disagreement between price trajectory and indicator trajectory."
          es: "Comprobar el desacuerdo de pendiente entre la trayectoria del precio y la del indicador."
      - id: step-4
        position: 4
        text:
          en: "Wait for trigger confirmation (e.g. reversal candle or trendline break) before entering."
          es: "Esperar la confirmación del detonante (ej. vela de inversión o rotura de línea de tendencia) antes de entrar."
    explanation:
      en: "Divergences are context clues, not immediate market buy/sell market signals. Always wait for price action confirmation."
      es: "Las divergencias son pistas de contexto, no señales automáticas de compra/venta. Espera siempre la confirmación del price action."

  - id: hidden-divergence-context
    kind: multi_select
    prompt:
      en: "Which conditions confirm a valid Hidden Bullish Divergence setup?"
      es: "¿Qué condiciones confirman una configuración válida de Divergencia Alcista Oculta?"
    options:
      - id: a
        correct: true
        text:
          en: "The prevailing macro trend is clearly bullish."
          es: "La tendencia macro dominante es claramente alcista."
      - id: b
        correct: true
        text:
          en: "Price makes a Higher Low during a pullback while RSI prints a Lower Low."
          es: "El precio marca un Mínimo Más Alto en el retroceso mientras el RSI marca uno Más Bajo."
      - id: c
        correct: false
        text:
          en: "Price is stepping down through a series of Lower Lows and Lower Highs."
          es: "El precio baja escalonadamente con Mínimos Más Bajos y Máximos Más Bajos."
      - id: d
        correct: true
        text:
          en: "The pullback retests a key support or moving-average level."
          es: "El retroceso retestea un nivel clave de soporte o de media móvil."
    explanation:
      en: "Hidden bullish divergence shows that momentum resets (a lower RSI low) while price holds structural strength (a higher low) — which only means anything inside an uptrend that is pausing. A market stepping down through lower lows and lower highs is a downtrend: there is no bullish structure for the divergence to be hidden inside."
      es: "La divergencia alcista oculta muestra que el momentum se reinicia (un mínimo más bajo del RSI) mientras el precio mantiene su fuerza estructural (un mínimo más alto), algo que solo significa algo dentro de una tendencia alcista que hace una pausa. Un mercado que baja con mínimos y máximos más bajos es una tendencia bajista: no hay estructura alcista dentro de la que ocultar la divergencia."

  - id: divergence-timeframe-truth
    kind: true_false
    prompt:
      en: "Divergences on lower timeframes (e.g. 1-minute charts) carry equal predictive weight as 4-hour divergences."
      es: "Las divergencias en temporalidades bajas (ej. 1 minuto) tienen el mismo peso predictivo que las divergencias de 4 horas."
    answer: false
    explanation:
      en: "Lower timeframe divergences frequently fail due to market noise and order book micro-fluctuations. High timeframe divergences reflect significant institutional positioning."
      es: "Las divergencias en temporalidades bajas fallan frecuentemente debido al ruido de mercado y microfluctuaciones. Las divergencias de temporalidad alta reflejan posicionamiento institucional significativo."

  - id: oscillator-selection
    kind: single_choice
    prompt:
      en: "What does a Regular Bearish Divergence indicate about underlying market momentum?"
      es: "¿Qué indica una Divergencia Bajista Regular sobre el momentum subyacente del mercado?"
    options:
      - id: a
        text:
          en: "That sellers have withdrawn from the market completely."
          es: "Que los vendedores se han retirado por completo del mercado."
      - id: b
        text:
          en: "That a large short squeeze is guaranteed to follow shortly."
          es: "Que está garantizado que a continuación habrá un short squeeze grande."
      - id: c
        text:
          en: "That trading volume on the instrument has fallen to zero."
          es: "Que el volumen de negociación del instrumento ha caído a cero."
      - id: d
        correct: true
        text:
          en: "Buying pressure is weakening even as price pushes to a higher peak."
          es: "La presión compradora se debilita aunque el precio empuje a un pico más alto."
    explanation:
      en: "Regular bearish divergence reveals that each successive higher high is backed by diminishing momentum, which is what 'exhaustion' means here. Sellers have not left — they are simply meeting less resistance each time — and nothing about a divergence guarantees the direction or size of what comes next."
      es: "La divergencia bajista regular revela que cada nuevo máximo más alto está respaldado por un momentum decreciente, y eso es lo que significa aquí 'agotamiento'. Los vendedores no se han ido: simplemente encuentran menos resistencia cada vez, y nada en una divergencia garantiza la dirección ni el tamaño de lo que viene."

  - id: rsi-divergence-confirmation
    kind: single_choice
    prompt:
      en: "Why should a trader wait for RSI to cross back above 30 before trading a regular bullish divergence?"
      es: "¿Por qué un trader debería esperar a que el RSI cruce de nuevo por encima de 30 antes de operar una divergencia alcista regular?"
    options:
      - id: a
        text:
          en: "Because it reduces the exchange's trading fees on the entry order."
          es: "Porque reduce las comisiones del exchange en la orden de entrada."
      - id: b
        correct: true
        text:
          en: "It confirms momentum actually turned, rather than still sliding."
          es: "Confirma que el momentum giró de verdad, en vez de seguir cayendo."
      - id: c
        text:
          en: "Because it guarantees the trade reaches its target within ten minutes."
          es: "Porque garantiza que la operación llegue a su objetivo en diez minutos."
      - id: d
        text:
          en: "Because it forces the venue to disable short positions on that pair."
          es: "Porque obliga al venue a desactivar los cortos en ese par."
    explanation:
      en: "RSI can remain deeply oversold throughout a strong downtrend, so a divergence forming there says only that momentum is decelerating — not that it has turned. Waiting for the line to hook back above 30 is what confirms buyers actually stepped in. It changes nothing about fees, timing or what the venue allows."
      es: "El RSI puede permanecer muy sobrevendido durante toda una tendencia bajista fuerte, así que una divergencia formada ahí solo dice que el momentum se desacelera, no que haya girado. Esperar a que la línea se enganche por encima de 30 es lo que confirma que los compradores entraron de verdad. No cambia nada sobre comisiones, plazos ni lo que permita el venue."

  - id: macd-histogram-divergence
    kind: single_choice
    prompt:
      en: "How does MACD histogram divergence differ from standard price-to-indicator divergence?"
      es: "¿En qué se diferencia la divergencia del histograma MACD de la divergencia estándar de precio a indicador?"
    options:
      - id: a
        text:
          en: "It only works when read on weekend candlestick charts."
          es: "Solo funciona cuando se lee en gráficos de velas de fin de semana."
      - id: b
        text:
          en: "It removes the need to place a stop-loss on the resulting trade."
          es: "Elimina la necesidad de poner un stop-loss en la operación resultante."
      - id: c
        correct: true
        text:
          en: "It tracks the gap between the MACD lines, so it warns earlier."
          es: "Sigue la distancia entre las líneas MACD, así que avisa antes."
      - id: d
        text:
          en: "It is only ever calculated on spot markets, never on futures."
          es: "Solo se calcula en mercados spot, nunca en futuros."
    explanation:
      en: "The histogram reflects the rate of change of the distance between the MACD lines — acceleration and deceleration — so histogram divergence spots slowing momentum before the lines themselves cross. It is an earlier and noisier clue, which is exactly why it still needs a level and a stop like any other setup."
      es: "El histograma refleja la tasa de cambio de la distancia entre las líneas MACD —aceleración y desaceleración—, así que la divergencia del histograma detecta el frenado del momentum antes de que las propias líneas se crucen. Es una pista más temprana y más ruidosa, y por eso sigue necesitando un nivel y un stop como cualquier otra configuración."

  - id: divergence-trendline-break
    kind: single_choice
    prompt:
      en: "What role does a micro trendline break play when executing a divergence trade?"
      es: "¿Qué papel juega la rotura de una micro línea de tendencia al ejecutar una operación por divergencia?"
    options:
      - id: a
        text:
          en: "It automatically doubles the position size the account can carry."
          es: "Duplica automáticamente el tamaño de posición que puede llevar la cuenta."
      - id: b
        correct: true
        text:
          en: "It is the price-action confirmation that the counter-move has started."
          es: "Es la confirmación por acción del precio de que el movimiento contrario empezó."
      - id: c
        text:
          en: "It cancels every open order you hold on the other exchanges."
          es: "Cancela todas las órdenes abiertas que tengas en los demás exchanges."
      - id: d
        text:
          en: "It converts a bearish divergence into a hidden bullish one."
          es: "Convierte una divergencia bajista en una divergencia alcista oculta."
    explanation:
      en: "Divergence is context and the level is location, but neither one times an entry: the trendline break is the concrete evidence that price has begun to move, which is what turns a reading into a trade. Nothing about it changes your sizing, your other orders, or the type of divergence you were looking at."
      es: "La divergencia es contexto y el nivel es ubicación, pero ninguno pone la hora a una entrada: la rotura de la línea de tendencia es la prueba concreta de que el precio ha empezado a moverse, y eso es lo que convierte una lectura en una operación. Nada de eso cambia tu dimensionamiento, tus otras órdenes ni el tipo de divergencia que mirabas."
