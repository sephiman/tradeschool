# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: divergence-types-match
    kind: matching
    prompt:
      en: "Match each divergence type to its structural chart definition."
      es: "Empareja cada tipo de divergencia con su definición estructural en el gráfico."
    pairs:
      - id: reg-bull
        left: { en: "Regular Bullish Divergence", es: "Divergencia Alcista Regular" }
        right:
          en: "Price makes Lower Lows while Indicator makes Higher Lows (Signals Reversal)."
          es: "El precio hace Mínimos Más Bajos mientras el Indicador hace Mínimos Más Altos (Señala Inversión)."
      - id: reg-bear
        left: { en: "Regular Bearish Divergence", es: "Divergencia Bajista Regular" }
        right:
          en: "Price makes Higher Highs while Indicator makes Lower Highs (Signals Reversal)."
          es: "El precio hace Máximos Más Altos mientras el Indicador hace Máximos Más Bajos (Señala Inversión)."
      - id: hid-bull
        left: { en: "Hidden Bullish Divergence", es: "Divergencia Alcista Oculta" }
        right:
          en: "Price makes Higher Lows while Indicator makes Lower Lows (Signals Continuation)."
          es: "El precio hace Mínimos Más Altos mientras el Indicador hace Mínimos Más Bajos (Señala Continuación)."
      - id: hid-bear
        left: { en: "Hidden Bearish Divergence", es: "Divergencia Bajista Oculta" }
        right:
          en: "Price makes Lower Highs while Indicator makes Higher Highs (Signals Continuation)."
          es: "El precio hace Máximos Más Bajos mientras el Indicador hace Máximos Más Altos (Señala Continuación)."
    explanation:
      en: "Regular divergences signal trend reversals at extremes; hidden divergences signal trend continuation during pullbacks."
      es: "Las divergencias regulares señalan inversiones de tendencia en extremos; las divergencias ocultas señalan continuación de tendencia durante retrocesos."

  - id: divergence-validation-steps
    kind: ordering
    prompt:
      en: "Order the steps to correctly identify and validate a divergence."
      es: "Ordena los pasos para identificar y validar correctamente una divergencia."
    items:
      - id: step-1
        position: 1
        text:
          en: "Identify clear price swings (Highs or Lows) at a key support or resistance level."
          es: "Identificar oscilaciones claras de precio (Máximos o Mínimos) en un nivel clave de soporte o resistencia."
      - id: step-2
        position: 2
        text:
          en: "Compare the corresponding peaks or troughs on the indicator (RSI / MACD)."
          es: "Comparar los picos o valles correspondientes en el indicador (RSI / MACD)."
      - id: step-3
        position: 3
        text:
          en: "Check for slope disagreement between price trajectory and indicator trajectory."
          es: "Comprobar el desacuerdo de pendiente entre la trayectoria del precio y la del indicador."
      - id: step-4
        position: 4
        text:
          en: "Wait for trigger confirmation (e.g. reversal candle or trendline break) before entering."
          es: "Esperar la confirmación del gatillo (ej. vela de inversión o rotura de línea de tendencia) antes de entrar."
    explanation:
      en: "Divergences are context clues, not immediate market buy/sell market signals. Always wait for price action confirmation."
      es: "Las divergencias son pistas de contexto, no señales automáticas de compra/venta. Espera siempre la confirmación del price action."

  - id: hidden-divergence-context
    kind: multi_select
    prompt:
      en: "Which conditions confirm a valid Hidden Bullish Divergence setup?"
      es: "¿Qué condiciones confirman una configuración válida de Divergencia Alcista Oculta?"
    options:
      - id: a
        correct: true
        text:
          en: "The prevailing macro trend is clearly bullish."
          es: "La tendencia macro dominante es claramente alcista."
      - id: b
        correct: true
        text:
          en: "Price makes a Higher Low during a pullback, while RSI prints a Lower Low."
          es: "El precio marca un Mínimo Más Alto durante un retroceso, mientras el RSI marca un Mínimo Más Bajo."
      - id: c
        correct: false
        text:
          en: "Price is forming a series of Lower Lows and Lower Highs."
          es: "El precio está formando una serie de Mínimos Más Bajos y Máximos Más Bajos."
      - id: d
        correct: true
        text:
          en: "The pullback retests a key support or moving average level."
          es: "El retroceso retesta un nivel clave de soporte o media móvil."
    explanation:
      en: "Hidden bullish divergence shows that momentum resets (lower RSI) while price holds structural strength (higher low)."
      es: "La divergencia alcista oculta muestra que el momentum se reinicia (RSI más bajo) mientras el precio mantiene fuerza estructural (mínimo más alto)."

  - id: divergence-timeframe-truth
    kind: true_false
    prompt:
      en: "Divergences on lower timeframes (e.g. 1-minute charts) carry equal predictive weight as 4-hour divergences."
      es: "Las divergencias en temporalidades bajas (ej. 1 minuto) tienen el mismo peso predictivo que las divergencias de 4 horas."
    answer: false
    explanation:
      en: "Lower timeframe divergences frequently fail due to market noise and order book micro-fluctuations. High timeframe divergences reflect significant institutional positioning."
      es: "Las divergencias en temporalidades bajas fallan frecuentemente debido al ruido de mercado y microfluctuaciones. Las divergencias de temporalidad alta reflejan posicionamiento institucional significativo."

  - id: oscillator-selection
    kind: single_choice
    prompt:
      en: "What does a Regular Bearish Divergence indicate about underlying market momentum?"
      es: "¿Qué indica una Divergencia Bajista Regular sobre el momentum subyacente del mercado?"
    options:
      - id: a
        correct: true
        text:
          en: "Buying pressure is weakening even though price pushed to a new higher peak."
          es: "La presión compradora se está debilitando aunque el precio haya alcanzado un nuevo pico más alto."
      - id: b
        text:
          en: "Sellers have completely exited the market."
          es: "Los vendedores han abandonado por completo el mercado."
      - id: c
        text:
          en: "A massive short squeeze is guaranteed to happen next."
          es: "Se garantiza que ocurrirá un short squeeze masivo a continuación."
      - id: d
        text:
          en: "Trading volume has reached zero."
          es: "El volumen de negociación ha llegado a cero."
    explanation:
      en: "Regular bearish divergence reveals that each successive higher high is backed by diminishing momentum, signaling exhaustion."
      es: "La divergencia bajista regular revela que cada nuevo máximo más alto está respaldado por un momentum decreciente, señalando agotamiento."

  - id: rsi-divergence-confirmation
    kind: single_choice
    prompt:
      en: "Why should a trader wait for RSI to cross back above 30 before trading a regular bullish divergence?"
      es: "¿Por qué un trader debería esperar a que el RSI cruce de nuevo por encima de 30 antes de operar una divergencia alcista regular?"
    options:
      - id: a
        correct: true
        text:
          en: "It confirms that bullish momentum has actually turned upward rather than continuing to slide in oversold territory."
          es: "Confirma que el momentum alcista ha girado hacia arriba en lugar de seguir cayendo en territorio de sobreventa."
      - id: b
        text:
          en: "It reduces exchange trading fees to zero."
          es: "Reduce las comisiones de trading del exchange a cero."
      - id: c
        text:
          en: "It guarantees that the trade will reach Take Profit within 10 minutes."
          es: "Garantiza que la operación llegará a Take Profit en 10 minutos."
      - id: d
        text:
          en: "It forces the exchange to disable short positions."
          es: "Obliga al exchange a desactivar las posiciones cortas."
    explanation:
      en: "RSI can remain deeply oversold during strong downtrends; waiting for the line to hook back up confirms buyer entry."
      es: "El RSI puede permanecer muy sobrevendido durante tendencias bajistas fuertes; esperar a que la línea se enganche hacia arriba confirma la entrada de compradores."

  - id: macd-histogram-divergence
    kind: single_choice
    prompt:
      en: "How does MACD histogram divergence differ from standard price-to-indicator divergence?"
      es: "¿En qué se diferencia la divergencia del histograma MACD de la divergencia estándar de precio a indicador?"
    options:
      - id: a
        correct: true
        text:
          en: "It measures the rate of change of the distance between MACD lines, giving an earlier signal of momentum decelerating."
          es: "Mide la tasa de cambio de la distancia entre las líneas MACD, dando una señal más temprana de desaceleración del momentum."
      - id: b
        text:
          en: "It only works on weekend candlestick charts."
          es: "Solo funciona en gráficos de velas de fin de semana."
      - id: c
        text:
          en: "It eliminates the need for stop loss orders."
          es: "Elimina la necesidad de órdenes de stop loss."
      - id: d
        text:
          en: "It is only calculated on spot markets, never futures."
          es: "Solo se calcula en mercados spot, nunca en futuros."
    explanation:
      en: "The MACD histogram reflects acceleration/deceleration; histogram divergence spots slowing momentum before the MACD signal lines cross."
      es: "El histograma MACD refleja aceleración/desaceleración; la divergencia del histograma detecta frenado del momentum antes de que las líneas del MACD se crucen."

  - id: divergence-trendline-break
    kind: single_choice
    prompt:
      en: "What role does a micro trendline break play when executing a divergence trade?"
      es: "¿Qué papel juega la rotura de una micro línea de tendencia al ejecutar una operación por divergencia?"
    options:
      - id: a
        correct: true
        text:
          en: "It provides concrete price action confirmation that the counter-trend move has commenced."
          es: "Proporciona confirmación concreta por acción del precio de que el movimiento contra-tendencia ha comenzado."
      - id: b
        text:
          en: "It doubles your account's position size automatically."
          es: "Duplica el tamaño de posición de tu cuenta automáticamente."
      - id: c
        text:
          en: "It cancels all open orders on other exchanges."
          es: "Cancela todas las órdenes abiertas en otros exchanges."
      - id: d
        text:
          en: "It turns a bearish divergence into a hidden bullish divergence."
          es: "Convierte una divergencia bajista en una divergencia alcista oculta."
    explanation:
      en: "Combining indicator divergence with a price structure or trendline break provides both context and timing."
      es: "Combinar la divergencia de indicador con la rotura de estructura o línea de tendencia proporciona contexto y timing."
