# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: demo-limit
    prompt:
      en: "Paper trading validates a lot, but there is one thing it cannot test. What?"
      es: "El trading en papel valida mucho, pero hay algo que no puede probar. ¿Qué?"
    options:
      - id: a
        text:
          en: "Whether you can find setups and size positions correctly from the stop."
          es: "Si sabes encontrar setups y dimensionar posiciones desde el stop."
      - id: b
        text:
          en: "Whether the plan's rules are internally consistent with one another."
          es: "Si las reglas del plan son coherentes unas con otras."
      - id: c
        text:
          en: "Nothing — demo fills and demo emotions are identical to live trading."
          es: "Nada: las ejecuciones y emociones de la demo son idénticas a las reales."
      - id: d
        correct: true
        text:
          en: "The psychology: demo has no real fear, because losing play money costs nothing."
          es: "La psicología: la demo no tiene miedo real ni dinero de verdad."
    explanation:
      en: "Demo validates the process — finding setups, sizing, checking the rules hang together — but not the trader. It has no real slippage and, crucially, no real fear: losing play money feels nothing like losing rent. Only small real money starts testing the psychology."
      es: "La demo valida el proceso —encontrar setups, dimensionar, comprobar que las reglas encajan— pero no al trader. No tiene slippage real y, sobre todo, no tiene miedo real: perder dinero de mentira no se parece a perder el alquiler. Solo el dinero real pequeño empieza a probar la psicología."
  - id: sample-size
    prompt:
      en: "You have taken 6 trades on a new system: 4 winners, 2 losers. What can you conclude about its edge?"
      es: "Has hecho 6 operaciones con un sistema nuevo: 4 ganadoras, 2 perdedoras. ¿Qué puedes concluir sobre su ventaja?"
    options:
      - id: a
        text:
          en: "It has a proven edge — two thirds winners is a reliable hit rate."
          es: "Tiene ventaja probada: dos tercios de aciertos es una tasa fiable."
      - id: b
        correct: true
        text:
          en: "Almost nothing: 6 trades is noise, and judging an edge needs dozens of them."
          es: "Casi nada: 6 operaciones son ruido y no una muestra que juzgar."
      - id: c
        text:
          en: "The win rate is 66,7%, and that is the number to plan around."
          es: "El acierto es del 66,7%, y ese es el número con el que planificar."
      - id: d
        text:
          en: "It is broken: a system that loses a third of the time should be scrapped."
          es: "Está roto: un sistema que pierde un tercio de las veces se desecha."
    explanation:
      en: "A tiny sample is dominated by luck: a good system easily shows early losers and a bad one early winners, so neither the optimistic nor the pessimistic reading survives. Judgement waits for a real sample — dozens of trades (m25), not a handful — and until then 66,7% is an artefact of six coin flips."
      es: "Una muestra diminuta la domina la suerte: un buen sistema muestra perdedoras temprano con facilidad y uno malo, ganadoras, así que no sobrevive ni la lectura optimista ni la pesimista. El juicio espera una muestra real —decenas de operaciones (m25), no un puñado— y hasta entonces el 66,7% es un artefacto de seis lanzamientos."
  - id: first-size
    prompt:
      en: "When you first move from demo to real money, how should you choose your position size?"
      es: "Cuando pasas por primera vez de la demo al dinero real, ¿cómo deberías elegir tu tamaño de posición?"
    options:
      - id: a
        text:
          en: "As large as your margin allows, so the validation is worth the time."
          es: "Tan grande como permita tu margen, para que validar merezca el tiempo."
      - id: b
        text:
          en: "The same size a profitable trader you follow posts on their account."
          es: "El mismo tamaño que publica en su cuenta un trader rentable que sigues."
      - id: c
        correct: true
        text:
          en: "Small enough that a full −1R loss feels genuinely trivial to you today."
          es: "Tan pequeño que una pérdida de −1R te resulte trivial."
      - id: d
        text:
          en: "Whatever size wins back what you 'lost' on demo while practising."
          es: "El tamaño que recupere lo que «perdiste» en la demo practicando."
    explanation:
      en: "The first job of real money is to expose you to real emotion while decisions still cost almost nothing. Start where losing is trivial; the profit comes later, after the edge is proven. Copying someone else's size skips both the proof and the account it was sized for, and demo losses are not money owed."
      es: "El primer trabajo del dinero real es exponerte a emoción real mientras las decisiones aún cuestan casi nada. Empieza donde perder es trivial; el beneficio llega después, cuando la ventaja está probada. Copiar el tamaño de otro se salta la prueba y la cuenta para la que se dimensionó, y las pérdidas de la demo no son una deuda."
  - id: scale-to-recover-tf
    kind: true_false
    prompt:
      en: "Increasing your position size after a losing streak, to win the losses back faster, inverts the rule that size follows proven edge."
      es: "Aumentar el tamaño de posición tras una racha perdedora, para recuperar más rápido, invierte la regla de que el tamaño sigue a la ventaja probada."
    answer: true
    explanation:
      en: "Scaling to recover is the losing trader's reflex: size should follow a proven edge, never the need to win back. It turns a manageable drawdown into a blown account."
      es: "Escalar para recuperar es el reflejo del trader perdedor: el tamaño debe seguir a la ventaja probada, nunca a la necesidad de recuperar. Convierte una racha adversa manejable en una cuenta reventada."
  - id: when-scale-up
    prompt:
      en: "Under what condition is it appropriate to increase your trading size?"
      es: "¿Bajo qué condición es apropiado aumentar tu tamaño de operación?"
    options:
      - id: a
        text:
          en: "As soon as you have one big winning day, since momentum should be used."
          es: "En cuanto tengas un gran día ganador, ya que el impulso hay que usarlo."
      - id: b
        text:
          en: "Whenever you feel confident, because confidence reflects your reading."
          es: "Siempre que te sientas seguro, porque la confianza refleja tu lectura."
      - id: c
        text:
          en: "Immediately after a loss, so the next winner recovers the drawdown."
          es: "Inmediatamente tras una pérdida, para que la siguiente la recupere."
      - id: d
        correct: true
        text:
          en: "When the journal proves the edge and you follow the plan."
          es: "Cuando el diario prueba la ventaja y sigues el plan."
    explanation:
      en: "Scale in steps, only when the record keeps proving the edge over a real sample AND you are still following the plan at the current size. Each step up re-tests the psychology, because bigger positions feel different — which is exactly why a single good day, a confident mood, or a drawdown are all the wrong triggers."
      es: "Escala por pasos, solo cuando el registro siga demostrando la ventaja sobre una muestra real Y sigas el plan al tamaño actual. Cada escalón vuelve a probar la psicología, porque las posiciones más grandes se sienten distintas: por eso un solo buen día, un ánimo confiado o una racha adversa son todos detonantes equivocados."
  - id: why-validate
    prompt:
      en: "What is the point of validating a system on demo or tiny size before trading it for real?"
      es: "¿Cuál es el sentido de validar un sistema en demo o a tamaño diminuto antes de operarlo de verdad?"
    options:
      - id: a
        text:
          en: "It guarantees the system will be profitable once you take it live."
          es: "Garantiza que el sistema será rentable en cuanto lo pases a real."
      - id: b
        correct: true
        text:
          en: "It moves the learning to where mistakes are cheap."
          es: "Traslada el aprendizaje a donde los errores son baratos."
      - id: c
        text:
          en: "It is a legal requirement on most regulated derivatives exchanges."
          es: "Es un requisito legal en casi todos los exchanges de derivados."
      - id: d
        text:
          en: "There is no point; validating just wastes the time an edge lasts."
          es: "No tiene sentido; validar solo gasta el tiempo que dura una ventaja."
    explanation:
      en: "The alternative to validation is discovering whether your system works with money you cannot afford to lose. It guarantees nothing about the future — it just makes the expensive lessons cheap, which is worth far more than the weeks it costs."
      es: "La alternativa a validar es descubrir si tu sistema funciona con dinero que no puedes permitirte perder. No garantiza nada sobre el futuro: solo abarata las lecciones caras, lo que vale mucho más que las semanas que cuesta."
  - id: validation-steps-multi
    kind: multi_select
    prompt:
      en: "Select ALL statements that describe sound validation before risking real money."
      es: "Selecciona TODAS las afirmaciones que describen una validación sensata antes de arriesgar dinero real."
    options:
      - id: a
        correct: true
        text: { en: "Trade the plan on demo until execution is automatic.", es: "Opera el plan en demo hasta que la ejecución sea automática." }
      - id: b
        correct: true
        text: { en: "Wait for dozens of trades before judging the edge.", es: "Espera decenas de operaciones antes de juzgar la ventaja." }
      - id: c
        correct: true
        text: { en: "Treat demo results as an optimistic ceiling, not a forecast.", es: "Trata los resultados de la demo como un techo optimista, no un pronóstico." }
      - id: d
        text: { en: "Skip straight to full size, since validating wastes time.", es: "Saltar directo al tamaño completo, porque validar hace perder tiempo." }
    explanation:
      en: "Validate on demo or minimum size, over a real sample, remembering demo flatters you: no real slippage and no real fear. Skipping to full size is the opposite of validation — it is paying full tuition on an untested claim, and it makes the first losing streak the most expensive one."
      es: "Valida en demo o tamaño mínimo, sobre una muestra real, recordando que la demo te favorece: sin slippage real ni miedo real. Saltar al tamaño completo es lo contrario de validar: es pagar la matrícula completa por una afirmación sin probar, y hace que la primera racha perdedora sea la más cara."
  - id: graded-sample-split
    prompt:
      en: "Your journal has 40 trades: 12 graded 'A' averaging +1,4R and 28 graded 'B' averaging +0,1R. Does this justify raising risk to 2% on A setups?"
      es: "Tu diario tiene 40 operaciones: 12 calificadas «A» con una media de +1,4R y 28 calificadas «B» con una media de +0,1R. ¿Justifica eso subir el riesgo al 2% en los setups A?"
    options:
      - id: a
        text:
          en: "Yes — a 14× gap in average R is far too large to have come from luck."
          es: "Sí: una diferencia de 14× en la R media es demasiado grande para ser suerte."
      - id: b
        text:
          en: "Yes, and you should drop the B setups from the plan entirely as well."
          es: "Sí, y además deberías eliminar del plan los setups B por completo."
      - id: c
        correct: true
        text:
          en: "No — 12 trades is far too small a sample, and grading splits it smaller."
          es: "No: 12 operaciones son una muestra demasiado pequeña para probarlo."
      - id: d
        text:
          en: "It does not matter; risk tiers are personal preference, not evidence."
          es: "Da igual: los niveles de riesgo son preferencia personal, no pruebas."
    explanation:
      en: "This is m25's sample-size problem sharpened: grading splits an already small record into even smaller ones, and a dozen trades can easily average +1,4R by chance. The temptation is to declare the tier ladder proven on exactly the lucky run that made you feel like a grader. Keep grading at a flat 1% and let the per-grade samples grow."
      es: "Es el problema del tamaño de muestra de m25 agudizado: calificar parte un registro ya pequeño en muestras aún menores, y una docena de operaciones puede dar una media de +1,4R por puro azar. La tentación es declarar la escala probada justo con la racha de suerte que te hizo sentirte capaz de calificar. Sigue calificando con un 1% plano y deja crecer las muestras."
  - id: validation-stages-match
    kind: matching
    prompt:
      en: "Match each stage of validating a new system to what it can and cannot prove."
      es: "Empareja cada etapa de validar un sistema nuevo con lo que puede y no puede demostrar."
    pairs:
      - id: demo
        left: { en: "Paper or demo trading", es: "Operar en papel o en demo" }
        right:
          en: "Validates the process — can you find setups, size correctly, follow the plan — but not the psychology: no real slippage and, more importantly, no real fear."
          es: "Valida el proceso (¿sabes encontrar setups, dimensionar bien, seguir el plan?), pero no la psicología: sin slippage real y, más importante, sin miedo real."
      - id: small
        left: { en: "The smallest real size the exchange allows", es: "El tamaño real más pequeño que permite el exchange" }
        right:
          en: "Starts testing the trader rather than the plan — real money introduces real fear at a low cost."
          es: "Empieza a poner a prueba al trader más que al plan: el dinero real introduce miedo real a bajo coste."
      - id: sample
        left: { en: "A handful of trades", es: "Un puñado de operaciones" }
        right:
          en: "Noise — a 60%-win system can easily show 3 losers in its first 5. You need dozens of trades, not a weekend, before results mean anything about the edge."
          es: "Ruido: un sistema con un 60% de acierto puede mostrar fácilmente 3 pérdidas en sus 5 primeras. Necesitas docenas de operaciones, no un fin de semana, antes de que los resultados digan algo sobre la ventaja."
    explanation:
      en: "Test where being wrong is free, and know what each stage is actually testing. Demo proves the mechanics; only small real money starts testing the trader."
      es: "Prueba donde equivocarse es gratis, y ten claro qué pone a prueba cada etapa. La demo demuestra la mecánica; solo el dinero real pequeño empieza a poner a prueba al trader."
