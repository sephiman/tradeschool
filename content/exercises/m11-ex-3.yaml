type: quiz
variants:
  - id: rsi-measures
    prompt:
      en: "What does the RSI actually measure?"
      es: "¿Qué mide realmente el RSI?"
    options:
      - id: a
        text:
          en: "How far price sits above or below its all-time high, as a percentage."
          es: "Cuánto está el precio por encima o debajo de su máximo histórico, en porcentaje."
      - id: b
        text:
          en: "How overvalued or undervalued the asset is against its fair price."
          es: "Lo sobrevalorado o infravalorado que está el activo frente a su precio justo."
      - id: c
        correct: true
        text:
          en: "Recent average gains against recent average losses, scaled to 0–100."
          es: "Las ganancias medias recientes frente a las pérdidas medias, de 0 a 100."
      - id: d
        text:
          en: "The total volume that has traded over the last fourteen bars."
          es: "El volumen total negociado en las últimas catorce velas."
    explanation:
      en: "RSI compares average up-moves to average down-moves over a lookback (default 14) and maps that onto 0–100. It says nothing about fair value, nothing about how far price is from any high, and nothing about volume — only how one-sided the recent bars have been."
      es: "El RSI compara las subidas medias con las bajadas medias en un periodo (por defecto 14) y lo lleva a una escala de 0 a 100. No dice nada sobre el valor justo, ni sobre lo lejos que está el precio de ningún máximo, ni sobre el volumen: solo cómo de unilaterales han sido las velas recientes."
  - id: macd-is
    prompt:
      en: "Which of these correctly describes the MACD?"
      es: "¿Cuál de estas describe correctamente el MACD?"
    options:
      - id: a
        correct: true
        text:
          en: "A fast EMA minus a slow one, plus a signal line and a histogram."
          es: "Una EMA rápida menos una lenta, con línea de señal e histograma."
      - id: b
        text:
          en: "A single moving average that turns green above price and red below it."
          es: "Una única media móvil que se pone verde sobre el precio y roja debajo."
      - id: c
        text:
          en: "An oscillator bounded between 0 and 100, exactly like the RSI is."
          es: "Un oscilador acotado entre 0 y 100, exactamente igual que el RSI."
      - id: d
        text:
          en: "The ratio of buy orders to sell orders resting in the order book."
          es: "La proporción entre órdenes de compra y de venta que hay en el libro."
    explanation:
      en: "MACD is built from two EMAs (fast 12, slow 26): their difference is the MACD line, a 9-period EMA of that line is the signal, and the histogram is the gap between the two. It is three plotted series, not one line, it is derived from price rather than from the book, and it is unbounded — unlike RSI it has no fixed 0–100 range."
      es: "El MACD se construye con dos EMAs (rápida 12, lenta 26): su diferencia es la línea MACD, una EMA de 9 periodos de esa línea es la señal, y el histograma es la distancia entre ambas. Son tres series dibujadas, no una línea, se deriva del precio y no del libro, y no está acotado: a diferencia del RSI, no tiene un rango fijo de 0 a 100."
  - id: macd-parts
    kind: matching
    prompt:
      en: "Match each oscillator component to what it is."
      es: "Empareja cada componente de los osciladores con lo que es."
    pairs:
      - id: rsi
        left: { en: "RSI", es: "RSI" }
        right:
          en: "A bounded 0–100 gauge of how one-sided recent up- and down-moves have been."
          es: "Un medidor acotado de 0 a 100 de cómo de unilaterales han sido las subidas y bajadas recientes."
      - id: macd-line
        left: { en: "MACD line", es: "Línea MACD" }
        right:
          en: "The fast EMA (12) minus the slow EMA (26) of price."
          es: "La EMA rápida (12) menos la EMA lenta (26) del precio."
      - id: signal
        left: { en: "Signal line", es: "Línea de señal" }
        right:
          en: "A 9-period EMA of the MACD line — a smoothed, slower version of it."
          es: "Una EMA de 9 periodos de la línea MACD: una versión suavizada y más lenta."
      - id: histogram
        left: { en: "Histogram", es: "Histograma" }
        right:
          en: "The gap between the MACD line and the signal line, drawn as bars."
          es: "La distancia entre la línea MACD y la línea de señal, dibujada como barras."
    explanation:
      en: "RSI is the bounded 0–100 momentum gauge; the MACD line is fast-minus-slow EMA; the signal is a 9-period EMA of that line; the histogram is the gap between the two. Keeping the pieces straight is what stops you misreading a cross."
      es: "El RSI es el medidor de momentum acotado de 0 a 100; la línea MACD es la EMA rápida menos la lenta; la señal es una EMA de 9 de esa línea; el histograma es la distancia entre ambas. Tener claras las piezas es lo que evita que malinterpretes un cruce."
  - id: macd-bounded-myth
    kind: true_false
    prompt:
      en: "Like the RSI, the MACD is bounded on a fixed 0–100 scale."
      es: "Igual que el RSI, el MACD está acotado en una escala fija de 0 a 100."
    answer: false
    explanation:
      en: "Only the RSI is bounded 0–100. The MACD is built from EMAs of price and is unbounded — its lines and histogram can run to any value the trend produces. Treating it as a 0–100 oscillator is a common mix-up."
      es: "Solo el RSI está acotado de 0 a 100. El MACD se construye con EMAs del precio y no está acotado: sus líneas y su histograma pueden llegar a cualquier valor que produzca la tendencia. Tratarlo como un oscilador de 0 a 100 es una confusión habitual."
  - id: rsi-near-100
    prompt:
      en: "The RSI on a chart is sitting near 100. What does that reading actually tell you?"
      es: "El RSI de un gráfico está cerca de 100. ¿Qué te dice realmente esa lectura?"
    options:
      - id: a
        text:
          en: "That the price has reached its all-time high on this instrument."
          es: "Que el precio ha alcanzado su máximo histórico en este instrumento."
      - id: b
        correct: true
        text:
          en: "That almost every recent bar closed up, so average losses are near zero."
          es: "Que casi toda vela reciente cerró al alza, así que las pérdidas medias son casi cero."
      - id: c
        text:
          en: "That the asset is overvalued relative to what it is really worth."
          es: "Que el activo está sobrevalorado respecto a lo que vale de verdad."
      - id: d
        text:
          en: "That the trading volume has spiked to a record for the period."
          es: "Que el volumen de negociación ha subido a un récord del periodo."
    explanation:
      en: "RSI is relative: near 100 means up-moves have overwhelmed down-moves over the lookback, so recent bars have been strongly one-sided to the upside. It says nothing about price being at any particular level, about the asset being 'expensive', or about how much traded — only about the balance of recent bars."
      es: "El RSI es relativo: cerca de 100 significa que las subidas han aplastado a las bajadas en el periodo, así que las velas recientes han sido fuertemente unilaterales al alza. No dice nada sobre que el precio esté en un nivel concreto, ni sobre que el activo esté 'caro', ni sobre cuánto se ha negociado: solo sobre el equilibrio de las velas recientes."
  - id: rsi-facts
    kind: multi_select
    prompt:
      en: "Select ALL of the statements that are true of the RSI."
      es: "Selecciona TODAS las afirmaciones que son ciertas del RSI."
    options:
      - id: a
        correct: true
        text:
          en: "It is scaled to a fixed range of 0 to 100."
          es: "Está escalado a un rango fijo de 0 a 100."
      - id: b
        correct: true
        text:
          en: "Its default lookback window is fourteen bars."
          es: "Su ventana de referencia por defecto es de catorce velas."
      - id: c
        correct: true
        text:
          en: "It compares recent average gains with recent average losses."
          es: "Compara las ganancias medias recientes con las pérdidas medias recientes."
      - id: d
        text:
          en: "It measures how far the asset is from its fair price."
          es: "Mide lo lejos que está el activo de su precio justo."
    explanation:
      en: "RSI is a bounded (0–100), 14-bar-by-default measure of how lopsided recent up- and down-moves have been. It has no notion of 'fair value' anywhere in its formula — that fourth idea is the classic misconception, and it is what makes people sell strength."
      es: "El RSI es una medida acotada (0 a 100), de 14 velas por defecto, de cómo de desequilibradas han sido las subidas y bajadas recientes. No hay ninguna noción de 'valor justo' en su fórmula: esa cuarta idea es la confusión clásica, y es la que hace que la gente venda la fuerza."
  - id: macd-zero-line-means
    prompt:
      en: "The MACD line crosses from below zero to above it. What has just happened, mechanically?"
      es: "La línea MACD cruza de estar por debajo de cero a estar por encima. ¿Qué ha ocurrido, mecánicamente?"
    options:
      - id: a
        correct: true
        text:
          en: "The fast 12-EMA has crossed above the slow 26-EMA."
          es: "La EMA rápida de 12 ha cruzado por encima de la lenta de 26."
      - id: b
        text:
          en: "The RSI has crossed above the 50 midpoint of its range."
          es: "El RSI ha cruzado por encima del punto medio 50 de su rango."
      - id: c
        text:
          en: "The MACD line has crossed above its own signal line."
          es: "La línea MACD ha cruzado por encima de su propia línea de señal."
      - id: d
        text:
          en: "Price has crossed above its previous all-time high."
          es: "El precio ha cruzado por encima de su anterior máximo histórico."
    explanation:
      en: "The MACD line IS the fast EMA minus the slow EMA, so the line at zero means the two are equal and a cross of zero means they swapped order. That is m10's golden cross on the 12/26 pair — a change of trend regime, and a different, higher-order event from a cross of the signal line, which only means the MACD line turned relative to its own average."
      es: "La línea MACD ES la EMA rápida menos la lenta, así que la línea en cero significa que ambas son iguales y que cruce el cero significa que intercambiaron el orden. Ese es el cruce dorado de m10 sobre el par 12/26: un cambio de régimen de tendencia, y un evento distinto y de orden superior al cruce de la línea de señal, que solo significa que la línea MACD giró respecto a su propia media."
  - id: hist-zero-is-cross
    kind: true_false
    prompt:
      en: "The MACD histogram reaching zero and the MACD line crossing its signal line are the same event."
      es: "Que el histograma del MACD llegue a cero y que la línea MACD cruce su línea de señal son el mismo evento."
    answer: true
    explanation:
      en: "The histogram IS the MACD line minus the signal line, so it is zero exactly when the two lines are equal — the instant of the cross. That is why a shrinking histogram is an early warning: it is the gap closing, and the flip is arithmetic once it reaches zero."
      es: "El histograma ES la línea MACD menos la línea de señal, así que vale cero exactamente cuando las dos líneas son iguales: el instante del cruce. Por eso un histograma que se encoge es un aviso temprano: es la distancia cerrándose, y el cambio de signo es aritmética en cuanto llega a cero."
  - id: macd-cross-order
    kind: ordering
    prompt:
      en: "A downtrend turns for real. Put these MACD events in the order they must happen, first to last."
      es: "Una tendencia bajista gira de verdad. Ordena estos eventos del MACD según el orden en que deben ocurrir, del primero al último."
    items:
      - id: line-turns
        position: 1
        text:
          en: "The MACD line stops falling and turns up, still well below zero."
          es: "La línea MACD deja de caer y gira al alza, todavía muy por debajo de cero."
      - id: hist-shrinks
        position: 2
        text:
          en: "The negative histogram starts shrinking as the MACD line closes on its signal."
          es: "El histograma negativo empieza a encogerse mientras la línea MACD se acerca a su señal."
      - id: signal-cross
        position: 3
        text:
          en: "The histogram flips positive: the MACD line crosses above its signal line."
          es: "El histograma pasa a positivo: la línea MACD cruza por encima de su línea de señal."
      - id: zero-cross
        position: 4
        text:
          en: "The MACD line reaches and crosses zero: the 12-EMA crosses above the 26-EMA."
          es: "La línea MACD llega y cruza el cero: la EMA de 12 cruza por encima de la de 26."
    explanation:
      en: "The MACD line has to turn before it can close the gap to its own lagging average, so the histogram shrinks before it flips, and the flip (the signal cross) comes before the MACD line has climbed all the way to zero. That ordering is why the signal cross is the earlier, noisier clue and the zero cross the later, heavier confirmation."
      es: "La línea MACD tiene que girar antes de poder cerrar la distancia con su propia media rezagada, así que el histograma se encoge antes de cambiar de signo, y ese cambio (el cruce de señal) llega antes de que la línea MACD haya escalado hasta el cero. Ese orden es la razón por la que el cruce de señal es la pista temprana y ruidosa, y el cruce de cero la confirmación tardía y de más peso."
  - id: macd-build
    kind: ordering
    prompt:
      en: "Put the steps of building the MACD in the right order, first to last."
      es: "Ordena los pasos para construir el MACD, del primero al último."
    items:
      - id: emas
        position: 1
        text:
          en: "Compute a fast EMA (12) and a slow EMA (26) of price."
          es: "Calcula una EMA rápida (12) y una EMA lenta (26) del precio."
      - id: macd-line
        position: 2
        text:
          en: "Subtract the slow EMA from the fast EMA to get the MACD line."
          es: "Resta la EMA lenta a la rápida para obtener la línea MACD."
      - id: signal
        position: 3
        text:
          en: "Take a 9-period EMA of the MACD line to get the signal line."
          es: "Toma una EMA de 9 periodos de la línea MACD para obtener la línea de señal."
      - id: histogram
        position: 4
        text:
          en: "Plot the gap between the MACD line and the signal line as the histogram."
          es: "Dibuja la distancia entre la línea MACD y la línea de señal como el histograma."
    explanation:
      en: "MACD is built in order: two EMAs of price, their difference (the MACD line), a 9-period EMA of that line (the signal), and finally the gap between line and signal (the histogram). Each step feeds the next, which is why the histogram can only be read once you have both lines."
      es: "El MACD se construye por orden: dos EMAs del precio, su diferencia (la línea MACD), una EMA de 9 de esa línea (la señal) y, por último, la distancia entre la línea y la señal (el histograma). Cada paso alimenta al siguiente, y por eso el histograma solo se puede leer una vez que tienes ambas líneas."
