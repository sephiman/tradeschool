# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: who-pays
    prompt:
      en: "The funding rate on a perpetual is clearly positive. What does that tell you?"
      es: "El funding rate de un perpetuo es claramente positivo. ¿Qué te dice eso?"
    options:
      - id: a
        correct: true
        text:
          en: "Longs are paying shorts, and the crowd is leaning long — positioning is tilted to the upside."
          es: "Los largos pagan a los cortos, y la masa está inclinada al lado largo: el posicionamiento se inclina al alza."
      - id: b
        text:
          en: "Shorts are paying longs, since a positive number naturally rewards the long side."
          es: "Los cortos pagan a los largos, ya que un número positivo premia de forma natural al lado largo."
      - id: c
        text:
          en: "Price is guaranteed to keep rising for as long as funding stays positive."
          es: "El precio tiene garantizado seguir subiendo mientras el funding se mantenga positivo."
      - id: d
        text:
          en: "The exchange is charging a flat fee on every trade, regardless of side."
          es: "El exchange cobra una comisión fija en cada operación, sin importar el lado."
    explanation:
      en: "Positive funding means the perp trades above spot, so longs pay shorts to keep the perp tethered near spot. It tells you the crowd is leaning long — a positioning reading, not a promise price will keep rising, and nothing to do with trading fees."
      es: "Un funding positivo significa que el perpetuo cotiza por encima del spot, así que los largos pagan a los cortos para mantener el perpetuo anclado cerca del spot. Te dice que la masa está inclinada al lado largo: una lectura de posicionamiento, no una promesa de que el precio seguirá subiendo, y nada que ver con las comisiones de trading."
  - id: crowded-extreme
    prompt:
      en: "Funding has been strongly positive for days and keeps climbing. A beginner reads this as a reason to add longs. What's the more honest read?"
      es: "El funding lleva días fuertemente positivo y sigue subiendo. Un principiante lo lee como una razón para sumar largos. ¿Cuál es la lectura más honesta?"
    options:
      - id: a
        correct: true
        text:
          en: "The long side is crowded and paying to stay in — one-sided positioning that is fragile, not a green light to pile in."
          es: "El lado largo está saturado y pagando por quedarse: un posicionamiento unilateral que es frágil, no una luz verde para amontonarse."
      - id: b
        text:
          en: "Strong positive funding confirms the uptrend, so adding longs is the high-probability play."
          es: "Un funding fuertemente positivo confirma la tendencia alcista, así que sumar largos es la jugada de alta probabilidad."
      - id: c
        text:
          en: "Only negative funding is ever a warning; positive funding is always a sign of health."
          es: "Solo el funding negativo es una advertencia; el funding positivo siempre es señal de salud."
      - id: d
        text:
          en: "Funding levels have no connection to how crowded positioning is."
          es: "Los niveles de funding no tienen ninguna relación con lo saturado que está el posicionamiento."
    explanation:
      en: "Extreme positive funding means almost everyone is already long and paying for it — crowded, one-sided positioning. That is fragile, not confirming: little new buying is left and many longs are one bad candle from being forced out. It's a caution flag, not an entry."
      es: "Un funding extremadamente positivo significa que casi todos ya están largos y pagando por ello: un posicionamiento concurrido y unilateral. Eso es frágil, no confirmatorio: queda poca compra nueva y muchos largos están a una vela mala de ser expulsados por la fuerza. Es una señal de precaución, no una entrada."
  - id: fee-myth
    kind: true_false
    prompt:
      en: "A positive funding rate means the exchange is charging you a fee on your trade."
      es: "Un funding rate positivo significa que el exchange te cobra una comisión por tu operación."
    answer: false
    explanation:
      en: "Funding is a payment between traders, not a fee paid to the exchange. Positive funding means the perp trades above spot, so longs pay shorts to keep the perp tethered near spot. The exchange isn't a party to that payment — trading fees are a separate thing."
      es: "El funding es un pago entre traders, no una comisión que se paga al exchange. Un funding positivo significa que el perpetuo cotiza por encima del spot, así que los largos pagan a los cortos para mantener el perpetuo anclado cerca del spot. El exchange no es parte de ese pago: las comisiones de trading son otra cosa distinta."
  - id: funding-signs
    kind: matching
    prompt:
      en: "Match each funding-rate reading to what it means."
      es: "Empareja cada lectura del funding rate con lo que significa."
    pairs:
      - id: pos
        left:
          en: "Positive funding"
          es: "Funding positivo"
        right:
          en: "Perp trades above spot; longs pay shorts"
          es: "El perpetuo cotiza por encima del spot; los largos pagan a los cortos"
      - id: neg
        left:
          en: "Negative funding"
          es: "Funding negativo"
        right:
          en: "Perp trades below spot; shorts pay longs"
          es: "El perpetuo cotiza por debajo del spot; los cortos pagan a los largos"
      - id: ext
        left:
          en: "Funding strongly positive for days"
          es: "Funding fuertemente positivo durante días"
        right:
          en: "The long side is overcrowded and fragile"
          es: "El lado largo está saturado y es frágil"
    explanation:
      en: "The sign tells you which way the perp is pricing versus spot, and therefore who pays whom: positive means longs pay shorts (crowd leaning long), negative means shorts pay longs (crowd leaning short). A sustained extreme is the real signal — it flags one-sided, fragile positioning, not a direction to trade."
      es: "El signo te dice hacia qué lado cotiza el perpetuo respecto al spot y, por tanto, quién paga a quién: positivo significa que los largos pagan a los cortos (la masa se inclina al lado largo) y negativo que los cortos pagan a los largos (la masa se inclina al lado corto). Un extremo sostenido es la verdadera señal: avisa de un posicionamiento unilateral y frágil, no de una dirección para operar."
  - id: negative-funding
    prompt:
      en: "The funding rate on a perpetual has turned clearly negative. What does that tell you?"
      es: "El funding rate de un perpetuo se ha vuelto claramente negativo. ¿Qué te dice eso?"
    options:
      - id: a
        correct: true
        text:
          en: "The perp is trading below spot, so shorts pay longs — the crowd is leaning short."
          es: "El perpetuo cotiza por debajo del spot, así que los cortos pagan a los largos: la masa se inclina al lado corto."
      - id: b
        text:
          en: "Shorts are winning their bets, and the exchange rewards them with a payment."
          es: "Los cortos están ganando sus apuestas, y el exchange los premia con un pago."
      - id: c
        text:
          en: "Price is guaranteed to keep falling for as long as funding stays negative."
          es: "El precio tiene garantizado seguir cayendo mientras el funding se mantenga negativo."
      - id: d
        text:
          en: "Longs pay shorts, since any funding payment always flows to the short side."
          es: "Los largos pagan a los cortos, ya que cualquier pago de funding va siempre al lado corto."
    explanation:
      en: "Negative funding means the perp trades below spot, so shorts pay longs to pull the perp back up toward spot. It reads as the crowd leaning short — a positioning gauge, not a promise price keeps falling and not a reward for being 'right.'"
      es: "Un funding negativo significa que el perpetuo cotiza por debajo del spot, así que los cortos pagan a los largos para tirar del perpetuo de vuelta hacia el spot. Se lee como que la masa se inclina al lado corto: un medidor de posicionamiento, no una promesa de que el precio seguirá cayendo ni un premio por 'acertar'."
  - id: funding-purpose
    prompt:
      en: "Perpetual futures never expire. Why do exchanges use a funding rate at all?"
      es: "Los futuros perpetuos nunca vencen. ¿Por qué usan los exchanges un funding rate?"
    options:
      - id: a
        correct: true
        text:
          en: "To tether the perpetual's price to spot, via a small periodic payment between the two sides."
          es: "Para anclar el precio del perpetuo al spot, mediante un pequeño pago periódico entre los dos lados."
      - id: b
        text:
          en: "To predict which direction price will move next."
          es: "Para predecir hacia qué dirección se moverá el precio a continuación."
      - id: c
        text:
          en: "So the exchange can collect a commission on every open position."
          es: "Para que el exchange cobre una comisión por cada posición abierta."
      - id: d
        text:
          en: "To pay a dividend to long-term holders of the contract."
          es: "Para pagar un dividendo a los tenedores del contrato a largo plazo."
    explanation:
      en: "Because a perp never settles at an expiry, the funding payment is the mechanism that keeps its price tethered to spot: when the perp drifts above spot, longs pay shorts; below spot, shorts pay longs. It's a tethering tool between traders — not a forecast, an exchange fee, or a dividend."
      es: "Como un perpetuo nunca liquida a vencimiento, el pago de funding es el mecanismo que mantiene su precio anclado al spot: cuando el perpetuo se aleja por encima del spot, los largos pagan a los cortos; por debajo del spot, los cortos pagan a los largos. Es una herramienta de anclaje entre traders: no un pronóstico, ni una comisión del exchange, ni un dividendo."
  - id: daily-vs-extreme
    kind: true_false
    prompt:
      en: "Day to day the funding payment is usually tiny; it's mainly at extremes that funding becomes a useful read on crowding."
      es: "Día a día el pago de funding suele ser minúsculo; es sobre todo en los extremos donde el funding se vuelve una lectura útil de la saturación."
    answer: true
    explanation:
      en: "Correct. Ordinary funding is just a small cost of holding a position and says little on its own. The information is in the extreme: sustained, deeply one-sided funding flags crowded, fragile positioning — that's when it's worth watching."
      es: "Correcto. El funding corriente es solo un pequeño coste de mantener la posición y por sí mismo dice poco. La información está en el extremo: un funding sostenido y muy unilateral avisa de un posicionamiento saturado y frágil; ahí es cuando merece la pena vigilarlo."
