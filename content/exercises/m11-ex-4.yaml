# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: overbought-in-uptrend
    prompt:
      en: "In a strong, sustained uptrend the RSI has been above 70 for two weeks and price keeps making new highs. What does this tell you?"
      es: "En una tendencia alcista fuerte y sostenida, el RSI lleva dos semanas por encima de 70 y el precio sigue haciendo nuevos máximos. ¿Qué te dice esto?"
    options:
      - id: a
        correct: true
        text:
          en: "That momentum is strongly one-sided; in a strong trend RSI can stay overbought for a long time, so this is not a sell signal by itself."
          es: "Que el momentum es fuertemente unilateral; en una tendencia fuerte el RSI puede quedarse en sobrecompra mucho tiempo, así que esto no es por sí solo una señal de venta."
      - id: b
        text:
          en: "That the asset is overbought and you should sell or short it now."
          es: "Que el activo está en sobrecompra y deberías venderlo o ponerte corto ahora."
      - id: c
        text:
          en: "That a reversal is guaranteed the moment RSI crosses back below 70."
          es: "Que un giro está garantizado en cuanto el RSI vuelva a cruzar por debajo de 70."
      - id: d
        text:
          en: "That the RSI is broken and should be ignored completely."
          es: "Que el RSI está estropeado y hay que ignorarlo por completo."
    explanation:
      en: "Overbought means recent moves have been strongly one-sided — in a powerful trend that is normal and can persist for weeks. 'RSI > 70, so sell' fights the trend and gets you run over. The reading describes momentum; it is not a dated appointment for a reversal."
      es: "La sobrecompra significa que los movimientos recientes han sido fuertemente unilaterales, y en una tendencia potente eso es normal y puede durar semanas. 'RSI > 70, así que vender' pelea contra la tendencia y hace que te arrolle. La lectura describe el momentum; no es una cita con fecha para un giro."
  - id: why-not-a-sell
    prompt:
      en: "Why is 'RSI above 70' not, on its own, a signal to sell?"
      es: "¿Por qué 'RSI por encima de 70' no es, por sí solo, una señal para vender?"
    options:
      - id: a
        correct: true
        text:
          en: "Because in a strong trend RSI can stay overbought for days or weeks while price keeps rising; the reading shows one-sided momentum, not an imminent turn."
          es: "Porque en una tendencia fuerte el RSI puede quedarse en sobrecompra días o semanas mientras el precio sigue subiendo; la lectura muestra momentum unilateral, no un giro inminente."
      - id: b
        text:
          en: "Because 70 is too low a threshold; you should only sell once RSI is above 90."
          es: "Porque 70 es un umbral demasiado bajo; solo deberías vender cuando el RSI pase de 90."
      - id: c
        text:
          en: "It is a reliable sell signal — the moment RSI tags 70 the top is in."
          es: "Sí es una señal de venta fiable: en cuanto el RSI toca 70, el techo está puesto."
      - id: d
        text:
          en: "Because RSI only works on stocks, not on crypto."
          es: "Porque el RSI solo funciona en acciones, no en cripto."
    explanation:
      en: "An overbought RSI tells you momentum has been strongly one-sided, which in an uptrend is a sign of strength as often as exhaustion. Extremes can persist; without structure or a level to lean on, the number alone is not a trade. Moving the threshold to 90 does not fix the logic — the mistake is treating an extreme as a timing trigger."
      es: "Un RSI en sobrecompra te dice que el momentum ha sido fuertemente unilateral, lo que en una tendencia alcista es tan a menudo señal de fuerza como de agotamiento. Los extremos pueden persistir; sin estructura ni un nivel en el que apoyarse, el número por sí solo no es una operación. Mover el umbral a 90 no arregla la lógica: el error es tratar un extremo como un disparador de timing."
  - id: overbought-sell-myth
    kind: true_false
    prompt:
      en: "An RSI reading above 70 is, by itself, a signal to sell."
      es: "Una lectura del RSI por encima de 70 es, por sí sola, una señal para vender."
    answer: false
    explanation:
      en: "Overbought just means recent moves have been strongly one-sided to the upside. In a strong trend RSI can stay above 70 for weeks while price keeps rising. On its own it is context, not a sell trigger."
      es: "La sobrecompra solo significa que los movimientos recientes han sido fuertemente unilaterales al alza. En una tendencia fuerte el RSI puede quedarse por encima de 70 durante semanas mientras el precio sigue subiendo. Por sí sola es contexto, no un disparador de venta."
  - id: oversold-buy-myth
    kind: true_false
    prompt:
      en: "In a strong downtrend, an RSI below 30 is a reliable signal to buy the dip."
      es: "En una tendencia bajista fuerte, un RSI por debajo de 30 es una señal fiable para comprar la caída."
    answer: false
    explanation:
      en: "The oversold trap is the overbought one in reverse. A powerful downtrend can pin RSI below 30 for days, printing new lows the whole way; 'oversold' means one-sided selling, not that a bottom is in. Buying into it just hands your stop to the trend."
      es: "La trampa de la sobreventa es la de la sobrecompra al revés. Una tendencia bajista potente puede clavar el RSI por debajo de 30 durante días, imprimiendo nuevos mínimos todo el camino; 'sobreventa' significa venta unilateral, no que se haya puesto un suelo. Comprar ahí solo le regala tu stop a la tendencia."
  - id: reading-context
    kind: matching
    prompt:
      en: "Match each oscillator reading, in its context, to what it actually means."
      es: "Empareja cada lectura del oscilador, en su contexto, con lo que realmente significa."
    pairs:
      - id: ob-trend
        left:
          en: "RSI above 70 while a strong uptrend keeps making new highs"
          es: "RSI por encima de 70 mientras una tendencia alcista fuerte sigue haciendo nuevos máximos"
        right:
          en: "Strongly one-sided upward momentum — normal in a trend, often strength rather than a top."
          es: "Momentum al alza fuertemente unilateral: normal en una tendencia, a menudo fuerza más que un techo."
      - id: os-trend
        left:
          en: "RSI below 30, pinned for days in a strong downtrend"
          es: "RSI por debajo de 30, clavado durante días en una tendencia bajista fuerte"
        right:
          en: "Strongly one-sided selling that can persist — not a timer for a bounce."
          es: "Venta fuertemente unilateral que puede persistir: no es un cronómetro para un rebote."
      - id: ob-range
        left:
          en: "RSI overbought at the top of a well-defined range"
          es: "RSI en sobrecompra en el techo de un rango bien definido"
        right:
          en: "Meaningful context — with a resistance level to lean on, it is worth weighing."
          es: "Contexto significativo: con un nivel de resistencia en el que apoyarse, merece la pena sopesarlo."
      - id: mid
        left:
          en: "RSI hovering near 50"
          es: "RSI rondando 50"
        right:
          en: "Recent gains and losses roughly balanced — no momentum edge either way."
          es: "Ganancias y pérdidas recientes más o menos equilibradas: sin ventaja de momentum en ningún sentido."
    explanation:
      en: "The same number means different things by context. Extremes in a trend describe one-sided momentum that can persist; an extreme against a level in a range is where the reading earns its keep; near 50 there is simply no momentum edge."
      es: "El mismo número significa cosas distintas según el contexto. Los extremos en una tendencia describen un momentum unilateral que puede persistir; un extremo contra un nivel en un rango es donde la lectura se gana su sitio; cerca de 50 sencillamente no hay ventaja de momentum."
  - id: cross-in-range
    prompt:
      en: "A coin has been chopping sideways in a well-defined range for weeks. The MACD line has crossed above its signal line — the fourth such cross in that range. What is this cross worth?"
      es: "Una moneda lleva semanas moviéndose de lado en un rango bien definido. La línea MACD ha cruzado por encima de su línea de señal: el cuarto cruce de ese tipo en el rango. ¿Cuánto vale este cruce?"
    options:
      - id: a
        correct: true
        text:
          en: "Very little — in a range the MACD line saws across zero, so crosses fire repeatedly and none of them leads anywhere. This is whipsaw."
          es: "Muy poco: en un rango la línea MACD sierra el cero, así que los cruces saltan una y otra vez y ninguno lleva a ninguna parte. Esto es sierra (whipsaw)."
      - id: b
        text:
          en: "It is a strong buy — a bullish cross is a bullish cross regardless of the market it happens in."
          es: "Es una compra fuerte: un cruce alcista es un cruce alcista sea cual sea el mercado en el que ocurra."
      - id: c
        text:
          en: "It guarantees the range is about to break upward, because four crosses in a row build pressure."
          es: "Garantiza que el rango va a romper al alza, porque cuatro cruces seguidos acumulan presión."
      - id: d
        text:
          en: "Nothing can be said, because the MACD does not work on ranging markets at all."
          es: "No se puede decir nada, porque el MACD no funciona en absoluto en mercados en rango."
    explanation:
      en: "The MACD is two moving averages, so it inherits m10's whipsaw problem exactly: hand it a sideways market and its lines cross back and forth, each cross looking identical to a good one. The same bullish cross inside an established uptrend would be continuation evidence — the context, not the cross, decides. And repeated crosses do not 'build pressure'; they are what a range looks like on the indicator."
      es: "El MACD son dos medias móviles, así que hereda exactamente el problema de la sierra de m10: dale un mercado lateral y sus líneas se cruzan de un lado a otro, cada cruce igual que uno bueno. El mismo cruce alcista dentro de una tendencia alcista establecida sería evidencia de continuación: decide el contexto, no el cruce. Y los cruces repetidos no 'acumulan presión': son el aspecto que tiene un rango en el indicador."
  - id: cross-context
    kind: matching
    prompt:
      en: "Match each MACD event, in its context, to what it actually tells you."
      es: "Empareja cada evento del MACD, en su contexto, con lo que realmente te dice."
    pairs:
      - id: signal-in-trend
        left:
          en: "A bullish signal-line cross inside an established uptrend, the MACD line never reaching zero"
          es: "Un cruce alcista de la línea de señal dentro de una tendencia alcista establecida, sin que la línea MACD llegue a cero"
        right:
          en: "Continuation evidence — the pullback is over and an intact trend is resuming."
          es: "Evidencia de continuación: el retroceso ha terminado y una tendencia intacta se reanuda."
      - id: signal-in-range
        left:
          en: "The identical bullish signal-line cross inside a sideways range"
          es: "El mismo cruce alcista de la línea de señal dentro de un rango lateral"
        right:
          en: "Whipsaw — one of many crosses that lead nowhere; the same shape, worth nothing."
          es: "Sierra: uno de tantos cruces que no llevan a ninguna parte; la misma forma, sin valor."
      - id: zero-cross
        left:
          en: "The MACD line crossing zero after a long run on one side"
          es: "La línea MACD cruzando el cero tras un recorrido largo en un lado"
        right:
          en: "A regime change — the 12- and 26-EMA swapped order, confirmed late as any MA cross is."
          es: "Un cambio de régimen: la EMA de 12 y la de 26 intercambiaron su orden, confirmado con retraso como cualquier cruce de medias."
      - id: shrinking-hist
        left:
          en: "Price grinding to new highs while the histogram prints smaller and smaller bars"
          es: "El precio raspando nuevos máximos mientras el histograma imprime barras cada vez más pequeñas"
        right:
          en: "Decelerating momentum and a cross approaching — a clue to watch for, not a sell order."
          es: "Momentum que se desacelera y un cruce que se acerca: una pista que vigilar, no una orden de venta."
    explanation:
      en: "The same crossover means different things by context, exactly as the same RSI reading does. A cross with a trend behind it times something real; the identical cross in a range is noise with a shape; a zero cross is the heavier, later regime event; and a shrinking histogram is the early warning that any of them is coming."
      es: "El mismo cruce significa cosas distintas según el contexto, igual que la misma lectura del RSI. Un cruce con una tendencia detrás pone la hora a algo real; el mismo cruce en un rango es ruido con forma; un cruce de cero es el evento de régimen, más tardío y de más peso; y un histograma que se encoge es el aviso temprano de que cualquiera de ellos se acerca."
  - id: sound-use
    kind: multi_select
    prompt:
      en: "Select ALL of the sound ways to use an RSI reading."
      es: "Selecciona TODAS las formas sensatas de usar una lectura del RSI."
    options:
      - id: a
        correct: true
        text:
          en: "To describe context — overbought inside a range means more than overbought in a rip-roaring trend."
          es: "Para describir el contexto: la sobrecompra dentro de un rango significa más que la sobrecompra en una tendencia desbocada."
      - id: b
        correct: true
        text:
          en: "As confirmation of a thesis you already hold from structure and levels."
          es: "Como confirmación de una tesis que ya tienes a partir de la estructura y los niveles."
      - id: c
        correct: true
        text:
          en: "As a read on how one-sided recent momentum has been."
          es: "Como lectura de cómo de unilateral ha sido el momentum reciente."
      - id: d
        text:
          en: "As a standalone trigger: sell the moment RSI crosses above 70, buy the moment it crosses below 30."
          es: "Como disparador autónomo: vender en cuanto el RSI cruce por encima de 70 y comprar en cuanto cruce por debajo de 30."
    explanation:
      en: "RSI is for context and confirmation, not standalone triggers. Reading it as momentum, weighing it against a level, or using it to back a thesis you already have are all sound; firing trades purely off 70/30 crossings is the mistake this module keeps warning about."
      es: "El RSI es para contexto y confirmación, no para disparadores autónomos. Leerlo como momentum, sopesarlo contra un nivel o usarlo para respaldar una tesis que ya tienes son formas sensatas; disparar operaciones solo por los cruces de 70/30 es el error del que este módulo no deja de advertir."
  - id: oversold-scenario
    prompt:
      en: "A coin is in a strong, sustained downtrend and its RSI has been below 30 for over a week while price keeps making new lows. What does this tell you?"
      es: "Una moneda está en una tendencia bajista fuerte y sostenida y su RSI lleva más de una semana por debajo de 30 mientras el precio sigue haciendo nuevos mínimos. ¿Qué te dice esto?"
    options:
      - id: a
        correct: true
        text:
          en: "That selling momentum is strongly one-sided; in a strong trend RSI can stay oversold a long time, so this is not a buy signal by itself."
          es: "Que el momentum vendedor es fuertemente unilateral; en una tendencia fuerte el RSI puede quedarse en sobreventa mucho tiempo, así que esto no es por sí solo una señal de compra."
      - id: b
        text:
          en: "That the coin is oversold and cheap, so you should buy the dip now."
          es: "Que la moneda está en sobreventa y barata, así que deberías comprar la caída ahora."
      - id: c
        text:
          en: "That a bounce is guaranteed the moment RSI crosses back above 30."
          es: "Que un rebote está garantizado en cuanto el RSI vuelva a cruzar por encima de 30."
      - id: d
        text:
          en: "That the RSI is malfunctioning and should be ignored entirely."
          es: "Que el RSI está fallando y hay que ignorarlo por completo."
    explanation:
      en: "This is the overbought trap in reverse. A pinned-low RSI describes one-sided selling, which in a downtrend is normal and can last; it is not a discount and not a bottom timer. Buying purely because it looks 'oversold' catches the falling knife."
      es: "Esta es la trampa de la sobrecompra al revés. Un RSI clavado abajo describe una venta unilateral, que en una tendencia bajista es normal y puede durar; no es un descuento ni un cronómetro de suelos. Comprar solo porque parece 'sobreventa' es agarrar el cuchillo que cae."
