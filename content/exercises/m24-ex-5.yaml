# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: demo-limit
    prompt:
      en: "Paper trading validates a lot, but there is one thing it cannot test. What?"
      es: "El trading en papel valida mucho, pero hay algo que no puede probar. ¿Qué?"
    options:
      - id: a
        correct: true
        text:
          en: "The psychology — demo has no real fear, because losing play money feels nothing like losing rent."
          es: "La psicología: la demo no tiene miedo real, porque perder dinero de mentira no se parece a perder el alquiler."
      - id: b
        text:
          en: "Whether you can find setups and size correctly."
          es: "Si sabes encontrar setups y dimensionar bien."
      - id: c
        text:
          en: "Whether the plan's rules are internally consistent."
          es: "Si las reglas del plan son coherentes entre sí."
      - id: d
        text:
          en: "Nothing — demo is identical to live trading."
          es: "Nada: la demo es idéntica al trading real."
    explanation:
      en: "Demo validates the process — finding setups, sizing, following the plan — but not the trader. It has no real slippage and, crucially, no real fear. Only small real money starts testing the psychology."
      es: "La demo valida el proceso —encontrar setups, dimensionar, seguir el plan— pero no al trader. No tiene slippage real y, sobre todo, no tiene miedo real. Solo el dinero real pequeño empieza a probar la psicología."
  - id: sample-size
    prompt:
      en: "You have taken 6 trades on a new system: 4 winners, 2 losers. What can you conclude about its edge?"
      es: "Has hecho 6 operaciones con un sistema nuevo: 4 ganadoras, 2 perdedoras. ¿Qué puedes concluir sobre su ventaja?"
    options:
      - id: a
        correct: true
        text:
          en: "Almost nothing — 6 trades is noise; you need a real sample (dozens) before results mean anything (m22)."
          es: "Casi nada: 6 operaciones son ruido; necesitas una muestra real (decenas) antes de que los resultados signifiquen algo (m22)."
      - id: b
        text:
          en: "It has a proven, reliable edge — start sizing up."
          es: "Tiene una ventaja probada y fiable: empieza a subir el tamaño."
      - id: c
        text:
          en: "The win rate is exactly 66,7% forever."
          es: "El acierto es exactamente del 66,7% para siempre."
      - id: d
        text:
          en: "It is broken and should be scrapped."
          es: "Está roto y debería desecharse."
    explanation:
      en: "A tiny sample is dominated by luck: a good system easily shows early losers and a bad one early winners. Judgement waits for dozens of trades, not a handful."
      es: "Una muestra diminuta la domina la suerte: un buen sistema muestra perdedoras temprano con facilidad y uno malo, ganadoras. El juicio espera decenas de operaciones, no un puñado."
  - id: first-size
    prompt:
      en: "When you first move from demo to real money, how should you choose your position size?"
      es: "Cuando pasas por primera vez de la demo al dinero real, ¿cómo deberías elegir tu tamaño de posición?"
    options:
      - id: a
        correct: true
        text:
          en: "Small enough that a full −1R loss feels genuinely trivial to you."
          es: "Lo bastante pequeño para que una pérdida completa de −1R te resulte de verdad trivial."
      - id: b
        text:
          en: "As large as your margin allows, to make the validation worthwhile."
          es: "Tan grande como permita tu margen, para que valga la pena validar."
      - id: c
        text:
          en: "The same size a profitable trader you follow uses."
          es: "El mismo tamaño que usa un trader rentable al que sigues."
      - id: d
        text:
          en: "Whatever size wins back your demo 'losses'."
          es: "El tamaño que recupere tus «pérdidas» de la demo."
    explanation:
      en: "The first job of real money is to expose you to real emotion while decisions still cost almost nothing. Start where losing is trivial; the profit comes later, after the edge is proven."
      es: "El primer trabajo del dinero real es exponerte a emoción real mientras las decisiones aún cuestan casi nada. Empieza donde perder es trivial; el beneficio llega después, cuando la ventaja está probada."
  - id: scale-to-recover-tf
    kind: true_false
    prompt:
      en: "After a losing streak, increasing your position size to win the losses back faster is a sound way to recover."
      es: "Tras una racha perdedora, aumentar el tamaño de posición para recuperar las pérdidas más rápido es una forma sensata de recuperarse."
    answer: false
    explanation:
      en: "Scaling to recover is the losing trader's reflex and the exact inversion of the rule: size follows proven edge, never the need to win back. It turns a manageable drawdown into a blown account."
      es: "Escalar para recuperar es el reflejo del trader perdedor y la inversión exacta de la regla: el tamaño sigue a la ventaja probada, nunca a la necesidad de recuperar. Convierte una racha adversa manejable en una cuenta reventada."
  - id: when-scale-up
    prompt:
      en: "Under what condition is it appropriate to increase your trading size?"
      es: "¿Bajo qué condición es apropiado aumentar tu tamaño de operación?"
    options:
      - id: a
        correct: true
        text:
          en: "When the journal shows the edge holding over a real sample AND you are following the plan at the current size."
          es: "Cuando el diario muestra que la ventaja se mantiene sobre una muestra real Y sigues el plan al tamaño actual."
      - id: b
        text:
          en: "As soon as you have one big winning day."
          es: "En cuanto tengas un gran día ganador."
      - id: c
        text:
          en: "Whenever you feel confident."
          es: "Siempre que te sientas seguro."
      - id: d
        text:
          en: "Immediately after a loss, to recover faster."
          es: "Inmediatamente después de una pérdida, para recuperar más rápido."
    explanation:
      en: "Scale in steps, only when the record keeps proving the edge and your discipline at the current size. Each step up re-tests the psychology, because bigger positions feel different."
      es: "Escala por pasos, solo cuando el registro siga demostrando la ventaja y tu disciplina al tamaño actual. Cada escalón vuelve a probar la psicología, porque las posiciones más grandes se sienten distintas."
  - id: why-validate
    prompt:
      en: "What is the point of validating a system on demo or tiny size before trading it for real?"
      es: "¿Cuál es el sentido de validar un sistema en demo o a tamaño diminuto antes de operarlo de verdad?"
    options:
      - id: a
        correct: true
        text:
          en: "It moves the learning to where mistakes are cheap, instead of paying tuition with money you can't lose."
          es: "Traslada el aprendizaje a donde los errores son baratos, en vez de pagar la matrícula con dinero que no puedes perder."
      - id: b
        text:
          en: "It guarantees the system will be profitable live."
          es: "Garantiza que el sistema será rentable en real."
      - id: c
        text:
          en: "It is a legal requirement on most exchanges."
          es: "Es un requisito legal en la mayoría de exchanges."
      - id: d
        text:
          en: "There is no point; validation wastes time."
          es: "No tiene sentido; validar es perder el tiempo."
    explanation:
      en: "The alternative to validation is discovering whether your system works with money you cannot afford to lose. Validation is how you learn the expensive lessons cheaply."
      es: "La alternativa a validar es descubrir si tu sistema funciona con dinero que no puedes permitirte perder. Validar es como aprendes barato las lecciones caras."
  - id: validation-steps-multi
    kind: multi_select
    prompt:
      en: "Select ALL statements that describe sound validation before risking real money."
      es: "Selecciona TODAS las afirmaciones que describen una validación sensata antes de arriesgar dinero real."
    options:
      - id: a
        correct: true
        text: { en: "Trade the plan on demo or minimum size until execution is automatic.", es: "Opera el plan en demo o tamaño mínimo hasta que la ejecución sea automática." }
      - id: b
        correct: true
        text: { en: "Wait for dozens of trades before judging the edge.", es: "Espera decenas de operaciones antes de juzgar la ventaja." }
      - id: c
        correct: true
        text: { en: "Treat demo results as an optimistic ceiling (no real slippage or fear).", es: "Trata los resultados de la demo como un techo optimista (sin slippage ni miedo reales)." }
      - id: d
        text: { en: "Skip straight to full size to make validation worthwhile.", es: "Saltar directo al tamaño completo para que valga la pena validar." }
    explanation:
      en: "Validate on demo/small size, over a real sample, remembering demo flatters you. Skipping to full size is the opposite of validation — it is paying full tuition on an untested claim."
      es: "Valida en demo/tamaño pequeño, sobre una muestra real, recordando que la demo te favorece. Saltar al tamaño completo es lo contrario de validar: es pagar la matrícula completa por una afirmación sin probar."
  - id: graded-sample-split
    prompt:
      en: "Your journal has 40 trades: 12 graded 'A' averaging +1,4R and 28 graded 'B' averaging +0,1R. Does this justify raising risk to 2% on A setups?"
      es: "Tu diario tiene 40 operaciones: 12 calificadas «A» con una media de +1,4R y 28 calificadas «B» con una media de +0,1R. ¿Justifica eso subir el riesgo al 2% en los setups A?"
    options:
      - id: a
        correct: true
        text:
          en: "No — 12 trades is far too small a sample, and grading splits your record into even smaller ones. Keep grading at flat 1% and let the sample grow."
          es: "No: 12 operaciones son una muestra demasiado pequeña, y calificar parte tu registro en muestras aún menores. Sigue calificando con un 1% plano y deja crecer la muestra."
      - id: b
        text:
          en: "Yes — a 14× gap in average R is too large to be luck."
          es: "Sí: una diferencia de 14× en la R media es demasiado grande para ser suerte."
      - id: c
        text:
          en: "Yes, and you should also drop the B setups from the plan entirely."
          es: "Sí, y además deberías eliminar del plan los setups B por completo."
      - id: d
        text:
          en: "It does not matter — risk tiers are a matter of personal preference, not evidence."
          es: "Da igual: los niveles de riesgo son una cuestión de preferencia personal, no de pruebas."
    explanation:
      en: "This is m22's sample-size problem sharpened: a dozen trades can easily produce a +1,4R average by chance, and the temptation is to declare the tier ladder proven on exactly the lucky run that made you feel like a grader. Grade at a flat 1% until the per-grade samples are real."
      es: "Es el problema del tamaño de muestra de m22 agudizado: una docena de operaciones puede dar una media de +1,4R por puro azar, y la tentación es declarar la escala probada justo con la racha de suerte que te hizo sentirte capaz de calificar. Califica con un 1% plano hasta que las muestras por calificación sean reales."
  - id: validation-stages-match
    kind: matching
    prompt:
      en: "Match each stage of validating a new system to what it can and cannot prove."
      es: "Empareja cada etapa de validar un sistema nuevo con lo que puede y no puede demostrar."
    pairs:
      - id: demo
        left: { en: "Paper or demo trading", es: "Operar en papel o en demo" }
        right:
          en: "Validates the process — can you find setups, size correctly, follow the plan — but not the psychology: no real slippage and, more importantly, no real fear."
          es: "Valida el proceso (¿sabes encontrar setups, dimensionar bien, seguir el plan?), pero no la psicología: sin slippage real y, más importante, sin miedo real."
      - id: small
        left: { en: "The smallest real size the exchange allows", es: "El tamaño real más pequeño que permite el exchange" }
        right:
          en: "Starts testing the trader rather than the plan — real money introduces real fear at a low cost."
          es: "Empieza a poner a prueba al trader más que al plan: el dinero real introduce miedo real a bajo coste."
      - id: sample
        left: { en: "A handful of trades", es: "Un puñado de operaciones" }
        right:
          en: "Noise — a 60%-win system can easily show 3 losers in its first 5. You need dozens of trades, not a weekend, before results mean anything about the edge."
          es: "Ruido: un sistema con un 60% de acierto puede mostrar fácilmente 3 pérdidas en sus 5 primeras. Necesitas docenas de operaciones, no un fin de semana, antes de que los resultados digan algo sobre la ventaja."
    explanation:
      en: "Test where being wrong is free, and know what each stage is actually testing. Demo proves the mechanics; only small real money starts testing the trader."
      es: "Prueba donde equivocarse es gratis, y ten claro qué pone a prueba cada etapa. La demo demuestra la mecánica; solo el dinero real pequeño empieza a poner a prueba al trader."
