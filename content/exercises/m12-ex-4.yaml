# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: divergence-traps
    kind: multi_select
    prompt:
      en: "Which of the following are common mistakes when trading divergences?"
      es: "¿Cuáles de los siguientes son errores comunes al operar divergencias?"
    options:
      - id: a
        correct: true
        text:
          en: "Shorting a strong bull trend solely on a regular bearish divergence."
          es: "Ponerse corto en una tendencia alcista fuerte solo por divergencia bajista."
      - id: b
        correct: true
        text:
          en: "Comparing price peaks from different cycles instead of adjacent swings."
          es: "Comparar picos de ciclos distintos en vez de oscilaciones adyacentes."
      - id: c
        correct: false
        text:
          en: "Requiring the divergence to form at a key high-timeframe level."
          es: "Exigir que la divergencia se forme en un nivel clave de temporalidad alta."
      - id: d
        correct: true
        text:
          en: "Forgetting that indicators stay divergent through parabolic trends."
          es: "Olvidar que los indicadores siguen divergentes en tendencias parabólicas."
    explanation:
      en: "Indicators can stay in divergence mode for a long time in strong trends, and comparing swings that belong to different cycles fabricates patterns that were never there. Demanding a key structural level is the opposite of a mistake — it is the filter that keeps the other three from costing you."
      es: "Los indicadores pueden permanecer en divergencia mucho tiempo en tendencias fuertes, y comparar oscilaciones de ciclos distintos fabrica patrones que nunca existieron. Exigir un nivel estructural clave es lo contrario de un error: es el filtro que evita que los otros tres te cuesten dinero."

  - id: regular-vs-hidden-purpose
    kind: true_false
    prompt:
      en: "Hidden divergences are used primarily to trade trend reversals rather than trend continuations."
      es: "Las divergencias ocultas se utilizan principalmente para operar inversiones de tendencia en lugar de continuaciones."
    answer: false
    explanation:
      en: "Hidden divergences are continuation patterns that signal trend strength during pullbacks. Regular divergences signal potential trend reversals."
      es: "Las divergencias ocultas son patrones de continuación que señalan fuerza de tendencia durante retrocesos. Las divergencias regulares señalan posibles inversiones."

  - id: divergence-mistakes-match
    kind: matching
    prompt:
      en: "Match each divergence trading error to its consequence."
      es: "Empareja cada error de trading de divergencias con su consecuencia."
    pairs:
      - id: no-level
        left: { en: "Trading divergence without a key level", es: "Operar divergencia sin un nivel clave" }
        right:
          en: "High rate of false signals in mid-range noise."
          es: "Alta tasa de señales falsas en ruido a mitad de rango."
      - id: counter-parabolic
        left: { en: "Shorting a parabolic trend on divergence", es: "Vender en corto una tendencia parabólica por divergencia" }
        right:
          en: "Getting liquidated as momentum continues printing higher highs."
          es: "Ser liquidado mientras el momentum sigue marcando máximos más altos."
      - id: non-adjacent
        left: { en: "Comparing non-adjacent price swings", es: "Comparar oscilaciones de precio no adyacentes" }
        right:
          en: "Fabricating false divergence patterns across unrelated cycles."
          es: "Fabricar patrones de divergencia falsos entre ciclos no relacionados."
    explanation:
      en: "Proper divergence trading requires strict swing selection, structural level alignment, and trend awareness."
      es: "El trading correcto de divergencias requiere selección estricta de swings, alineación de niveles estructurales y conciencia de la tendencia."

  - id: parabolic-run-danger
    kind: single_choice
    prompt:
      en: "Why is shorting a parabolic crypto rally based solely on bearish divergence dangerous?"
      es: "¿Por qué es peligroso vender en corto una subida parabólica de cripto basándose solo en divergencia bajista?"
    options:
      - id: a
        text:
          en: "Because divergence indicators freeze once volume exceeds a billion USD."
          es: "Porque los indicadores se congelan si el volumen supera los mil millones."
      - id: b
        correct: true
        text:
          en: "Indicators can print divergence after divergence while price doubles."
          es: "Los indicadores pueden marcar divergencia tras divergencia mientras el precio se dobla."
      - id: c
        text:
          en: "Because exchanges close short positions automatically in parabolic rallies."
          es: "Porque los exchanges cierran los cortos automáticamente en subidas parabólicas."
      - id: d
        text:
          en: "Because a bearish divergence guarantees price will never pull back at all."
          es: "Porque una divergencia bajista garantiza que el precio no retrocederá nunca."
    explanation:
      en: "In strong trend manias, momentum indicators reset dynamically while aggressive buyers keep driving price higher — so multiple consecutive divergences can print through a 100%+ move, and each one liquidates the shorts who traded it. Nothing freezes, nothing closes your position for you, and the divergence is a real observation; it is simply not a timing tool."
      es: "En manías de tendencia fuerte, los indicadores de momentum se reinician dinámicamente mientras los compradores agresivos siguen empujando el precio, así que pueden marcarse varias divergencias consecutivas a lo largo de un movimiento del 100 % o más, y cada una liquida a quienes la operaron en corto. Nada se congela, nadie te cierra la posición, y la divergencia es una observación real: sencillamente no es una herramienta de timing."

  - id: divergence-execution-order
    kind: ordering
    prompt:
      en: "Arrange the checklist steps before placing a trade on a regular bullish divergence."
      es: "Ordena los pasos de la lista de verificación antes de colocar una operación en una divergencia alcista regular."
    items:
      - id: step-1
        position: 1
        text:
          en: "Verify price is at major high-timeframe support."
          es: "Verificar que el precio está en un soporte importante de temporalidad alta."
      - id: step-2
        position: 2
        text:
          en: "Confirm price made a Lower Low while oscillator printed a Higher Low."
          es: "Confirmar que el precio hizo un Mínimo Más Bajo mientras el oscilador marcó un Mínimo Más Alto."
      - id: step-3
        position: 3
        text:
          en: "Wait for bullish candle rejection or market structure break on lower timeframe."
          es: "Esperar el rechazo de vela alcista o la rotura de estructura en temporalidad menor."
      - id: step-4
        position: 4
        text:
          en: "Calculate position size based on Stop Loss placed below recent swing low."
          es: "Calcular el tamaño de posición basado en un Stop Loss colocado bajo el mínimo reciente."
    explanation:
      en: "Divergence provides context; level gives location; structural break gives entry; risk math calculates position size."
      es: "La divergencia da el contexto; el nivel da la ubicación; la rotura da la entrada; la matemática de riesgo calcula la posición."

  - id: divergence-volume-confirmation
    kind: single_choice
    prompt:
      en: "Why is declining volume during a new price high peak supportive of a regular bearish divergence?"
      es: "¿Por qué el volumen decreciente durante un nuevo pico de precio alto respalda una divergencia bajista regular?"
    options:
      - id: a
        correct: true
        text:
          en: "Fewer aggressive participants are behind the push to the new high."
          es: "Hay menos participantes agresivos detrás del empujón al nuevo máximo."
      - id: b
        text:
          en: "It indicates the exchange's servers are undergoing scheduled maintenance."
          es: "Indica que los servidores del exchange están en mantenimiento programado."
      - id: c
        text:
          en: "It guarantees that funding rates will turn negative in the next window."
          es: "Garantiza que las tasas de funding se volverán negativas en la próxima ventana."
      - id: d
        text:
          en: "It means the spot and perpetual prices have converged onto each other."
          es: "Significa que los precios spot y perpetuo han convergido entre sí."
    explanation:
      en: "Price reaching a new high on declining volume confirms a lack of buyer commitment, which reinforces the momentum exhaustion the oscillator is already showing. It is a second, independent witness to the same story — not a statement about infrastructure, funding, or the basis between markets."
      es: "Que el precio alcance un nuevo máximo con volumen decreciente confirma la falta de compromiso comprador, lo que refuerza el agotamiento de momentum que ya muestra el oscilador. Es un segundo testigo independiente de la misma historia, no una afirmación sobre infraestructura, funding ni la base entre mercados."

  - id: divergence-stop-placement
    kind: single_choice
    prompt:
      en: "Where is the most logical structural placement for a Stop Loss when trading a regular bullish divergence?"
      es: "¿Cuál es la ubicación estructural más lógica para un Stop Loss al operar una divergencia alcista regular?"
    options:
      - id: a
        text:
          en: "Exactly at the entry price, so that the trade carries no risk at all."
          es: "Exactamente en el precio de entrada, para que la operación no tenga riesgo."
      - id: b
        text:
          en: "Fifty percent above the resistance level you are targeting on the way up."
          es: "Un cincuenta por ciento por encima de la resistencia a la que apuntas."
      - id: c
        correct: true
        text:
          en: "Just below the Lower Low that formed the divergence pattern."
          es: "Justo por debajo del Mínimo Más Bajo que formó el patrón de divergencia."
      - id: d
        text:
          en: "On the 200 EMA of the 1-minute chart, wherever that happens to sit."
          es: "En la EMA 200 del gráfico de 1 minuto, esté donde esté."
    explanation:
      en: "If price breaks below the lowest swing point of a bullish divergence, the structural setup is invalidated and there is nothing left to be right about — so that is where the stop belongs. A stop at the entry is not a stop, a stop above the target is not risk management, and an unrelated indicator line has nothing to do with what would invalidate this idea."
      es: "Si el precio rompe por debajo del mínimo de la divergencia alcista, la configuración estructural queda invalidada y ya no queda nada en lo que tener razón: ahí es donde va el stop. Un stop en la entrada no es un stop, un stop por encima del objetivo no es gestión de riesgo, y una línea de indicador ajena no tiene nada que ver con lo que invalidaría esta idea."

  - id: triple-divergence-phenomenon
    kind: single_choice
    prompt:
      en: "What does a 'Triple Bearish Divergence' (three consecutive higher price highs with three lower indicator highs) reveal?"
      es: "¿Qué revela una 'Triple Divergencia Bajista' (tres máximos de precio altos consecutivos con tres máximos de indicador más bajos)?"
    options:
      - id: a
        correct: true
        text:
          en: "Compounding momentum exhaustion in an extended, ageing trend."
          es: "Agotamiento de momentum acumulado en una tendencia extendida y envejecida."
      - id: b
        text:
          en: "That the technical indicators on the chart have stopped updating."
          es: "Que los indicadores técnicos del gráfico han dejado de actualizarse."
      - id: c
        text:
          en: "That the market has entered a risk-free cycle of perpetual buying."
          es: "Que el mercado ha entrado en un ciclo de compra perpetua sin riesgo."
      - id: d
        text:
          en: "That the funding-rate calculation on the venue has been inverted."
          es: "Que el cálculo de la tasa de funding del venue se ha invertido."
    explanation:
      en: "Triple divergence shows repeated failed attempts by buyers to push price higher *with strength*, building pressure for a deep reversal once support finally breaks. It is still a description of momentum, not a promise about timing — which is exactly why the same pattern can print three times while a parabolic trend keeps running."
      es: "La triple divergencia muestra intentos fallidos repetidos de los compradores por empujar el precio *con fuerza*, acumulando presión para una inversión profunda cuando por fin ceda el soporte. Sigue siendo una descripción del momentum, no una promesa sobre el momento, y por eso el mismo patrón puede aparecer tres veces mientras una tendencia parabólica sigue corriendo."
