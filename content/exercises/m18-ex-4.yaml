# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: extreme-fear-print
    prompt:
      en: "The index prints an extreme reading of 8 (extreme fear). What is the correct way to use it?"
      es: "El índice marca una lectura extrema de 8 (miedo extremo). ¿Cuál es la forma correcta de usarla?"
    options:
      - id: a
        text:
          en: "Buy immediately with size — an extreme reading is a precise entry trigger."
          es: "Comprar de inmediato y con tamaño: una lectura extrema es un trigger preciso."
      - id: b
        text:
          en: "Short immediately, since fear means price will keep falling from here."
          es: "Cortar de inmediato, ya que el miedo significa que el precio seguirá cayendo."
      - id: c
        correct: true
        text:
          en: "Treat it as a contrarian zone and wait for your own confirmation."
          es: "Tratarla como zona contraria y esperar tu propia confirmación."
      - id: d
        text:
          en: "Ignore it entirely — sentiment is never useful for anything at all."
          es: "Ignorarla del todo: el sentimiento no sirve nunca para nada."
    explanation:
      en: "An extreme reading marks a contrarian zone, not a moment. Extremes can stay extreme for weeks, so buying on the number alone gets you run over — and it is certainly not an instruction to short with the crowd either. The number frames which side is dangerous; the entry still comes from structure, a level, your own confirmation."
      es: "Una lectura extrema marca una zona contraria, no un momento. Los extremos pueden seguir extremos durante semanas, así que comprar solo por el número te arrolla, y desde luego tampoco es una orden de cortar con la masa. El número enmarca qué lado es peligroso; la entrada sigue viniendo de la estructura, de un nivel, de tu propia confirmación."
  - id: zone-not-timing
    prompt:
      en: "Why is an extreme sentiment reading a zone rather than a timing trigger?"
      es: "¿Por qué una lectura extrema de sentimiento es una zona y no un trigger de timing?"
    options:
      - id: a
        correct: true
        text:
          en: "Extremes can persist for months while price keeps trending."
          es: "Los extremos pueden persistir meses mientras el precio sigue en tendencia."
      - id: b
        text:
          en: "Because the exact value, such as 90, pinpoints the top to the very day."
          es: "Porque el valor exacto, como 90, señala el techo al día concreto."
      - id: c
        text:
          en: "Because the index updates too slowly, though it still marks the turn."
          es: "Porque el índice se actualiza muy despacio, aunque marque igual el giro."
      - id: d
        text:
          en: "Because sentiment matters only in stock markets and never in crypto."
          es: "Porque el sentimiento solo importa en las bolsas y nunca en cripto."
    explanation:
      en: "Extreme greed has lasted through entire bull runs and extreme fear through long bear markets. The reading tells you the crowd is lopsided and one side is dangerous — it says nothing about the exact moment of the turn, whatever value it prints, so the timing must come from your own tools."
      es: "La codicia extrema ha durado rallies alcistas enteros y el miedo extremo, mercados bajistas largos. La lectura te dice que la masa está desequilibrada y que un lado es peligroso; no dice nada sobre el momento exacto del giro, marque el valor que marque, así que el timing debe venir de tus propias herramientas."
  - id: precise-trigger-myth
    kind: true_false
    prompt:
      en: "An extreme sentiment reading is, by itself, a precise buy or sell trigger."
      es: "Una lectura extrema de sentimiento es, por sí sola, un trigger preciso de compra o venta."
    answer: false
    explanation:
      en: "This is the classic trap. An extreme reading marks a crowded, contrarian zone — never a moment. Extremes can persist for weeks or months, so the trigger must come from your own tools: structure, a level, confirmation."
      es: "Esta es la trampa clásica. Una lectura extrema marca una zona contraria y saturada, nunca un momento. Los extremos pueden persistir semanas o meses, así que el disparador debe venir de tus propias herramientas: estructura, un nivel, confirmación."
  - id: greed-persist-scenario
    prompt:
      en: "You short the first \"extreme greed\" print at 90, but price climbs another 40% over two months while greed stays extreme. What is the lesson?"
      es: "Te pones corto en la primera lectura de \"codicia extrema\" en 90, pero el precio sube otro 40 % en dos meses mientras la codicia sigue extrema. ¿Cuál es la lección?"
    options:
      - id: a
        text:
          en: "The index lied about the state of the market and should be thrown away."
          es: "El índice mintió sobre el estado del mercado y hay que tirarlo."
      - id: b
        correct: true
        text:
          en: "Extremes persist: sentiment marks the crowded side, not the moment."
          es: "Los extremos persisten: el sentimiento marca el lado, no el momento."
      - id: c
        text:
          en: "You simply needed more leverage in order to survive the move against you."
          es: "Solo necesitabas más apalancamiento para sobrevivir al movimiento en contra."
      - id: d
        text:
          en: "Extreme greed always means the top arrives on that very same day."
          es: "La codicia extrema siempre significa que el techo llega ese mismo día."
    explanation:
      en: "Greed stayed extreme through entire bull runs. Shorting the first extreme print treats a zone as a moment — the exact mistake that gets contrarians run over. The reading itself was fine and the index was working; the timing has to come from elsewhere, and more leverage against a persisting extreme only shortens how long you survive."
      es: "La codicia se mantuvo extrema durante rallies alcistas enteros. Cortar en la primera lectura extrema trata una zona como un momento: justo el error que arrolla a los contrarios. La lectura estaba bien y el índice funcionaba; el timing tiene que venir de otro sitio, y más apalancamiento contra un extremo que persiste solo acorta lo que aguantas."
  - id: where-trigger-comes-from
    prompt:
      en: "If sentiment only tells you which side is dangerous, where does the actual entry trigger come from?"
      es: "Si el sentimiento solo te dice qué lado es peligroso, ¿de dónde viene el detonante real de entrada?"
    options:
      - id: a
        text:
          en: "From the index number crossing a round value such as 90 or 10."
          es: "De que el número del índice cruce un valor redondo como 90 o 10."
      - id: b
        text:
          en: "From whatever the loudest consensus on social media says that day."
          es: "De lo que diga ese día el consenso más ruidoso de las redes sociales."
      - id: c
        correct: true
        text:
          en: "From your own tools — structure, a level, confirmation."
          es: "De tus propias herramientas: estructura, un nivel, confirmación."
      - id: d
        text:
          en: "From the index crossing back through the midpoint at 50."
          es: "De que el índice vuelva a cruzar el punto medio en 50."
    explanation:
      en: "Sentiment is context, not a signal generator. It frames which side is crowded and risky; the decision to actually enter still has to be confirmed by your own analysis of price and structure. No threshold on the index — 90, 10 or 50 — converts a mood reading into a moment, and the loudest consensus is the crowd the reading is measuring."
      es: "El sentimiento es contexto, no un generador de señales. Enmarca qué lado está saturado y es arriesgado; la decisión de entrar de verdad todavía tiene que confirmarla tu propio análisis del precio y la estructura. Ningún umbral del índice —90, 10 o 50— convierte una lectura de ánimo en un momento, y el consenso más ruidoso es justamente la masa que la lectura está midiendo."
  - id: correct-use-of-extreme
    kind: multi_select
    prompt:
      en: "Select ALL the correct ways to use an extreme sentiment reading."
      es: "Selecciona TODAS las formas correctas de usar una lectura extrema de sentimiento."
    options:
      - id: a
        correct: true
        text:
          en: "Treat it as a contrarian zone where risk/reward starts to shift."
          es: "Tratarla como una zona contraria donde el riesgo/beneficio empieza a cambiar."
      - id: b
        correct: true
        text:
          en: "Get more careful on the crowded side — size down, tighten risk."
          es: "Ser más prudente en el lado saturado: reducir tamaño, apretar el riesgo."
      - id: c
        correct: true
        text:
          en: "Wait for your own confirmation before entering."
          es: "Esperar tu propia confirmación antes de entrar."
      - id: d
        text:
          en: "Use the exact number as an entry button the instant it prints."
          es: "Usar el número exacto como botón de entrada en cuanto aparece."
      - id: e
        text:
          en: "Short the first extreme-greed print with full size."
          es: "Cortar la primera lectura de codicia extrema con tamaño completo."
      - id: f
        text:
          en: "Assume the reading pinpoints the turn to the exact day."
          es: "Dar por hecho que la lectura señala el giro al día exacto."
    explanation:
      en: "An extreme reading is a zone, not a moment: use it to lean cautious on the crowded side and to look for setups, but let your own confirmation time the entry. Using the number as an instant entry button, shorting the first extreme print, or assuming it pinpoints the turn are all the trap that gets people run over."
      es: "Una lectura extrema es una zona, no un momento: úsala para volverte prudente en el lado saturado y para buscar setups, pero deja que tu propia confirmación marque el momento de entrar. Usar el número como botón de entrada instantáneo, cortar en la primera lectura extrema o dar por hecho que señala el giro exacto son la trampa que arrolla a la gente."
  - id: double-counting
    prompt:
      en: "A trader confirms a bullish price breakout by pointing at a rising greed reading. What is wrong with that?"
      es: "Un trader confirma una ruptura alcista del precio señalando una lectura de codicia al alza. ¿Qué falla en eso?"
    options:
      - id: a
        text:
          en: "Nothing at all — sentiment is a genuine second witness to what price says."
          es: "Nada: el sentimiento es un segundo testigo genuino de lo que dice el precio."
      - id: b
        correct: true
        text:
          en: "Half the index is price in disguise: it is one reason counted twice."
          es: "Media puntuación es precio disfrazado: es una razón contada dos veces."
      - id: c
        text:
          en: "Greed readings are always contrarian, so the breakout is bound to fail."
          es: "Las lecturas de codicia son siempre contrarias: la ruptura fallará seguro."
      - id: d
        text:
          en: "The index lags, so it should be read as bearish confirmation instead."
          es: "El índice va con retardo, así que debe leerse como confirmación bajista."
    explanation:
      en: "Volatility and momentum — both computed from price — are together about half the score, so they think they have two independent reasons when they really have one. The index is not a second witness to what price is already telling you. That does not make it a reversed signal either: it simply is not independent evidence."
      es: "La volatilidad y el momentum, ambos calculados a partir del precio, son juntos la mitad de la puntuación, así que creen tener dos razones independientes cuando solo tienen una. El índice no es un segundo testigo de lo que el precio ya te dice. Eso tampoco lo convierte en una señal invertida: sencillamente no es evidencia independiente."
  - id: sentiment-role-match
    kind: matching
    prompt:
      en: "Match each tool to the question it can actually answer."
      es: "Empareja cada herramienta con la pregunta que puede responder realmente."
    pairs:
      - id: sent
        left: { en: "A sentiment extreme", es: "Un extremo de sentimiento" }
        right:
          en: "Which side is dangerous — how crowded and one-sided the mood is right now."
          es: "Qué lado es peligroso: lo saturado y unilateral que está el ánimo ahora mismo."
      - id: struct
        left: { en: "Structure, a level, confirmation", es: "Estructura, un nivel, confirmación" }
        right:
          en: "When to act — the actual entry trigger."
          es: "Cuándo actuar: el detonante real de entrada."
      - id: zone
        left: { en: "The contrarian zone itself", es: "La zona contraria en sí" }
        right:
          en: "A region where the odds and risk/reward start to shift — never a moment."
          es: "Una región donde las probabilidades y el riesgo/beneficio empiezan a cambiar; nunca un momento."
    explanation:
      en: "Sentiment tells you which side is dangerous; it never tells you when. The trigger has to come from your own tools."
      es: "El sentimiento te dice qué lado es peligroso; nunca te dice cuándo. El trigger tiene que venir de tus propias herramientas."
  - id: size-for-extremes
    kind: true_false
    prompt:
      en: "Because the odds have shifted at an extreme reading, a full-size contrarian position is justified there."
      es: "Como las probabilidades han cambiado en una lectura extrema, ahí se justifica una posición contraria a tamaño completo."
    answer: false
    explanation:
      en: "An extreme can deepen and stay extreme for a long time, and a fixed-size contrarian bet placed *at* the extreme has to survive all of it. Size for the fact that the extreme can get more extreme."
      es: "Un extremo puede profundizarse y mantenerse mucho tiempo, y una apuesta contraria de tamaño fijo colocada *en* el extremo tiene que sobrevivir a todo ello. Dimensiona partiendo de que el extremo puede volverse más extremo."
