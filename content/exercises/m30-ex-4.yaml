# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: cvd-divergence-order
    kind: ordering
    prompt:
      en: "Sequence the steps to identify a bearish CVD (Cumulative Volume Delta) divergence."
      es: "Ordena los pasos para identificar una divergencia bajista de CVD (Delta de Volumen Acumulado)."
    items:
      - id: step-1
        position: 1
        text:
          en: "Price prints a Higher High at a resistance level."
          es: "El precio marca un Máximo Más Alto en un nivel de resistencia."
      - id: step-2
        position: 2
        text:
          en: "CVD prints a Lower High over the exact same timeframe."
          es: "El CVD marca un Máximo Más Bajo durante el mismo marco temporal."
      - id: step-3
        position: 3
        text:
          en: "Deduce that aggressive buyers are exhausting while passive sellers absorb the rally."
          es: "Deducir que los compradores agresivos se agotan mientras vendedores pasivos absorben la subida."
      - id: step-4
        position: 4
        text:
          en: "Look for price breakdown below local market structure as trade confirmation."
          es: "Buscar la rotura del precio por debajo de la estructura local como confirmación."
    explanation:
      en: "When price makes Higher Highs but CVD fails to follow, aggressive buying power is fading into passive selling resistance."
      es: "Cuando el precio hace Máximos Más Altos pero el CVD no lo sigue, la fuerza compradora se agota contra la resistencia pasiva."

  - id: cvd-behavior-truth
    kind: true_false
    prompt:
      en: "CVD measures the total number of limit orders resting on the order book."
      es: "El CVD mide el número total de órdenes límite en el libro de órdenes."
    answer: false
    explanation:
      en: "CVD tracks the cumulative difference between aggressive buy market orders and aggressive sell market orders executed over time. Resting limit orders are the order book — intention rather than executed flow."
      es: "El CVD rastrea la diferencia acumulada entre órdenes de compra a mercado y órdenes de venta a mercado ejecutadas a lo largo del tiempo. Las órdenes límite en reposo son el libro: intención, no flujo ejecutado."

  - id: cvd-divergence-match
    kind: matching
    prompt:
      en: "Match each CVD market condition to its order flow interpretation."
      es: "Empareja cada condición de mercado de CVD con su interpretación de flujo de órdenes."
    pairs:
      - id: bull-div
        left: { en: "Price Lower Low + CVD Higher Low", es: "Precio Mínimo Más Bajo + CVD Mínimo Más Alto" }
        right:
          en: "Bullish Divergence: Aggressive selling pressure is decreasing at the support level."
          es: "Divergencia Alcista: La presión vendedora agresiva disminuye en el nivel de soporte."
      - id: bear-div
        left: { en: "Price Higher High + CVD Lower High", es: "Precio Máximo Más Alto + CVD Máximo Más Bajo" }
        right:
          en: "Bearish Divergence: Aggressive buying pressure is decreasing at the resistance level."
          es: "Divergencia Bajista: La presión compradora agresiva disminuye en el nivel de resistencia."
      - id: absorption-bear
        left: { en: "Price Flat + CVD Spiking High", es: "Precio Plano + CVD Subiendo Fuerte" }
        right:
          en: "Passive Bearish Absorption: Heavy buy aggression absorbed by limit sell wall."
          es: "Absorción Bajista Pasiva: Fuerte agresión compradora absorbida por muro de venta límite."
    explanation:
      en: "CVD reveals whether volume aggression is aligned with price movement or being absorbed by passive liquidity."
      es: "El CVD revela si la agresión de volumen está alineada con el movimiento de precio o siendo absorbida por liquidez pasiva."

  - id: cvd-multi-timeframe
    kind: multi_select
    prompt:
      en: "Select all valid principles when reading CVD across different venues and timeframes."
      es: "Selecciona todos los principios válidos al leer el CVD en diferentes venues y temporalidades."
    options:
      - id: a
        correct: true
        text:
          en: "Spot and perp CVD can diverge, since perps carry leveraged flow."
          es: "El CVD spot y el de perps pueden divergir por el apalancamiento."
      - id: b
        correct: true
        text:
          en: "Higher timeframe CVD divergences are structurally more reliable."
          es: "Las divergencias de CVD en marcos mayores son más fiables."
      - id: c
        correct: false
        text:
          en: "A 1-minute CVD should be relied on to predict multi-week trend reversals."
          es: "Hay que fiarse del CVD de 1 minuto para prever giros de varias semanas."
      - id: d
        correct: true
        text:
          en: "Aggregating exchanges smooths out single-venue reporting anomalies."
          es: "Agregar exchanges suaviza las anomalías de reporte de un solo venue."
    explanation:
      en: "Perps vs spot CVD comparisons and higher timeframe alignment give robust market structure context. A minute of flow is a minute of flow: read CVD at the timeframe you intend to trade, and never let a one-minute divergence carry a multi-week thesis."
      es: "Las comparaciones de CVD perps vs spot y la alineación de temporalidades mayores dan un contexto sólido de estructura de mercado. Un minuto de flujo es un minuto de flujo: lee el CVD en la temporalidad que piensas operar y nunca dejes que una divergencia de un minuto sostenga una tesis de semanas."

  - id: cvd-absorption-read
    kind: single_choice
    prompt:
      en: "What does it mean when CVD makes a sharp new high while price fails to breach key resistance?"
      es: "¿Qué significa cuando el CVD hace un nuevo máximo brusco mientras el precio no logra superar una resistencia clave?"
    options:
      - id: a
        text:
          en: "Aggressive buyers have exhausted the resting sell orders at that level."
          es: "Los compradores agresivos ya agotaron las ventas límite del nivel."
      - id: b
        correct: true
        text:
          en: "Passive sellers are absorbing the aggressive buyers at resistance."
          es: "Vendedores pasivos absorben la compra agresiva en la resistencia."
      - id: c
        text:
          en: "Every limit sell order has been pulled from the book at resistance."
          es: "Todas las órdenes límite de venta se han retirado del libro."
      - id: d
        text:
          en: "The CVD is stale: it will re-sync once price clears resistance."
          es: "El CVD está desfasado: se resincronizará al superar la resistencia."
    explanation:
      en: "High-volume buying unable to push price higher indicates limit order absorption at resistance — and it is the opposite of exhausted sellers: the sell orders are winning, which is exactly why price will not move. That creates reversal risk in the absorber's direction, a clue rather than a receipt."
      es: "Compras de alto volumen incapaces de empujar el precio más arriba indican absorción con órdenes límite en la resistencia, y es lo contrario de vendedores agotados: las órdenes de venta están ganando, y por eso el precio no se mueve. Eso crea riesgo de giro en la dirección de quien absorbe: una pista, no un recibo."

  - id: spot-vs-perp-cvd-divergence
    kind: single_choice
    prompt:
      en: "What does it indicate when Spot CVD is rising steadily while Perp CVD is falling?"
      es: "¿Qué indica cuando el CVD Spot sube de forma constante mientras el CVD Perp está cayendo?"
    options:
      - id: a
        text:
          en: "Perp traders are taking profit into spot buyers, so the rally is over."
          es: "Los perps toman beneficio contra compradores spot, la subida acabó."
      - id: b
        text:
          en: "The two feeds disagree, which means one venue is misreporting its delta."
          es: "Los dos feeds discrepan: un venue está reportando mal su delta."
      - id: c
        text:
          en: "Funding has gone negative, which mechanically pushes perp CVD down."
          es: "El funding se ha vuelto negativo, lo que baja el CVD perp."
      - id: d
        correct: true
        text:
          en: "Spot is being accumulated while leveraged traders short or get liquidated."
          es: "Se acumula spot mientras los apalancados cortan o son liquidados."
    explanation:
      en: "Spot CVD represents genuine demand for the asset without leverage, which is why spot-led rallies are structurally stronger than perp-led ones. The two series measuring different populations is the point, not a data fault — and funding is a consequence of positioning, not a mechanism that moves a CVD line."
      es: "El CVD Spot representa demanda real del activo sin apalancamiento, y por eso las subidas lideradas por spot son estructuralmente más fuertes que las lideradas por perpetuos. Que las dos series midan poblaciones distintas es el sentido del ejercicio, no un fallo de datos; y el funding es consecuencia del posicionamiento, no un mecanismo que mueva una línea de CVD."

  - id: cvd-breakout-fakeout-read
    kind: single_choice
    prompt:
      en: "How can CVD help identify a fakeout at a key price resistance level?"
      es: "¿Cómo puede ayudar el CVD a identificar un fakeout en un nivel clave de resistencia de precio?"
    options:
      - id: a
        correct: true
        text:
          en: "Price breaks resistance on declining CVD — thin liquidity, not buying."
          es: "El precio rompe con CVD decreciente: liquidez fina, no compra."
      - id: b
        text:
          en: "The CVD flips its colour from green to red the moment a fakeout starts."
          es: "El CVD cambia de verde a rojo en cuanto empieza el fakeout."
      - id: c
        text:
          en: "A fakeout always shows a CVD spike, so a flat CVD rules one out."
          es: "Un fakeout siempre da un pico de CVD, y un CVD plano lo descarta."
      - id: d
        text:
          en: "CVD cannot see breakouts, since it only accumulates inside a range."
          es: "El CVD no ve roturas, ya que solo acumula dentro de un rango."
    explanation:
      en: "A breakout that clears resistance without aggressive buying behind it moved because there was nothing in the way, not because anyone wanted the price — so it is prone to immediate rejection once passive liquidity steps back in. This is m14's low-volume-breakout warning made visible: the CVD shows you the missing aggression instead of leaving you to infer it."
      es: "Una rotura que supera la resistencia sin compra agresiva detrás se movió porque no había nada delante, no porque alguien quisiera ese precio, así que es propensa a un rechazo inmediato en cuanto la liquidez pasiva vuelve. Es la advertencia de m14 sobre roturas con poco volumen hecha visible: el CVD te enseña la agresión que falta en vez de dejarte deducirla."

  - id: cvd-reset-misconception
    kind: single_choice
    prompt:
      en: "Why is the absolute numerical value of CVD less important than its relative slope and swing pattern?"
      es: "¿Por qué el valor numérico absoluto del CVD es menos importante que su pendiente relativa y patrón de swings?"
    options:
      - id: a
        text:
          en: "Exchange APIs re-baseline the CVD every hour, so the number resets."
          es: "Las API de los exchanges rebasan el CVD cada hora y se reinicia."
      - id: b
        correct: true
        text:
          en: "CVD accumulates from an arbitrary start, so only the shape carries."
          es: "El CVD acumula desde un inicio arbitrario: solo la forma vale."
      - id: c
        text:
          en: "CVD is denominated in coins, so the number changes with price."
          es: "El CVD se denomina en monedas, así que cambia con el precio."
      - id: d
        text:
          en: "The absolute value is only meaningful on spot, never on perps."
          es: "El valor absoluto solo tiene sentido en spot, nunca en perps."
    explanation:
      en: "CVD starting values depend on when recording began — nobody randomises them and no denomination trick is involved. The key information is whether delta is making higher or lower swings relative to price, which is why the pane rarely has a meaningful zero of its own."
      es: "Los valores iniciales del CVD dependen de cuándo comenzó la grabación: nadie los aleatoriza y no hay ningún truco de denominación. La información clave es si el delta hace swings más altos o más bajos en relación al precio, y por eso el panel raramente tiene un cero propio con significado."
