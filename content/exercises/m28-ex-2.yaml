type: quiz
variants:
  - id: hidden-degree-of-freedom
    prompt:
      en: "A trader tunes the RSI period, adds a volume filter and excludes Mondays, and the backtested curve improves at every step. What has actually been added?"
      es: "Un trader ajusta el periodo del RSI, añade un filtro de volumen y excluye los lunes, y la curva del backtest mejora en cada paso. ¿Qué se ha añadido en realidad?"
    options:
      - id: a
        text:
          en: "Three independent confirmations, which is the confluence m14 asks for."
          es: "Tres confirmaciones independientes, que es la confluencia que pide m14."
      - id: b
        text:
          en: "Robustness: a system with more conditions takes fewer bad trades."
          es: "Robustez: un sistema con más condiciones toma menos malas operaciones."
      - id: c
        text:
          en: "Nothing at all — filters neither help nor hurt a backtested result."
          es: "Nada en absoluto: los filtros ni ayudan ni perjudican a un backtest."
      - id: d
        correct: true
        text:
          en: "Three more degrees of freedom for the past to agree with him."
          es: "Tres grados de libertad más para que el pasado le dé la razón."
    explanation:
      en: "Every parameter is a knob, and a rule with enough knobs can describe any history perfectly — including one generated by dice. The improvement is not evidence the system got better; it is evidence that the fit got tighter, which is the opposite thing. 'No Mondays' is the giveaway: a condition with no mechanism behind it is fitted noise wearing a rule's clothes."
      es: "Cada parámetro es un mando, y una regla con mandos suficientes puede describir a la perfección cualquier histórico, incluido uno generado con dados. La mejora no es prueba de que el sistema haya mejorado: es prueba de que el ajuste se ha apretado, que es lo contrario. «Los lunes no» es la pista: una condición sin ningún mecanismo detrás es ruido ajustado disfrazado de regla."
  - id: train-test
    prompt:
      en: "You tuned the system on 2022 data. What is the point of running the frozen rules over 2023 without touching them?"
      es: "Has ajustado el sistema con datos de 2022. ¿Para qué sirve pasar las reglas congeladas por 2023 sin tocarlas?"
    options:
      - id: a
        correct: true
        text:
          en: "It asks whether the rules work on data they were never allowed to see."
          es: "Pregunta si las reglas funcionan en datos que nunca se les dejó ver."
      - id: b
        text:
          en: "It doubles the sample, which halves the error band on the win rate."
          es: "Duplica la muestra, lo que reduce a la mitad la banda de error."
      - id: c
        text:
          en: "It checks the rules still make sense in a more recent market regime."
          es: "Comprueba que las reglas siguen teniendo sentido en un régimen más reciente."
      - id: d
        text:
          en: "It is a formality — if the rules are sound the second half adds nothing."
          es: "Es un trámite: si las reglas son buenas, la segunda mitad no aporta nada."
    explanation:
      en: "A system that only wins where it was allowed to look is not a system, it is a description of the past. Splitting the history is what makes the difference visible: the first half is where the knobs may move, the second half is the question. It is not simply more sample — data you have already fitted to cannot test you, which is also why the test half is spent the first time you use it to CHOOSE between variants."
      es: "Un sistema que solo gana donde se le dejó mirar no es un sistema, es una descripción del pasado. Partir el histórico es lo que hace visible la diferencia: la primera mitad es donde los mandos pueden moverse, la segunda es la pregunta. No es simplemente más muestra: unos datos a los que ya has ajustado no pueden ponerte a prueba, y por eso mismo la mitad de prueba se gasta la primera vez que la usas para ELEGIR entre variantes."
  - id: rules-first
    kind: true_false
    prompt:
      en: "It is fine to write the exact entry rules down after walking the chart, as long as you are honest with yourself about what you would have taken."
      es: "No pasa nada por escribir las reglas exactas de entrada después de recorrer el gráfico, siempre que seas honesto contigo mismo sobre lo que habrías tomado."
    answer: false
    explanation:
      en: "Honesty is not the missing ingredient — an eye that has seen the outcome cannot unsee it, and the rule you write afterwards is shaped by the move you already watched. That is m15-l1's redrawn trendline in another form: something adjusted until it fits will fit forever and predict nothing. The rules go on paper first, and the chart advances one candle at a time with the right-hand side hidden."
      es: "La honestidad no es el ingrediente que falta: un ojo que ha visto el desenlace no puede dejar de verlo, y la regla que escribes después queda moldeada por el movimiento que ya has visto. Es la línea de tendencia redibujada de m15-l1 en otra forma: algo que se ajusta hasta encajar encajará siempre y no predecirá nada. Las reglas van al papel primero, y el gráfico avanza vela a vela con el lado derecho tapado."
  - id: backtest-lies
    kind: multi_select
    prompt:
      en: "Select ALL the things that make a backtested result better than the system really is."
      es: "Selecciona TODO lo que hace que un backtest salga mejor de lo que el sistema es de verdad."
    options:
      - id: a
        correct: true
        text:
          en: "Reading a candle's close before that candle had closed."
          es: "Leer el cierre de una vela antes de que esa vela hubiera cerrado."
      - id: b
        correct: true
        text:
          en: "Testing only coins that still exist and still trade today."
          es: "Probar solo con monedas que hoy siguen existiendo y cotizando."
      - id: c
        correct: true
        text:
          en: "Assuming every stop and entry filled at exactly its price."
          es: "Suponer que cada stop y cada entrada se ejecutaron a su precio exacto."
      - id: d
        correct: true
        text:
          en: "Keeping the one variation out of fifty that also passed the test half."
          es: "Quedarse con la variante de cincuenta que también pasó la mitad de prueba."
      - id: e
        text:
          en: "Logging every trade in R rather than in currency."
          es: "Anotar cada operación en R en lugar de en divisa."
    explanation:
      en: "Look-ahead, survivorship, ignored frictions and choosing on the test half all flatter the result, and none of them leaves a trace in the equity curve — which is why they have to be designed out rather than spotted afterwards. Logging in R is just m27's bookkeeping; it changes nothing about the result, it only makes trades of different sizes comparable."
      es: "El look-ahead, el sesgo de supervivencia, las fricciones ignoradas y elegir usando la mitad de prueba halagan todos el resultado, y ninguno deja rastro en la curva de capital: por eso hay que diseñarlos fuera en lugar de detectarlos después. Anotar en R es simplemente la contabilidad de m27; no cambia el resultado, solo hace comparables operaciones de tamaños distintos."
