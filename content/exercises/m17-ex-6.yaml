# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: phases-order
    kind: ordering
    prompt:
      en: "Put the four phases of a squeeze in order, first to last."
      es: "Ordena las cuatro fases de un squeeze, de la primera a la última."
    items:
      - id: build
        position: 1
        text:
          en: "Build — one leveraged side crowds in, funding goes one-sided, OI climbs."
          es: "Acumulación: un lado apalancado se amontona, el funding se vuelve unilateral, el OI sube."
      - id: trig
        position: 2
        text:
          en: "Trigger — price reaches the cluster and the first liquidations fire."
          es: "Disparo: el precio alcanza el clúster y se disparan las primeras liquidaciones."
      - id: casc
        position: 3
        text:
          en: "Cascade — each forced close pushes price into the next cluster of forced closes."
          es: "Cascada: cada cierre forzoso empuja el precio hasta el siguiente clúster de cierres forzosos."
      - id: exh
        position: 4
        text:
          en: "Exhaustion — the crowded side empties and the move stalls or snaps back."
          es: "Agotamiento: el lado concurrido se vacía y el movimiento se estanca o rebota."
    explanation:
      en: "A squeeze loads before it fires: a crowded, leveraged side builds (1), price reaching the cluster triggers the first liquidations (2), those forced closes cascade into more (3), and once the crowded side is emptied the mechanical move exhausts (4)."
      es: "Un squeeze se carga antes de dispararse: un lado concurrido y apalancado se acumula (1), el precio al alcanzar el clúster dispara las primeras liquidaciones (2), esos cierres forzosos forman una cascada de más (3) y, una vez vaciado el lado concurrido, el movimiento mecánico se agota (4)."
  - id: exhaustion-tell
    prompt:
      en: "A short squeeze has run 15% in an hour and is still climbing. Which reading tells you it is reaching exhaustion rather than starting a trend?"
      es: "Un short squeeze ha subido un 15% en una hora y sigue trepando. ¿Qué lectura te dice que se acerca al agotamiento en vez de empezar una tendencia?"
    options:
      - id: a
        correct: true
        text:
          en: "The funding that was deeply negative has flipped positive and open interest has fallen as those shorts were closed out — the forced buyers behind price are gone."
          es: "El funding, que estaba muy negativo, se ha vuelto positivo y el interés abierto ha caído a medida que esos cortos se cerraban: los compradores forzosos que había detrás del precio han desaparecido."
      - id: b
        text:
          en: "The speed of the move itself — 15% in an hour confirms real conviction."
          es: "La velocidad del movimiento en sí: un 15% en una hora confirma convicción real."
      - id: c
        text:
          en: "Price printing new highs on the largest volume of the day."
          es: "El precio marcando nuevos máximos con el mayor volumen del día."
      - id: d
        text:
          en: "The liquidation map showing a fresh cluster of shorts above current price."
          es: "El mapa de liquidaciones mostrando un clúster nuevo de cortos por encima del precio actual."
    explanation:
      en: "The fuel was forced buying from a finite pool, so the tell is the pool emptying: funding flipping sign and open interest falling as those positions are closed. Volume proves nothing — forced flow prints volume too — and a cluster still above price is fuel, not exhaustion."
      es: "El combustible era compra forzosa de una reserva finita, así que la señal es que esa reserva se vacía: el funding cambiando de signo y el interés abierto cayendo a medida que se cierran esas posiciones. El volumen no prueba nada (el flujo forzoso también imprime volumen) y un clúster todavía por encima del precio es combustible, no agotamiento."
  - id: durable-trend-myth
    kind: true_false
    prompt:
      en: "A squeeze is a durable new trend: once it starts, you can safely hold in its direction for weeks."
      es: "Un squeeze es una nueva tendencia duradera: una vez que empieza, puedes mantener con seguridad en su dirección durante semanas."
    answer: false
    explanation:
      en: "A squeeze is a mechanical cascade of forced closes drawn from a finite, crowded side. When that side is emptied there is no forced flow left, so the move exhausts and usually snaps back — it is the opposite of a durable trend."
      es: "Un squeeze es una cascada mecánica de cierres forzosos que sale de un lado concurrido y finito. Cuando ese lado se vacía no queda flujo forzado, así que el movimiento se agota y normalmente rebota: es lo contrario de una tendencia duradera."
  - id: phase-match
    kind: matching
    prompt:
      en: "Match each phase of a squeeze to what happens in it."
      es: "Empareja cada fase de un squeeze con lo que ocurre en ella."
    pairs:
      - id: bld
        left:
          en: "Build"
          es: "Acumulación"
        right:
          en: "The crowded, leveraged side loads up (one-sided funding, rising OI)"
          es: "El lado concurrido y apalancado se carga (funding unilateral, OI que sube)"
      - id: trg
        left:
          en: "Trigger"
          es: "Disparo"
        right:
          en: "Price reaches the cluster and the first liquidations fire"
          es: "El precio alcanza el clúster y se disparan las primeras liquidaciones"
      - id: csc
        left:
          en: "Cascade"
          es: "Cascada"
        right:
          en: "Forced closes push price into the next cluster of forced closes"
          es: "Los cierres forzosos empujan el precio hasta el siguiente clúster de cierres forzosos"
      - id: exs
        left:
          en: "Exhaustion"
          es: "Agotamiento"
        right:
          en: "The crowded side is emptied and the move stalls or snaps back"
          es: "El lado concurrido se vacía y el movimiento se estanca o rebota"
    explanation:
      en: "The four phases are distinct: fuel is loaded (build), the first forced closes fire (trigger), they feed on each other (cascade), and the finite crowded side runs out (exhaustion). Knowing which phase you are in is the whole point — the danger and the edge are in different phases."
      es: "Las cuatro fases son distintas: se carga el combustible (acumulación), se disparan los primeros cierres forzosos (disparo), se alimentan entre sí (cascada) y el lado concurrido y finito se acaba (agotamiento). Saber en qué fase estás es lo importante: el peligro y el filo están en fases diferentes."
  - id: chasing-trap
    prompt:
      en: "ETH just ran 15% straight up in an hour on a short squeeze and sits at the highs. A beginner buys, expecting the trend to continue. What is the flaw?"
      es: "ETH acaba de subir un 15% de golpe en una hora por un short squeeze y está en máximos. Un principiante compra esperando que la tendencia continúe. ¿Cuál es el fallo?"
    options:
      - id: a
        correct: true
        text:
          en: "The move was forced buying from a finite pool of shorts that is now nearly empty; buying here is buying just as the mechanical bid disappears."
          es: "El movimiento era compra forzada de una bolsa finita de cortos que ahora está casi vacía; comprar aquí es comprar justo cuando la demanda mecánica desaparece."
      - id: b
        text:
          en: "There is no flaw — a 15% move in an hour confirms a strong uptrend worth joining."
          es: "No hay fallo: un movimiento del 15% en una hora confirma una tendencia alcista fuerte a la que vale la pena sumarse."
      - id: c
        text:
          en: "The only risk is that trading fees are higher during volatile periods."
          es: "El único riesgo es que las comisiones de trading son más altas en periodos volátiles."
      - id: d
        text:
          en: "Squeezes always continue the next day, so the entry is just slightly early."
          es: "Los squeezes siempre continúan al día siguiente, así que la entrada es solo un poco temprana."
    explanation:
      en: "Chasing a spent squeeze is the classic trap. The violent leg was mechanical — forced buying from a crowded short side that is now emptied. Buying the top means providing the liquidity that early longs take profit into, right as the forced bid runs out. The move that looked strongest was ending."
      es: "Perseguir un squeeze gastado es la trampa clásica. El tramo violento era mecánico: compra forzada de un lado corto concurrido que ahora está vacío. Comprar el techo significa aportar la liquidez con la que los primeros largos toman ganancias, justo cuando la demanda forzada se acaba. El movimiento que parecía más fuerte estaba terminando."
  - id: forced-direction
    kind: matching
    prompt:
      en: "Match each event to the forced order flow it creates."
      es: "Empareja cada evento con el flujo de órdenes forzadas que crea."
    pairs:
      - id: sfc
        left:
          en: "A short being force-closed"
          es: "Un corto que se cierra por la fuerza"
        right:
          en: "Buys to close, pushing price up"
          es: "Compra para cerrar, empujando el precio hacia arriba"
      - id: lfc
        left:
          en: "A long being force-closed"
          es: "Un largo que se cierra por la fuerza"
        right:
          en: "Sells to close, pushing price down"
          es: "Vende para cerrar, empujando el precio hacia abajo"
      - id: emt
        left:
          en: "The crowded side fully emptied"
          es: "El lado concurrido totalmente vaciado"
        right:
          en: "Forced flow stops; price tends to stall or snap back"
          es: "El flujo forzado se detiene; el precio tiende a estancarse o rebotar"
    explanation:
      en: "A liquidation forces an order in the painful direction: closing a short is a forced buy (lifts price), closing a long is a forced sell (drops price). When the crowded side is gone, that forced flow disappears — which is exactly why the cascade exhausts and often reverses."
      es: "Una liquidación fuerza una orden en la dirección dolorosa: cerrar un corto es una compra forzada (sube el precio), cerrar un largo es una venta forzada (baja el precio). Cuando el lado concurrido desaparece, ese flujo forzado se acaba: por eso justamente la cascada se agota y a menudo se da la vuelta."
  - id: fuel-tf
    kind: true_false
    prompt:
      en: "A short squeeze keeps running only while there are crowded shorts left to force-close; once that side is emptied it tends to stall or reverse."
      es: "Un short squeeze sigue corriendo solo mientras quedan cortos concurridos que cerrar por la fuerza; una vez vaciado ese lado, tiende a estancarse o darse la vuelta."
    answer: true
    explanation:
      en: "The forced buying that drives a short squeeze comes from short positions being liquidated — a finite pool. When it is exhausted there is nothing forced left to lift price, so the mechanical move stalls and frequently snaps back."
      es: "La compra forzada que impulsa un short squeeze viene de posiciones cortas que se liquidan: una bolsa finita. Cuando se agota no queda nada forzado que suba el precio, así que el movimiento mecánico se estanca y con frecuencia rebota."
  - id: eth-squeeze-numbers
    prompt:
      en: "ETH bled for days with deeply negative funding and rising OI. Spot buying lifts it through 3,000, and short liquidation shelves at 3,050, 3,150 and 3,300 fire in turn — ETH runs to 3,450 in under an hour on no news. What was that move?"
      es: "ETH sangró durante días con funding muy negativo y OI creciente. Compras en spot lo elevan por encima de 3.000, y las plataformas de liquidación de cortos en 3.050, 3.150 y 3.300 se disparan una tras otra: ETH sube a 3.450 en menos de una hora sin noticias. ¿Qué fue ese movimiento?"
    options:
      - id: a
        correct: true
        text:
          en: "About 15% of the crowded short side being emptied by forced buying — mechanics, not fresh conviction."
          es: "Alrededor de un 15% del lado corto saturado siendo vaciado por compra forzosa: mecánica, no convicción nueva."
      - id: b
        text:
          en: "A durable new uptrend, confirmed by the speed of the move."
          es: "Una nueva tendencia alcista duradera, confirmada por la velocidad del movimiento."
      - id: c
        text: { en: "Spot demand alone, since the buying started in spot.", es: "Solo demanda spot, ya que la compra empezó en spot." }
      - id: d
        text:
          en: "A long squeeze, because price moved violently."
          es: "Un long squeeze, porque el precio se movió con violencia."
    explanation:
      en: "By 3,450 the crowded shorts are gone and funding has flipped positive. With no forced buyers left behind price, it stalls and bleeds back toward 3,150 — the violent leg was mechanical, and mechanics run out."
      es: "En 3.450 los cortos saturados han desaparecido y el funding se ha vuelto positivo. Sin compradores forzosos detrás del precio, se estanca y retrocede hacia 3.150: el tramo violento era mecánico, y la mecánica se agota."
  - id: crypto-cascade-facts
    kind: multi_select
    prompt:
      en: "Select ALL the reasons cascades run further in crypto than in other leveraged markets."
      es: "Selecciona TODAS las razones por las que las cascadas van más lejos en cripto que en otros mercados apalancados."
    options:
      - id: a
        correct: true
        text:
          en: "24/7 trading — no overnight pause to let a crowded position cool off, so cascades fire at 3am and run unopposed."
          es: "Operar 24/7: no hay pausa nocturna que enfríe una posición saturada, así que las cascadas se disparan a las 3 de la madrugada y corren sin oposición."
      - id: b
        correct: true
        text:
          en: "Extreme leverage puts liquidation prices right next to entry, so clusters are dense and go off on tiny moves."
          es: "El apalancamiento extremo sitúa los precios de liquidación junto a la entrada, así que los grupos son densos y se disparan con movimientos mínimos."
      - id: c
        correct: true
        text:
          en: "Thin books — weekends, holidays and small-cap alts — mean the same forced flow moves price much further."
          es: "Los libros finos (fines de semana, festivos y alts pequeñas) hacen que el mismo flujo forzoso mueva mucho más el precio."
      - id: d
        text:
          en: "Exchanges halt trading during cascades, which concentrates the move."
          es: "Los exchanges detienen la negociación durante las cascadas, lo que concentra el movimiento."
      - id: e
        text:
          en: "Forced orders are limit orders, which stack the book in the direction of the move."
          es: "Las órdenes forzosas son órdenes límite, que apilan el libro en la dirección del movimiento."
    explanation:
      en: "The wick overshoots because there was nothing there to absorb it. All three conditions push the same way: dense fuel, no pause, and nothing to stop the flow."
      es: "La mecha se excede porque no había nada que la absorbiera. Las tres condiciones empujan en la misma dirección: combustible denso, sin pausa y sin nada que frene el flujo."
  - id: fade-not-chase
    prompt:
      en: "A squeeze is running right now. What is the honest edge — and what if you cannot tell which phase you are in?"
      es: "Un squeeze está en marcha ahora mismo. ¿Cuál es la ventaja honesta, y qué hacer si no sabes en qué fase estás?"
    options:
      - id: a
        correct: true
        text:
          en: "Fade exhaustion, never chase the cascade — and if you cannot tell which phase you are in, the correct trade is none."
          es: "Operar contra el agotamiento, nunca perseguir la cascada, y si no sabes en qué fase estás, la operación correcta es ninguna."
      - id: b
        text:
          en: "Chase the cascade — momentum this strong tends to continue for days."
          es: "Perseguir la cascada: un momentum tan fuerte suele continuar días."
      - id: c
        text:
          en: "Enter in the direction of the cluster the map shows next."
          es: "Entrar en la dirección del siguiente grupo que muestre el mapa."
      - id: d
        text:
          en: "Add to the crowded side, since funding pays it."
          es: "Añadir al lado saturado, ya que el funding lo paga."
    explanation:
      en: "The cascade looks exactly like a powerful breakout, which is why chasing it is the classic mistake: you buy precisely as the mechanical bid disappears and become the liquidity the early sellers take profit into."
      es: "La cascada se parece exactamente a una ruptura potente, y por eso perseguirla es el error clásico: compras justo cuando desaparece la demanda mecánica y te conviertes en la liquidez con la que los primeros vendedores toman beneficio."
