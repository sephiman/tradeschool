# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: liquidation-factors
    kind: multi_select
    prompt:
      en: "Which factors directly bring the mark price closer to your liquidation price?"
      es: "¿Qué factores acercan directamente el precio mark a tu precio de liquidación?"
    options:
      - id: a
        correct: true
        text:
          en: "Choosing higher leverage, which thins the margin buffer."
          es: "Elegir más apalancamiento, que adelgaza el colchón de margen."
      - id: b
        correct: true
        text:
          en: "Funding payments deducted from the margin backing the position."
          es: "Pagos de funding deducidos del margen que respalda la posición."
      - id: c
        correct: false
        text:
          en: "Unrealized profit accruing on an unrelated position elsewhere."
          es: "Beneficio no realizado acumulándose en otra posición no relacionada."
      - id: d
        correct: true
        text:
          en: "A high maintenance-margin rate set for that particular pair."
          es: "Una tasa de mantenimiento alta fijada para ese par concreto."
    explanation:
      en: "Three things move the line toward you: less collateral per unit of position, collateral drained by funding, and a venue that demands a fatter buffer for that pair. Profit on an unrelated trade does the opposite where it counts at all — under cross it adds free collateral, and under isolated it does not reach this position."
      es: "Tres cosas mueven la línea hacia ti: menos colateral por unidad de posición, colateral drenado por el funding, y un venue que exige un colchón mayor para ese par. El beneficio de una operación no relacionada hace lo contrario allí donde cuenta: en cruzado añade colateral libre, y en aislado no llega a esta posición."

  - id: mark-vs-last-liquidation
    kind: true_false
    prompt:
      en: "Exchanges trigger liquidations based on the Last Traded Price to ensure immediate market responsiveness."
      es: "Los exchanges activan las liquidaciones basándose en el Último Precio Operado para garantizar una respuesta inmediata del mercado."
    answer: false
    explanation:
      en: "Exchanges trigger liquidations using the Mark Price (index price + fair basis) to protect traders from scam wicks and market manipulation on the order book."
      es: "Los exchanges activan las liquidaciones usando el Precio Mark (precio índice + basis justo) para proteger a los traders de mechas manipuladas y manipulación en el libro de órdenes."

  - id: mark-price-components
    kind: matching
    prompt:
      en: "Match each price concept used in perpetual futures to its definition."
      es: "Empareja cada concepto de precio usado en futuros perpetuos con su definición."
    pairs:
      - id: last
        left: { en: "Last Traded Price", es: "Último Precio Operado" }
        right:
          en: "The price at which the most recent trade actually executed on the exchange order book."
          es: "El precio al que se ejecutó la operación más reciente en el libro de órdenes del exchange."
      - id: index
        left: { en: "Index Price", es: "Precio Índice" }
        right:
          en: "A weighted average price of the asset aggregated from major spot exchanges."
          es: "Un precio promedio ponderado del activo agregado de los principales exchanges spot."
      - id: mark
        left: { en: "Mark Price", es: "Precio Mark" }
        right:
          en: "Index price adjusted for fair funding basis, used to grade PnL and trigger liquidations."
          es: "Precio índice ajustado por el basis justo de funding, usado para calcular PnL y liquidaciones."
    explanation:
      en: "Mark price prevents artificial liquidations caused by single-exchange order book spikes."
      es: "El precio mark evita liquidaciones artificiales causadas por picos repentinos en el libro de un solo exchange."

  - id: liquidation-cascade-order
    kind: ordering
    prompt:
      en: "Arrange the chain reaction of a liquidation cascade in sequence."
      es: "Ordena la reacción en cadena de una cascada de liquidaciones."
    items:
      - id: step-1
        position: 1
        text:
          en: "A sharp price drop triggers the mark price of over-leveraged longs."
          es: "Una caída brusca de precio activa el precio mark de posiciones largas sobreapalancadas."
      - id: step-2
        position: 2
        text:
          en: "Liquidation engine submits forced market sell orders into the order book."
          es: "El motor de liquidación envía órdenes de venta a mercado forzosas al libro."
      - id: step-3
        position: 3
        text:
          en: "Forced sell orders consume bid liquidity, driving the price down even further."
          es: "Las órdenes de venta forzosas consumen la liquidez de compra, bajando el precio aún más."
      - id: step-4
        position: 4
        text:
          en: "The lower price triggers lower liquidation levels, causing a cascade."
          es: "El precio más bajo activa niveles de liquidación inferiores, provocando una cascada."
    explanation:
      en: "Liquidation cascades occur when forced market orders sweep thin order books, triggering lower liquidation price clusters."
      es: "Las cascadas de liquidación ocurren cuando las órdenes a mercado forzosas barren libros poco profundos, activando clusters de liquidación inferiores."

  - id: scam-wick-defense
    kind: single_choice
    prompt:
      en: "How does Mark Price protect long positions during an order book flash crash on a single exchange?"
      es: "¿Cómo protege el Precio Mark a las posiciones largas durante un flash crash en el libro de un solo exchange?"
    options:
      - id: a
        text:
          en: "It refunds the margin lost by every trader caught in the wick."
          es: "Reembolsa el margen perdido por cada trader atrapado en la mecha."
      - id: b
        correct: true
        text:
          en: "It tracks a multi-venue spot index, so one book's spike does not reach it."
          es: "Sigue un índice spot de varios venues, así que el pico de un libro no lo alcanza."
      - id: c
        text:
          en: "It halts trading on the pair until the book has been rebuilt."
          es: "Detiene la negociación del par hasta que el libro se haya reconstruido."
      - id: d
        text:
          en: "It converts the affected futures contracts into spot holdings."
          es: "Convierte los contratos de futuros afectados en posiciones spot."
    explanation:
      en: "Mark price is computed from broad spot index prices, which makes it immune to localised order-book manipulation or an isolated liquidity crash: the wick prints on the last price and the mark barely moves, so no liquidation fires. It is a defence by construction — nothing is paused, converted, or paid back afterwards."
      es: "El precio mark se calcula a partir de índices spot amplios, lo que lo hace inmune a la manipulación localizada del libro o a una caída de liquidez aislada: la mecha se imprime en el último precio y el mark apenas se mueve, así que no salta ninguna liquidación. Es una defensa por construcción: no se pausa, ni se convierte, ni se devuelve nada después."

  - id: insurance-fund-role
    kind: single_choice
    prompt:
      en: "What is the primary role of a crypto exchange's Insurance Fund?"
      es: "¿Cuál es la función principal del Fondo de Seguro de un exchange de criptomonedas?"
    options:
      - id: a
        text:
          en: "To pay daily interest on spot balances that carry no leverage."
          es: "Pagar intereses diarios sobre saldos spot que no llevan apalancamiento."
      - id: b
        text:
          en: "To cover the blockchain gas fees on customer withdrawals."
          es: "Cubrir las comisiones de gas de los retiros de los clientes."
      - id: c
        correct: true
        text:
          en: "To absorb the deficit when a liquidation closes past bankruptcy price."
          es: "Absorber el déficit cuando una liquidación cierra más allá del precio de bancarrota."
      - id: d
        text:
          en: "To guarantee that premium-tier accounts never close a losing trade."
          es: "Garantizar que las cuentas premium nunca cierren una operación en pérdida."
    explanation:
      en: "If a position is liquidated and closed at a price worse than its bankruptcy price, the shortfall has to come from somewhere, or the winning counterparty would not be paid in full. The insurance fund is that buffer — it exists to keep the exchange's books whole, not to subsidise any trader's outcome."
      es: "Si una posición se liquida y cierra a un precio peor que su precio de bancarrota, el déficit tiene que salir de algún sitio, o la contraparte ganadora no cobraría íntegramente. El fondo de seguro es ese colchón: existe para que cuadren las cuentas del exchange, no para subvencionar el resultado de ningún trader."

  - id: adl-priority-queue
    kind: single_choice
    prompt:
      en: "Which positions are highest in the Auto-Deleveraging (ADL) priority queue when an exchange insurance fund fails?"
      es: "¿Qué posiciones están más arriba en la cola de prioridad de ADL cuando falla el fondo de seguro?"
    options:
      - id: a
        text:
          en: "Whichever positions have been open on the venue for the longest."
          es: "Las posiciones que llevan más tiempo abiertas en el venue."
      - id: b
        correct: true
        text:
          en: "The most profitable ones, ranked by profit and effective leverage."
          es: "Las más rentables, ordenadas por beneficio y apalancamiento efectivo."
      - id: c
        text:
          en: "The accounts holding the smallest total balance in USD terms."
          es: "Las cuentas con el saldo total más pequeño en términos de USD."
      - id: d
        text:
          en: "Positions margined in isolated mode rather than cross mode."
          es: "Las posiciones marginadas en modo aislado en vez de en cruzado."
    explanation:
      en: "ADL closes out the opposing side of a bankrupt position, so it ranks profitable traders by profit percentage and leverage and takes from the top. That is the uncomfortable part: being right and heavily levered is exactly what puts you first in the queue — not how long you have been there, how large your account is, or which margin mode you chose."
      es: "El ADL cierra el lado contrario de una posición en quiebra, así que ordena a los traders rentables por porcentaje de beneficio y apalancamiento y va tomando desde arriba. Ahí está lo incómodo: acertar y estar muy apalancado es justo lo que te pone el primero de la cola, no cuánto llevas ahí, ni el tamaño de tu cuenta, ni el modo de margen que elegiste."

  - id: cross-margin-liquidation-risk
    kind: single_choice
    prompt:
      en: "In a Cross Margin account, what happens if one bad trade experiences massive un-hedged drawdown?"
      es: "En una cuenta de Margen Cruzado, ¿qué ocurre si una mala operación sufre un drawdown masivo sin cobertura?"
    options:
      - id: a
        correct: true
        text:
          en: "It drains the whole account's free balance, and can take every position with it."
          es: "Drena el saldo libre de toda la cuenta y puede llevarse todas las posiciones."
      - id: b
        text:
          en: "The loss is automatically capped at the margin that trade was opened with."
          es: "La pérdida se limita automáticamente al margen con el que se abrió."
      - id: c
        text:
          en: "The venue freezes the losing trade and lets the others keep running."
          es: "El venue congela la operación perdedora y deja correr las demás."
      - id: d
        text:
          en: "The position is converted into a spot holding with no fee charged."
          es: "La posición se convierte en una posición spot sin cobrar comisión."
    explanation:
      en: "Cross margin reaches for all free collateral to keep one trade alive, which is exactly why the damage is not contained: if price keeps going, it can wipe the entire balance and every position resting on it. Capping the loss at the allocated margin is what *isolated* mode does — nothing freezes a position or converts it away for you."
      es: "El margen cruzado echa mano de todo el colateral libre para mantener viva una operación, y por eso el daño no queda contenido: si el precio sigue, puede barrer el saldo entero y todas las posiciones que se apoyan en él. Limitar la pérdida al margen asignado es lo que hace el modo *aislado*: nada congela una posición ni te la convierte en otra cosa."
