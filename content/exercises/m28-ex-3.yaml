# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: premium-basis-match
    kind: matching
    prompt:
      en: "Match each futures pricing term to its market state."
      es: "Empareja cada término de precio de futuros con su estado de mercado."
    pairs:
      - id: basis
        left: { en: "Futures Basis", es: "Basis de Futuros" }
        right:
          en: "The price difference between the futures contract and the underlying spot index."
          es: "La diferencia de precio entre el contrato de futuros y el índice spot subyacente."
      - id: contango
        left: { en: "Contango", es: "Contango" }
        right:
          en: "Futures price trades at a premium above the spot index (positive basis)."
          es: "El precio de futuros cotiza con prima por encima del índice spot (basis positivo)."
      - id: backwardation
        left: { en: "Backwardation", es: "Backwardation" }
        right:
          en: "Futures price trades at a discount below the spot index (negative basis)."
          es: "El precio de futuros cotiza con descuento por debajo del índice spot (basis negativo)."
    explanation:
      en: "Basis measures the premium or discount of futures versus spot. High contango signals bullish leverage demand, while backwardation signals extreme bearishness or spot scarcity."
      es: "El basis mide la prima o descuento de los futuros frente al spot. Un contango elevado señala demanda alcista apalancada, mientras que el backwardation señala pesimismo o escasez spot."

  - id: arbitrage-mechanics
    kind: multi_select
    prompt:
      en: "Which statements correctly describe cash-and-carry arbitrage?"
      es: "¿Qué afirmaciones describen correctamente el arbitraje cash-and-carry?"
    options:
      - id: a
        correct: true
        text:
          en: "Buying spot while shorting the perp when funding is strongly positive."
          es: "Comprar spot y vender el perp cuando el funding es muy positivo."
      - id: b
        correct: true
        text:
          en: "Capturing market-neutral yield from the funding longs pay."
          es: "Capturar rendimiento neutral del funding que pagan los largos."
      - id: c
        correct: false
        text:
          en: "Taking unhedged long directional exposure on high leverage."
          es: "Tomar exposición direccional alcista sin cobertura y apalancada."
      - id: d
        correct: true
        text:
          en: "The yield narrows as arbitrageurs compete and drive the perp back."
          es: "El rendimiento se estrecha cuando los arbitrajistas devuelven el perp."
    explanation:
      en: "Cash-and-carry locks in market-neutral yield by going long spot and short futures when futures trade at a high premium — the whole point is that the two legs cancel, so direction no longer matters. An unhedged leveraged long is the opposite trade: it keeps every bit of the direction risk the hedge exists to remove."
      es: "El cash-and-carry asegura un rendimiento neutral al mercado comprando spot y vendiendo futuros cuando cotizan con prima alta: todo su sentido es que las dos patas se cancelan y la dirección deja de importar. Un largo apalancado sin cobertura es la operación contraria: conserva todo el riesgo direccional que la cobertura existe para eliminar."

  - id: basis-convergence-truth
    kind: true_false
    prompt:
      en: "Dated futures contracts are guaranteed to converge to the spot price upon expiry."
      es: "Se garantiza que los contratos de futuros con fecha vencen al precio spot en el momento de la expiración."
    answer: true
    explanation:
      en: "At contract settlement, the futures settlement price is pegged directly to the underlying spot index, forcing basis to zero."
      es: "En la liquidación del contrato, el precio de liquidación de futuros se fija directamente al índice spot subyacente, forzando a que el basis sea cero."

  - id: premium-driver-identification
    kind: single_choice
    prompt:
      en: "What does a sudden widening of the Korean Kimchi Premium (high BTC price on Korean exchanges vs global spot) indicate?"
      es: "¿Qué indica un ensanchamiento repentino de la Prima Kimchi (precio alto de BTC en exchanges coreanos vs spot global)?"
    options:
      - id: a
        text:
          en: "Bitcoin block times have lengthened, so transfers between venues stall."
          es: "Los bloques de Bitcoin tardan más y las transferencias se atascan."
      - id: b
        correct: true
        text:
          en: "Strong local retail demand plus fiat transfer and withdrawal friction."
          es: "Demanda minorista local fuerte más fricción de fiat y de retirada."
      - id: c
        text:
          en: "Global spot venues are quoting stale prices while Korea quotes live ones."
          es: "El spot global cotiza precios rancios mientras Corea cotiza en vivo."
      - id: d
        text:
          en: "Korean shorts are being paid an unusually large funding rate right now."
          es: "A los cortos coreanos les pagan ahora un funding inusualmente alto."
    explanation:
      en: "Cross-exchange premiums persist when capital flow friction prevents arbitrageurs from quickly moving fiat or crypto between venues — the demand is what opens the gap, the friction is what keeps it open. Block times affect everyone equally and no venue's feed is stale here; both readings would apply globally rather than to one country's exchanges."
      es: "Las primas entre exchanges persisten cuando la fricción del flujo de capital impide que los arbitrajistas muevan rápido fiat o cripto entre sitios: la demanda abre el hueco, la fricción lo mantiene abierto. El tiempo de bloque afecta a todos por igual y aquí ningún feed está rancio; las dos lecturas valdrían globalmente, no para los exchanges de un solo país."

  - id: basis-arbitrage-sequence
    kind: ordering
    prompt:
      en: "Sequence the execution steps of a cash-and-carry basis arbitrage trade."
      es: "Ordena los pasos de ejecución de una operación de arbitraje de basis cash-and-carry."
    items:
      - id: step-1
        position: 1
        text:
          en: "Identify perpetual futures trading at a substantial premium above spot with high positive funding."
          es: "Identificar futuros perpetuos cotizando con prima sustancial sobre spot con funding positivo alto."
      - id: step-2
        position: 2
        text:
          en: "Buy spot asset on spot venue and transfer as collateral to futures venue."
          es: "Comprar activo en el mercado spot y transferirlo como colateral al mercado de futuros."
      - id: step-3
        position: 3
        text:
          en: "Open an equivalent short position on perpetual futures (1x hedge)."
          es: "Abrir una posición corta equivalente en futuros perpetuos (cobertura 1x)."
      - id: step-4
        position: 4
        text:
          en: "Collect periodic funding yield until premium normalizes, then close both legs."
          es: "Cobrar el rendimiento periódico de funding hasta que la prima se normalice y cerrar ambas patas."
    explanation:
      en: "Cash-and-carry locks in market-neutral yield by balancing spot long against futures short."
      es: "El cash-and-carry bloquea rendimiento neutral al mercado equilibrando spot largo contra futuros corto."

  - id: funding-arb-risk
    kind: single_choice
    prompt:
      en: "What is the principal risk in a delta-neutral cash-and-carry trade (long spot, short perp)?"
      es: "¿Cuál es el riesgo principal en una operación de cash-and-carry delta-neutral (long spot, short perp)?"
    options:
      - id: a
        text:
          en: "The asset price rising 50%, since the spot leg cannot cover the short."
          es: "Que el precio suba un 50 %, ya que el spot no cubre el corto."
      - id: b
        text:
          en: "Liquidation of the spot position, which carries no margin buffer."
          es: "La liquidación de la posición spot, que no tiene colchón de margen."
      - id: c
        text:
          en: "The order book deepening, which erodes the spread the trade earns."
          es: "Que el libro gane profundidad y erosione el spread que gana la operación."
      - id: d
        correct: true
        text:
          en: "Funding flipping negative, turning the yield into a recurring cost."
          es: "Que el funding se vuelva negativo y el ingreso pase a ser gasto."
    explanation:
      en: "Price moves are hedged by construction — that is what delta-neutral means, so a 50% rally costs nothing net and an unleveraged spot holding cannot be liquidated. What is not hedged is the funding rate itself: if sentiment shifts, the yield can shrink to nothing or reverse into a payment you owe every interval."
      es: "Los movimientos de precio están cubiertos por construcción —eso significa delta-neutral—, así que una subida del 50 % no cuesta nada en neto y una posición spot sin apalancar no se puede liquidar. Lo que no está cubierto es el propio funding: si cambia el sentimiento, el rendimiento puede reducirse a nada o invertirse en un pago que debes cada intervalo."

  - id: spot-perp-basis-expansion
    kind: single_choice
    prompt:
      en: "Why does perpetual futures basis expand to high positive levels during euphoric bull markets?"
      es: "¿Por qué el basis de futuros perpetuos se expande a niveles positivos altos durante mercados alcistas eufóricos?"
    options:
      - id: a
        correct: true
        text:
          en: "Leveraged long demand arrives faster than spot liquidity can keep up."
          es: "La demanda de largos apalancados va más rápido que la liquidez spot."
      - id: b
        text:
          en: "Exchanges charge longs a higher maker fee, which lifts the perp price."
          es: "Los exchanges cobran más comisión a los largos y eso sube el perp."
      - id: c
        text:
          en: "The underlying chain congests, so the perp cannot track spot closely."
          es: "La cadena se congestiona y el perp no puede seguir de cerca al spot."
      - id: d
        text:
          en: "Shorts are given zero margin requirement, so nobody sells the premium."
          es: "A los cortos no se les exige margen y nadie vende la prima."
    explanation:
      en: "High leverage demand drives perpetual prices above spot, creating high positive basis and elevating funding payments to shorts. The perp does not need the chain at all to track spot — funding is the mechanism that tethers it, and a fee schedule is far too small to open a basis of this size."
      es: "La alta demanda de apalancamiento empuja los perpetuos por encima del spot, creando un basis positivo alto y elevando los pagos de funding a los cortos. El perp no necesita la cadena para seguir al spot: el funding es el mecanismo que lo ata, y una tabla de comisiones es demasiado pequeña para abrir un basis de este tamaño."

  - id: cross-venue-transfer-friction
    kind: single_choice
    prompt:
      en: "Why do price premiums between two exchanges fail to close immediately when wallet withdrawals are suspended on one venue?"
      es: "¿Por qué las primas de precio entre dos exchanges no se cierran inmediatamente cuando se suspenden las retiradas de wallet en uno de ellos?"
    options:
      - id: a
        text:
          en: "The order books stop displaying bids until withdrawals are restored."
          es: "Los libros dejan de mostrar bids hasta que vuelvan las retiradas."
      - id: b
        text:
          en: "Global trading volume falls to zero, so no price can be discovered."
          es: "El volumen global cae a cero y no se puede descubrir ningún precio."
      - id: c
        text:
          en: "Funding rates are forced to zero on every venue during a suspension."
          es: "El funding se fuerza a cero en todos los exchanges durante la pausa."
      - id: d
        correct: true
        text:
          en: "Arbitrageurs cannot move assets across to sell on the dearer venue."
          es: "Los arbitrajistas no pueden llevar activos al exchange más caro."
    explanation:
      en: "Arbitrage relies on physically transporting assets or fiat between exchanges; closing the withdrawal rails traps capital and preserves the divergence. Trading itself continues normally on both venues — that is exactly why the two prices can stay apart while each book keeps quoting."
      es: "El arbitraje depende de transportar físicamente activos o fiat entre exchanges; cerrar la vía de retiradas atrapa capital y mantiene la divergencia. La negociación sigue con normalidad en los dos sitios: por eso justamente los dos precios pueden quedarse separados mientras cada libro sigue cotizando."
