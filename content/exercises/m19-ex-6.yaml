# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: five-coins-myth
    kind: true_false
    prompt:
      en: "Holding five different coins means your portfolio is diversified."
      es: "Tener cinco monedas distintas significa que tu cartera está diversificada."
    answer: false
    explanation:
      en: "False. Diversification depends on correlation, not on the number of names. Five alts that fall together in a sell-off are one correlated bet in five costumes — the count of tickers is not the count of independent bets."
      es: "Falso. La diversificación depende de la correlación, no del número de nombres. Cinco alts que caen juntas en una caída son una apuesta correlacionada con cinco trajes: la cuenta de tickers no es la cuenta de apuestas independientes."
  - id: correlation-scale-match
    kind: matching
    prompt:
      en: "Match each correlation value to what it means for two positions."
      es: "Empareja cada valor de correlación con lo que significa para dos posiciones."
    pairs:
      - id: plus1
        left: { en: "+1", es: "+1" }
        right:
          en: "Move in lockstep — effectively one position held twice."
          es: "Se mueven al unísono: en la práctica, una posición mantenida dos veces."
      - id: zero
        left: { en: "0", es: "0" }
        right:
          en: "Independent — one tells you nothing about the other."
          es: "Independientes: una no te dice nada de la otra."
      - id: minus1
        left: { en: "−1", es: "−1" }
        right:
          en: "Move exactly opposite — a perfect hedge."
          es: "Se mueven exactamente al revés: una cobertura perfecta."
      - id: plus09
        left: { en: "+0.9 (typical crypto alts)", es: "+0,9 (alts de cripto típicas)" }
        right:
          en: "Almost the same bet — barely diversified at all."
          es: "Casi la misma apuesta: apenas diversificada."
    explanation:
      en: "Correlation runs from +1 (lockstep, one bet twice) through 0 (independent) to −1 (a perfect hedge). Most crypto alts sit near +0.9 to BTC, so a basket of them is barely diversified — and in a drawdown that figure climbs even closer to +1."
      es: "La correlación va de +1 (al unísono, una apuesta dos veces) pasando por 0 (independientes) hasta −1 (cobertura perfecta). La mayoría de las alts de cripto rondan +0,9 frente a BTC, así que una cesta de ellas apenas está diversificada, y en un drawdown esa cifra sube aún más cerca de +1."
  - id: diversification-when
    prompt:
      en: "You want extra positions to actually lower your portfolio risk. When does that happen?"
      es: "Quieres que las posiciones adicionales reduzcan de verdad el riesgo de tu cartera. ¿Cuándo ocurre eso?"
    options:
      - id: a
        text:
          en: "Always — every extra coin is one more layer of diversification."
          es: "Siempre: cada moneda de más es una capa más de diversificación."
      - id: b
        text:
          en: "Whenever you reach at least five names, the usual rule of thumb."
          es: "En cuanto llegas a al menos cinco nombres, la regla general habitual."
      - id: c
        correct: true
        text:
          en: "Only when the holdings do not tend to fall together."
          es: "Solo cuando lo que tienes no tiende a caer junto."
      - id: d
        text:
          en: "Whenever each position is capped at 1%, since caps make the total safe."
          es: "Siempre que cada posición esté limitada al 1%: los límites hacen seguro el total."
    explanation:
      en: "Diversification lowers risk only when the pieces are genuinely uncorrelated. Adding correlated names, reaching a magic count, or capping each line does nothing about correlation — the risks still stack in a shared move, which is exactly what a per-trade cap cannot see."
      es: "La diversificación reduce el riesgo solo cuando las piezas están genuinamente descorrelacionadas. Añadir nombres correlacionados, llegar a un número mágico o limitar cada línea no hace nada contra la correlación: los riesgos se siguen sumando en un movimiento compartido, que es justo lo que un límite por operación no puede ver."
  - id: drawdown-correlation
    kind: true_false
    prompt:
      en: "In a hard crypto sell-off, correlations between alts snap toward +1, so the diversification you measured in calm weather evaporates."
      es: "En una caída dura de cripto, las correlaciones entre alts saltan hacia +1, así que la diversificación que mediste con el mercado tranquilo se evapora."
    answer: true
    explanation:
      en: "True. Everyone de-risks at once and the per-coin narratives stop mattering, so the basket behaves like one leveraged long exactly when you need it not to."
      es: "Cierto. Todos reducen riesgo a la vez y las narrativas de cada moneda dejan de importar, así que la cesta se comporta como un único largo apalancado justo cuando necesitas que no lo haga."
  - id: alt-beta
    prompt:
      en: "Most alts have a beta above 1 to BTC. On a day BTC falls 10%, what typically happens to those alts?"
      es: "La mayoría de las alts tienen una beta superior a 1 frente a BTC. En un día en que BTC cae un 10%, ¿qué suele pasar con esas alts?"
    options:
      - id: a
        text:
          en: "They fall less than BTC does, because BTC is the one leading the way down."
          es: "Caen menos que BTC, porque es BTC quien lidera la bajada."
      - id: b
        text:
          en: "They are unaffected — alts trade purely on their own narratives."
          es: "No se ven afectadas: las alts cotizan solo por sus narrativas."
      - id: c
        correct: true
        text:
          en: "They fall harder — often 15% to 25% — blowing through 10% stops."
          es: "Caen más fuerte —a menudo un 15-25%— y atraviesan los stops del 10%."
      - id: d
        text:
          en: "They rise, as money rotates out of BTC and into the altcoins."
          es: "Suben, ya que el dinero rota de BTC hacia las altcoins."
    explanation:
      en: "A beta above 1 means bigger moves than BTC in both directions. When BTC drops 10%, higher-beta alts commonly drop 15–25%, so a 10% stop on a thin alt book fills lower after slippage and loses more than its planned budget. Rotation out of BTC happens in calm markets, not in a broad sell-off."
      es: "Una beta superior a 1 significa movimientos mayores que BTC en ambas direcciones. Cuando BTC cae un 10%, las alts de beta más alta caen a menudo un 15-25%, así que un stop del 10% en un libro fino se ejecuta más abajo tras el deslizamiento y pierde más que su presupuesto previsto. La rotación desde BTC ocurre en mercados tranquilos, no en una caída generalizada."
  - id: book-profile-match
    kind: matching
    prompt:
      en: "Match each two-position book to its real risk profile (assume BTC and the alt are highly correlated)."
      es: "Empareja cada cartera de dos posiciones con su perfil de riesgo real (supón que BTC y la alt están muy correlacionadas)."
    pairs:
      - id: two-longs
        left: { en: "Long BTC + long a correlated alt", es: "Largo en BTC + largo en una alt correlacionada" }
        right:
          en: "Stacked — nearly one directional bet, risks add up."
          es: "Apilada: casi una sola apuesta direccional, los riesgos se suman."
      - id: long-short
        left: { en: "Long BTC + short a correlated alt", es: "Largo en BTC + corto en una alt correlacionada" }
        right:
          en: "Hedged — a relative bet with low directional risk."
          es: "Cubierta: una apuesta relativa con bajo riesgo direccional."
      - id: uncorrelated
        left: { en: "Long BTC + long an asset uncorrelated to crypto", es: "Largo en BTC + largo en un activo descorrelacionado de cripto" }
        right:
          en: "Genuinely diversified — the two risks are partly independent."
          es: "Genuinamente diversificada: los dos riesgos son en parte independientes."
    explanation:
      en: "Direction plus correlation sets the profile. Two longs on correlated names stack into one bet; a long against a short on correlated names largely cancels into a relative bet; only a genuinely uncorrelated pairing spreads the risk. Counting positions tells you none of this."
      es: "La dirección más la correlación fijan el perfil. Dos largos en nombres correlacionados se apilan en una apuesta; un largo contra un corto en nombres correlacionados se cancela en gran parte en una apuesta relativa; solo un emparejamiento genuinamente descorrelacionado reparte el riesgo. Contar posiciones no te dice nada de esto."
  - id: calm-vs-crash
    prompt:
      en: "Why can a basket of alts look nicely diversified in calm markets yet behave like a single position in a crash?"
      es: "¿Por qué una cesta de alts puede parecer bien diversificada en mercados tranquilos y comportarse como una sola posición en un desplome?"
    options:
      - id: a
        correct: true
        text:
          en: "In a sell-off everyone de-risks at once and correlations snap toward +1."
          es: "En una caída todos reducen riesgo a la vez y las correlaciones saltan a +1."
      - id: b
        text:
          en: "Because correlation is a fixed property, so it was never diversified at all."
          es: "Porque la correlación es fija, así que nunca estuvo diversificada."
      - id: c
        text:
          en: "Because exchanges raise fees during crashes, which links the coins together."
          es: "Porque los exchanges suben comisiones en los desplomes y enlazan las monedas."
      - id: d
        text:
          en: "Because calm markets have no correlation at all between any of the coins."
          es: "Porque en mercados tranquilos no hay ninguna correlación entre monedas."
    explanation:
      en: "Correlation is not constant, which is the whole point. In calm markets alts drift on separate stories and genuinely look independent; in a drawdown people sell everything at once, the stories stop mattering, and correlations climb toward +1 — so the basket behaves like one leveraged long exactly when it hurts. Nothing about the venue's fees is involved."
      es: "La correlación no es constante, y ese es todo el punto. En mercados tranquilos las alts se mueven por historias separadas y parecen de verdad independientes; en un drawdown la gente vende todo a la vez, las historias dejan de importar y las correlaciones suben hacia +1, así que la cesta se comporta como un único largo apalancado justo cuando duele. Las comisiones del venue no pintan nada aquí."
  - id: independent-bets
    kind: multi_select
    prompt:
      en: "Select ALL statements about counting risk that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre cómo contar el riesgo."
    options:
      - id: a
        correct: true
        text:
          en: "Risk only diversifies away when correlation is below +1."
          es: "El riesgo solo se diversifica cuando la correlación está por debajo de +1."
      - id: b
        correct: true
        text:
          en: "Ten longs on ten coins that move together is one bet in ten costumes."
          es: "Diez largos en diez monedas que se mueven juntas son una apuesta con diez trajes."
      - id: c
        correct: true
        text:
          en: "A long and a short in correlated instruments partly cancel out."
          es: "Un largo y un corto en instrumentos correlacionados se cancelan en parte."
      - id: d
        text:
          en: "The number of tickets open in your account determines diversification."
          es: "El número de posiciones abiertas determina la diversificación."
      - id: e
        text:
          en: "Splitting one 3% idea across three coins turns it into three 1% ideas."
          es: "Repartir una idea del 3% en tres monedas la convierte en tres del 1%."
    explanation:
      en: "Diversification is about independent risks, never about the number of tickers on your screen. A long against a short on correlated names is a relative bet with far less directional risk, while splitting one idea across three coins just makes the 3% harder to see."
      es: "La diversificación va de riesgos independientes, nunca del número de tickers en tu pantalla. Un largo contra un corto en nombres correlacionados es una apuesta relativa con mucho menos riesgo direccional, mientras que repartir una idea en tres monedas solo hace más difícil ver el 3%."
  - id: cluster-cap-practice
    prompt:
      en: "You want a rule that stops the diversification illusion from creeping back in. Which one does the job?"
      es: "Quieres una regla que evite que la ilusión de diversificación vuelva a colarse. ¿Cuál lo consigue?"
    options:
      - id: a
        text:
          en: "Cap the number of open positions at three, regardless of what they are."
          es: "Limita las posiciones abiertas a tres, sean las que sean."
      - id: b
        text:
          en: "Require every position to use isolated margin, removing correlation risk."
          es: "Exige margen aislado en todas: elimina el riesgo de correlación."
      - id: c
        correct: true
        text:
          en: "Cap the cluster: a maximum risk for the whole correlated group."
          es: "Limita el grupo: un riesgo máximo para todo el conjunto correlacionado."
      - id: d
        text:
          en: "Keep each trade at 1% and let the position count take care of itself."
          es: "Mantén cada operación al 1% y deja que el número se resuelva solo."
    explanation:
      en: "Set a maximum for the correlated group — say 2% across all alt longs combined — and size the individual trades to fit inside it. Cap the cluster, not just the line: a position limit says nothing about direction, isolated margin bounds each loss without making the losses independent, and per-trade caps are precisely what the illusion hides behind."
      es: "Fija un máximo para el conjunto correlacionado —por ejemplo el 2% entre todos los largos en alts— y dimensiona las operaciones para que quepan dentro. Limita el grupo, no solo la línea: un límite de posiciones no dice nada sobre la dirección, el margen aislado acota cada pérdida sin hacerlas independientes, y los límites por operación son justo aquello tras lo que se esconde la ilusión."
  - id: cross-margin-cascade
    prompt:
      en: "Your correlated positions all share one cross-margin pool. What does a correlated drop do?"
      es: "Tus posiciones correlacionadas comparten un mismo pool de margen cruzado. ¿Qué hace una caída correlacionada?"
    options:
      - id: a
        text:
          en: "Nothing extra — each position is liquidated against its own margin."
          es: "Nada adicional: cada posición se liquida contra su propio margen."
      - id: b
        correct: true
        text:
          en: "Draws them all down against the same collateral at once."
          es: "Las arrastra todas a la vez contra el mismo colateral."
      - id: c
        text:
          en: "It protects them, since winners in the pool subsidise losers indefinitely."
          es: "Las protege, ya que las ganadoras subvencionan indefinidamente a las perdedoras."
      - id: d
        text:
          en: "It converts them automatically to isolated margin at the maintenance level."
          es: "Las convierte automáticamente a margen aislado en el nivel de mantenimiento."
    explanation:
      en: "That can push several toward liquidation simultaneously, so positions that looked independent fail as a single cascade. Cross margin buys depth of cushion by pooling collateral — which is exactly what turns several correlated losses into one shared drawdown against that pool, and the subsidy only lasts as long as the pool does."
      es: "Eso puede empujar varias hacia la liquidación al mismo tiempo, así que posiciones que parecían independientes fallan como una sola cascada. El margen cruzado compra colchón agrupando el colateral, y eso es precisamente lo que convierte varias pérdidas correlacionadas en un único drawdown compartido contra ese pool, y la subvención dura lo que dure el pool."
