# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: stablecoin
    prompt:
      en: "Which statement best describes a stablecoin?"
      es: "¿Qué afirmación describe mejor una stablecoin?"
    options:
      - id: a
        correct: true
        text:
          en: "A token that aims to hold a fixed value (usually 1 USD), backed by reserves."
          es: "Un token que busca mantener un valor fijo (normalmente 1 USD), respaldado por reservas."
      - id: b
        text:
          en: "A coin whose price is guaranteed by a government."
          es: "Una moneda cuyo precio garantiza un gobierno."
      - id: c
        text:
          en: "Any altcoin with low volatility this week."
          es: "Cualquier altcoin con poca volatilidad esta semana."
      - id: d
        text:
          en: "A share in the exchange that issues it."
          es: "Una acción del exchange que la emite."
    explanation:
      en: "A stablecoin targets a fixed value via reserves; its stability depends entirely on the issuer actually holding what it claims."
      es: "Una stablecoin apunta a un valor fijo mediante reservas; su estabilidad depende por completo de que el emisor tenga de verdad lo que dice."
  - id: btc-supply
    prompt:
      en: "What is Bitcoin's maximum supply?"
      es: "¿Cuál es el suministro máximo de Bitcoin?"
    options:
      - id: a
        correct: true
        text:
          en: "Capped at 21 million, on a fixed schedule."
          es: "Limitado a 21 millones, con una emisión fija."
      - id: b
        text: { en: "Unlimited — miners create more as needed.", es: "Ilimitado: los mineros crean más según haga falta." }
      - id: c
        text: { en: "100 million, set at launch.", es: "100 millones, fijado en el lanzamiento." }
      - id: d
        text: { en: "Decided each year by a central bank.", es: "Lo decide cada año un banco central." }
    explanation:
      en: "Bitcoin's supply is capped at 21 million on a predictable schedule — the basis of its scarcity claim."
      es: "El suministro de Bitcoin está limitado a 21 millones con una emisión predecible: la base de su afirmación de escasez."
  - id: value
    prompt:
      en: "Which of these does NOT confer durable value to a token?"
      es: "¿Cuál de estos NO aporta valor duradero a un token?"
    options:
      - id: a
        correct: true
        text:
          en: "A large 'market cap' that is really a tiny float times a fantasy price."
          es: "Un 'market cap' enorme que en realidad es un float minúsculo por un precio de fantasía."
      - id: b
        text: { en: "Genuine demand for a real use.", es: "Demanda genuina por un uso real." }
      - id: c
        text: { en: "Credible scarcity.", es: "Escasez creíble." }
      - id: d
        text: { en: "Strong network effects.", es: "Fuertes efectos de red." }
    explanation:
      en: "Real value comes from use, scarcity and network effects. A headline market cap on a tiny float is narrative, not durable value."
      es: "El valor real viene del uso, la escasez y los efectos de red. Un market cap de titular sobre un float minúsculo es narrativa, no valor duradero."
  - id: asset-classes-match
    kind: matching
    prompt:
      en: "Match each type of crypto asset to its defining property."
      es: "Empareja cada tipo de activo cripto con su propiedad definitoria."
    pairs:
      - id: btc
        left: { en: "Bitcoin (BTC)", es: "Bitcoin (BTC)" }
        right:
          en: "The oldest, most decentralised chain; scarce, with a fixed supply capped at 21 million."
          es: "La cadena más antigua y descentralizada; escasa, con una emisión fija limitada a 21 millones."
      - id: alt
        left: { en: "Altcoin", es: "Altcoin" }
        right:
          en: "Everything that isn't Bitcoin — quality ranges from serious platforms to worthless tokens."
          es: "Todo lo que no es Bitcoin: la calidad va desde plataformas serias hasta tokens sin valor."
      - id: stable
        left: { en: "Stablecoin", es: "Stablecoin" }
        right:
          en: "Aims to hold a fixed value (usually 1 USD), backed by the issuer's reserves."
          es: "Busca mantener un valor fijo (normalmente 1 USD), respaldado por las reservas del emisor."
    explanation:
      en: "Bitcoin is the scarce reserve asset; 'altcoin' just means 'not Bitcoin' and says nothing about quality; a stablecoin targets a fixed value via reserves."
      es: "Bitcoin es el activo de reserva escaso; 'altcoin' solo significa 'no Bitcoin' y no dice nada sobre la calidad; una stablecoin apunta a un valor fijo mediante reservas."
  - id: durable-value
    kind: multi_select
    prompt:
      en: "Select ALL of the following that give a token durable value."
      es: "Selecciona TODO lo siguiente que aporta valor duradero a un token."
    options:
      - id: a
        correct: true
        text: { en: "Genuine demand for a real use.", es: "Demanda genuina por un uso real." }
      - id: b
        correct: true
        text: { en: "Credible scarcity.", es: "Escasez creíble." }
      - id: c
        correct: true
        text: { en: "Strong network effects.", es: "Fuertes efectos de red." }
      - id: d
        text: { en: "An influencer's endorsement.", es: "El respaldo de un influencer." }
      - id: e
        text: { en: "The price went up last week.", es: "Que el precio subiera la semana pasada." }
      - id: f
        text: { en: "A slick website and heavy marketing.", es: "Una web bonita y mucho marketing." }
    explanation:
      en: "Durable value comes from real demand, credible scarcity and network effects. Endorsements, a recent pump and marketing are narrative — real in the short term, worthless as long-term collateral."
      es: "El valor duradero viene de la demanda real, la escasez creíble y los efectos de red. Los respaldos, una subida reciente y el marketing son narrativa: reales a corto plazo e inútiles como colateral a largo."
  - id: stablecoin-gov-myth
    kind: true_false
    prompt:
      en: "A stablecoin's price is guaranteed by a government."
      es: "El precio de una stablecoin lo garantiza un gobierno."
    answer: false
    explanation:
      en: "A stablecoin targets a fixed value through reserves held by its issuer, not any government guarantee. If the issuer doesn't hold what it claims, the peg can break."
      es: "Una stablecoin apunta a un valor fijo mediante reservas de su emisor, no por una garantía de ningún gobierno. Si el emisor no tiene lo que dice, la paridad puede romperse."
  - id: altcoin-quality
    prompt:
      en: "What does calling a coin 'an altcoin' tell you about its quality?"
      es: "¿Qué te dice sobre su calidad llamar 'altcoin' a una moneda?"
    options:
      - id: a
        correct: true
        text:
          en: "Nothing by itself — altcoins range from serious platforms to tokens made only to be sold to you."
          es: "Nada por sí solo: las altcoins van desde plataformas serias hasta tokens creados solo para vendértelos."
      - id: b
        text: { en: "It is lower quality than Bitcoin by definition.", es: "Es de menor calidad que Bitcoin por definición." }
      - id: c
        text: { en: "It is a scam by definition.", es: "Es una estafa por definición." }
      - id: d
        text: { en: "It is a safe long-term hold.", es: "Es una inversión segura a largo plazo." }
    explanation:
      en: "'Altcoin' just means 'not Bitcoin'. It tells you nothing about quality — you still have to look at each one on its own."
      es: "'Altcoin' solo significa 'no Bitcoin'. No te dice nada sobre la calidad: sigues teniendo que mirar cada una por separado."
  - id: market-cap-myth
    kind: true_false
    prompt:
      en: "A token's market cap tells you how much real money has been invested in it."
      es: "El market cap de un token te dice cuánto dinero real se ha invertido en él."
    answer: false
    explanation:
      en: "Market cap is just price × total supply, and that price comes from the last trade of whatever thin slice actually changes hands. It is a number, not a pool of money you could ever withdraw."
      es: "El market cap es solo precio × suministro total, y ese precio sale de la última operación de la porción mínima que realmente cambia de manos. Es un número, no un fondo de dinero que puedas retirar."
  - id: thin-float
    prompt:
      en: "A token trades at 2 USD with a total supply of 1 billion, so its headline market cap is 2 billion USD. Only 1% of the supply really circulates and the order book holds about 200,000 USD of genuine bids. What does that 2 billion figure represent?"
      es: "Un token cotiza a 2 USD con un suministro total de 1.000 millones, así que su market cap de titular es de 2.000 millones de USD. Solo el 1% del suministro circula de verdad y el libro de órdenes tiene unos 200.000 USD de bids reales. ¿Qué representa esa cifra de 2.000 millones?"
    options:
      - id: a
        correct: true
        text:
          en: "Almost nothing real — a tiny float times a fantasy price; a holder selling a few hundred thousand would collapse the book."
          es: "Casi nada real: un float minúsculo por un precio de fantasía; un holder que vendiera unos cientos de miles hundiría el libro."
      - id: b
        text:
          en: "2 billion USD that entered the token and could be withdrawn."
          es: "2.000 millones de USD que entraron en el token y podrían retirarse."
      - id: c
        text: { en: "The token's guaranteed floor value.", es: "El valor mínimo garantizado del token." }
      - id: d
        text: { en: "Proof the token is more liquid than a smaller-cap one.", es: "La prueba de que el token es más líquido que uno de cap menor." }
    explanation:
      en: "A big market cap on a thin float is not wealth and not safety — it is a number that exists only while nobody sells. Real liquidity here is the 200,000 USD in the book, a rounding error next to the quoted 'cap'."
      es: "Un market cap grande sobre un float minúsculo no es riqueza ni seguridad: es un número que solo existe mientras nadie vende. La liquidez real aquí son los 200.000 USD del libro, un error de redondeo al lado del 'cap' publicado."
  - id: stablecoin-truths
    kind: multi_select
    prompt:
      en: "Select ALL statements that are true of a stablecoin like USDT or USDC."
      es: "Selecciona TODAS las afirmaciones que son ciertas para una stablecoin como USDT o USDC."
    options:
      - id: a
        correct: true
        text:
          en: "It is the cash leg of crypto trading — where you park value between trades."
          es: "Es la pata de efectivo del trading cripto: donde aparcas valor entre operaciones."
      - id: b
        correct: true
        text:
          en: "Holding it is a credit exposure to its issuer, not risk-free cash."
          es: "Tenerla es una exposición de crédito a su emisor, no efectivo libre de riesgo."
      - id: c
        correct: true
        text:
          en: "On a futures venue it is usually the collateral your positions are margined in."
          es: "En un venue de futuros suele ser el colateral con el que se margina tu posición."
      - id: d
        text: { en: "Its peg is legally guaranteed.", es: "Su paridad está garantizada legalmente." }
      - id: e
        text: { en: "It cannot trade away from 1 USD.", es: "No puede cotizar lejos de 1 USD." }
    explanation:
      en: "A stablecoin is the cash leg and usually your margin collateral, which is exactly why it matters that it is a claim on an issuer rather than risk-free cash. 'Stable' is an aim, not a law: pegs have broken."
      es: "Una stablecoin es la pata de efectivo y normalmente tu colateral de margen, y precisamente por eso importa que sea un derecho frente a un emisor y no efectivo libre de riesgo. 'Estable' es un objetivo, no una ley: las paridades se han roto."
  - id: depeg-cases
    kind: matching
    prompt:
      en: "Match each stablecoin episode to what actually happened."
      es: "Empareja cada episodio de stablecoin con lo que ocurrió realmente."
    pairs:
      - id: ust
        left: { en: "UST, May 2022", es: "UST, mayo de 2022" }
        right:
          en: "Propped up by mechanism rather than real reserves; lost its peg and collapsed toward zero within days."
          es: "Sostenida por un mecanismo en vez de reservas reales; perdió la paridad y se hundió hacia cero en días."
      - id: usdc
        left: { en: "USDC, March 2023", es: "USDC, marzo de 2023" }
        right:
          en: "Well reserved, but part of those reserves sat in a failing bank; briefly traded near 0.88 USD and recovered once backstopped."
          es: "Bien respaldada, pero parte de sus reservas estaba en un banco en quiebra; cotizó brevemente cerca de 0,88 USD y se recuperó al ser respaldada."
      - id: margin
        left: { en: "A de-peg while you hold futures positions", es: "Una pérdida de paridad mientras tienes posiciones de futuros" }
        right:
          en: "Your margin itself moves, so it distorts every open position at once — not just one holding."
          es: "Tu propio margen se mueve, así que distorsiona todas las posiciones abiertas a la vez, no solo una tenencia."
    explanation:
      en: "A stablecoin is only as good as its reserves and its ability to honour redemptions. UST had mechanism instead of reserves; USDC had real reserves in the wrong bank. Either way the risk lands on your collateral."
      es: "Una stablecoin vale lo que valen sus reservas y su capacidad de atender los reembolsos. UST tenía mecanismo en vez de reservas; USDC tenía reservas reales en el banco equivocado. En ambos casos el riesgo cae sobre tu colateral."
