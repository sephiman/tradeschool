# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: stablecoin
    prompt:
      en: "Which statement best describes a stablecoin?"
      es: "¿Qué afirmación describe mejor una stablecoin?"
    options:
      - id: a
        correct: true
        text:
          en: "A token that aims to hold a fixed value, usually 1 USD, backed by reserves."
          es: "Un token que busca mantener un valor fijo, normalmente 1 USD, respaldado por reservas."
      - id: b
        text:
          en: "Any altcoin calm enough that its price has barely moved this week."
          es: "Cualquier altcoin tan tranquila que su precio apenas se ha movido esta semana."
      - id: c
        text:
          en: "A coin whose price a government guarantees by law, the way an insured deposit is."
          es: "Una moneda cuyo precio garantiza un gobierno por ley, como un depósito asegurado."
      - id: d
        text:
          en: "A share in the issuer that pays you a cut of the interest its reserves earn."
          es: "Una acción del emisor que te paga parte del interés que ganan sus reservas."
    explanation:
      en: "A stablecoin targets a fixed value through reserves its issuer holds. No government underwrites it, it pays you nothing, and a quiet week is not a peg — the stability depends entirely on the issuer actually holding what it claims."
      es: "Una stablecoin apunta a un valor fijo mediante reservas que tiene su emisor. Ningún gobierno la respalda, no te paga nada y una semana tranquila no es una paridad: la estabilidad depende por completo de que el emisor tenga de verdad lo que dice."
  - id: btc-supply
    prompt:
      en: "What is Bitcoin's maximum supply?"
      es: "¿Cuál es el suministro máximo de Bitcoin?"
    options:
      - id: a
        text:
          en: "Unlimited — miners mint more whenever fees stop covering their costs."
          es: "Ilimitado: los mineros emiten más cuando las comisiones no cubren sus costes."
      - id: b
        text:
          en: "100 million, set at launch and revised upward by developer vote since."
          es: "100 millones, fijado en el lanzamiento y subido luego por voto de desarrolladores."
      - id: c
        correct: true
        text:
          en: "Capped at 21 million, released on a halving schedule fixed in the protocol."
          es: "Limitado a 21 millones, emitido según un calendario de halvings fijado en el protocolo."
      - id: d
        text:
          en: "Decided each year by a central bank targeting the network's inflation."
          es: "Lo decide cada año un banco central con un objetivo de inflación para la red."
    explanation:
      en: "Bitcoin's supply is capped at 21 million and issued on a schedule nobody administers — the halving is arithmetic in the protocol, not a policy anyone votes on each year. That predictability is the basis of its scarcity claim."
      es: "El suministro de Bitcoin está limitado a 21 millones y se emite según un calendario que nadie administra: el halving es aritmética del protocolo, no una política que alguien vote cada año. Esa previsibilidad es la base de su afirmación de escasez."
  - id: value
    prompt:
      en: "Which of these does NOT confer durable value to a token?"
      es: "¿Cuál de estos NO aporta valor duradero a un token?"
    options:
      - id: a
        correct: true
        text:
          en: "A headline 'market cap' that is a tiny float times a fantasy price."
          es: "Un 'market cap' de titular que es un float minúsculo por un precio de fantasía."
      - id: b
        text:
          en: "Genuine demand from people who need the token to use the network, not to flip it."
          es: "Demanda genuina de gente que necesita el token para usar la red, no para revenderlo."
      - id: c
        text:
          en: "Credible scarcity that nobody can quietly revise later."
          es: "Escasez creíble que nadie pueda revisar en silencio más adelante."
      - id: d
        text:
          en: "Network effects that make leaving the token costly for those who use it."
          es: "Efectos de red que hacen costoso irse para quienes lo usan."
    explanation:
      en: "Real value comes from use, credible scarcity and network effects — all of which survive a bad week. A headline cap on a tiny float is narrative: a number that exists only while nobody sells."
      es: "El valor real viene del uso, la escasez creíble y los efectos de red: todo eso sobrevive a una mala semana. Un cap de titular sobre un float minúsculo es narrativa: un número que solo existe mientras nadie vende."
  - id: asset-classes-match
    kind: matching
    prompt:
      en: "Match each type of crypto asset to its defining property."
      es: "Empareja cada tipo de activo cripto con su propiedad definitoria."
    pairs:
      - id: btc
        left: { en: "Bitcoin (BTC)", es: "Bitcoin (BTC)" }
        right:
          en: "The oldest, most decentralised chain; scarce, with a fixed supply capped at 21 million."
          es: "La cadena más antigua y descentralizada; escasa, con una emisión fija limitada a 21 millones."
      - id: alt
        left: { en: "Altcoin", es: "Altcoin" }
        right:
          en: "Everything that isn't Bitcoin — quality ranges from serious platforms to worthless tokens."
          es: "Todo lo que no es Bitcoin: la calidad va desde plataformas serias hasta tokens sin valor."
      - id: stable
        left: { en: "Stablecoin", es: "Stablecoin" }
        right:
          en: "Aims to hold a fixed value (usually 1 USD), backed by the issuer's reserves."
          es: "Busca mantener un valor fijo (normalmente 1 USD), respaldado por las reservas del emisor."
    explanation:
      en: "Bitcoin is the scarce reserve asset; 'altcoin' just means 'not Bitcoin' and says nothing about quality; a stablecoin targets a fixed value via reserves."
      es: "Bitcoin es el activo de reserva escaso; 'altcoin' solo significa 'no Bitcoin' y no dice nada sobre la calidad; una stablecoin apunta a un valor fijo mediante reservas."
  - id: durable-value
    kind: multi_select
    prompt:
      en: "Select ALL of the following that give a token durable value."
      es: "Selecciona TODO lo siguiente que aporta valor duradero a un token."
    options:
      - id: a
        text:
          en: "An influencer's endorsement to an audience that buys whatever he posts."
          es: "El respaldo de un influencer ante un público que compra lo que publique."
      - id: b
        correct: true
        text:
          en: "Genuine demand from people who need it to use the network."
          es: "Demanda genuina de gente que lo necesita para usar la red."
      - id: c
        text:
          en: "A price that rose last week on volume the chart calls strong."
          es: "Un precio que subió la semana pasada con un volumen que el gráfico llama fuerte."
      - id: d
        correct: true
        text:
          en: "Credible scarcity nobody can quietly revise later."
          es: "Escasez creíble que nadie pueda revisar en silencio."
      - id: e
        text:
          en: "A slick site and a marketing budget larger than the engineering one."
          es: "Una web bonita y un presupuesto de marketing mayor que el de ingeniería."
      - id: f
        correct: true
        text:
          en: "Network effects that make leaving costly for those who use it."
          es: "Efectos de red que hacen costoso irse para quienes lo usan."
    explanation:
      en: "Durable value comes from real demand, credible scarcity and network effects. An endorsement, a recent pump and a marketing budget are narrative — real in the short term, worthless as long-term collateral, and all three can be bought."
      es: "El valor duradero viene de la demanda real, la escasez creíble y los efectos de red. Un respaldo, una subida reciente y un presupuesto de marketing son narrativa: reales a corto plazo, inútiles como colateral a largo, y las tres se pueden comprar."
  - id: stablecoin-gov-myth
    kind: true_false
    prompt:
      en: "A stablecoin's peg holds only as long as its issuer can honour redemptions at 1 USD."
      es: "La paridad de una stablecoin se sostiene solo mientras su emisor pueda atender los reembolsos a 1 USD."
    answer: true
    explanation:
      en: "True — and no government is standing behind it. A stablecoin targets a fixed value through reserves its issuer holds, so if the issuer cannot honour what it claims, the peg breaks. Pegs have broken."
      es: "Cierto, y ningún gobierno está detrás. Una stablecoin apunta a un valor fijo mediante reservas de su emisor, así que si el emisor no puede atender lo que promete, la paridad se rompe. Se han roto paridades."
  - id: altcoin-quality
    prompt:
      en: "What does calling a coin 'an altcoin' tell you about its quality?"
      es: "¿Qué te dice sobre su calidad llamar 'altcoin' a una moneda?"
    options:
      - id: a
        text:
          en: "That it is lower quality than Bitcoin: the label is a ranking, Bitcoin first."
          es: "Que es de menor calidad que Bitcoin: la etiqueta es un ranking, con Bitcoin primero."
      - id: b
        text:
          en: "That it is a scam — the serious projects call themselves protocols, not altcoins."
          es: "Que es una estafa: los proyectos serios se llaman protocolos, no altcoins."
      - id: c
        text:
          en: "That it is a safe long-term hold, since it lasted long enough to earn a name."
          es: "Que es una inversión segura a largo plazo, porque duró lo bastante para tener nombre."
      - id: d
        correct: true
        text:
          en: "Nothing by itself — the word only means 'not Bitcoin', which is not a quality."
          es: "Nada por sí solo: la palabra solo significa 'no Bitcoin'."
    explanation:
      en: "'Altcoin' just means 'not Bitcoin'. Underneath the label the range runs from serious platforms to tokens made only to be sold to you, so it sorts nothing — you still have to look at each one on its own."
      es: "'Altcoin' solo significa 'no Bitcoin'. Debajo de la etiqueta hay de todo, desde plataformas serias hasta tokens creados solo para vendértelos, así que no ordena nada: sigues teniendo que mirar cada una por separado."
  - id: market-cap-myth
    kind: true_false
    prompt:
      en: "A token's market cap tells you how much real money has been invested in it."
      es: "El market cap de un token te dice cuánto dinero real se ha invertido en él."
    answer: false
    explanation:
      en: "Market cap is just price × total supply, and that price comes from the last trade of whatever thin slice actually changes hands. It is a number, not a pool of money you could ever withdraw."
      es: "El market cap es solo precio × suministro total, y ese precio sale de la última operación de la porción mínima que realmente cambia de manos. Es un número, no un fondo de dinero que puedas retirar."
  - id: thin-float
    prompt:
      en: "A token trades at 2 USD with a total supply of 1 billion, so its headline market cap is 2 billion USD. Only 1% of the supply really circulates and the order book holds about 200,000 USD of genuine bids. What does that 2 billion figure represent?"
      es: "Un token cotiza a 2 USD con un suministro total de 1.000 millones, así que su market cap de titular es de 2.000 millones de USD. Solo el 1% del suministro circula de verdad y el libro de órdenes tiene unos 200.000 USD de bids reales. ¿Qué representa esa cifra de 2.000 millones?"
    options:
      - id: a
        text:
          en: "The 2 billion USD that entered the token, which its holders could withdraw."
          es: "Los 2.000 millones de USD que entraron en el token y que sus holders podrían retirar."
      - id: b
        correct: true
        text:
          en: "Almost nothing real: a tiny float times a price nobody is obliged to honour."
          es: "Casi nada real: un float minúsculo por un precio que nadie está obligado a sostener."
      - id: c
        text:
          en: "A floor — the cap is the value the book would defend before letting price break."
          es: "Un suelo: el cap es el valor que el libro defendería antes de dejar caer el precio."
      - id: d
        text:
          en: "Proof it is deeper than a smaller-cap token, since cap and liquidity track."
          es: "La prueba de que es más profundo que uno de cap menor, porque cap y liquidez van juntos."
    explanation:
      en: "A big market cap on a thin float is not wealth and not safety — it is a number that exists only while nobody sells. The real liquidity here is the 200,000 USD in the book, a rounding error next to the quoted 'cap', and a holder selling a few hundred thousand would collapse it."
      es: "Un market cap grande sobre un float minúsculo no es riqueza ni seguridad: es un número que solo existe mientras nadie vende. La liquidez real aquí son los 200.000 USD del libro, un error de redondeo al lado del 'cap' publicado, y un holder que vendiera unos cientos de miles lo hundiría."
  - id: stablecoin-truths
    kind: multi_select
    prompt:
      en: "Select ALL statements that are true of a stablecoin like USDT or USDC."
      es: "Selecciona TODAS las afirmaciones que son ciertas para una stablecoin como USDT o USDC."
    options:
      - id: a
        correct: true
        text:
          en: "It is the cash leg of crypto trading — where value waits between trades."
          es: "Es la pata de efectivo del trading cripto: donde espera el valor entre operaciones."
      - id: b
        text:
          en: "Its peg is legally guaranteed, so a court would make holders whole at 1 USD."
          es: "Su paridad está garantizada legalmente, así que un juez repondría a los holders a 1 USD."
      - id: c
        correct: true
        text:
          en: "Holding it is a credit exposure to its issuer, not risk-free cash."
          es: "Tenerla es una exposición de crédito a su emisor, no efectivo libre de riesgo."
      - id: d
        text:
          en: "It cannot trade away from 1 USD, because arbitrage closes any gap at once."
          es: "No puede cotizar lejos de 1 USD, porque el arbitraje cierra cualquier hueco al momento."
      - id: e
        correct: true
        text:
          en: "On a futures venue it is usually the collateral your positions margin in."
          es: "En un venue de futuros suele ser el colateral con el que se margina tu posición."
    explanation:
      en: "A stablecoin is the cash leg and usually your margin collateral, which is exactly why it matters that it is a claim on an issuer rather than risk-free cash. 'Stable' is an aim, not a law: no court sets the price, and arbitrage only works while someone is willing to redeem."
      es: "Una stablecoin es la pata de efectivo y normalmente tu colateral de margen, y precisamente por eso importa que sea un derecho frente a un emisor y no efectivo libre de riesgo. 'Estable' es un objetivo, no una ley: ningún juez fija el precio, y el arbitraje solo funciona mientras alguien esté dispuesto a reembolsar."
  - id: depeg-cases
    kind: matching
    prompt:
      en: "Match each stablecoin episode to what actually happened."
      es: "Empareja cada episodio de stablecoin con lo que ocurrió realmente."
    pairs:
      - id: ust
        left: { en: "UST, May 2022", es: "UST, mayo de 2022" }
        right:
          en: "Propped up by mechanism rather than real reserves; lost its peg and collapsed toward zero within days."
          es: "Sostenida por un mecanismo en vez de reservas reales; perdió la paridad y se hundió hacia cero en días."
      - id: usdc
        left: { en: "USDC, March 2023", es: "USDC, marzo de 2023" }
        right:
          en: "Well reserved, but part of those reserves sat in a failing bank; briefly traded near 0.88 USD and recovered once backstopped."
          es: "Bien respaldada, pero parte de sus reservas estaba en un banco en quiebra; cotizó brevemente cerca de 0,88 USD y se recuperó al ser respaldada."
      - id: margin
        left: { en: "A de-peg while you hold futures positions", es: "Una pérdida de paridad mientras tienes posiciones de futuros" }
        right:
          en: "Your margin itself moves, so it distorts every open position at once — not just one holding."
          es: "Tu propio margen se mueve, así que distorsiona todas las posiciones abiertas a la vez, no solo una tenencia."
    explanation:
      en: "A stablecoin is only as good as its reserves and its ability to honour redemptions. UST had mechanism instead of reserves; USDC had real reserves in the wrong bank. Either way the risk lands on your collateral."
      es: "Una stablecoin vale lo que valen sus reservas y su capacidad de atender los reembolsos. UST tenía mecanismo en vez de reservas; USDC tenía reservas reales en el banco equivocado. En ambos casos el riesgo cae sobre tu colateral."
