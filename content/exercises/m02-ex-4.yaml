# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: api-key-scope
    prompt:
      en: "You want to connect a portfolio tracker that only needs to read your balances. What kind of API key should you give it?"
      es: "Quieres conectar un tracker de cartera que solo necesita leer tus saldos. ¿Qué tipo de API key deberías darle?"
    options:
      - id: a
        text:
          en: "A full-access key — simpler, and the app has good reviews."
          es: "Una clave de acceso total: más simple, y la app tiene buenas reseñas."
      - id: b
        text:
          en: "A key with withdrawals enabled, so it can rebalance the portfolio for you."
          es: "Una clave con retiros activados, para que rebalancee la cartera por ti."
      - id: c
        correct: true
        text:
          en: "A read-only key, with trading and withdrawals disabled."
          es: "Una clave de solo lectura, con trading y retiros desactivados."
      - id: d
        text:
          en: "Your account password, since an API key is weaker than a login."
          es: "La contraseña de tu cuenta, porque una API key es más débil que un login."
    explanation:
      en: "Grant the least access the tool needs: read-only is enough to show balances. A key that can trade or withdraw is a spare key to your funds, however good the reviews are, and your account password is not a credential you hand to software at all."
      es: "Concede el mínimo acceso que necesita la herramienta: solo lectura basta para mostrar saldos. Una clave que puede operar o retirar es una copia de la clave de tus fondos, por buenas que sean las reseñas, y la contraseña de la cuenta no es una credencial que se entregue a ningún software."
  - id: 2fa-whitelist
    prompt:
      en: "Which pair of measures best protects a CEX account?"
      es: "¿Qué par de medidas protege mejor una cuenta de un CEX?"
    options:
      - id: a
        correct: true
        text:
          en: "App-based 2FA together with a whitelist of approved withdrawal addresses."
          es: "2FA con app junto con una lista blanca de direcciones de retiro aprobadas."
      - id: b
        text:
          en: "SMS-based 2FA plus a password long enough to resist guessing."
          es: "2FA por SMS más una contraseña lo bastante larga para resistir intentos."
      - id: c
        text:
          en: "A full-access API key plus an email alert on every login."
          es: "Una API key de acceso total más una alerta por correo en cada inicio."
      - id: d
        text:
          en: "Reusing the strong password that already protects your email."
          es: "Reutilizar la contraseña fuerte que ya protege tu correo."
    explanation:
      en: "App-based 2FA resists the SIM-swap attacks that defeat SMS, and a withdrawal whitelist stops an intruder sending coins to a new address. Password length is irrelevant once the second factor is stolen, an alert tells you after the fact, and a reused password means one breached site unlocks the exchange."
      es: "El 2FA con app resiste los ataques de SIM-swap que vencen al SMS, y una lista blanca de retiros impide que un intruso envíe monedas a una dirección nueva. La longitud de la contraseña da igual una vez robado el segundo factor, una alerta te avisa cuando ya ha pasado, y una contraseña reutilizada hace que un sitio filtrado abra el exchange."
  - id: sms-2fa-myth
    kind: true_false
    prompt:
      en: "SMS 2FA is the weakest of the common second factors, because a SIM-swap hands your codes to the attacker."
      es: "El 2FA por SMS es el más débil de los segundos factores habituales, porque un SIM-swap entrega tus códigos al atacante."
    answer: true
    explanation:
      en: "True. The code is delivered to a phone number, and a phone number is something a carrier can be talked into moving. An authenticator app has no number to steal, which is why it is the stronger default."
      es: "Cierto. El código se entrega a un número de teléfono, y a una operadora se la puede convencer de mover un número. Una app de autenticación no tiene número que robar, y por eso es el criterio por defecto más fuerte."
  - id: security-practices
    kind: multi_select
    prompt:
      en: "Select ALL practices that genuinely reduce the risk to a CEX account."
      es: "Selecciona TODAS las prácticas que reducen de verdad el riesgo de una cuenta de un CEX."
    options:
      - id: a
        correct: true
        text:
          en: "Two-factor codes from an authenticator app, not SMS."
          es: "Códigos de dos factores desde una app de autenticación, no por SMS."
      - id: b
        correct: true
        text:
          en: "A whitelist of approved withdrawal addresses."
          es: "Una lista blanca de direcciones de retiro aprobadas."
      - id: c
        correct: true
        text:
          en: "A read-only API key for the portfolio tracker."
          es: "Una API key de solo lectura para el tracker de cartera."
      - id: d
        text:
          en: "Reusing your email password so it is easy to remember."
          es: "Reutilizar la contraseña del correo para acordarte fácil."
      - id: e
        text:
          en: "An API key with withdrawals enabled, for convenience."
          es: "Una API key con los retiros activados, por comodidad."
    explanation:
      en: "App 2FA, a withdrawal whitelist and least-privilege API keys each limit the damage from a single failure. The other two do the opposite: a reused password turns any breached site into a way in, and a withdrawal-capable key is a spare key to the funds."
      es: "El 2FA con app, una lista blanca de retiros y las API keys de mínimo privilegio limitan cada una el daño de un solo fallo. Las otras dos hacen lo contrario: una contraseña reutilizada convierte cualquier sitio filtrado en una puerta, y una clave con retiros es una copia de la llave de los fondos."
  - id: measure-threat-match
    kind: matching
    prompt:
      en: "Match each security measure to the threat it limits."
      es: "Empareja cada medida de seguridad con la amenaza que limita."
    pairs:
      - id: app2fa
        left: { en: "Authenticator-app 2FA", es: "2FA con app de autenticación" }
        right:
          en: "Resists the SIM-swap attacks that defeat SMS codes"
          es: "Resiste los ataques de SIM-swap que vencen a los códigos por SMS"
      - id: whitelist
        left: { en: "Withdrawal address whitelist", es: "Lista blanca de direcciones de retiro" }
        right:
          en: "Stops an intruder sending coins to a new address"
          es: "Impide que un intruso envíe monedas a una dirección nueva"
      - id: readonly
        left: { en: "Read-only API key", es: "API key de solo lectura" }
        right:
          en: "A leaked key still can't trade or withdraw"
          es: "Una clave filtrada aún no puede operar ni retirar"
      - id: unique-pw
        left: { en: "A unique password per site", es: "Una contraseña única por sitio" }
        right:
          en: "One leaked site can't unlock your exchange"
          es: "Un sitio filtrado no puede abrir tu exchange"
    explanation:
      en: "Each measure targets a specific failure: app 2FA vs SIM-swap, a whitelist vs rogue withdrawals, a read-only key vs a leaked key, and unique passwords vs credential reuse."
      es: "Cada medida ataca un fallo concreto: el 2FA con app frente al SIM-swap, la lista blanca frente a retiros no autorizados, la clave de solo lectura frente a una clave filtrada, y las contraseñas únicas frente a la reutilización de credenciales."
  - id: withdrawal-whitelist-use
    prompt:
      en: "What does a withdrawal address whitelist actually protect you from?"
      es: "¿De qué te protege en realidad una lista blanca de direcciones de retiro?"
    options:
      - id: a
        text:
          en: "It hides your balance from the other users trading on the exchange."
          es: "Oculta tu saldo a los demás usuarios que operan en el exchange."
      - id: b
        correct: true
        text:
          en: "An intruder still cannot send coins to an unapproved address."
          es: "Un intruso sigue sin poder enviar monedas a una dirección nueva."
      - id: c
        text:
          en: "It lowers the fee you pay each time you withdraw to a saved address."
          es: "Reduce la comisión que pagas al retirar a una dirección guardada."
      - id: d
        text:
          en: "It automatically reverses any withdrawal you later regret making."
          es: "Revierte automáticamente cualquier retiro del que luego te arrepientas."
    explanation:
      en: "A whitelist locks withdrawals to addresses you pre-approved, ideally with a delay before a new one becomes usable. It changes nothing about privacy, fees, or the finality of a withdrawal once it is on-chain — it just means an intruder in your account has nowhere to send the coins."
      es: "Una lista blanca limita los retiros a direcciones que aprobaste de antemano, idealmente con un retardo antes de que una nueva sea utilizable. No cambia nada sobre la privacidad, las comisiones ni la irreversibilidad de un retiro ya on-chain: solo hace que un intruso en tu cuenta no tenga adónde enviar las monedas."
  - id: api-withdraw-tf
    kind: true_false
    prompt:
      en: "An API key with withdrawals enabled is safe to hand to any third-party app you like the look of."
      es: "Una API key con los retiros activados se puede dar sin problema a cualquier app de terceros que te dé buena espina."
    answer: false
    explanation:
      en: "An API key that can withdraw is a spare key to your funds: if the app is malicious or gets breached, your coins can leave. Give tools the least access they need — read-only, or trade-only with withdrawals disabled."
      es: "Una API key que puede retirar es una copia de la clave de tus fondos: si la app es maliciosa o sufre una brecha, tus monedas pueden salir. Da a las herramientas el mínimo acceso que necesitan: solo lectura, o solo trading con los retiros desactivados."
  - id: sim-swap
    prompt:
      en: "Why is an authenticator app stronger than SMS codes, even if your password is excellent?"
      es: "¿Por qué una app de autenticación es más fuerte que los códigos por SMS, aunque tu contraseña sea excelente?"
    options:
      - id: a
        text:
          en: "App codes are longer, so they cannot realistically be guessed."
          es: "Los códigos de la app son más largos y no se pueden adivinar."
      - id: b
        text:
          en: "SMS codes get reused across logins, while app codes are unique."
          es: "Los códigos SMS se reutilizan entre inicios y los de la app son únicos."
      - id: c
        text:
          en: "The app also encrypts the password you store on the exchange."
          es: "La app además cifra la contraseña que guardas en el exchange."
      - id: d
        correct: true
        text:
          en: "SMS codes ride on your phone number, and whoever takes the number takes the codes."
          es: "Los códigos SMS dependen de tu número, y quien se lleva el número se lleva los códigos."
    explanation:
      en: "This is the SIM-swap: an attacker social-engineers your carrier into porting the number, and every code follows it. People with excellent passwords have been cleaned out overnight this way, because the second factor was something a phone shop could reassign. Code length and uniqueness are not the difference — having no number to steal is."
      es: "Es el SIM-swap: un atacante engaña a tu operadora para portar el número, y todos los códigos se van con él. Gente con contraseñas excelentes ha sido vaciada de la noche a la mañana así, porque el segundo factor era algo que una tienda de móviles podía reasignar. La diferencia no es la longitud ni la unicidad del código: es no tener número que robar."
  - id: takeover-steps
    kind: ordering
    prompt:
      en: "Put the steps of a SIM-swap account takeover in order."
      es: "Ordena los pasos de un robo de cuenta por SIM-swap."
    items:
      - id: password
        position: 1
        text:
          en: "The attacker gets your password from a data breach or a phishing page."
          es: "El atacante consigue tu contraseña de una filtración de datos o una página de phishing."
      - id: port
        position: 2
        text:
          en: "They social-engineer your carrier into porting your phone number to their SIM."
          es: "Engañan a tu operadora para portar tu número de teléfono a su SIM."
      - id: code
        position: 3
        text: { en: "Your SMS 2FA codes now arrive on their phone.", es: "Tus códigos 2FA por SMS llegan ahora a su teléfono." }
      - id: login
        position: 4
        text: { en: "They log in as you.", es: "Inician sesión como si fueran tú." }
      - id: withdraw
        position: 5
        text:
          en: "They withdraw the funds, and because it settles on-chain it is final."
          es: "Retiran los fondos y, como se liquida on-chain, es definitivo."
    explanation:
      en: "A withdrawal address whitelist breaks the last step — the one that actually moves the coins — even for an attacker who completed every step before it. That is why it matters more than it looks."
      es: "Una lista blanca de direcciones de retiro rompe el último paso, el que realmente mueve las monedas, incluso para un atacante que completó todos los anteriores. Por eso importa más de lo que parece."
  - id: bounded-loss
    prompt:
      en: "What is the goal that 2FA, scoped API keys and a withdrawal whitelist all share?"
      es: "¿Cuál es el objetivo que comparten el 2FA, las API keys con permisos limitados y la lista blanca de retiros?"
    options:
      - id: a
        text:
          en: "Being un-hackable, once all three are configured together."
          es: "Ser inhackeable, una vez configuradas las tres juntas."
      - id: b
        text:
          en: "Making withdrawals faster and cheaper by pre-approving each address."
          es: "Hacer los retiros más rápidos y baratos aprobando antes cada dirección."
      - id: c
        correct: true
        text:
          en: "Bounded loss — making sure one failure cannot empty the account."
          es: "Pérdida acotada: que un solo fallo no pueda vaciar la cuenta."
      - id: d
        text:
          en: "Proving your identity to the regulators supervising the venue."
          es: "Probar tu identidad ante los reguladores que supervisan el venue."
    explanation:
      en: "Security isn't about being un-hackable — that is not on the menu, and no combination of three controls puts it there. Every control here exists to limit the blast radius, turning a total loss into a survivable one. Speed and compliance are somebody else's goals."
      es: "La seguridad no consiste en ser inhackeable: eso no está en el menú, y ninguna combinación de tres controles lo consigue. Cada control existe para limitar el radio de daño, convirtiendo una pérdida total en una soportable. La velocidad y el cumplimiento son objetivos de otros."
