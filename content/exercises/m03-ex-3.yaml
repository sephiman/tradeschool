# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: uptrend-definition
    prompt:
      en: "Which pattern defines an uptrend?"
      es: "¿Qué patrón define una tendencia alcista?"
    options:
      - id: a
        correct: true
        text:
          en: "A sequence of higher highs and higher lows together."
          es: "Una secuencia de máximos más altos y mínimos más altos."
      - id: b
        text:
          en: "Price bouncing between a fixed ceiling and a fixed floor."
          es: "El precio rebotando entre un techo fijo y un suelo fijo."
      - id: c
        text:
          en: "A sequence of higher highs paired with lower lows."
          es: "Una secuencia de máximos más altos junto con mínimos más bajos."
      - id: d
        text:
          en: "A single large green candle that closes near its high."
          es: "Una sola vela verde grande que cierra cerca de su máximo."
    explanation:
      en: "An uptrend makes net upward progress: each peak above the last and each dip bottoming above the previous one — both halves, not one. Higher highs with lower lows is an expanding, directionless structure, a fixed band is a range, and one big candle is not a trend at all."
      es: "Una tendencia alcista avanza de forma neta hacia arriba: cada pico por encima del anterior y cada caída con un fondo por encima del previo, ambas mitades y no solo una. Máximos más altos con mínimos más bajos es una estructura que se expande sin dirección, una banda fija es un rango, y una sola vela grande no es una tendencia."
  - id: range-recognition
    prompt:
      en: "Price has spent two weeks bouncing between roughly 100 and 110 with no net progress. What is it doing, and what follows?"
      es: "El precio lleva dos semanas rebotando entre aproximadamente 100 y 110 sin avance neto. ¿Qué está haciendo y qué se deduce?"
    options:
      - id: a
        correct: true
        text:
          en: "It is ranging: trend tactics tend to fail here."
          es: "Está en rango: las tácticas de tendencia tienden a fallar aquí."
      - id: b
        text:
          en: "An uptrend, because it keeps bouncing up from the 100 floor."
          es: "Tendencia alcista, porque sigue rebotando al alza desde el suelo de 100."
      - id: c
        text:
          en: "A downtrend, because it keeps falling back from the 110 ceiling."
          es: "Tendencia bajista, porque sigue cayendo desde el techo de 110."
      - id: d
        text:
          en: "Nothing — price always trends, so a range cannot last two weeks."
          es: "Nada: el precio siempre tiene tendencia, así que un rango no dura dos semanas."
    explanation:
      en: "Similar highs and similar lows with no net progress is a range. Reading each bounce off 100 as an 'uptrend' — or each rejection at 110 as a downtrend — is the classic mistake: the moves cancel out. Markets range most of the time, and a two-week one is entirely ordinary."
      es: "Máximos parecidos y mínimos parecidos sin avance neto es un rango. Leer cada rebote en 100 como una 'tendencia alcista' —o cada rechazo en 110 como bajista— es el error clásico: los movimientos se cancelan. Los mercados están en rango la mayor parte del tiempo, y uno de dos semanas es de lo más corriente."
  - id: structure-match
    kind: matching
    prompt:
      en: "Match each price structure to its definition."
      es: "Empareja cada estructura de precio con su definición."
    pairs:
      - id: up
        left: { en: "Uptrend", es: "Tendencia alcista" }
        right:
          en: "Higher highs and higher lows."
          es: "Máximos más altos y mínimos más altos."
      - id: down
        left: { en: "Downtrend", es: "Tendencia bajista" }
        right:
          en: "Lower highs and lower lows."
          es: "Máximos más bajos y mínimos más bajos."
      - id: range
        left: { en: "Range", es: "Rango" }
        right:
          en: "Similar highs and similar lows, with no net progress."
          es: "Máximos parecidos y mínimos parecidos, sin avance neto."
    explanation:
      en: "An uptrend steps up (higher highs, higher lows), a downtrend steps down (lower highs, lower lows), and a range goes sideways between similar highs and lows."
      es: "Una tendencia alcista escala (máximos y mínimos más altos), una bajista desciende (máximos y mínimos más bajos), y un rango se mueve de lado entre máximos y mínimos parecidos."
  - id: downtrend-def
    prompt:
      en: "Which pattern defines a downtrend?"
      es: "¿Qué patrón define una tendencia bajista?"
    options:
      - id: a
        text:
          en: "A sequence of lower highs paired with higher lows."
          es: "Una secuencia de máximos más bajos junto con mínimos más altos."
      - id: b
        text:
          en: "A single large red candle that closes near its low."
          es: "Una sola vela roja grande que cierra cerca de su mínimo."
      - id: c
        text:
          en: "Price bouncing between a fixed ceiling and a fixed floor."
          es: "El precio rebotando entre un techo fijo y un suelo fijo."
      - id: d
        correct: true
        text:
          en: "A sequence of lower highs and lower lows, one after the other."
          es: "Una secuencia de máximos más bajos y mínimos más bajos, uno tras otro."
    explanation:
      en: "A downtrend makes net downward progress: each peak below the last and each bounce topping out below the previous one. Lower highs with higher lows is a contracting, directionless structure, a fixed band is a range, and one big candle is not a trend."
      es: "Una tendencia bajista avanza de forma neta hacia abajo: cada pico por debajo del anterior y cada rebote con un techo por debajo del previo. Máximos más bajos con mínimos más altos es una estructura que se contrae sin dirección, una banda fija es un rango, y una sola vela grande no es una tendencia."
  - id: trend-rarity-myth
    kind: true_false
    prompt:
      en: "Markets spend most of their time ranging, and trends are the exception."
      es: "Los mercados pasan la mayor parte del tiempo en rango, y las tendencias son la excepción."
    answer: true
    explanation:
      en: "True, and that is exactly why identifying a real trend is worth the effort — and why trend tactics applied to the default state get shredded."
      es: "Cierto, y por eso precisamente vale la pena identificar una tendencia real, y por eso las tácticas de tendencia aplicadas al estado por defecto acaban destrozadas."
  - id: trend-range-multi
    kind: multi_select
    prompt:
      en: "Select ALL statements about trends and ranges that are true."
      es: "Selecciona TODAS las afirmaciones sobre tendencias y rangos que sean ciertas."
    options:
      - id: a
        correct: true
        text:
          en: "Tactics that work in a trend can get shredded in a range, and vice versa."
          es: "Las tácticas que funcionan en tendencia se destrozan en rango, y al revés."
      - id: b
        correct: true
        text:
          en: "An uptrend requires higher highs and higher lows together."
          es: "Una tendencia alcista requiere máximos y mínimos más altos a la vez."
      - id: c
        text:
          en: "One big green candle is enough to establish an uptrend on its own."
          es: "Una sola vela verde grande basta por sí sola para establecer una tendencia alcista."
      - id: d
        text:
          en: "A range cannot last two weeks, because price is always trending."
          es: "Un rango no puede durar dos semanas, porque el precio siempre tiene tendencia."
    explanation:
      en: "An uptrend needs both halves of the pattern at once, and matching your tactics to the regime is most of the job. A single candle is not a structure, and ranges routinely last weeks — they are the market's default, not an anomaly."
      es: "Una tendencia alcista necesita las dos mitades del patrón a la vez, y ajustar las tácticas al régimen es buena parte del trabajo. Una sola vela no es una estructura, y los rangos duran semanas con frecuencia: son el estado por defecto del mercado, no una anomalía."
  - id: downtrend-example
    prompt:
      en: "Over three swings, price makes highs at 100, 95 and 91, and lows at 88, 84 and 80. What is this?"
      es: "En tres oscilaciones, el precio marca máximos en 100, 95 y 91, y mínimos en 88, 84 y 80. ¿Qué es esto?"
    options:
      - id: a
        text:
          en: "A range, because price keeps oscillating between highs and lows."
          es: "Un rango, porque el precio oscila entre máximos y mínimos."
      - id: b
        correct: true
        text:
          en: "A downtrend: every high and every low is below the one before."
          es: "Una tendencia bajista: cada máximo y cada mínimo está por debajo del anterior."
      - id: c
        text:
          en: "An uptrend, because the lows keep being defended each time."
          es: "Una tendencia alcista, porque los mínimos se defienden cada vez."
      - id: d
        text:
          en: "Nothing readable, since there is no volume data attached."
          es: "Nada legible, ya que no hay datos de volumen adjuntos."
    explanation:
      en: "Lower highs plus lower lows is the definition of a downtrend. Oscillation alone does not make a range — a range needs *similar* highs and lows, and these step steadily down. Structure is read off the sequence of swings, and it needs no volume series to be legible."
      es: "Máximos decrecientes más mínimos decrecientes es la definición de tendencia bajista. Oscilar por sí solo no hace un rango: un rango necesita máximos y mínimos *parecidos*, y estos bajan de forma sostenida. La estructura se lee de la secuencia de oscilaciones y no necesita ninguna serie de volumen para ser legible."
  - id: why-range-default
    prompt:
      en: "Why is ranging the market's default state, with trends the exception?"
      es: "¿Por qué el rango es el estado por defecto del mercado y las tendencias la excepción?"
    options:
      - id: a
        text:
          en: "Exchanges cap how far price can move per day, forcing sideways action."
          es: "Los exchanges limitan cuánto puede moverse el precio al día y fuerzan el lateral."
      - id: b
        text:
          en: "Ranges happen when volume is missing; trends need none."
          es: "Los rangos ocurren cuando falta volumen; las tendencias no lo necesitan."
      - id: c
        correct: true
        text:
          en: "A range is balance — neither side can force a breakout."
          es: "Un rango es equilibrio: ningún lado puede forzar la ruptura."
      - id: d
        text:
          en: "Most traders trade ranges, so their own orders keep creating them."
          es: "La mayoría de traders operan rangos, así que sus órdenes los crean."
    explanation:
      en: "Buyers defend the floor, sellers cap the ceiling, and the result is chop: a sustained one-sided imbalance is expensive to maintain and therefore rare. Nothing imposes it from outside — there is no daily cap, and a trend takes *more* participation than a range, not less. That is exactly why a real trend is worth riding when you find one."
      es: "Los compradores defienden el suelo, los vendedores tapan el techo, y el resultado es serrucho: un desequilibrio sostenido hacia un solo lado es caro de mantener y por eso raro. Nada lo impone desde fuera: no hay límite diario, y una tendencia exige *más* participación que un rango, no menos. Precisamente por eso una tendencia real merece la pena cuando la encuentras."
  - id: mini-trend-tf
    kind: true_false
    prompt:
      en: "Any single day inside a two-week range can look like a mini-trend on a lower timeframe."
      es: "Cualquier día dentro de un rango de dos semanas puede parecer una mini-tendencia en una temporalidad menor."
    answer: true
    explanation:
      en: "True, and it is the trap: BTC bouncing between 59,000 and 62,000 for two weeks is ranging even though individual days inside it trend. Read structure on the timeframe you are actually trading."
      es: "Cierto, y es la trampa: BTC rebotando entre 59.000 y 62.000 durante dos semanas está en rango aunque los días individuales tengan tendencia. Lee la estructura en la temporalidad que realmente operas."
