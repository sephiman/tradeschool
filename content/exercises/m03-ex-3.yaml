# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: uptrend-definition
    prompt:
      en: "Which pattern defines an uptrend?"
      es: "¿Qué patrón define una tendencia alcista?"
    options:
      - id: a
        correct: true
        text:
          en: "A sequence of higher highs and higher lows."
          es: "Una secuencia de máximos más altos y mínimos más altos."
      - id: b
        text:
          en: "A sequence of higher highs and lower lows."
          es: "Una secuencia de máximos más altos y mínimos más bajos."
      - id: c
        text:
          en: "Price bouncing between a fixed ceiling and floor."
          es: "El precio rebotando entre un techo y un suelo fijos."
      - id: d
        text:
          en: "A single large green candle."
          es: "Una sola vela verde grande."
    explanation:
      en: "An uptrend makes net upward progress: each peak above the last and each dip bottoming above the previous one. Higher highs with lower lows is an expanding, directionless structure, and one big candle is not a trend."
      es: "Una tendencia alcista avanza de forma neta hacia arriba: cada pico por encima del anterior y cada caída con un fondo por encima del previo. Máximos más altos con mínimos más bajos es una estructura que se expande sin dirección, y una sola vela grande no es una tendencia."
  - id: range-recognition
    prompt:
      en: "Price has spent two weeks bouncing between roughly 100 and 110 with no net progress. What is it doing, and what follows?"
      es: "El precio lleva dos semanas rebotando entre aproximadamente 100 y 110 sin avance neto. ¿Qué está haciendo y qué se deduce?"
    options:
      - id: a
        correct: true
        text:
          en: "It is ranging; trend-following tactics tend to fail here because there is no directional progress."
          es: "Está en rango; las tácticas de seguimiento de tendencia tienden a fallar aquí porque no hay avance direccional."
      - id: b
        text:
          en: "It is in an uptrend, because it keeps bouncing up from 100."
          es: "Está en tendencia alcista, porque sigue rebotando al alza desde 100."
      - id: c
        text:
          en: "It is in a downtrend, because it keeps falling back from 110."
          es: "Está en tendencia bajista, porque sigue cayendo desde 110."
      - id: d
        text:
          en: "Nothing — price is always trending, so a range cannot last two weeks."
          es: "Nada: el precio siempre está en tendencia, así que un rango no puede durar dos semanas."
    explanation:
      en: "Similar highs and similar lows with no net progress is a range. Reading each bounce off 100 as an 'uptrend' is the classic mistake — the bounces cancel out, and markets range most of the time."
      es: "Máximos parecidos y mínimos parecidos sin avance neto es un rango. Leer cada rebote en 100 como una 'tendencia alcista' es el error clásico: los rebotes se cancelan, y los mercados están en rango la mayor parte del tiempo."
  - id: structure-match
    kind: matching
    prompt:
      en: "Match each price structure to its definition."
      es: "Empareja cada estructura de precio con su definición."
    pairs:
      - id: up
        left: { en: "Uptrend", es: "Tendencia alcista" }
        right:
          en: "Higher highs and higher lows."
          es: "Máximos más altos y mínimos más altos."
      - id: down
        left: { en: "Downtrend", es: "Tendencia bajista" }
        right:
          en: "Lower highs and lower lows."
          es: "Máximos más bajos y mínimos más bajos."
      - id: range
        left: { en: "Range", es: "Rango" }
        right:
          en: "Similar highs and similar lows, with no net progress."
          es: "Máximos parecidos y mínimos parecidos, sin avance neto."
    explanation:
      en: "An uptrend steps up (higher highs, higher lows), a downtrend steps down (lower highs, lower lows), and a range goes sideways between similar highs and lows."
      es: "Una tendencia alcista escala (máximos y mínimos más altos), una bajista desciende (máximos y mínimos más bajos), y un rango se mueve de lado entre máximos y mínimos parecidos."
  - id: downtrend-def
    prompt:
      en: "Which pattern defines a downtrend?"
      es: "¿Qué patrón define una tendencia bajista?"
    options:
      - id: a
        correct: true
        text:
          en: "A sequence of lower highs and lower lows."
          es: "Una secuencia de máximos más bajos y mínimos más bajos."
      - id: b
        text:
          en: "A sequence of lower highs and higher lows."
          es: "Una secuencia de máximos más bajos y mínimos más altos."
      - id: c
        text:
          en: "A single large red candle."
          es: "Una sola vela roja grande."
      - id: d
        text:
          en: "Price bouncing between a fixed ceiling and floor."
          es: "El precio rebotando entre un techo y un suelo fijos."
    explanation:
      en: "A downtrend makes net downward progress: each peak below the last and each bounce topping out below the previous one. Lower highs with higher lows is a contracting, directionless structure, and one big candle is not a trend."
      es: "Una tendencia bajista avanza de forma neta hacia abajo: cada pico por debajo del anterior y cada rebote con un techo por debajo del previo. Máximos más bajos con mínimos más altos es una estructura que se contrae sin dirección, y una sola vela grande no es una tendencia."
  - id: trend-rarity-myth
    kind: true_false
    prompt:
      en: "Most of the time, markets are trending rather than ranging."
      es: "La mayor parte del tiempo, los mercados están en tendencia en lugar de en rango."
    answer: false
    explanation:
      en: "Markets range most of the time; trends are the exception, which is exactly why identifying a real trend is worth the effort."
      es: "Los mercados están en rango la mayor parte del tiempo; las tendencias son la excepción, y por eso precisamente vale la pena identificar una tendencia real."
  - id: trend-range-multi
    kind: multi_select
    prompt:
      en: "Select ALL statements about trends and ranges that are true."
      es: "Selecciona TODAS las afirmaciones sobre tendencias y rangos que sean ciertas."
    options:
      - id: a
        correct: true
        text:
          en: "Tactics that work in a trend can get shredded in a range, and vice versa."
          es: "Las tácticas que funcionan en tendencia pueden destrozarse en un rango, y al revés."
      - id: b
        correct: true
        text:
          en: "An uptrend requires both higher highs and higher lows."
          es: "Una tendencia alcista requiere tanto máximos más altos como mínimos más altos."
      - id: c
        text:
          en: "One big green candle is enough to establish an uptrend."
          es: "Una sola vela verde grande basta para establecer una tendencia alcista."
      - id: d
        text:
          en: "A range cannot last two weeks because price is always trending."
          es: "Un rango no puede durar dos semanas porque el precio siempre está en tendencia."
    explanation:
      en: "An uptrend needs higher highs and higher lows together, and matching your tactics to the regime matters. A single candle is not a trend, and ranges routinely last a long time."
      es: "Una tendencia alcista necesita máximos más altos y mínimos más altos a la vez, y ajustar las tácticas al régimen importa. Una sola vela no es una tendencia, y los rangos duran mucho tiempo con frecuencia."
  - id: downtrend-example
    prompt:
      en: "Over three swings, price makes highs at 100, 95 and 91, and lows at 88, 84 and 80. What is this?"
      es: "En tres oscilaciones, el precio marca máximos en 100, 95 y 91, y mínimos en 88, 84 y 80. ¿Qué es esto?"
    options:
      - id: a
        correct: true
        text:
          en: "A downtrend — each high is lower than the last and each low is lower than the last."
          es: "Una tendencia bajista: cada máximo es más bajo que el anterior y cada mínimo también."
      - id: b
        text: { en: "A range, because price is oscillating between highs and lows.", es: "Un rango, porque el precio oscila entre máximos y mínimos." }
      - id: c
        text: { en: "An uptrend, because the lows keep being defended.", es: "Una tendencia alcista, porque los mínimos se siguen defendiendo." }
      - id: d
        text: { en: "Nothing readable without volume data.", es: "Nada legible sin datos de volumen." }
    explanation:
      en: "Lower highs plus lower lows is the definition of a downtrend. Structure is read off the sequence of swings, not off any single candle."
      es: "Máximos decrecientes más mínimos decrecientes es la definición de tendencia bajista. La estructura se lee de la secuencia de oscilaciones, no de una vela aislada."
  - id: why-range-default
    prompt:
      en: "Why is ranging the market's default state, with trends the exception?"
      es: "¿Por qué el rango es el estado por defecto del mercado y las tendencias la excepción?"
    options:
      - id: a
        correct: true
        text:
          en: "A range is balance — neither side can force a breakout. A sustained one-sided imbalance is expensive to maintain and therefore rare."
          es: "Un rango es equilibrio: ningún lado puede forzar la ruptura. Un desequilibrio sostenido hacia un solo lado es caro de mantener y por eso raro."
      - id: b
        text:
          en: "Exchanges cap how far price can move per day, which forces sideways action."
          es: "Los exchanges limitan cuánto puede moverse el precio al día, lo que fuerza el movimiento lateral."
      - id: c
        text:
          en: "Ranges are what happens when volume is missing; trends need no participation."
          es: "Los rangos ocurren cuando falta volumen; las tendencias no necesitan participación."
      - id: d
        text: { en: "Most traders trade ranges, so their orders create them.", es: "La mayoría de traders operan rangos, así que sus órdenes los crean." }
    explanation:
      en: "Buyers defend the floor, sellers cap the ceiling, and the result is chop. That is exactly why a real trend is worth riding when you find one — and why identifying the regime is worth the effort."
      es: "Los compradores defienden el suelo, los vendedores tapan el techo, y el resultado es serrucho. Precisamente por eso una tendencia real merece la pena cuando la encuentras, y por eso identificar el régimen vale el esfuerzo."
  - id: mini-trend-tf
    kind: true_false
    prompt:
      en: "Any single day inside a two-week range can look like a mini-trend on a lower timeframe."
      es: "Cualquier día dentro de un rango de dos semanas puede parecer una mini-tendencia en una temporalidad menor."
    answer: true
    explanation:
      en: "True, and it is the trap: BTC bouncing between 59,000 and 62,000 for two weeks is ranging even though individual days inside it trend. Read structure on the timeframe you are actually trading."
      es: "Cierto, y es la trampa: BTC rebotando entre 59.000 y 62.000 durante dos semanas está en rango aunque los días individuales tengan tendencia. Lee la estructura en la temporalidad que realmente operas."
