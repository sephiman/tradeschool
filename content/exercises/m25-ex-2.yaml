type: calculation
formula: expectancy
prompt:
  en: "A trend-following system wins only **{win_rate}** of the time (the fraction of trades in profit), but it lets winners run and cuts losers short: the average win is **{avg_win} USDT** while the average loss is just **{avg_loss} USDT**. What is the expectancy per trade?"
  es: "Un sistema seguidor de tendencia solo acierta el **{win_rate}** de las veces (la fracción de operaciones en ganancia), pero deja correr las ganadoras y corta pronto las perdedoras: la ganancia media es **{avg_win} USDT** mientras que la pérdida media es de solo **{avg_loss} USDT**. ¿Cuál es la esperanza (expectancy) por operación?"
params:
  win_rate: { kind: choice, values: ["0.3", "0.4"] }
  avg_win: { kind: int_range, min: 450, max: 700, step: 50 }
  avg_loss: { kind: int_range, min: 90, max: 150, step: 30 }
round: 2
unit: USDT
explanation:
  en: "Even winning well under half the time, this system is profitable: expectancy = win% × average win − loss% × average loss comes out positive because the payoff is large — the big average win more than pays for the frequent small losses. Win rate alone would have dismissed a system that loses most of its trades; expectancy shows the edge is real."
  es: "Aun ganando bastante menos de la mitad de las veces, este sistema es rentable: la esperanza = win% × ganancia media − loss% × pérdida media sale positiva porque el payoff es grande — la ganancia media grande paga de sobra las frecuentes pérdidas pequeñas. El win rate por sí solo habría descartado un sistema que pierde la mayoría de sus operaciones; la esperanza demuestra que el edge es real."
