# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: drawdown-asymmetry
    prompt:
      en: "Your account falls 50% in a bad month. What return, on the balance that is left, do you need to get back to where you started?"
      es: "Tu cuenta cae un 50% en un mal mes. ¿Qué rentabilidad, sobre el saldo que queda, necesitas para volver al punto de partida?"
    options:
      - id: a
        text:
          en: "+50%, exactly the same percentage that you lost on the way down."
          es: "+50%, exactamente el mismo porcentaje que perdiste en la bajada."
      - id: b
        text:
          en: "+25%, which is half of the percentage that you lost."
          es: "+25%, que es la mitad del porcentaje que perdiste."
      - id: c
        correct: true
        text:
          en: "+100% — you have to double what is left just to get back to even."
          es: "+100%: tienes que duplicar lo que queda."
      - id: d
        text:
          en: "+150%, being the loss itself plus a margin to cover the fees."
          es: "+150%: la pérdida más un margen para cubrir las comisiones."
    explanation:
      en: "Gains and losses are not symmetric, because the gain is figured on a smaller base. Going 100 → 50 is −50%, but climbing 50 → 100 is +100% — a 50% gain on 50 only reaches 75. The deeper the drawdown, the more brutally this curve turns against you, which is the reason to cap risk per trade."
      es: "Las ganancias y las pérdidas no son simétricas, porque la ganancia se calcula sobre una base más pequeña. Ir de 100 → 50 es −50%, pero subir de 50 → 100 es +100%: una ganancia del 50% sobre 50 solo llega a 75. Cuanto más profundo es el drawdown, más brutalmente se vuelve esta curva en tu contra, y por eso se limita el riesgo por operación."
  - id: correlation-stacks
    prompt:
      en: "You open five separate longs, each risking 1% of your account, on five altcoins that usually rise and fall together. In a market-wide sell-off, what is your real risk?"
      es: "Abres cinco largos separados, cada uno arriesgando el 1% de tu cuenta, en cinco altcoins que suelen subir y bajar juntas. En una caída generalizada del mercado, ¿cuál es tu riesgo real?"
    options:
      - id: a
        correct: true
        text:
          en: "About 5% — correlated positions move as one, so risks stack."
          es: "Alrededor del 5%: las correlacionadas se mueven como una y se suman."
      - id: b
        text:
          en: "Lower than 1%, because holding five coins diversifies the risk away."
          es: "Menos del 1%, porque tener cinco monedas diversifica el riesgo."
      - id: c
        text:
          en: "Still 1%: each position is capped at 1%, so the total must be too."
          es: "Sigue siendo el 1%: cada posición está limitada al 1%, luego el total también."
      - id: d
        text:
          en: "0%, since five separate positions end up hedging each other out."
          es: "0%, ya que cinco posiciones separadas acaban cubriéndose entre sí."
    explanation:
      en: "Diversification only helps when holdings are genuinely uncorrelated. Five coins that fall together are effectively one 5% bet in five costumes; their risks add rather than cancel, and a per-trade cap does not cap the correlated total. In a hard crypto sell-off almost everything correlates toward 1."
      es: "La diversificación solo ayuda cuando lo que tienes está genuinamente descorrelacionado. Cinco monedas que caen juntas son en la práctica una sola apuesta del 5% con cinco trajes; sus riesgos se suman en vez de anularse, y un límite por operación no limita el total correlacionado. En una caída dura de cripto casi todo se correlaciona hacia 1."
  - id: drawdown-myth
    kind: true_false
    prompt:
      en: "A 50% drawdown needs a +100% gain on what is left to get back to where you started."
      es: "Un drawdown del 50% necesita una ganancia del +100% sobre lo que queda para volver al punto de partida."
    answer: true
    explanation:
      en: "True, and the belief that +50% would do it is what ruins over-leveraged accounts. Going 100 → 50 is −50%, but climbing 50 → 100 is +100%, because the gain is figured on the smaller surviving base — a 50% gain on 50 only reaches 75."
      es: "Cierto, y creer que bastaría con un +50% es lo que arruina las cuentas sobreapalancadas. Ir de 100 → 50 es −50%, pero subir de 50 → 100 es +100%, porque la ganancia se calcula sobre la base menor que sobrevive: un +50% sobre 50 solo llega a 75."
  - id: recovery-matching
    kind: matching
    prompt:
      en: "Match each drawdown to the gain, on what is left, needed to get back to even."
      es: "Empareja cada drawdown con la ganancia, sobre lo que queda, necesaria para volver a estar en tablas."
    pairs:
      - { id: d10, left: { en: "Down 10%", es: "Caída del 10%" }, right: { en: "needs +11.1%", es: "necesita +11,1%" } }
      - { id: d20, left: { en: "Down 20%", es: "Caída del 20%" }, right: { en: "needs +25%", es: "necesita +25%" } }
      - { id: d50, left: { en: "Down 50%", es: "Caída del 50%" }, right: { en: "needs +100%", es: "necesita +100%" } }
      - { id: d80, left: { en: "Down 80%", es: "Caída del 80%" }, right: { en: "needs +400%", es: "necesita +400%" } }
    explanation:
      en: "Each recovery is larger than the loss it undoes, and the gap widens fast because the gain is figured on the shrunken base that is left. −10% needs +11.1%, but −80% needs +400%. This accelerating asymmetry is the whole reason to cap risk before the hole gets deep."
      es: "Cada recuperación es mayor que la pérdida que deshace, y la brecha se ensancha rápido porque la ganancia se calcula sobre la base reducida que queda. −10% necesita +11,1%, pero −80% necesita +400%. Esta asimetría que se acelera es toda la razón para limitar el riesgo antes de que el pozo se haga profundo."
  - id: diversification-truth
    prompt:
      en: "When does holding several different coins actually reduce your risk?"
      es: "¿Cuándo reduce de verdad tu riesgo tener varias monedas distintas?"
    options:
      - id: a
        text:
          en: "Always — more different coins is always more diversification of risk."
          es: "Siempre: más monedas distintas es siempre más diversificación del riesgo."
      - id: b
        text:
          en: "Whenever each position is capped at 1%, since the caps make the total safe."
          es: "Siempre que cada posición esté limitada al 1%: los límites hacen seguro el total."
      - id: c
        correct: true
        text:
          en: "Only when the coins do not tend to fall together, which in crypto is rare."
          es: "Solo cuando las monedas no tienden a caer juntas."
      - id: d
        text:
          en: "Whenever you hold at least five names, which is the usual rule of thumb."
          es: "Siempre que tengas al menos cinco valores, la regla general habitual."
    explanation:
      en: "Diversification only helps when the holdings are genuinely uncorrelated. In a hard crypto sell-off almost everything correlates toward 1, so a book that looked diversified in calm weather behaves like one leveraged long exactly when it matters. Counting names or capping each line does not fix correlation — it only hides it."
      es: "La diversificación solo ayuda cuando lo que tienes está genuinamente descorrelacionado. En una caída dura de cripto casi todo se correlaciona hacia 1, así que una cartera que parecía diversificada con el mercado tranquilo se comporta como un único largo apalancado justo cuando importa. Contar valores o limitar cada línea no arregla la correlación: solo la oculta."
  - id: cluster-cap
    prompt:
      en: "You are long BTC, ETH and three large-cap alts that historically move together. How should you think about your real portfolio risk?"
      es: "Estás largo en BTC, ETH y tres altcoins de gran capitalización que históricamente se mueven juntas. ¿Cómo deberías pensar tu riesgo de cartera real?"
    options:
      - id: a
        text:
          en: "As five independent bets, since each has its own ticker and its own stop."
          es: "Como cinco apuestas independientes: cada una tiene su ticker y su stop."
      - id: b
        text:
          en: "As lower risk than one position, because five names dilute the exposure."
          es: "Como menos riesgo que una posición, porque cinco valores lo diluyen."
      - id: c
        correct: true
        text:
          en: "As one correlated cluster — cap the risk of the whole group."
          es: "Como un solo grupo correlacionado: limita el riesgo de todo el grupo."
      - id: d
        text:
          en: "As irrelevant: portfolio risk matters to spot investors, not futures traders."
          es: "Como irrelevante: el riesgo de cartera es para inversores de contado."
    explanation:
      en: "Your real portfolio risk is your total exposure to a single move, not the number of tickets you hold, so you cap the cluster's combined risk rather than just each line on its own. Positions that move together are effectively one bet in several costumes — treating them as independent is how several 'small' positions add up to one large, undiversified bet, and that arithmetic applies to any account that carries direction."
      es: "Tu riesgo de cartera real es tu exposición total a un mismo movimiento, no el número de tickets que tengas, así que limitas el riesgo combinado del grupo en vez de solo el de cada línea. Las posiciones que se mueven juntas son en la práctica una sola apuesta con varios trajes: tratarlas como independientes es como varias posiciones 'pequeñas' se suman en una sola grande y sin diversificar, y esa aritmética vale para cualquier cuenta que lleve dirección."
  - id: drawdown-facts
    kind: multi_select
    prompt:
      en: "Select ALL statements about drawdown asymmetry that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre la asimetría del drawdown."
    options:
      - id: a
        correct: true
        text:
          en: "The recovery gain is calculated on what remains, not on what you started with."
          es: "La ganancia de recuperación se calcula sobre lo que queda, no sobre el inicio."
      - id: b
        correct: true
        text:
          en: "Losing a third of the account requires about +50% to get back to even."
          es: "Perder un tercio de la cuenta exige en torno a un +50% para volver a cero."
      - id: c
        correct: true
        text:
          en: "Every further percent lost removes capital and raises the recovery bar."
          es: "Cada punto perdido quita capital y sube la barra de recuperación."
      - id: d
        text:
          en: "A 90% loss needs about +90% to recover the original balance."
          es: "Una pérdida del 90% necesita un +90% para recuperar el saldo original."
      - id: e
        text:
          en: "The relationship is linear: each 10% lost needs exactly 10% gained."
          es: "La relación es lineal: cada 10% perdido necesita exactamente un 10%."
    explanation:
      en: "The curve turns against you faster the deeper you fall — 50% needs +100%, 75% needs +300%, 90% needs +900%, nothing like the symmetric relationship the last two options describe. That is the whole reason to cap risk per trade before you are anywhere near a deep hole."
      es: "La curva se vuelve contra ti más rápido cuanto más caes: el 50% necesita +100%, el 75% +300% y el 90% +900%, nada parecido a la relación simétrica que describen las dos últimas opciones. Esa es toda la razón para limitar el riesgo por operación antes de estar cerca de un agujero profundo."
  - id: moving-stop
    prompt:
      en: "Price nears your stop, you decide the level 'needs more room', and you slide the stop further away. What have you just done?"
      es: "El precio se acerca a tu stop, decides que el nivel 'necesita más margen' y lo alejas. ¿Qué acabas de hacer?"
    options:
      - id: a
        text:
          en: "Given a good trade the room it needs, at no cost to your risk budget."
          es: "Dar a una buena operación el margen que necesita, sin coste para el riesgo."
      - id: b
        text:
          en: "Reduced the position size automatically, since the stop is now wider."
          es: "Reducir el tamaño automáticamente, ya que ahora el stop es más ancho."
      - id: c
        text:
          en: "Nothing meaningful — the risk is still 1%, since size has not changed."
          es: "Nada relevante: el riesgo sigue en el 1%, porque el tamaño no cambió."
      - id: d
        correct: true
        text:
          en: "Turned a defined 1% risk into an open-ended one you no longer control."
          es: "Convertir un riesgo definido del 1% en uno sin límite."
    explanation:
      en: "The size was calculated from the original stop distance, so widening the stop after entry keeps the size and enlarges the loss — the fastest way to turn a planned small loss into an account-ending one. Nothing resizes itself when you drag the line: the arithmetic that protected you only works if the stop stays where you put it."
      es: "El tamaño se calculó con la distancia original del stop, así que ampliarlo después de entrar mantiene el tamaño y agranda la pérdida: la forma más rápida de convertir una pérdida pequeña planificada en una que acaba con la cuenta. Nada se redimensiona solo al arrastrar la línea: la aritmética que te protegía solo funciona si el stop se queda donde lo pusiste."
  - id: oversize-once
    kind: true_false
    prompt:
      en: "After a good winning streak, taking one trade at 5% risk instead of 1% is acceptable — the earlier wins have paid for it."
      es: "Tras una buena racha ganadora, tomar una operación con un 5% de riesgo en vez del 1% es aceptable: las ganancias previas ya lo han pagado."
    answer: false
    explanation:
      en: "One oversized trade can undo the protection of a hundred disciplined ones. The rule only works if it has no exceptions — and 'just this once' is exactly the exception that arrives after a streak or a loss you want back quickly."
      es: "Una sola operación sobredimensionada puede deshacer la protección de cien disciplinadas. La regla solo funciona si no tiene excepciones, y 'solo esta vez' es precisamente la excepción que llega tras una racha o una pérdida que quieres recuperar rápido."
  - id: gap-risk
    prompt:
      en: "Crypto never closes, so there is no weekend gap. Does that make your 1% risk a guarantee?"
      es: "El cripto nunca cierra, así que no hay gap de fin de semana. ¿Eso convierte tu riesgo del 1% en una garantía?"
    options:
      - id: a
        text:
          en: "Yes — 24/7 trading means there is always a price sitting at your stop level."
          es: "Sí: operar 24/7 significa que siempre hay precio en tu nivel de stop."
      - id: b
        text:
          en: "Yes, provided that you use a limit order rather than a market stop."
          es: "Sí, siempre que uses una orden límite en vez de un stop a mercado."
      - id: c
        correct: true
        text:
          en: "No — a stop only requests the next available price, never your own price."
          es: "No: un stop solo pide el siguiente precio disponible."
      - id: d
        text:
          en: "No, but only on exchanges that have no insurance fund behind them."
          es: "No, pero solo en exchanges que no tienen fondo de seguros detrás."
    explanation:
      en: "In a cascade, an outage, thin weekend liquidity or a 3 a.m. news shock, price can jump straight past your level and your 1% becomes 2% or 4% realised — a limit stop makes that worse, not better, because it may simply not fill. Treat the 1% as a ceiling that holds in calm conditions, not a floor the exchange guarantees, and size with a little room for the fill to come out worse than planned."
      es: "En una cascada, una caída del exchange, escasa liquidez de fin de semana o un shock de noticias a las 3 de la madrugada, el precio puede saltarse tu nivel y tu 1% se convierte en un 2% o 4% realizado; un stop límite lo empeora, no lo mejora, porque puede sencillamente no ejecutarse. Trata el 1% como un techo que se cumple en condiciones tranquilas, no como un suelo que garantice el exchange, y dimensiona dejando algo de margen para que la ejecución salga peor de lo previsto."
