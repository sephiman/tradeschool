# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: small-sample
    prompt:
      en: "You've taken 10 trades with a new system and 8 were winners. What can you legitimately conclude?"
      es: "Has hecho 10 operaciones con un sistema nuevo y 8 fueron ganadoras. ¿Qué puedes concluir legítimamente?"
    options:
      - id: a
        correct: true
        text:
          en: "Very little — 10 trades is far too small a sample; this could easily be variance rather than a real edge."
          es: "Muy poco: 10 operaciones son una muestra demasiado pequeña; esto podría ser fácilmente varianza y no un edge real."
      - id: b
        text:
          en: "The system is profitable — a high win rate always means a profitable system."
          es: "El sistema es rentable: un win rate alto siempre significa un sistema rentable."
      - id: c
        text:
          en: "The system is broken — with a real edge you should be winning closer to 100%."
          es: "El sistema está roto: con un edge real deberías estar ganando cerca del 100%."
      - id: d
        text:
          en: "Nothing at all until you have taken exactly 100 trades."
          es: "Nada en absoluto hasta que hayas hecho exactamente 100 operaciones."
    explanation:
      en: "Ten trades is noise: a losing system can show 8 early wins purely by variance, and only a large sample (think hundreds of trades) reveals the true expectancy. A high win rate alone never proves profitability, because it says nothing about the size of the wins and losses. There is no magic number like 100 either — the point is 'a large sample', and edge is about expectancy, not win rate."
      es: "Diez operaciones son ruido: un sistema perdedor puede mostrar 8 ganancias tempranas por pura varianza, y solo una muestra grande (piensa en cientos de operaciones) revela la esperanza real. Un win rate alto por sí solo nunca demuestra rentabilidad, porque no dice nada sobre el tamaño de las ganancias y las pérdidas. Tampoco hay un número mágico como 100: la clave es 'una muestra grande', y el edge va de esperanza, no de win rate."
  - id: losing-streak
    prompt:
      en: "Your positive-expectancy system, which wins about 40% of the time, has just lost 6 trades in a row. What is the right read?"
      es: "Tu sistema de esperanza positiva, que gana alrededor del 40% de las veces, acaba de perder 6 operaciones seguidas. ¿Cuál es la lectura correcta?"
    options:
      - id: a
        correct: true
        text:
          en: "A streak like this is normal and expected with a 40% win rate — it is arithmetic, not evidence the edge is gone."
          es: "Una racha así es normal y esperable con un win rate del 40%: es aritmética, no una prueba de que el edge haya desaparecido."
      - id: b
        text:
          en: "The edge has clearly stopped working — change the rules now before you lose more."
          es: "El edge ha dejado de funcionar claramente: cambia las reglas ya, antes de perder más."
      - id: c
        text:
          en: "You must have made execution errors — a real edge never loses 6 in a row."
          es: "Habrás cometido errores de ejecución: un edge real nunca pierde 6 seguidas."
      - id: d
        text:
          en: "Increase your position size to win back the losses faster."
          es: "Aumenta el tamaño de tus posiciones para recuperar las pérdidas más rápido."
    explanation:
      en: "With a 60% chance of losing any single trade, six losses in a row happens about 0.60^6 ≈ 4.7% of the time — over hundreds of trades such streaks are expected to recur. A run within the normal range is not evidence of anything. Abandoning or rewriting a working system mid-drawdown, or sizing up to 'win it back', is the classic way beginners turn a normal streak into a real loss."
      es: "Con un 60% de probabilidad de perder cualquier operación, perder seis seguidas ocurre alrededor del 0,60^6 ≈ 4,7% de las veces; a lo largo de cientos de operaciones se espera que estas rachas se repitan. Una racha dentro del rango normal no prueba nada. Abandonar o reescribir un sistema que funciona en pleno drawdown, o subir el tamaño para 'recuperarlo', es la forma clásica en que los principiantes convierten una racha normal en una pérdida real."
  - id: variance-terms-match
    kind: matching
    prompt:
      en: "Match each term to what it means."
      es: "Empareja cada término con lo que significa."
    pairs:
      - id: sample
        left:
          en: "Sample size"
          es: "Tamaño muestral"
        right:
          en: "The number of trades behind a result; only a large one reveals the true expectancy."
          es: "El número de operaciones que hay tras un resultado; solo uno grande revela la esperanza real."
      - id: streak
        left:
          en: "Losing streak"
          es: "Racha de pérdidas"
        right:
          en: "A run of consecutive losses; normal and computable from the win rate."
          es: "Una serie de pérdidas seguidas; normal y calculable a partir del win rate."
      - id: edge
        left:
          en: "Edge"
          es: "Edge"
        right:
          en: "A positive expectancy that holds up across a large sample."
          es: "Una esperanza positiva que se mantiene a lo largo de una muestra grande."
      - id: noise
        left:
          en: "Noise"
          es: "Ruido"
        right:
          en: "Short-run swings that look meaningful but are just variance."
          es: "Oscilaciones de corto plazo que parecen significativas pero son solo varianza."
    explanation:
      en: "A large sample is what lets you see the real expectancy; a losing streak is a normal run you can predict from the win rate; an edge is expectancy that survives that sample; and noise is the short-run variance that fools people into reading meaning into a handful of trades."
      es: "Una muestra grande es lo que te deja ver la esperanza real; una racha de pérdidas es una serie normal que puedes predecir a partir del win rate; un edge es una esperanza que sobrevive a esa muestra; y el ruido es la varianza de corto plazo que engaña a la gente para que lea significado en un puñado de operaciones."
  - id: screenshot-proof-myth
    kind: true_false
    prompt:
      en: "A screenshot showing eight winning trades in a row proves the system has a real edge."
      es: "Una captura que muestra ocho operaciones ganadoras seguidas demuestra que el sistema tiene un edge real."
    answer: false
    explanation:
      en: "False. Eight green trades is a tiny sample — pure variance can produce that even from a losing system. An edge only shows up across a large sample (hundreds of trades taken the same way), so a screenshot proves nothing about expectancy."
      es: "Falso. Ocho operaciones en verde son una muestra minúscula: la pura varianza puede producir eso incluso desde un sistema perdedor. Un edge solo aparece a lo largo de una muestra grande (cientos de operaciones tomadas de la misma forma), así que una captura no demuestra nada sobre la esperanza."
  - id: real-edge-multi
    kind: multi_select
    prompt:
      en: "Select ALL of the following that you actually need before concluding a system has a real edge."
      es: "Selecciona TODO lo siguiente que de verdad necesitas antes de concluir que un sistema tiene un edge real."
    options:
      - id: a
        correct: true
        text:
          en: "A large sample of trades — think hundreds, not a handful."
          es: "Una muestra grande de operaciones: piensa en cientos, no en un puñado."
      - id: b
        correct: true
        text:
          en: "Positive expectancy measured across that sample."
          es: "Una esperanza positiva medida a lo largo de esa muestra."
      - id: c
        correct: true
        text:
          en: "The same method applied consistently to every trade."
          es: "El mismo método aplicado de forma consistente en cada operación."
      - id: d
        text:
          en: "A high win rate over your last five trades."
          es: "Un win rate alto en tus últimas cinco operaciones."
      - id: e
        text:
          en: "A recent winning streak."
          es: "Una racha ganadora reciente."
      - id: f
        text:
          en: "A profitable screenshot from someone online."
          es: "Una captura rentable de alguien en internet."
    explanation:
      en: "A real edge is positive expectancy that survives a large sample of trades taken the same way. A hot last-five, a recent streak or someone else's screenshot are all small-sample noise — they feel convincing but prove nothing about the true average."
      es: "Un edge real es una esperanza positiva que sobrevive a una muestra grande de operaciones tomadas de la misma forma. Un buen dato en las últimas cinco, una racha reciente o la captura de otra persona son todo ruido de muestra pequeña: convencen, pero no demuestran nada sobre la media real."
  - id: streak-probability
    prompt:
      en: "Your system wins 40% of trades, so any single trade has a 60% chance of losing. Roughly how likely is a run of three losses in a row?"
      es: "Tu sistema gana el 40% de las operaciones, así que cualquier operación tiene un 60% de probabilidad de perder. ¿Con qué probabilidad aproximada se da una racha de tres pérdidas seguidas?"
    options:
      - id: a
        correct: true
        text:
          en: "About 22% — 0.60 × 0.60 × 0.60, or roughly one in five."
          es: "Alrededor del 22%: 0,60 × 0,60 × 0,60, más o menos una de cada cinco."
      - id: b
        text:
          en: "Almost 0% — three losses in a row hardly ever happens."
          es: "Casi 0%: tres pérdidas seguidas casi nunca ocurren."
      - id: c
        text:
          en: "60% — the same as the chance of losing any single trade."
          es: "60%: lo mismo que la probabilidad de perder cualquier operación."
      - id: d
        text:
          en: "About 6% — you'd cube the 40% win rate (0.40³) instead."
          es: "Alrededor del 6%: se elevaría al cubo el win rate del 40% (0,40³)."
    explanation:
      en: "Independent losses multiply: 0.60³ = 0.216, about 22% — roughly one in five, so over a few hundred trades it happens constantly. Cubing the win rate (0.40³ ≈ 6%) answers the wrong question, and the chance doesn't stay at the single-trade 60% because the losses compound."
      es: "Las pérdidas independientes se multiplican: 0,60³ = 0,216, alrededor del 22%, más o menos una de cada cinco, así que a lo largo de unos cientos de operaciones ocurre constantemente. Elevar al cubo el win rate (0,40³ ≈ 6%) responde a la pregunta equivocada, y la probabilidad no se queda en el 60% de una sola operación porque las pérdidas se acumulan."
