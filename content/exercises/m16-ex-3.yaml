# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: what-is-capitulation
    prompt:
      en: "What is 'capitulation'?"
      es: "¿Qué es la \"capitulación\"?"
    options:
      - id: a
        text:
          en: "The exchange force-closing leveraged positions once their margin runs out."
          es: "El exchange cerrando posiciones apalancadas cuando se agota su margen."
      - id: b
        text:
          en: "A scheduled halving of the Bitcoin block reward paid to miners."
          es: "Un halving programado de la recompensa por bloque que cobran los mineros."
      - id: c
        correct: true
        text:
          en: "Scared holders giving up and selling at a loss to stop the pain."
          es: "Tenedores asustados que se rinden y venden con pérdidas para dejar de sufrir."
      - id: d
        text:
          en: "The moment the crowd turns euphoric and buys the very top."
          es: "El momento en que la masa se vuelve eufórica y compra el techo."
    explanation:
      en: "Capitulation is the emotional surrender at the low, and once it has run, selling pressure is largely spent. It is not a mechanical force-close: that is liquidation, a different thing entirely, where the exchange closes a leveraged position because margin is exhausted. Euphoric buying is the opposite end of the same emotional scale."
      es: "La capitulación es la rendición emocional en el mínimo y, una vez consumada, la presión vendedora queda casi agotada. No es un cierre forzoso mecánico: eso es la liquidación, algo del todo distinto, donde el exchange cierra una posición apalancada porque el margen se agotó. La compra eufórica es el extremo contrario de la misma escala emocional."
  - id: fear-location
    prompt:
      en: "Where on the price chart does the deepest extreme fear tend to appear?"
      es: "¿En qué parte del gráfico de precio tiende a aparecer el miedo extremo más profundo?"
    options:
      - id: a
        text:
          en: "Near market tops, right before a big rally is about to begin."
          es: "Cerca de los techos, justo antes de que empiece un gran rally."
      - id: b
        correct: true
        text:
          en: "Near market lows, once the panic sellers have largely gone."
          es: "Cerca de los mínimos, cuando los vendedores en pánico ya se han ido."
      - id: c
        text:
          en: "Randomly across the chart, with no relation to where price is."
          es: "Al azar por el gráfico, sin relación con dónde está el precio."
      - id: d
        text:
          en: "Only during scheduled news events on the macro calendar."
          es: "Solo durante eventos de noticias programados del calendario macro."
    explanation:
      en: "Deep fear clusters near bottoms: once capitulation has run and the panic sellers are out, selling pressure is largely spent and price is often near a low. That makes extreme fear a zone of interest — not a dated buy signal, and not something that needs a calendar event to appear."
      es: "El miedo profundo se concentra cerca de los suelos: una vez consumada la capitulación y fuera los vendedores presa del pánico, la presión vendedora queda casi agotada y el precio suele estar cerca de un mínimo. Eso convierte el miedo extremo en una zona de interés, no en una señal de compra con fecha, ni en algo que necesite un evento del calendario para aparecer."
  - id: capitulation-vs-liquidation
    kind: true_false
    prompt:
      en: "\"Capitulation\" and \"liquidation\" are two names for the same event."
      es: "\"Capitulación\" y \"liquidación\" son dos nombres para el mismo suceso."
    answer: false
    explanation:
      en: "They are different. Capitulation is holders emotionally giving up and selling at a loss to stop the pain. Liquidation is the exchange force-closing a leveraged position when its margin runs out. Panic-driven capitulation can trigger liquidations, but the two are not the same thing."
      es: "Son distintos. La capitulación es que los tenedores se rinden emocionalmente y venden con pérdidas para dejar de sufrir. La liquidación es el exchange cerrando forzosamente una posición apalancada cuando se agota su margen. La capitulación por pánico puede desencadenar liquidaciones, pero no son lo mismo."
  - id: capitulation-effect
    prompt:
      en: "Once capitulation has run its course, what happens to selling pressure?"
      es: "Una vez consumada la capitulación, ¿qué le ocurre a la presión vendedora?"
    options:
      - id: a
        correct: true
        text:
          en: "It is largely spent — those who were going to panic-sell already have."
          es: "Queda casi agotada: quienes iban a vender en pánico ya lo han hecho."
      - id: b
        text:
          en: "It accelerates, since capitulation guarantees weeks of forced selling."
          es: "Se acelera, ya que la capitulación garantiza semanas de venta forzada."
      - id: c
        text:
          en: "The exchange takes over and keeps selling on the holders' behalf."
          es: "El exchange toma el relevo y sigue vendiendo por cuenta de los tenedores."
      - id: d
        text:
          en: "Nothing changes: capitulation has no effect on the sellers who remain."
          es: "No cambia nada: la capitulación no afecta a los vendedores que quedan."
    explanation:
      en: "That is the point of capitulation as a signal: when the sellers who were going to give up have given up, the supply of frightened selling dries up, and price is often near a low. That is why it marks a zone of interest — not a precise buy moment, and nobody keeps selling on your behalf afterwards."
      es: "Ese es el sentido de la capitulación como señal: cuando los vendedores que iban a rendirse ya se han rendido, la oferta de venta asustada se seca y el precio suele estar cerca de un mínimo. Por eso marca una zona de interés, no un momento preciso de compra, y después nadie sigue vendiendo en tu nombre."
  - id: fear-sequence
    kind: ordering
    prompt:
      en: "Put the stages of a fear-driven sell-off in order, first to last."
      es: "Ordena las fases de una caída impulsada por el miedo, de la primera a la última."
    items:
      - id: drop
        position: 1
        text:
          en: "Price falls and the mood turns fearful."
          es: "El precio cae y el ánimo se vuelve temeroso."
      - id: deepen
        position: 2
        text:
          en: "Fear deepens toward extreme as the drop continues."
          es: "El miedo se agrava hacia el extremo a medida que sigue la caída."
      - id: capitulate
        position: 3
        text:
          en: "Holders capitulate — selling at a loss to stop the pain."
          es: "Los tenedores capitulan: venden con pérdidas para dejar de sufrir."
      - id: spent
        position: 4
        text:
          en: "Selling pressure is largely spent and price is often near a low."
          es: "La presión vendedora queda casi agotada y el precio suele estar cerca de un mínimo."
    explanation:
      en: "Fear builds, peaks in capitulation, and then selling exhausts itself near a low. The sequence explains why the deepest fear clusters near bottoms — but it still tells you nothing about the exact day price turns."
      es: "El miedo se acumula, culmina en la capitulación y después la venta se agota cerca de un mínimo. La secuencia explica por qué el miedo más profundo se concentra cerca de los suelos, pero sigue sin decirte el día exacto en que gira el precio."
  - id: fear-buy-too-early
    prompt:
      en: "A trader buys the moment the index first prints extreme fear, yet price keeps bleeding for weeks. What was the mistake?"
      es: "Un trader compra en cuanto el índice marca por primera vez miedo extremo, pero el precio sigue sangrando durante semanas. ¿Cuál fue el error?"
    options:
      - id: a
        text:
          en: "The index was broken: extreme fear never appears within a downtrend."
          es: "El índice estaba roto: el miedo extremo nunca aparece en una bajista."
      - id: b
        text:
          en: "They should have shorted — fear always means lower prices from there."
          es: "Deberían haber cortado: el miedo siempre significa precios más bajos."
      - id: c
        text:
          en: "Sentiment matters only in equities, so it should have been ignored."
          es: "El sentimiento solo importa en acciones, así que debió ignorarse."
      - id: d
        correct: true
        text:
          en: "Treating extreme fear as a timed bottom, when it is only a zone."
          es: "Tratar el miedo extremo como un suelo con fecha, siendo una zona."
    explanation:
      en: "Extreme fear marks a contrarian zone of interest, not a moment, and fear can stay extreme through long bear markets — so entries need their own confirmation. It appears in downtrends by definition, it is not an instruction to short, and it applies to crypto as much as anywhere else."
      es: "El miedo extremo marca una zona contraria de interés, no un momento, y el miedo puede seguir extremo durante largos mercados bajistas: las entradas necesitan su propia confirmación. Aparece en tendencias bajistas por definición, no es una orden de cortar, y aplica al cripto tanto como a cualquier otro sitio."
  - id: capitulation-scene
    kind: multi_select
    prompt:
      en: "Select ALL of the following that describe what a capitulation low typically looks like."
      es: "Selecciona TODO lo siguiente que describa cómo suele verse un mínimo de capitulación."
    options:
      - id: a
        correct: true
        text: { en: "A single violent session — BTC dropping 15% in a few hours.", es: "Una única sesión violenta: BTC cayendo un 15% en pocas horas." }
      - id: b
        correct: true
        text: { en: "Enormous volume as holders finally give up.", es: "Volumen enorme cuando los holders por fin se rinden." }
      - id: c
        correct: true
        text:
          en: "A cascade of liquidations dumping more supply into a thin book."
          es: "Una cascada de liquidaciones vertiendo más oferta en un libro fino."
      - id: d
        correct: true
        text:
          en: "The index gapping to single digits as social flips to 'it's over'."
          es: "El índice cayendo a un dígito mientras las redes dicen 'se acabó'."
      - id: e
        text:
          en: "A slow, quiet drift lower on shrinking volume over several months."
          es: "Una deriva lenta y tranquila a la baja con volumen decreciente durante meses."
    explanation:
      en: "Panic, forced selling and a spike of fear all at once — that flush is what exhausts the supply of frightened holders, and it is loud by nature. A slow quiet drift is the opposite: nobody has surrendered yet, so the selling is still ahead. Either way it is a zone of interest, a place to look for setups, not a command to buy."
      es: "Pánico, venta forzosa y un pico de miedo a la vez: ese lavado es lo que agota la oferta de holders asustados, y es ruidoso por naturaleza. Una deriva lenta y tranquila es lo contrario: nadie se ha rendido todavía, así que la venta aún está por llegar. En cualquier caso es una zona de interés, un lugar donde buscar setups, no una orden de comprar."
  - id: overnight-swing
    prompt:
      en: "Crypto never closes. What does that do to a sentiment reading you check at breakfast?"
      es: "El cripto nunca cierra. ¿Qué le hace eso a una lectura de sentimiento que consultas en el desayuno?"
    options:
      - id: a
        text:
          en: "Nothing at all — the index only updates during weekday hours."
          es: "Nada en absoluto: el índice solo se actualiza en horario laboral."
      - id: b
        correct: true
        text:
          en: "An extreme can be reached and unwound while you sleep."
          es: "Un extremo puede alcanzarse y deshacerse mientras duermes."
      - id: c
        text:
          en: "It makes the reading more reliable, because it never gets reset."
          es: "Hace la lectura más fiable, porque nunca se reinicia."
      - id: d
        text:
          en: "It guarantees the extreme will still be in place when you act on it."
          es: "Garantiza que el extremo seguirá ahí cuando actúes sobre él."
    explanation:
      en: "Sentiment compounds through overnight and weekend sessions on thin liquidity, and the mood never gets a nightly reset — so the number you see may be lagging both the swing out and the swing back. Combined with the index's already-lagging inputs, a reading can describe a state the market moved on from hours ago."
      es: "El sentimiento se acumula en sesiones nocturnas y de fin de semana con escasa liquidez, y el ánimo no tiene reinicio nocturno, así que el número que ves puede ir por detrás tanto del movimiento de ida como del de vuelta. Combinado con las entradas ya retrasadas del índice, una lectura puede describir un estado que el mercado dejó atrás horas antes."
  - id: fear-persists
    kind: true_false
    prompt:
      en: "Extreme fear can stay extreme for months while price keeps bleeding."
      es: "El miedo extremo puede seguir extremo durante meses mientras el precio sigue sangrando."
    answer: true
    explanation:
      en: "True — fear stayed extreme through long grinding bear markets. A contrarian who bought the *first* extreme-fear print got run over: the crowd stayed lopsided far longer than their account could survive."
      es: "Cierto: el miedo se mantuvo extremo durante mercados bajistas largos y desgastantes. Quien compró la *primera* lectura de miedo extremo fue arrollado: la multitud siguió desequilibrada mucho más de lo que su cuenta podía aguantar."
