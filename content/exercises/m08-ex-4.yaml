# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: wick-poke-is-fakeout
    prompt:
      en: "Price rises into a resistance zone, prints a candle with a long upper wick that pokes above the zone, then closes back below it. The next few candles stay below. What happened?"
      es: "El precio sube hacia una zona de resistencia, imprime una vela con una mecha superior larga que asoma por encima de la zona y luego cierra de vuelta por debajo. Las siguientes velas se quedan por debajo. ¿Qué ha pasado?"
    options:
      - id: a
        text:
          en: "A genuine breakout, since price really did trade above the resistance."
          es: "Una ruptura genuina, ya que el precio sí operó por encima de la resistencia."
      - id: b
        correct: true
        text:
          en: "A fakeout — it poked beyond but closed back inside."
          es: "Un fakeout: asomó más allá pero cerró de vuelta dentro."
      - id: c
        text:
          en: "A change of character, because the resistance was reached and touched."
          es: "Un cambio de carácter, porque la resistencia se alcanzó y se tocó."
      - id: d
        text:
          en: "Confirmation that the resistance has now flipped into support."
          es: "Confirmación de que la resistencia ya se ha girado a soporte."
    explanation:
      en: "A wick above the zone with a close back inside is the signature of a fakeout: the break was rejected. Trading above intrabar is not a breakout — that needs a candle body closing beyond the level and holding there — and a level cannot flip roles it never actually surrendered. Change of character is a structure term about swing sequence, not about touching a level."
      es: "Una mecha por encima de la zona con un cierre de vuelta dentro es la firma de un fakeout: la ruptura fue rechazada. Operar por encima de forma intradía no es una ruptura —eso exige un cuerpo de vela que cierre más allá del nivel y aguante ahí— y un nivel no puede cambiar de papel si nunca llegó a ceder. El cambio de carácter es un término de estructura sobre la secuencia de swings, no sobre tocar un nivel."
  - id: strongest-breakout-evidence
    prompt:
      en: "Which of these is the strongest evidence that a break above a resistance zone is genuine rather than a fakeout?"
      es: "¿Cuál de estas es la prueba más sólida de que una ruptura por encima de una zona de resistencia es genuina y no un fakeout?"
    options:
      - id: a
        text:
          en: "Price wicked well above the zone intrabar, showing strong buying pressure."
          es: "El precio dejó una mecha muy por encima de la zona, mostrando presión compradora."
      - id: b
        text:
          en: "RSI has pushed above 70, confirming the breakout with momentum behind it."
          es: "El RSI ha superado 70, confirmando la ruptura con momentum detrás."
      - id: c
        correct: true
        text:
          en: "A body closes above the zone, then a retest holds it as support."
          es: "Un cuerpo cierra por encima de la zona y un retest la mantiene como soporte."
      - id: d
        text:
          en: "The candle crossing the zone is unusually large, even though it closes lower."
          es: "La vela que cruza la zona es especialmente grande, aunque cierre más abajo."
    explanation:
      en: "A genuine breakout is confirmed by a close beyond the level that holds and retests, ideally with a volume increase. Wicks are the least reliable part of a candle; an overbought RSI usually just means a strong move that can equally keep going or fail; and a large candle that closes back on the wrong side is evidence *against* the break, however dramatic it looks."
      es: "Una ruptura genuina se confirma con un cierre más allá del nivel que aguanta y retestea, idealmente con un aumento de volumen. Las mechas son la parte menos fiable de una vela; un RSI sobrecomprado suele indicar solo un movimiento fuerte que puede seguir o fallar por igual; y una vela grande que cierra de vuelta en el lado equivocado es prueba *en contra* de la ruptura, por espectacular que parezca."
  - id: wick-breakout-myth
    kind: true_false
    prompt:
      en: "A wick beyond a level is a confirmed breakout, even if the candle closes back inside the range."
      es: "Una mecha más allá de un nivel es una ruptura confirmada, aunque la vela cierre de vuelta dentro del rango."
    answer: false
    explanation:
      en: "False. A wick through a level is a rumour, not the news. A breakout needs a full candle body to close beyond the level and hold. A poke that closes back inside is the signature of a fakeout, not a confirmed breakout."
      es: "Falso. Una mecha que atraviesa un nivel es un rumor, no la noticia. Una ruptura necesita que un cuerpo de vela entero cierre más allá del nivel y aguante. Un asomo que cierra de vuelta dentro es la firma de un fakeout, no de una ruptura confirmada."
  - id: trustworthy-breakout-select
    kind: multi_select
    prompt:
      en: "Select ALL of the following that make a break above a resistance zone more trustworthy."
      es: "Selecciona TODO lo que haga más fiable una ruptura por encima de una zona de resistencia."
    options:
      - id: a
        correct: true
        text:
          en: "A full candle body closes above the zone."
          es: "Un cuerpo de vela entero cierra por encima de la zona."
      - id: b
        correct: true
        text:
          en: "Price retests the old resistance as support and holds there."
          es: "El precio retestea la vieja resistencia como soporte y aguanta ahí."
      - id: c
        correct: true
        text:
          en: "The break prints on higher volume than the candles around it."
          es: "La ruptura se imprime con más volumen que las velas de alrededor."
      - id: d
        text:
          en: "A long upper wick pokes above the zone during the candle."
          es: "Una mecha superior larga asoma por encima de la zona en la vela."
      - id: e
        text:
          en: "RSI has climbed above 70 on the timeframe you are trading."
          es: "El RSI ha subido por encima de 70 en la temporalidad que operas."
    explanation:
      en: "A trustworthy break shows a body closing beyond the level, a retest that holds, and ideally higher volume — real participation got price through. A lone intrabar wick and an overbought oscillator are not confirmation of anything; they accompany fakeouts just as readily as real breaks."
      es: "Una ruptura fiable muestra un cuerpo que cierra más allá del nivel, un retest que aguanta e idealmente más volumen: hizo falta participación real para atravesarlo. Una mecha intradía suelta y un oscilador sobrecomprado no confirman nada; acompañan a los fakeouts con la misma facilidad que a las rupturas reales."
  - id: sr-zone-not-line
    prompt:
      en: "You drew a support level; price stopped 0.3% short of it and then bounced hard. A beginner says 'support failed.' What is the better reading?"
      es: "Trazaste un soporte; el precio se detuvo un 0,3% antes de él y luego rebotó con fuerza. Un principiante dice «el soporte ha fallado». ¿Cuál es la mejor lectura?"
    options:
      - id: a
        text:
          en: "The support failed, because price never reached the exact line you drew."
          es: "El soporte falló, porque el precio nunca llegó a la línea exacta que trazaste."
      - id: b
        text:
          en: "The bounce was luck; a level counts only if price touches it to the tick."
          es: "El rebote fue suerte; un nivel cuenta solo si el precio lo toca al tick."
      - id: c
        text:
          en: "You should redraw the line 0.3% higher every time this happens again."
          es: "Deberías retrazar la línea un 0,3% más arriba cada vez que vuelva a pasar."
      - id: d
        correct: true
        text:
          en: "Levels are zones; price reacted inside the band, so it worked."
          es: "Los niveles son zonas; el precio reaccionó dentro de la banda: funcionó."
    explanation:
      en: "A level is a band a few candles wide, not one exact number — different traders' orders sit at slightly different prices, so a reaction anywhere inside the zone is the zone doing its job. Chasing the line after each near-miss just redraws the band around wherever price last happened to turn."
      es: "Un nivel es una banda de unas cuantas velas de ancho, no un número exacto: las órdenes de distintos traders están a precios ligeramente distintos, así que una reacción en cualquier punto dentro de la zona es la zona haciendo su trabajo. Perseguir la línea tras cada casi-toque solo redibuja la banda allí donde el precio giró por última vez."
  - id: breakout-fakeout-match
    kind: matching
    prompt:
      en: "Match each price-structure term to its signature."
      es: "Empareja cada término de estructura de precio con su firma."
    pairs:
      - id: bo
        left:
          en: "Genuine breakout"
          es: "Ruptura genuina"
        right:
          en: "A full body closes beyond the level and holds, ideally retesting it"
          es: "Un cuerpo entero cierra más allá del nivel y aguanta, idealmente retesteándolo"
      - id: fk
        left:
          en: "Fakeout"
          es: "Fakeout"
        right:
          en: "Price pokes beyond on a wick, then closes back inside the range"
          es: "El precio asoma más allá con una mecha y luego cierra de vuelta dentro del rango"
      - id: rt
        left:
          en: "Retest"
          es: "Retest"
        right:
          en: "Price returns to the broken level, which now holds as new support or resistance"
          es: "El precio vuelve al nivel roto, que ahora aguanta como nuevo soporte o resistencia"
      - id: zn
        left:
          en: "Support/resistance zone"
          es: "Zona de soporte/resistencia"
        right:
          en: "A band a few candles wide, not a single exact price"
          es: "Una banda de unas cuantas velas de ancho, no un único precio exacto"
    explanation:
      en: "A genuine breakout closes beyond and holds; a fakeout pokes beyond on a wick and closes back inside. A retest is price returning to the broken level and finding it holds. And the level itself is always a zone — a band, not a line."
      es: "Una ruptura genuina cierra más allá y aguanta; un fakeout asoma con una mecha y cierra de vuelta dentro. Un retest es el precio volviendo al nivel roto y encontrando que aguanta. Y el nivel en sí siempre es una zona: una banda, no una línea."
  - id: wait-for-the-close
    prompt:
      en: "As price crosses a level in real time, what is the single most useful way to tell a breakout from a fakeout?"
      es: "Cuando el precio cruza un nivel en tiempo real, ¿cuál es la forma más útil de distinguir una ruptura de un fakeout?"
    options:
      - id: a
        correct: true
        text:
          en: "Wait for the candle to close beyond the level and hold."
          es: "Esperar a que la vela cierre más allá del nivel y aguante."
      - id: b
        text:
          en: "Enter the instant price ticks past the level, ahead of everyone else."
          es: "Entrar en cuanto el precio rebasa el nivel, antes que todos los demás."
      - id: c
        text:
          en: "Judge it by how large the candle crossing the level turns out to be."
          es: "Juzgarlo por lo grande que resulte ser la vela que cruza el nivel."
      - id: d
        text:
          en: "Check whether RSI sits above 70 at the exact moment of the cross."
          es: "Mirar si el RSI está por encima de 70 justo en el momento del cruce."
    explanation:
      en: "Nobody can tell a breakout from a fakeout at the instant price crosses — the close beyond that holds, and often the retest, is the only discriminator. Reacting to the poke is exactly what traps the traders caught by fakeouts, and neither candle size nor an oscillator reading resolves the ambiguity while the bar is still open."
      es: "Nadie puede distinguir una ruptura de un fakeout en el instante en que el precio cruza: el cierre más allá que aguanta, y a menudo el retest, es el único discriminador. Reaccionar al asomo es justo lo que atrapa a los traders que caen en los fakeouts, y ni el tamaño de la vela ni una lectura de oscilador resuelven la ambigüedad con la barra aún abierta."
  - id: fakeout-mechanism
    prompt:
      en: "Mechanically, why do fakeouts happen at exactly the most obvious levels?"
      es: "Mecánicamente, ¿por qué las rupturas falsas ocurren precisamente en los niveles más obvios?"
    options:
      - id: a
        text:
          en: "Exchanges widen the spread at round numbers, which distorts the printed candle."
          es: "Los exchanges amplían el spread en números redondos y distorsionan la vela impresa."
      - id: b
        text:
          en: "Obvious levels attract more genuine volume, which always sustains the break."
          es: "Los niveles obvios atraen más volumen genuino, que siempre sostiene la ruptura."
      - id: c
        correct: true
        text:
          en: "Resting stops and 'buy if it breaks' orders pile up just beyond them."
          es: "Los stops en reposo y las órdenes de 'compra si rompe' se acumulan justo detrás."
      - id: d
        text:
          en: "They are random — there is no mechanism behind them, only bad luck."
          es: "Son aleatorias: no hay ningún mecanismo detrás, solo mala suerte."
    explanation:
      en: "Pushing price a hair past an obvious level triggers all of those orders at once — a burst of buying with nothing real behind it. Once that fuel is spent, price falls back inside: the false break didn't fail by accident, it ran out of the very orders that caused it. And the traders who bought the poke are now trapped above the level and motivated to sell, which is what pushes price back down."
      es: "Empujar el precio un pelo más allá de un nivel obvio dispara todas esas órdenes de golpe: un estallido de compras sin nada real detrás. Agotado ese combustible, el precio vuelve dentro: la ruptura falsa no falló por accidente, se quedó sin las mismas órdenes que la causaron. Y quienes compraron el pinchazo están ahora atrapados por encima del nivel y motivados para vender, que es lo que empuja el precio de vuelta abajo."
  - id: genuine-break-sequence
    kind: ordering
    prompt:
      en: "Put the stages of a genuine breakout above resistance in order."
      es: "Ordena las etapas de una ruptura genuina por encima de una resistencia."
    items:
      - id: close
        position: 1
        text:
          en: "A full candle body closes decisively beyond the level — ideally on higher volume."
          es: "Un cuerpo de vela completo cierra decididamente más allá del nivel, idealmente con más volumen."
      - id: hold
        position: 2
        text: { en: "Price holds there rather than falling straight back inside.", es: "El precio se sostiene ahí en vez de volver de inmediato dentro." }
      - id: retest
        position: 3
        text:
          en: "Price comes back to retest the old level, now as support."
          es: "El precio regresa para hacer un retest del nivel antiguo, ahora como soporte."
      - id: away
        position: 4
        text:
          en: "It bounces away from the retest — the level that used to cap price now catches it."
          es: "Rebota desde el retest: el nivel que antes tapaba el precio ahora lo sostiene."
    explanation:
      en: "The retest holds because of role reversal: sellers who defended the old resistance were overrun and cover on the pullback, while buyers who refused to chase finally get their entry at the old line. The retest is the market voting a second time."
      es: "El retest aguanta por la inversión de papeles: los vendedores que defendían la antigua resistencia fueron atropellados y cierran en el retroceso, mientras los compradores que no quisieron perseguir consiguen por fin su entrada en la línea antigua. El retest es el mercado votando una segunda vez."
  - id: weekend-break-weight
    kind: true_false
    prompt:
      en: "A breakout printed at 04:00 on a Sunday deserves the same trust as the same break in a busy weekday session."
      es: "Una ruptura impresa a las 04:00 de un domingo merece la misma confianza que la misma ruptura en una sesión concurrida de día laborable."
    answer: false
    explanation:
      en: "In the dead hours the book is thin, so far less size is needed to shove price through an obvious level — false breaks cluster in exactly these windows. The level may simply have been pushed through empty air, and it snaps back when real volume returns."
      es: "En las horas muertas el libro está fino, así que hace falta mucho menos tamaño para empujar el precio a través de un nivel obvio: las rupturas falsas se concentran justo en esas ventanas. El nivel puede haberse atravesado en el vacío, y vuelve atrás cuando regresa el volumen real."
