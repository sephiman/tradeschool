# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: not-your-keys
    prompt:
      en: "\"Not your keys, not your coins\" means…"
      es: "\"Not your keys, not your coins\" significa…"
    options:
      - id: a
        correct: true
        text:
          en: "Coins held on an exchange are an IOU from it, not coins you control directly."
          es: "Las monedas en un exchange son un pagaré suyo, no monedas que controles."
      - id: b
        text:
          en: "You must memorise the seed phrase; writing it down voids its security."
          es: "Debes memorizar la frase semilla; apuntarla anula su seguridad."
      - id: c
        text:
          en: "Only miners truly own coins; everyone else rents them between blocks."
          es: "Solo los mineros poseen de verdad las monedas; los demás las alquilan."
      - id: d
        text:
          en: "Keys are optional on a modern exchange, which custodies by account."
          es: "Las claves son opcionales en un exchange moderno, que custodia por cuenta."
    explanation:
      en: "If your coins sit on an exchange you hold a claim against a company, not the coins — which matters the day withdrawals freeze. The key is not a password to remember or an optional extra: whoever holds it holds the coins."
      es: "Si tus monedas están en un exchange tienes un derecho frente a una empresa, no las monedas: eso importa el día que se congelan los retiros. La clave no es una contraseña que recordar ni un extra opcional: quien la tiene, tiene las monedas."
  - id: finality
    prompt:
      en: "A confirmed transaction, buried under enough later blocks, is…"
      es: "Una transacción confirmada, enterrada bajo suficientes bloques posteriores, es…"
    options:
      - id: a
        text:
          en: "Reversible within 24 hours if support opens a ticket with the miner."
          es: "Reversible en 24 horas si el soporte abre un ticket con el minero."
      - id: b
        correct: true
        text:
          en: "Effectively irreversible — there is no chargeback and nobody to appeal to."
          es: "Prácticamente irreversible: no hay contracargo ni nadie a quien reclamar."
      - id: c
        text:
          en: "Reversible by the sender until the next block confirms on top of it."
          es: "Reversible por el emisor hasta que el siguiente bloque confirme encima."
      - id: d
        text:
          en: "Automatically refunded if price moves more than the fee you paid."
          es: "Reembolsada automáticamente si el precio se mueve más que la comisión pagada."
    explanation:
      en: "Settlement is final: once buried under enough blocks, reversing a transaction would mean out-running the whole honest network. No sender, miner or support desk has that power, and none of them has a window in which to use it."
      es: "Las transacciones son irreversibles: una vez enterrada bajo suficientes bloques, revertirla exigiría adelantar a toda la red honesta. Ni el emisor, ni un minero, ni un soporte tienen ese poder, ni una ventana en la que ejercerlo."
  - id: no-operator
    prompt:
      en: "Which best describes who runs a blockchain like Bitcoin?"
      es: "¿Qué describe mejor quién opera una blockchain como Bitcoin?"
    options:
      - id: a
        text:
          en: "A single company whose database is the ledger every other node just copies."
          es: "Una única empresa cuya base de datos es el libro que los demás nodos copian."
      - id: b
        text:
          en: "A committee of the largest exchanges, which votes protocol changes through."
          es: "Un comité de los mayores exchanges, que vota y aprueba los cambios de protocolo."
      - id: c
        correct: true
        text:
          en: "Thousands of independent nodes holding the same history and the same rules."
          es: "Miles de nodos independientes que guardan la misma historia y las mismas reglas."
      - id: d
        text:
          en: "A consortium of central banks that clears settlement between them overnight."
          es: "Un consorcio de bancos centrales que compensa la liquidación entre ellos de noche."
    explanation:
      en: "There is no central operator to run it, vote on it or clear it. Many nodes hold the same history and reject anything that breaks the rules — which is why no single party can print extra coins, freeze a balance or reverse a payment to please anyone."
      es: "No hay operador central que lo dirija, lo vote ni lo compense. Muchos nodos guardan la misma historia y rechazan cualquier cosa que rompa las reglas: por eso ninguna parte puede emitir monedas extra, congelar un saldo ni revertir un pago para complacer a nadie."
  - id: reversal-myth
    kind: true_false
    prompt:
      en: "If you send Bitcoin to the wrong address and the transaction confirms, no support desk anywhere can reverse it for you."
      es: "Si envías Bitcoin a la dirección equivocada y la transacción se confirma, ningún soporte del mundo puede revertirla por ti."
    answer: true
    explanation:
      en: "True. Settlement is final: once a transaction is confirmed and buried under later blocks there is no chargeback, and no company sits above the network with the power to undo one."
      es: "Cierto. Las transacciones son irreversibles: una vez confirmada y enterrada bajo bloques posteriores no hay contracargo, y ninguna empresa está por encima de la red con poder para deshacerla."
  - id: keys-consequence-match
    kind: matching
    prompt:
      en: "Match each user-level property of a blockchain to its practical consequence."
      es: "Empareja cada propiedad de una blockchain para el usuario con su consecuencia práctica."
    pairs:
      - id: op
        left: { en: "No central operator", es: "Sin operador central" }
        right:
          en: "No single company's database 'is' Bitcoin; thousands of nodes must agree."
          es: "La base de datos de ninguna empresa 'es' Bitcoin; miles de nodos deben ponerse de acuerdo."
      - id: fin
        left: { en: "Settlement is final", es: "Las transacciones son irreversibles" }
        right:
          en: "There is no chargeback and no support desk once a transfer confirms."
          es: "No hay contracargo ni atención al cliente una vez que una transferencia se confirma."
      - id: key
        left: { en: "You hold keys, not accounts", es: "Tienes claves, no cuentas" }
        right:
          en: "Whoever controls the private key controls the coins."
          es: "Quien controla la clave privada controla las monedas."
    explanation:
      en: "These three ideas are the whole user-level picture: no operator to appeal to, final settlement, and ownership that lives in the key itself."
      es: "Estas tres ideas son toda la imagen para el usuario: no hay operador al que reclamar, las transacciones son finales, y la propiedad reside en la propia clave."
  - id: self-custody
    prompt:
      en: "You hold the private key to some of your coins yourself. What does that mean in practice?"
      es: "Guardas tú mismo la clave privada de algunas de tus monedas. ¿Qué significa eso en la práctica?"
    options:
      - id: a
        text:
          en: "Support can reset the key like a password, once you prove who you are."
          es: "El soporte puede restablecer la clave como una contraseña, si demuestras quién eres."
      - id: b
        text:
          en: "The exchange keeps a backup of the key, which is what its cold storage is."
          es: "El exchange guarda una copia de la clave: en eso consiste su almacenamiento en frío."
      - id: c
        text:
          en: "Your coins are insured by the network against a key you can no longer use."
          es: "La red asegura tus monedas frente a una clave que ya no puedas usar."
      - id: d
        correct: true
        text:
          en: "Full control, and full responsibility if you lose the key."
          es: "Control total, y responsabilidad total si pierdes la clave."
    explanation:
      en: "Whoever controls the key controls the coins — that is the point of self-custody and also the danger. The chain only knows which key authorised a transfer, so there is no reset, no backup held on your behalf and no insurer standing behind it."
      es: "Quien controla la clave controla las monedas: ese es el sentido de la autocustodia y también el peligro. La cadena solo sabe qué clave autorizó una transferencia, así que no hay restablecimiento, ni copia guardada por ti, ni aseguradora detrás."
  - id: exchange-balance
    kind: multi_select
    prompt:
      en: "Your coins are sitting on an exchange. Select ALL statements that are true of that situation."
      es: "Tus monedas están en un exchange. Selecciona TODAS las afirmaciones ciertas en esa situación."
    options:
      - id: a
        correct: true
        text:
          en: "You own an IOU from the exchange, not the coins themselves."
          es: "Tienes un pagaré del exchange, no las monedas en sí."
      - id: b
        correct: true
        text:
          en: "The exchange can freeze withdrawals, cutting you off from the balance."
          es: "El exchange puede congelar los retiros y dejarte sin acceso al saldo."
      - id: c
        correct: true
        text:
          en: "If the exchange goes bankrupt, your balance can go with it."
          es: "Si el exchange quiebra, tu saldo puede irse con él."
      - id: d
        text:
          en: "The network insures your balance against the exchange failing."
          es: "La red asegura tu saldo frente a la quiebra del exchange."
      - id: e
        text:
          en: "You control the private key to those coins, held in your account."
          es: "Controlas la clave privada de esas monedas, guardada en tu cuenta."
    explanation:
      en: "\"Not your keys, not your coins\": a balance on an exchange is a claim against a company, and the company holds the key. Several exchanges have frozen withdrawals or gone bankrupt taking customer balances with them, and no network-level insurer made anyone whole."
      es: "\"Not your keys, not your coins\": un saldo en un exchange es un derecho frente a una empresa, y la empresa tiene la clave. Varios exchanges han congelado retiros o han quebrado llevándose los saldos de sus clientes, y ninguna aseguradora de red repuso a nadie."
  - id: lost-key
    kind: true_false
    prompt:
      en: "If you lose the private key to your coins, they are frozen forever — nobody can restore access."
      es: "Si pierdes la clave privada de tus monedas, quedan congeladas para siempre: nadie puede restaurar el acceso."
    answer: true
    explanation:
      en: "True. The chain only knows which key authorised a transfer, so control of the key is ownership with nothing else attached. Millions of BTC are gone exactly this way."
      es: "Cierto. La cadena solo sabe qué clave autorizó una transferencia, así que controlar la clave es la propiedad y no hay nada más detrás. Millones de BTC se han perdido exactamente así."
  - id: settlement-steps
    kind: ordering
    prompt:
      en: "Put the life of a blockchain transaction in order, from creation to the point where it can no longer be undone."
      es: "Ordena la vida de una transacción en blockchain, desde su creación hasta el punto en que ya no puede deshacerse."
    items:
      - id: sign
        position: 1
        text:
          en: "The holder authorises the transfer with their private key."
          es: "El titular autoriza la transferencia con su clave privada."
      - id: broadcast
        position: 2
        text:
          en: "The transaction is broadcast to the network's independent nodes."
          es: "La transacción se difunde a los nodos independientes de la red."
      - id: block
        position: 3
        text:
          en: "Nodes check it against the rules and it is bundled into a block."
          es: "Los nodos la validan contra las reglas y se agrupa en un bloque."
      - id: buried
        position: 4
        text:
          en: "Later blocks stack on top, each pointing back to the previous one."
          es: "Se apilan bloques posteriores, cada uno apuntando al anterior."
      - id: final
        position: 5
        text:
          en: "Reversing it would mean out-running the whole honest network — settlement is final."
          es: "Revertirla exigiría adelantar a toda la red honesta: la liquidación es definitiva."
    explanation:
      en: "Finality is not a policy, it is arithmetic: each block that stacks on top makes rewriting the history below it more economically absurd. That same property removes your safety net."
      es: "La irreversibilidad no es una política, es aritmética: cada bloque que se apila encima hace más económicamente absurdo reescribir la historia de debajo. Esa misma propiedad te quita la red de seguridad."
  - id: supply-change
    prompt:
      en: "Why can't a large holder or a friendly regulator simply have Bitcoin's 21 million cap raised?"
      es: "¿Por qué un gran holder o un regulador amistoso no puede simplemente subir el límite de 21 millones de Bitcoin?"
    options:
      - id: a
        text:
          en: "Financial law in most countries forbids changing a published token supply."
          es: "La ley financiera de la mayoría de países prohíbe cambiar un suministro publicado."
      - id: b
        correct: true
        text:
          en: "There is nobody to ask: a core rule changes only if the whole network of nodes adopts it."
          es: "No hay a quién pedírselo: una regla central cambia solo si toda la red de nodos la adopta."
      - id: c
        text:
          en: "The cap can be raised, but only at a halving, once every four years."
          es: "El límite puede subirse, pero solo en un halving, una vez cada cuatro años."
      - id: d
        text:
          en: "Only the largest mining pool may approve it, and it has always refused."
          es: "Solo el mayor pool de minería puede aprobarlo, y siempre se ha negado."
    explanation:
      en: "No central operator means no desk that takes the request — not a legislature, not a schedule, not the biggest miner. A rule that thousands of independent nodes enforce changes only when they overwhelmingly choose to run different software, which is slow and rare by design."
      es: "Que no haya operador central significa que no hay ventanilla que reciba la petición: ni un legislador, ni un calendario, ni el mayor minero. Una regla que hacen cumplir miles de nodos independientes cambia solo cuando ellos deciden masivamente ejecutar otro software, algo lento y raro por diseño."
