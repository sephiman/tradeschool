# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: not-your-keys
    prompt:
      en: "\"Not your keys, not your coins\" means…"
      es: "\"Not your keys, not your coins\" significa…"
    options:
      - id: a
        correct: true
        text:
          en: "Coins held on an exchange are an IOU from it; you don't control them directly."
          es: "Las monedas en un exchange son un pagaré suyo; no las controlas directamente."
      - id: b
        text: { en: "You must memorize your keys or lose access.", es: "Debes memorizar tus claves o pierdes el acceso." }
      - id: c
        text: { en: "Only miners truly own coins.", es: "Solo los mineros poseen de verdad las monedas." }
      - id: d
        text: { en: "Keys are optional on modern exchanges.", es: "Las claves son opcionales en los exchanges modernos." }
    explanation:
      en: "If your coins sit on an exchange you hold a claim against it, not the coins — which matters the day withdrawals freeze."
      es: "Si tus monedas están en un exchange tienes un derecho frente a él, no las monedas: eso importa el día que se congelan los retiros."
  - id: finality
    prompt:
      en: "A confirmed transaction, buried under enough later blocks, is…"
      es: "Una transacción confirmada, enterrada bajo suficientes bloques posteriores, es…"
    options:
      - id: a
        correct: true
        text: { en: "Effectively irreversible — there is no chargeback.", es: "Prácticamente irreversible: no hay contracargo." }
      - id: b
        text: { en: "Reversible within 24 hours by support.", es: "Reversible en 24 horas por soporte." }
      - id: c
        text: { en: "Reversible by the sender at any time.", es: "Reversible por el emisor en cualquier momento." }
      - id: d
        text: { en: "Automatically refunded if the price moves.", es: "Reembolsada automáticamente si el precio se mueve." }
    explanation:
      en: "Settlement is final: once buried under enough blocks, reversing a transaction is, in practice, impossible."
      es: "Las transacciones son irreversibles: una vez enterrada bajo suficientes bloques, revertir una transacción es, en la práctica, imposible."
  - id: no-operator
    prompt:
      en: "Which best describes who runs a blockchain like Bitcoin?"
      es: "¿Qué describe mejor quién opera una blockchain como Bitcoin?"
    options:
      - id: a
        correct: true
        text:
          en: "Thousands of independent nodes that keep the same history and reject rule-breaking."
          es: "Miles de nodos independientes que guardan la misma historia y rechazan lo que rompe las reglas."
      - id: b
        text: { en: "A single company whose database is the ledger.", es: "Una única empresa cuya base de datos es el libro contable." }
      - id: c
        text: { en: "A committee of exchanges.", es: "Un comité de exchanges." }
      - id: d
        text: { en: "A central bank consortium.", es: "Un consorcio de bancos centrales." }
    explanation:
      en: "There is no central operator: many nodes hold the same history and reject anything that breaks the rules."
      es: "No hay operador central: muchos nodos guardan la misma historia y rechazan cualquier cosa que rompa las reglas."
  - id: reversal-myth
    kind: true_false
    prompt:
      en: "If you send Bitcoin to the wrong address and the transaction confirms, exchange support can reverse it for you."
      es: "Si envías Bitcoin a la dirección equivocada y la transacción se confirma, el soporte del exchange puede revertirla por ti."
    answer: false
    explanation:
      en: "Settlement is final. Once a transaction is confirmed and buried under later blocks, there is no chargeback and no support desk that can undo it."
      es: "Las transacciones son irreversibles. Una vez confirmada y enterrada bajo bloques posteriores, no hay contracargo ni un soporte que pueda deshacerla."
  - id: keys-consequence-match
    kind: matching
    prompt:
      en: "Match each user-level property of a blockchain to its practical consequence."
      es: "Empareja cada propiedad de una blockchain para el usuario con su consecuencia práctica."
    pairs:
      - id: op
        left: { en: "No central operator", es: "Sin operador central" }
        right:
          en: "No single company's database 'is' Bitcoin; thousands of nodes must agree."
          es: "La base de datos de ninguna empresa 'es' Bitcoin; miles de nodos deben ponerse de acuerdo."
      - id: fin
        left: { en: "Settlement is final", es: "Las transacciones son irreversibles" }
        right:
          en: "There is no chargeback and no support desk once a transfer confirms."
          es: "No hay contracargo ni atención al cliente una vez que una transferencia se confirma."
      - id: key
        left: { en: "You hold keys, not accounts", es: "Tienes claves, no cuentas" }
        right:
          en: "Whoever controls the private key controls the coins."
          es: "Quien controla la clave privada controla las monedas."
    explanation:
      en: "These three ideas are the whole user-level picture: no operator to appeal to, final settlement, and ownership that lives in the key itself."
      es: "Estas tres ideas son toda la imagen para el usuario: no hay operador al que reclamar, las transacciones son finales, y la propiedad reside en la propia clave."
  - id: self-custody
    prompt:
      en: "You hold the private key to some of your coins yourself. What does that mean in practice?"
      es: "Guardas tú mismo la clave privada de algunas de tus monedas. ¿Qué significa eso en la práctica?"
    options:
      - id: a
        correct: true
        text:
          en: "Full control and full responsibility — if you lose the key, no one can restore access."
          es: "Control total y responsabilidad total: si pierdes la clave, nadie puede restaurar el acceso."
      - id: b
        text: { en: "Support can reset your key like a forgotten password.", es: "El soporte puede restablecer tu clave como una contraseña olvidada." }
      - id: c
        text: { en: "The exchange keeps a backup of your key.", es: "El exchange guarda una copia de seguridad de tu clave." }
      - id: d
        text: { en: "Your coins are insured by the network.", es: "La red asegura tus monedas." }
    explanation:
      en: "Whoever controls the key controls the coins. That is the point of self-custody and also the danger: lose the key and there is no reset."
      es: "Quien controla la clave controla las monedas. Ese es el sentido de la autocustodia y también el peligro: si pierdes la clave, no hay forma de restablecerla."
  - id: exchange-balance
    kind: multi_select
    prompt:
      en: "Your coins are sitting on an exchange. Select ALL statements that are true of that situation."
      es: "Tus monedas están en un exchange. Selecciona TODAS las afirmaciones ciertas en esa situación."
    options:
      - id: a
        correct: true
        text:
          en: "You own an IOU from the exchange, not the coins themselves."
          es: "Tienes un pagaré del exchange, no las monedas en sí."
      - id: b
        correct: true
        text:
          en: "The exchange can freeze withdrawals, cutting you off from the balance."
          es: "El exchange puede congelar los retiros y dejarte sin acceso al saldo."
      - id: c
        correct: true
        text:
          en: "If the exchange goes bankrupt, your balance can go with it."
          es: "Si el exchange quiebra, tu saldo puede irse con él."
      - id: d
        text: { en: "The network insures your balance.", es: "La red asegura tu saldo." }
      - id: e
        text: { en: "You control the private key to those coins.", es: "Controlas la clave privada de esas monedas." }
    explanation:
      en: "\"Not your keys, not your coins\": a balance on an exchange is a claim against a company. Several exchanges have frozen withdrawals or gone bankrupt taking customer balances with them."
      es: "\"Not your keys, not your coins\": un saldo en un exchange es un derecho frente a una empresa. Varios exchanges han congelado retiros o han quebrado llevándose los saldos de sus clientes."
  - id: lost-key
    kind: true_false
    prompt:
      en: "If you lose the private key to your coins, they are frozen forever — nobody can restore access."
      es: "Si pierdes la clave privada de tus monedas, quedan congeladas para siempre: nadie puede restaurar el acceso."
    answer: true
    explanation:
      en: "True. The chain only knows which key authorised a transfer, so control of the key is ownership with nothing else attached. Millions of BTC are gone exactly this way."
      es: "Cierto. La cadena solo sabe qué clave autorizó una transferencia, así que controlar la clave es la propiedad y no hay nada más detrás. Millones de BTC se han perdido exactamente así."
  - id: settlement-steps
    kind: ordering
    prompt:
      en: "Put the life of a blockchain transaction in order, from creation to the point where it can no longer be undone."
      es: "Ordena la vida de una transacción en blockchain, desde su creación hasta el punto en que ya no puede deshacerse."
    items:
      - id: sign
        position: 1
        text:
          en: "The holder authorises the transfer with their private key."
          es: "El titular autoriza la transferencia con su clave privada."
      - id: broadcast
        position: 2
        text:
          en: "The transaction is broadcast to the network's independent nodes."
          es: "La transacción se difunde a los nodos independientes de la red."
      - id: block
        position: 3
        text:
          en: "Nodes check it against the rules and it is bundled into a block."
          es: "Los nodos la validan contra las reglas y se agrupa en un bloque."
      - id: buried
        position: 4
        text:
          en: "Later blocks stack on top, each pointing back to the previous one."
          es: "Se apilan bloques posteriores, cada uno apuntando al anterior."
      - id: final
        position: 5
        text:
          en: "Reversing it would mean out-running the whole honest network — settlement is final."
          es: "Revertirla exigiría adelantar a toda la red honesta: la liquidación es definitiva."
    explanation:
      en: "Finality is not a policy, it is arithmetic: each block that stacks on top makes rewriting the history below it more economically absurd. That same property removes your safety net."
      es: "La irreversibilidad no es una política, es aritmética: cada bloque que se apila encima hace más económicamente absurdo reescribir la historia de debajo. Esa misma propiedad te quita la red de seguridad."
  - id: supply-change
    prompt:
      en: "Why can't a large holder or a friendly regulator simply have Bitcoin's 21 million cap raised?"
      es: "¿Por qué un gran holder o un regulador amistoso no puede simplemente subir el límite de 21 millones de Bitcoin?"
    options:
      - id: a
        correct: true
        text:
          en: "There is nobody to ask — changing a core rule means convincing the whole network of nodes, which is slow and rare by design."
          es: "No hay a quién pedírselo: cambiar una regla central exige convencer a toda la red de nodos, algo lento y raro por diseño."
      - id: b
        text: { en: "It is forbidden by financial law in most countries.", es: "Lo prohíbe la ley financiera en la mayoría de países." }
      - id: c
        text: { en: "The cap can be raised, but only once every four years.", es: "El límite puede subirse, pero solo una vez cada cuatro años." }
      - id: d
        text: { en: "Only the largest mining pool may approve it, and it refuses.", es: "Solo el mayor pool de minería puede aprobarlo, y se niega." }
    explanation:
      en: "No central operator means no single party can print extra coins, freeze a balance or reverse a payment to please anyone. The rules are enforced by thousands of nodes at once."
      es: "Que no haya operador central significa que ninguna parte puede emitir monedas extra, congelar un saldo ni revertir un pago para complacer a nadie. Las reglas las hacen cumplir miles de nodos a la vez."
