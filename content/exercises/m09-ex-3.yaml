# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: cycle-order
    prompt:
      en: "Which sequence correctly describes the Wyckoff cycle?"
      es: "¿Qué secuencia describe correctamente el ciclo de Wyckoff?"
    options:
      - id: a
        correct: true
        text:
          en: "Accumulation, then markup, then distribution, then markdown."
          es: "Acumulación, luego markup, luego distribución, luego markdown."
      - id: b
        text:
          en: "Distribution, then markup, then accumulation, then markdown."
          es: "Distribución, luego markup, luego acumulación, luego markdown."
      - id: c
        text:
          en: "Accumulation, then markdown, then distribution, then markup."
          es: "Acumulación, luego markdown, luego distribución, luego markup."
      - id: d
        text:
          en: "Markup, then markdown, then accumulation, then distribution."
          es: "Markup, luego markdown, luego acumulación, luego distribución."
    explanation:
      en: "Large players build longs during accumulation, which resolves upward into the markup. After the markup they unload during distribution, which resolves downward into the markdown. Each range is followed by the trend it was preparing, so accumulation cannot precede a markdown and distribution cannot precede a markup — and the cycle always starts from the range, not from the trend it produces."
      es: "Los grandes participantes construyen largos durante la acumulación, que se resuelve al alza en el markup. Tras el markup sueltan durante la distribución, que se resuelve a la baja en el markdown. Cada rango va seguido de la tendencia que preparaba, así que la acumulación no puede preceder a un markdown ni la distribución a un markup, y el ciclo arranca siempre en el rango, no en la tendencia que produce."
  - id: range-meaning
    prompt:
      en: "In Wyckoff's reading, what is actually happening during a sideways trading range?"
      es: "En la lectura de Wyckoff, ¿qué ocurre realmente durante un rango lateral?"
    options:
      - id: a
        correct: true
        text:
          en: "Large players are quietly building or unloading, a slice at a time."
          es: "Los grandes participantes construyen o sueltan en silencio, porción a porción."
      - id: b
        text:
          en: "Nothing meaningful — the market idles until the next piece of news lands."
          es: "Nada relevante: el mercado se para hasta que llegue la próxima noticia."
      - id: c
        text:
          en: "Institutions have left the market entirely and only retail traders remain."
          es: "Las instituciones han abandonado el mercado y solo queda el retail."
      - id: d
        text:
          en: "Accumulation, always — sideways price means buyers are absorbing supply."
          es: "Acumulación, siempre: un precio lateral significa que los compradores absorben."
    explanation:
      en: "The whole point of Wyckoff is that a quiet range is where the big, invisible work happens: a large order has to be worked over many sessions of two-way churn, because filling it at once would move price against itself. That work is anything but idle, and the institutions are the ones doing it. A range can be accumulation OR distribution — the prior trend and the false break tell you which; sideways price alone does not mean buyers are winning."
      es: "Todo el sentido de Wyckoff es que un rango tranquilo es donde ocurre el trabajo grande e invisible: una orden grande hay que trabajarla en muchas sesiones de ir y venir, porque llenarla de golpe movería el precio en su contra. Ese trabajo es cualquier cosa menos parálisis, y quienes lo hacen son las instituciones. Un rango puede ser acumulación O distribución; la tendencia previa y la ruptura falsa te dicen cuál, y un precio lateral por sí solo no significa que ganen los compradores."
  - id: cycle-sequence
    kind: ordering
    prompt:
      en: "Put the four stages of the Wyckoff cycle in order, first to last."
      es: "Ordena las cuatro etapas del ciclo de Wyckoff, de la primera a la última."
    items:
      - id: acc
        position: 1
        text: { en: "Accumulation (a range after a downtrend)", es: "Acumulación (un rango tras una tendencia bajista)" }
      - id: mup
        position: 2
        text: { en: "Markup (price trends up, leaving the range)", es: "Markup (el precio sube en tendencia y abandona el rango)" }
      - id: dis
        position: 3
        text: { en: "Distribution (a range after the markup)", es: "Distribución (un rango tras el markup)" }
      - id: mdn
        position: 4
        text: { en: "Markdown (price trends down, leaving the range)", es: "Markdown (el precio baja en tendencia y abandona el rango)" }
    explanation:
      en: "The cycle alternates range, trend, range, trend: accumulation builds longs, the markup carries them up, distribution unloads them, and the markdown carries price back down. A range is always followed by the trend it was preparing — accumulation into markup, distribution into markdown."
      es: "El ciclo alterna rango, tendencia, rango, tendencia: la acumulación construye largos, el markup los lleva arriba, la distribución los suelta y el markdown lleva el precio de vuelta abajo. Un rango va siempre seguido de la tendencia que preparaba: acumulación hacia markup, distribución hacia markdown."
  - id: phases-order
    kind: ordering
    prompt:
      en: "Wyckoff labels the life of a trading range with phases A to E. Put them in the order they occur."
      es: "Wyckoff etiqueta la vida de un rango con fases de la A a la E. Ordénalas según ocurren."
    items:
      - id: pa
        position: 1
        text: { en: "Phase A — the prior trend stops and the range's first boundaries form", es: "Fase A — la tendencia previa se detiene y se forman los primeros límites del rango" }
      - id: pb
        position: 2
        text: { en: "Phase B — the long, choppy middle where the cause is built", es: "Fase B — el medio largo y errático donde se construye la causa" }
      - id: pc
        position: 3
        text: { en: "Phase C — the test, where the spring or upthrust appears", es: "Fase C — la prueba, donde aparece el spring o el upthrust" }
      - id: pd
        position: 4
        text: { en: "Phase D — the range starts to resolve toward one boundary", es: "Fase D — el rango empieza a resolverse hacia un límite" }
      - id: pe
        position: 5
        text: { en: "Phase E — price leaves the range; the markup or markdown begins", es: "Fase E — el precio abandona el rango; comienza el markup o el markdown" }
    explanation:
      en: "You never have to name these live, but the order tells the story: the trend stops (A), the cause is built through long churn (B), the range is tested with a spring or upthrust (C), it starts to resolve (D), and finally price leaves the range (E). The spring or upthrust sits in Phase C, before the range actually breaks."
      es: "Nunca hace falta nombrarlas en directo, pero el orden cuenta la historia: la tendencia se detiene (A), se construye la causa con un ir y venir largo (B), el rango se pone a prueba con un spring o un upthrust (C), empieza a resolverse (D) y por fin el precio abandona el rango (E). El spring o el upthrust está en la fase C, antes de que el rango se rompa de verdad."
  - id: range-nothing-myth
    kind: true_false
    prompt:
      en: "A quiet, sideways range means nothing important is happening; the only action worth watching is in the trends."
      es: "Un rango tranquilo y lateral significa que no pasa nada importante; lo único que merece la pena mirar son las tendencias."
    answer: false
    explanation:
      en: "This is backwards. Wyckoff's whole claim is that the range is where the big, invisible work happens — a large player filling an order over many sessions. The trends (markup, markdown) are just the visible result of buying or selling that already finished inside the range."
      es: "Es justo al revés. Todo el argumento de Wyckoff es que el rango es donde ocurre el trabajo grande e invisible: un gran participante llenando una orden a lo largo de muchas sesiones. Las tendencias (markup, markdown) son solo el resultado visible de una compra o venta que ya terminó dentro del rango."
  - id: stage-actions
    kind: matching
    prompt:
      en: "Match each stage of the Wyckoff cycle to what is happening in it."
      es: "Empareja cada etapa del ciclo de Wyckoff con lo que ocurre en ella."
    pairs:
      - id: acc
        left: { en: "Accumulation", es: "Acumulación" }
        right: { en: "A range after a downtrend; large players quietly build long positions", es: "Un rango tras una tendencia bajista; los grandes participantes construyen largos en silencio" }
      - id: mup
        left: { en: "Markup", es: "Markup" }
        right: { en: "A trend up out of the range; the buying is done and price rises", es: "Una tendencia al alza fuera del rango; la compra ha terminado y el precio sube" }
      - id: dis
        left: { en: "Distribution", es: "Distribución" }
        right: { en: "A range after an uptrend; large players quietly unload into eager buyers", es: "Un rango tras una tendencia alcista; los grandes participantes sueltan en silencio a compradores entusiastas" }
      - id: mdn
        left: { en: "Markdown", es: "Markdown" }
        right: { en: "A trend down out of the range; the selling is done and price falls", es: "Una tendencia a la baja fuera del rango; la venta ha terminado y el precio cae" }
    explanation:
      en: "Accumulation and distribution are the ranges (building and unloading); markup and markdown are the trends that follow. Note the symmetry: accumulation follows a downtrend and leads to a markup, while distribution follows an uptrend and leads to a markdown."
      es: "La acumulación y la distribución son los rangos (construir y soltar); el markup y el markdown son las tendencias que siguen. Fíjate en la simetría: la acumulación sigue a una tendencia bajista y lleva a un markup, mientras que la distribución sigue a una alcista y lleva a un markdown."
  - id: accumulation-context
    prompt:
      en: "Accumulation is a range that comes after a ___ and resolves into a ___."
      es: "La acumulación es un rango que llega después de un(a) ___ y se resuelve en un ___."
    options:
      - id: a
        text:
          en: "after an uptrend; resolves into a markdown"
          es: "después de una tendencia alcista; se resuelve en un markdown"
      - id: b
        text:
          en: "after an uptrend; resolves into a markup"
          es: "después de una tendencia alcista; se resuelve en un markup"
      - id: c
        text:
          en: "after a downtrend; resolves into a markdown"
          es: "después de una tendencia bajista; se resuelve en un markdown"
      - id: d
        correct: true
        text:
          en: "after a downtrend; resolves into a markup"
          es: "después de una tendencia bajista; se resuelve en un markup"
    explanation:
      en: "Accumulation is where large players buy from sellers who have given up — so it follows a downtrend and, once the buying is done, resolves upward into a markup. The first option describes distribution, its exact mirror image; the other two mix the two ranges up, which is the most common Wyckoff mistake there is."
      es: "La acumulación es donde los grandes participantes compran a los vendedores que se han rendido, así que sigue a una tendencia bajista y, terminada la compra, se resuelve al alza en un markup. La primera opción describe la distribución, su imagen espejo exacta; las otras dos mezclan ambos rangos, que es el error más común que existe en Wyckoff."
  - id: why-size-hides
    prompt:
      en: "A desk wants 2,000 contracts but the visible order book only offers 150 near the current price. Why does it feed 100–200 at a time over days instead of buying it all now?"
      es: "Una mesa quiere 2.000 contratos pero el libro visible solo ofrece 150 cerca del precio actual. ¿Por qué introduce 100-200 a la vez durante días en vez de comprarlo todo ahora?"
    options:
      - id: a
        text:
          en: "Exchanges cap the maximum order size on futures contracts."
          es: "Los exchanges limitan el tamaño máximo de orden en los futuros."
      - id: b
        correct: true
        text:
          en: "Paying up through every offer would move price 8–10% against itself."
          es: "Pagar a través de todas las ofertas movería el precio un 8-10% en su contra."
      - id: c
        text:
          en: "Smaller orders qualify the desk for a lower maker fee tier."
          es: "Las órdenes pequeñas dan acceso a un tramo de comisión maker menor."
      - id: d
        text:
          en: "It is waiting for a technical signal before committing the full size."
          es: "Espera una señal técnica antes de comprometer todo el tamaño."
    explanation:
      en: "It would also announce its intent to the whole market. That constraint is why a range forms at all: the sideways chop is not indecision, it is a large order being worked in slices, and each slice needs a willing counterparty on the other side. Nothing forces the split from outside — no size cap, no fee tier, and the desk has already decided to buy."
      es: "También anunciaría su intención a todo el mercado. Esa restricción es la razón de que se forme un rango: el movimiento lateral no es indecisión, es una orden grande ejecutada en porciones, y cada porción necesita una contraparte dispuesta al otro lado. Nada impone el troceo desde fuera: ni un límite de tamaño, ni un tramo de comisión, y la mesa ya ha decidido comprar."
  - id: absorbing-question
    prompt:
      en: "Support at 100 has held for two weeks: every sag toward 100 gets bought, every push toward resistance fades. What is the question Wyckoff says to ask?"
      es: "Un soporte en 100 ha aguantado dos semanas: cada caída hacia 100 se compra, cada empuje hacia la resistencia se desvanece. ¿Cuál es la pregunta que dice Wyckoff que hay que hacerse?"
    options:
      - id: a
        text:
          en: "\"How many days remain until the range is forced to break?\""
          es: "\"¿Cuántos días quedan hasta que el rango tenga que romperse?\""
      - id: b
        text:
          en: "\"Which indicator confirms that this really is a range?\""
          es: "\"¿Qué indicador confirma que esto es de verdad un rango?\""
      - id: c
        correct: true
        text:
          en: "\"Who is doing the absorbing, and on which side?\""
          es: "\"¿Quién está absorbiendo, y en qué lado?\""
      - id: d
        text:
          en: "\"Is the range wide enough to trade edge to edge profitably?\""
          es: "\"¿Es el rango bastante ancho para operarlo de extremo a extremo?\""
    explanation:
      en: "To a chart watcher two weeks at 100 is dead money. To Wyckoff it is a buyer sitting on the bid, absorbing everything offered, session after session, until the sellers are used up — so the question is who, and on which side, never 'is it going sideways?'. Ranges have no expiry date, no indicator declares them, and their width is a separate question from what is being built inside."
      es: "Para quien solo mira el gráfico, dos semanas en 100 es dinero muerto. Para Wyckoff es un comprador sentado en la demanda, absorbiendo todo lo que se ofrece, sesión tras sesión, hasta agotar a los vendedores: por eso la pregunta es quién y en qué lado, nunca '¿está yendo de lado?'. Los rangos no tienen fecha de caducidad, ningún indicador los declara, y su anchura es una pregunta aparte de lo que se está construyendo dentro."
  - id: stages-vs-phases
    kind: multi_select
    prompt:
      en: "Select ALL statements that correctly separate Wyckoff's two vocabularies."
      es: "Selecciona TODAS las afirmaciones que separan correctamente los dos vocabularios de Wyckoff."
    options:
      - id: a
        correct: true
        text:
          en: "Stages name the cycle the whole market moves through."
          es: "Las etapas nombran el ciclo por el que pasa todo el mercado."
      - id: b
        correct: true
        text:
          en: "Phases A–E name the interior life of one single range."
          es: "Las fases A-E nombran la vida interior de un único rango."
      - id: c
        correct: true
        text:
          en: "Accumulation follows a downtrend; distribution follows an uptrend."
          es: "La acumulación sigue a una tendencia bajista; la distribución, a una alcista."
      - id: d
        text:
          en: "Stages and phases are two names for one five-step sequence."
          es: "Etapas y fases son dos nombres para una misma secuencia de cinco pasos."
      - id: e
        text:
          en: "You must name the live phase before you can trade a range."
          es: "Debes nombrar la fase en vivo antes de poder operar un rango."
    explanation:
      en: "Keep the two apart: the cycle is the market's long arc — accumulation, markup, distribution, markdown — while the phases are one range's story from A to E. They are different scales, not synonyms. And you do not need to name phases live: the vocabulary is for reading the shape, not a checklist to complete before acting."
      es: "Mantén ambos separados: el ciclo es el arco largo del mercado —acumulación, markup, distribución, markdown— mientras que las fases son la historia de un solo rango de la A a la E. Son escalas distintas, no sinónimos. Y no necesitas nombrar las fases en vivo: el vocabulario sirve para leer la forma, no es una lista que completar antes de actuar."
