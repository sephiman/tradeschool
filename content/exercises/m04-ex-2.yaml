type: calculation
formula: funding_payment
prompt:
  en: "A **{side}** perp position carries **{notional} USDT** of notional through the funding timestamp. The 8-hour funding rate prints at **{rate}**. How much funding do you pay this interval, in USDT? (Negative means you receive it instead.)"
  es: "Una posición perp **{side}** arrastra **{notional} USDT** de nocional al llegar la marca de funding. La tasa de funding a 8 horas marca **{rate}**. ¿Cuánto funding pagas en este intervalo, en USDT? (Negativo significa que lo recibes en su lugar.)"
params:
  notional: { kind: int_range, min: 25000, max: 100000, step: 5000 }
  rate: { kind: choice, values: ["0.0001", "0.0005", "0.001", "-0.0004"] }
  side: { kind: choice, values: ["long", "short"] }
tolerance: { abs: "0.5" }
round: 2
unit: USDT
explanation:
  en: "Multiply the notional by the rate, then apply the sign of your side (+1 long, −1 short). With a negative funding rate the crowded side flips: shorts pay and longs receive. The bigger the notional, the more each interval costs — which is why funding matters on positions held for days. Exchanges quote funding as a percentage (0.05%, not 0.0005), so convert it once before you multiply — two places left. In your head it is easier the other way round: 1% of the notional is a hundredth of it, and every funding rate you will meet is a small slice of that."
  es: "Multiplica el nocional por la tasa y aplica el signo de tu lado (+1 largo, −1 corto). Con una tasa de funding negativa el lado saturado cambia: los cortos pagan y los largos reciben. Cuanto mayor el nocional, más cuesta cada intervalo, y por eso el funding importa en posiciones mantenidas durante días. Los exchanges cotizan el funding en porcentaje (0,05%, no 0,0005), así que conviértelo una vez antes de multiplicar: dos lugares a la izquierda. De cabeza sale mejor al revés: el 1% del nocional es su centésima parte, y toda tasa de funding que verás es una porción pequeña de eso."
