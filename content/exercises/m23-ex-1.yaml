# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: holding-period-swing
    prompt:
      en: "Which trading style is defined by holding positions for days to weeks?"
      es: "¿Qué estilo de trading se define por mantener las posiciones de días a semanas?"
    options:
      - id: a
        text:
          en: "Scalping, whose positions run from seconds to a few minutes."
          es: "El scalping, cuyas posiciones van de segundos a unos minutos."
      - id: b
        text:
          en: "Day trading, because 'day' means holding on for several days."
          es: "El day trading, porque 'day' significa aguantar varios días."
      - id: c
        correct: true
        text:
          en: "Swing trading, which holds a single position for days and sometimes weeks."
          es: "El swing trading, que aguanta una posición días o semanas."
      - id: d
        text:
          en: "Whichever of the styles happens to use the most leverage."
          es: "El estilo que resulte usar más apalancamiento."
    explanation:
      en: "Swing trading holds for days to weeks. Day trading closes within the same day — the name refers to a single session, not several days — and scalping lasts only seconds to minutes. Leverage is a separate choice and plays no part in naming a style."
      es: "El swing trading mantiene de días a semanas. El day trading cierra dentro del mismo día —el nombre alude a una única sesión, no a varios días— y el scalping dura solo de segundos a minutos. El apalancamiento es una elección aparte y no interviene en el nombre del estilo."
  - id: holding-period-scalp
    prompt:
      en: "About how long does a scalper typically hold a single position?"
      es: "¿Cuánto suele mantener un scalper una sola posición?"
    options:
      - id: a
        text:
          en: "Several days, closing the position out over the weekend."
          es: "Varios días, cerrando la posición durante el fin de semana."
      - id: b
        text:
          en: "Until the next funding payment comes round, and then out."
          es: "Hasta que llega el siguiente pago de funding, y entonces fuera."
      - id: c
        text:
          en: "From the market open through to the market close each day."
          es: "Desde la apertura hasta el cierre del mercado cada día."
      - id: d
        correct: true
        text:
          en: "Seconds to a few minutes, and often dozens or hundreds of trades a day."
          es: "De segundos a unos pocos minutos, y a menudo decenas al día."
    explanation:
      en: "Scalping means very short holds — seconds to a few minutes — and often dozens or hundreds of trades a day. Holding for a day is day trading; holding for days is swing trading. And crypto has no open or close to hold between, which is why the styles are defined by duration rather than by a session."
      es: "El scalping son tenencias muy cortas —de segundos a pocos minutos— y a menudo decenas o cientos de operaciones al día. Mantener un día es day trading; mantener varios días es swing trading. Y el cripto no tiene apertura ni cierre entre los que mantener, por eso los estilos se definen por duración y no por una sesión."
  - id: day-trade-definition
    prompt:
      en: "What is the defining feature of day trading?"
      es: "¿Cuál es el rasgo que define al day trading?"
    options:
      - id: a
        text:
          en: "Positions are held for several days, since 'day' means across days."
          es: "Las posiciones se mantienen varios días, ya que 'day' significa varios días."
      - id: b
        text:
          en: "It only ever uses the daily chart, reading one candle at a time."
          es: "Solo usa el gráfico diario, leyendo una vela cada vez."
      - id: c
        correct: true
        text:
          en: "Positions open and close within the same day, nothing held overnight."
          es: "Las posiciones se abren y cierran el mismo día, sin mantener de noche."
      - id: d
        text:
          en: "It always uses more leverage than swing trading does."
          es: "Siempre usa más apalancamiento que el swing trading."
    explanation:
      en: "A day trader closes out before the day is over and does not hold overnight on purpose — the 'day' is a single session, not several days. Typical work is a handful of trades read off the 5-minute to 1-hour charts rather than the daily, and leverage is a separate choice, not part of the definition."
      es: "Un day trader cierra antes de que acabe el día y no mantiene de un día para otro a propósito: el 'day' es una única sesión, no varios días. Lo típico es un puñado de operaciones leídas en gráficos de 5 minutos a 1 hora, no en el diario, y el apalancamiento es una elección aparte, no parte de la definición."
  - id: styles-holding-match
    kind: matching
    prompt:
      en: "Match each trading style to its typical holding period and behaviour."
      es: "Empareja cada estilo de trading con su periodo de tenencia y comportamiento típicos."
    pairs:
      - id: scalp
        left: { en: "Scalping", es: "Scalping" }
        right:
          en: "Seconds to a few minutes; dozens or hundreds of trades a day."
          es: "De segundos a unos pocos minutos; decenas o cientos de operaciones al día."
      - id: day
        left: { en: "Day trading", es: "Day trading" }
        right:
          en: "Minutes to hours; flat by the end of the session, no overnight position."
          es: "De minutos a horas; plano al final de la sesión, sin posición nocturna."
      - id: swing
        left: { en: "Swing trading", es: "Swing trading" }
        right:
          en: "Days to weeks; only a handful of trades, decided on higher timeframes."
          es: "De días a semanas; solo un puñado de operaciones, decididas en temporalidades altas."
    explanation:
      en: "The styles form a spectrum by holding period: scalping is seconds to minutes, day trading is minutes to hours (closed within the session), and swing trading runs for days to weeks. Holding period — not the coin or the indicator — is how you tell them apart."
      es: "Los estilos forman un espectro por periodo de tenencia: el scalping es de segundos a minutos, el day trading de minutos a horas (cerrado dentro de la sesión) y el swing trading corre de días a semanas. El periodo de tenencia —no la moneda ni el indicador— es como se distinguen."
  - id: styles-speed-order
    kind: ordering
    prompt:
      en: "Order the three trading styles from the shortest typical holding period to the longest."
      es: "Ordena los tres estilos de trading del periodo de tenencia típico más corto al más largo."
    items:
      - id: scalp
        position: 1
        text: { en: "Scalping (seconds to minutes)", es: "Scalping (de segundos a minutos)" }
      - id: day
        position: 2
        text: { en: "Day trading (minutes to hours)", es: "Day trading (de minutos a horas)" }
      - id: swing
        position: 3
        text: { en: "Swing trading (days to weeks)", es: "Swing trading (de días a semanas)" }
    explanation:
      en: "Fastest to slowest: scalping (seconds to minutes), then day trading (minutes to hours, closed within the day), then swing trading (days to weeks). That single axis — how long you hold — is what separates the styles."
      es: "Del más rápido al más lento: scalping (de segundos a minutos), luego day trading (de minutos a horas, cerrado dentro del día) y luego swing trading (de días a semanas). Ese único eje —cuánto tiempo mantienes— es lo que separa los estilos."
  - id: what-separates-styles
    kind: true_false
    prompt:
      en: "Three traders on the same coin, with the same account and the same indicator, can still be in three different styles."
      es: "Tres traders en la misma moneda, con la misma cuenta y el mismo indicador, pueden estar aun así en tres estilos distintos."
    answer: true
    explanation:
      en: "True. What separates the styles is how long they hold and how often they trade — not the coin, not the account size and not the indicator on the chart."
      es: "Cierto. Lo que separa los estilos es cuánto tiempo mantienen y con qué frecuencia operan, no la moneda, ni el tamaño de la cuenta, ni el indicador del gráfico."
  - id: two-charts
    prompt:
      en: "Each style names two charts — a slower frame and a faster one. What different jobs do they do?"
      es: "Cada estilo nombra dos gráficos: uno más lento y otro más rápido. ¿Qué trabajos distintos hacen?"
    options:
      - id: a
        text:
          en: "The lower timeframe dictates the bias, since it is the more current one."
          es: "La temporalidad menor dicta el sesgo, por ser la más actualizada."
      - id: b
        text:
          en: "They are alternatives — you pick whichever one agrees with your idea."
          es: "Son alternativas: eliges la que coincida con tu idea."
      - id: c
        correct: true
        text:
          en: "The higher timeframe sets the bias; the lower one sets the entry."
          es: "La temporalidad mayor fija el sesgo; la menor fija la entrada."
      - id: d
        text:
          en: "The slower chart is for entries and the faster one is for targets."
          es: "El gráfico lento es para entradas y el rápido para objetivos."
    explanation:
      en: "That is the top-down step of the trading plan: bias first on the higher timeframe, then the entry on the lower one, in that order — never flipping between them to justify a position you already hold, and never letting the fastest chart decide the direction."
      es: "Ese es el paso descendente del plan de trading: primero el sesgo en la temporalidad mayor, luego la entrada en la menor, en ese orden, sin saltar entre ellas para justificar una posición que ya tienes y sin dejar que el gráfico más rápido decida la dirección."
  - id: scalping-facts
    kind: multi_select
    prompt:
      en: "Select ALL statements that are TRUE of scalping."
      es: "Selecciona TODAS las afirmaciones ciertas sobre el scalping."
    options:
      - id: a
        correct: true
        text: { en: "Positions last seconds to a few minutes.", es: "Las posiciones duran de segundos a unos pocos minutos." }
      - id: b
        correct: true
        text: { en: "Dozens or hundreds of trades a day is normal.", es: "Docenas o cientos de operaciones al día es lo normal." }
      - id: c
        correct: true
        text: { en: "Most days end flat, with no open risk.", es: "La mayoría de los días acaban planos, sin riesgo abierto." }
      - id: d
        correct: true
        text: { en: "It reads the fastest charts — tick, 1-minute, 5-minute.", es: "Lee los gráficos más rápidos: tick, 1 minuto, 5 minutos." }
      - id: e
        text:
          en: "It is the most profitable style, because it captures more moves."
          es: "Es el estilo más rentable, porque captura más movimientos."
    explanation:
      en: "Holding period, trade count and timeframe move together along the spectrum — pick a point on one and the other two are largely decided. None of that makes a style inherently more profitable; more trades is more decisions and more fees, not more edge."
      es: "El periodo de tenencia, el número de operaciones y la temporalidad se mueven juntos en el espectro: elige un punto en uno y los otros dos quedan casi decididos. Nada de eso hace que un estilo sea intrínsecamente más rentable; más operaciones son más decisiones y más comisiones, no más ventaja."
  - id: style-boundaries
    kind: true_false
    prompt:
      en: "The boundaries between the styles are strict rules: a day trade that runs a little long has become something else and the trade is a mistake."
      es: "Los límites entre estilos son reglas estrictas: una operación intradía que se alarga un poco se ha convertido en otra cosa y la operación es un error."
    answer: false
    explanation:
      en: "The boundaries are not laws; a 'day trade' that runs a little long is not a sin. The holding period is simply the honest way to tell the styles apart — not how clever the setup looks, and not which coin you trade."
      es: "Los límites no son leyes; una 'operación intradía' que se alarga un poco no es un pecado. El periodo de tenencia es simplemente la forma honesta de distinguir los estilos, no lo ingenioso que parezca el setup ni la moneda que operes."
