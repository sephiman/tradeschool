# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: volume-profile-match
    kind: matching
    prompt:
      en: "Match each volume profile level to its trading significance."
      es: "Empareja cada nivel del perfil de volumen con su importancia en el trading."
    pairs:
      - id: poc
        left: { en: "Point of Control (POC)", es: "Punto de Control (POC)" }
        right:
          en: "The single price level with the highest traded volume during the specified session."
          es: "El nivel de precio individual con el mayor volumen negociado durante la sesión."
      - id: va
        left: { en: "Value Area (VAH / VAL)", es: "Área de Valor (VAH / VAL)" }
        right:
          en: "The price range containing approximately 70% of total session trading volume."
          es: "El rango de precios que contiene aproximadamente el 70% del volumen total de la sesión."
      - id: lvn
        left: { en: "Low Volume Node (LVN)", es: "Nodo de Bajo Volumen (LVN)" }
        right:
          en: "A price zone with sparse volume where price tends to move fast without rejection."
          es: "Una zona de poco volumen donde el precio tiende a moverse rápido sin encontrar rechazo."
    explanation:
      en: "The POC represents fair value where most trading occurred. LVNs act as fast-pass zones where price moves quickly due to lack of resting volume."
      es: "El POC representa el valor justo donde más se negoció. Los LVN actúan como zonas de paso rápido donde el precio se desplaza velozmente por falta de volumen."

  - id: profile-analysis-steps
    kind: ordering
    prompt:
      en: "Order the steps for trading a Value Area acceptance scenario."
      es: "Ordena los pasos para operar un escenario de aceptación en el Área de Valor."
    items:
      - id: step-1
        position: 1
        text:
          en: "Identify prior session Value Area High (VAH) and Value Area Low (VAL)."
          es: "Identificar el VAH y VAL de la sesión anterior."
      - id: step-2
        position: 2
        text:
          en: "Observe price opening outside the Value Area."
          es: "Observar que el precio abre fuera del Área de Valor."
      - id: step-3
        position: 3
        text:
          en: "Watch for price re-entering and accepting back inside the Value Area with volume."
          es: "Observar si el precio vuelve a entrar y se acepta dentro del Área de Valor con volumen."
      - id: step-4
        position: 4
        text:
          en: "Target the opposite side of the Value Area (POC then VAH/VAL target)."
          es: "Buscar como objetivo el lado opuesto del Área de Valor (POC y luego VAH/VAL)."
    explanation:
      en: "Value Area acceptance rules state that if price re-enters a previous value area and accepts, it has high probability of traversing to the opposite side."
      es: "Las reglas del área de valor indican que si el precio reingresa y se acepta en una zona anterior, tiene alta probabilidad de cruzar hacia el lado opuesto."

  - id: volume-profile-concepts
    kind: multi_select
    prompt:
      en: "Which statements correctly describe Volume Profile characteristics?"
      es: "¿Qué afirmaciones describen correctamente las características del Perfil de Volumen?"
    options:
      - id: a
        correct: true
        text:
          en: "Volume Profile organises volume by price level, not by time."
          es: "El Perfil de Volumen ordena el volumen por precio, no por tiempo."
      - id: b
        correct: true
        text:
          en: "High Volume Nodes are fair-value acceptance and consolidation zones."
          es: "Los Nodos de Alto Volumen son zonas de valor justo y consolidación."
      - id: c
        correct: false
        text:
          en: "Price is guaranteed to turn around whenever it touches the POC."
          es: "Se garantiza que el precio gire cada vez que toca el POC."
      - id: d
        correct: true
        text:
          en: "Low Volume Nodes act as rejection points or fast-movement zones."
          es: "Los Nodos de Bajo Volumen son puntos de rechazo o de paso rápido."
    explanation:
      en: "Volume profile structures show where heavy trading agreement occurred (HVN) versus price levels passed through rapidly (LVN). A POC marks past fair value, which makes a reaction there more likely than at a random price — never a guaranteed turn."
      es: "Las estructuras del perfil de volumen muestran dónde ocurrió un fuerte acuerdo de negociación (HVN) frente a precios cruzados rápidamente (LVN). Un POC marca el valor justo pasado, lo que hace una reacción ahí más probable que en un precio al azar, nunca un giro garantizado."

  - id: poc-magnet-myth
    kind: true_false
    prompt:
      en: "The Point of Control (POC) acts as a mandatory magnet that price is guaranteed to revisit every session."
      es: "El Punto de Control (POC) actúa como un imán obligatorio al que el precio está obligado a volver cada sesión."
    answer: false
    explanation:
      en: "Treating POC as a guaranteed target is a classic trader mistake. POC represents past fair value, not a guaranteed future appointment."
      es: "Tratar el POC como un objetivo garantizado es un error clásico. El POC representa el valor justo pasado, no una cita futura obligatoria."

  - id: lvn-behavior-read
    kind: single_choice
    prompt:
      en: "Why does price tend to slice quickly through a Low Volume Node (LVN)?"
      es: "¿Por qué el precio tiende a cruzar rápidamente un Nodo de Bajo Volumen (LVN)?"
    options:
      - id: a
        correct: true
        text:
          en: "There is little resting liquidity at those prices to slow price down."
          es: "Hay poca liquidez en reposo a esos precios que frene al precio."
      - id: b
        text:
          en: "The exchange disables limit orders inside a low-volume band entirely."
          es: "El exchange desactiva las órdenes límite dentro de esa banda."
      - id: c
        text:
          en: "An LVN doubles the available leverage, so moves through it accelerate."
          es: "Un LVN duplica el apalancamiento y los movimientos se aceleran."
      - id: d
        text:
          en: "LVNs only form while the market is closed, so price gaps across them."
          es: "Los LVN solo se forman con el mercado cerrado y el precio salta."
    explanation:
      en: "LVNs represent prices where little trading previously occurred, so the book at those prices is thin and offers little friction against an aggressive move. Nothing about the venue's rules changes there — it is simply an absence of history and of resting orders."
      es: "Los LVN representan precios donde antes se negoció poco, así que el libro a esos precios es fino y ofrece poca fricción frente a un movimiento agresivo. Nada cambia en las reglas del exchange ahí: es sencillamente una ausencia de historial y de órdenes en reposo."

  - id: volume-profile-vah-val-meaning
    kind: single_choice
    prompt:
      en: "What does price trading within the Value Area (between VAH and VAL) signify?"
      es: "¿Qué significa que el precio cotice dentro del Área de Valor (entre VAH y VAL)?"
    options:
      - id: a
        text:
          en: "An immediate trend reversal is guaranteed once price re-enters it."
          es: "Se garantiza una inversión de tendencia en cuanto vuelva a entrar."
      - id: b
        text:
          en: "The 70% band marks the prices the market rejected most quickly."
          es: "La banda del 70 % marca los precios que el mercado rechazó antes."
      - id: c
        text:
          en: "Spot and perp prices have disconnected across that band of prices."
          es: "Los precios de spot y perpetuos se han desconectado en esa banda."
      - id: d
        correct: true
        text:
          en: "Balance: buyers and sellers currently agree this price is fair."
          es: "Equilibrio: compradores y vendedores aceptan ese precio como justo."
    explanation:
      en: "The Value Area contains about 70% of traded volume, marking the range where participants accept current prices as fair — a balanced consolidation state, and the opposite of a rejected band. It describes where the market has been comfortable; it promises nothing about the next move."
      es: "El Área de Valor contiene en torno al 70 % del volumen negociado y marca el rango donde los participantes aceptan los precios actuales como justos: un estado de consolidación equilibrada, lo contrario de una banda rechazada. Describe dónde el mercado ha estado cómodo; no promete nada sobre el siguiente movimiento."

  - id: footprint-delta-imbalance
    kind: single_choice
    prompt:
      en: "What is a diagonal buying imbalance on a footprint chart?"
      es: "¿Qué es un desequilibrio comprador diagonal en un gráfico de footprint?"
    options:
      - id: a
        text:
          en: "A rendering error in the chart, since the two sides cannot differ."
          es: "Un error de dibujo del gráfico, ya que los dos lados no difieren."
      - id: b
        correct: true
        text:
          en: "Aggressive buys at one ask far outnumber the bid diagonally below."
          es: "Las compras agresivas en un ask superan al bid diagonal de abajo."
      - id: c
        text:
          en: "A signal the funding rate will fall on the next settlement interval."
          es: "Una señal de que el funding bajará en el siguiente intervalo."
      - id: d
        text:
          en: "An order placed at the weekend, when the two sides are counted apart."
          es: "Una orden puesta en fin de semana, cuando los lados se cuentan aparte."
    explanation:
      en: "Footprints display trades diagonally, ask against the bid one level below, precisely because the two sides genuinely differ: a buying imbalance shows aggressive market orders sweeping that level with force. The comparison is the whole point of the display, not an artefact of it."
      es: "Los footprints muestran las operaciones en diagonal, el ask contra el bid del nivel inferior, justamente porque los dos lados sí difieren: un desequilibrio comprador muestra órdenes a mercado barriendo ese nivel con fuerza. La comparación es el sentido de la pantalla, no un artefacto suyo."

  - id: hvn-support-resistance-nature
    kind: single_choice
    prompt:
      en: "Why do High Volume Nodes (HVNs) frequently act as support or resistance levels during price retests?"
      es: "¿Por qué los Nodos de Alto Volumen (HVN) actúan con frecuencia como soporte o resistencia al retestar el precio?"
    options:
      - id: a
        text:
          en: "Exchanges freeze price movement whenever price returns to an HVN."
          es: "Los exchanges congelan el precio cada vez que vuelve a un HVN."
      - id: b
        text:
          en: "An HVN automatically triggers liquidations, which stalls the move."
          es: "Un HVN dispara liquidaciones automáticas y eso frena el movimiento."
      - id: c
        text:
          en: "HVN levels only exist on very low timeframes, so retests stall there."
          es: "Los HVN solo existen en temporalidades muy bajas y ahí se frena."
      - id: d
        correct: true
        text:
          en: "Heavy past trade leaves standing interest and memory at that price."
          es: "Mucha negociación pasada deja interés y memoria en ese precio."
    explanation:
      en: "HVNs mark prices where high volume previously transacted, so participants perceive them as fair-value anchors and liquidity tends to be deep there. The effect comes from the participants' own behaviour, not from any exchange mechanism — and, as ever, it makes a reaction more likely rather than certain."
      es: "Los HVN marcan precios donde antes se negoció mucho volumen, así que los participantes los perciben como anclas de valor justo y la liquidez suele ser profunda ahí. El efecto viene del comportamiento de los propios participantes, no de ningún mecanismo del exchange; y, como siempre, hace una reacción más probable, no segura."
