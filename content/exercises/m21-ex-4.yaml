# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: slippage-def
    prompt:
      en: "You send a market order on a thin altcoin and fill several ticks worse than the last printed price. What just happened?"
      es: "Envías una orden de mercado en una altcoin poco líquida y te ejecutas varios ticks peor que el último precio impreso. ¿Qué acaba de pasar?"
    options:
      - id: a
        correct: true
        text:
          en: "Slippage — your order walked through a thin book, filling deeper at worse prices because little size was resting near the top."
          es: "Slippage: tu orden atravesó un libro poco profundo, ejecutándose más abajo a peores precios porque había poco volumen puesto cerca de arriba."
      - id: b
        text:
          en: "You were liquidated by the exchange."
          es: "El exchange te liquidó."
      - id: c
        text:
          en: "The exchange charged a hidden penalty fee."
          es: "El exchange te cobró una penalización oculta."
      - id: d
        text:
          en: "Your limit price was set too high."
          es: "Tu precio de límite estaba fijado demasiado alto."
    explanation:
      en: "That gap between expected and actual fill is slippage, caused by a market order eating through a thin book. It is not a liquidation (a forced close by the exchange), not a hidden fee, and a market order has no limit price to mis-set."
      es: "Esa diferencia entre la ejecución esperada y la real es el slippage, causado por una orden de mercado que se come un libro poco profundo. No es una liquidación (un cierre forzoso del exchange), no es una comisión oculta, y una orden de mercado no tiene precio de límite que fijar mal."
  - id: liquidity-effect
    prompt:
      en: "How does thin liquidity affect a market order compared with a deep, liquid book?"
      es: "¿Cómo afecta la escasa liquidez a una orden de mercado frente a un libro profundo y líquido?"
    options:
      - id: a
        correct: true
        text:
          en: "Thin liquidity widens slippage — with little size resting near price, even a modest order moves the price several ticks."
          es: "La escasa liquidez ensancha el slippage: con poco volumen puesto cerca del precio, hasta una orden modesta lo mueve varios ticks."
      - id: b
        text:
          en: "Thin liquidity means the exchange will liquidate the position sooner."
          es: "La escasa liquidez significa que el exchange liquidará la posición antes."
      - id: c
        text:
          en: "Liquidity has no effect; the fill price is always the last printed price."
          es: "La liquidez no influye; el precio de ejecución es siempre el último precio impreso."
      - id: d
        text:
          en: "A thin book always fills you at a better price than a deep one."
          es: "Un libro poco profundo siempre te ejecuta a mejor precio que uno profundo."
    explanation:
      en: "Liquidity is how much size can trade without moving price. A deep book absorbs your order with barely a wobble; a thin book has little resting size, so the order walks the price and slippage widens. Liquidity is not liquidation — thin books do not, by themselves, liquidate you."
      es: "La liquidez es cuánto volumen puede operarse sin mover el precio. Un libro profundo absorbe tu orden con apenas un temblor; un libro poco profundo tiene poco volumen puesto, así que la orden hace caminar el precio y el slippage se ensancha. La liquidez no es liquidación: un libro poco profundo no te liquida por sí solo."
  - id: liquidity-not-liquidation
    kind: true_false
    prompt:
      en: "Thin liquidity, by itself, will liquidate your position."
      es: "La escasa liquidez, por sí sola, liquidará tu posición."
    answer: false
    explanation:
      en: "Liquidity and liquidation are different things. Thin liquidity widens your slippage — a market order walks the price — but it does not force-close your position. Liquidation is the exchange closing a leveraged position when margin runs out, a separate event."
      es: "La liquidez y la liquidación son cosas distintas. La escasa liquidez ensancha tu slippage —una orden de mercado hace caminar el precio— pero no cierra a la fuerza tu posición. La liquidación es el exchange cerrando una posición apalancada cuando se agota el margen, un suceso aparte."
  - id: slippage-defence
    prompt:
      en: "You have to trade a thin, illiquid altcoin. What is the sensible way to limit slippage?"
      es: "Tienes que operar una altcoin poco profunda y poco líquida. ¿Cuál es la forma sensata de limitar el slippage?"
    options:
      - id: a
        correct: true
        text:
          en: "Prefer limit orders to name your price, and size down so you are not forced to eat the whole book."
          es: "Prefiere órdenes de límite para fijar tu precio, y reduce el tamaño para no verte obligado a comerte el libro entero."
      - id: b
        text:
          en: "Send one large market order so it fills before the price can move."
          es: "Envía una orden de mercado grande para que se ejecute antes de que el precio pueda moverse."
      - id: c
        text:
          en: "Assume the market order will fill near the last printed price."
          es: "Da por hecho que la orden de mercado se ejecutará cerca del último precio impreso."
      - id: d
        text:
          en: "Add leverage so a smaller balance covers the same size."
          es: "Añade apalancamiento para que un saldo menor cubra el mismo tamaño."
    explanation:
      en: "On a thin book a market order walks the price, so name your price with limit orders and keep size small enough that you are not forced deep into the book. Never assume a market order fills near the last print when there is little resting behind it, and leverage does nothing to reduce slippage."
      es: "En un libro poco profundo, una orden de mercado hace caminar el precio, así que fija tu precio con órdenes de límite y mantén un tamaño lo bastante pequeño para no verte obligado a adentrarte en el libro. Nunca asumas que una orden de mercado se ejecuta cerca del último precio impreso cuando hay poco volumen puesto detrás, y el apalancamiento no hace nada por reducir el slippage."
  - id: execution-terms-match
    kind: matching
    prompt:
      en: "Match each execution term to its meaning."
      es: "Empareja cada término de ejecución con su significado."
    pairs:
      - id: slp
        left: { en: "Slippage", es: "Slippage" }
        right: { en: "The gap between the price you expected and the price you got", es: "La diferencia entre el precio que esperabas y el que conseguiste" }
      - id: liqd
        left: { en: "Liquidity", es: "Liquidez" }
        right: { en: "How much size can trade without moving the price", es: "Cuánto volumen puede operarse sin mover el precio" }
      - id: thin
        left: { en: "Thin book", es: "Libro poco profundo" }
        right: { en: "Little resting size near price, so orders walk it several ticks", es: "Poco volumen puesto cerca del precio, así que las órdenes lo hacen caminar varios ticks" }
      - id: liqn
        left: { en: "Liquidation", es: "Liquidación" }
        right: { en: "A forced close of a leveraged position by the exchange", es: "Un cierre forzoso de una posición apalancada por el exchange" }
    explanation:
      en: "Keep the terms straight: slippage is the fill gap, liquidity is how much can trade without moving price, a thin book is one with little resting size. Liquidation is unrelated to the other three — it is the exchange forcibly closing a position when margin runs out."
      es: "Ten claros los términos: el slippage es la diferencia de ejecución, la liquidez es cuánto puede operarse sin mover el precio, un libro poco profundo es el que tiene poco volumen puesto. La liquidación no tiene relación con los otros tres: es el exchange cerrando a la fuerza una posición cuando se agota el margen."
  - id: deep-vs-thin
    prompt:
      en: "Compared with a thin book, how does a deep, liquid book handle the same market order?"
      es: "Frente a un libro poco profundo, ¿cómo maneja un libro profundo y líquido la misma orden de mercado?"
    options:
      - id: a
        correct: true
        text:
          en: "It absorbs the order with barely a wobble, so your average fill stays close to the current price."
          es: "Absorbe la orden con apenas un temblor, así que tu ejecución promedio se mantiene cerca del precio actual."
      - id: b
        text:
          en: "It always fills you at a worse price than a thin book would."
          es: "Siempre te ejecuta a peor precio que uno fino."
      - id: c
        text:
          en: "It fills you at exactly the last printed price, guaranteed."
          es: "Te ejecuta exactamente al último precio impreso, garantizado."
      - id: d
        text:
          en: "It has no effect; fill price depends only on order size."
          es: "No influye; el precio de ejecución depende solo del tamaño de la orden."
    explanation:
      en: "A deep book has plenty of size resting near price, so it soaks up your order with little movement and your average fill stays close to where the market is. A thin book, with little resting size, lets even a modest order walk the price and slip."
      es: "Un libro profundo tiene mucho volumen puesto cerca del precio, así que absorbe tu orden con poco movimiento y tu ejecución promedio se mantiene cerca de donde está el mercado. Un libro poco profundo, con poco volumen puesto, deja que hasta una orden modesta haga caminar el precio y resbale."
  - id: market-fills-near-last
    kind: true_false
    prompt:
      en: "A market order always fills near the last printed price, even when the book behind it is nearly empty."
      es: "Una orden de mercado siempre se ejecuta cerca del último precio impreso, incluso cuando el libro que hay detrás está casi vacío."
    answer: false
    explanation:
      en: "The last printed price is just the last trade; it says nothing about how much size is resting now. On a nearly empty book a market order eats through what little is there and fills at progressively worse prices, sometimes far from the last print."
      es: "El último precio impreso es solo la última operación; no dice nada de cuánto volumen hay puesto ahora. En un libro casi vacío, una orden de mercado se come lo poco que haya y se ejecuta a precios cada vez peores, a veces lejos del último precio impreso."
  - id: slippage-worked
    prompt:
      en: "You send a market buy for 10 contracts. The resting asks are 2 at 100.0, 3 at 100.5 and 5 at 101.0. What is your average fill, and what would a deep book have done?"
      es: "Envías una compra a mercado de 10 contratos. Los asks en reposo son 2 a 100,0, 3 a 100,5 y 5 a 101,0. ¿Cuál es tu precio medio y qué habría hecho un libro profundo?"
    options:
      - id: a
        correct: true
        text:
          en: "100.65 — a 0.65 gap from the 100.0 you saw quoted. On a deep book where 100.0 held 500 contracts, all 10 would have filled at 100.0."
          es: "100,65: una diferencia de 0,65 respecto al 100,0 que veías cotizado. En un libro profundo donde 100,0 tuviera 500 contratos, los 10 se habrían ejecutado a 100,0."
      - id: b
        text: { en: "100.0 — market orders fill at the quoted price.", es: "100,0: las órdenes de mercado se ejecutan al precio cotizado." }
      - id: c
        text: { en: "101.0 — the whole order fills at the worst level touched.", es: "101,0: toda la orden se ejecuta al peor nivel alcanzado." }
      - id: d
        text: { en: "100.5 — the midpoint of the levels swept.", es: "100,5: el punto medio de los niveles barridos." }
    explanation:
      en: "Your order sweeps every level in turn: (2×100.0 + 3×100.5 + 5×101.0) / 10 = 100.65. Slippage is the gap between the price you expected and the average you got, and it is a property of the book, not of your intent."
      es: "Tu orden barre cada nivel por turno: (2×100,0 + 3×100,5 + 5×101,0) / 10 = 100,65. El slippage es la diferencia entre el precio que esperabas y la media que obtuviste, y es una propiedad del libro, no de tu intención."
  - id: became-the-price
    prompt:
      en: "You fire a large market order into a shallow altcoin book and it moves several percent against you. What actually happened?"
      es: "Lanzas una orden de mercado grande a un libro poco profundo de una altcoin y se mueve varios puntos porcentuales en tu contra. ¿Qué ocurrió realmente?"
    options:
      - id: a
        correct: true
        text:
          en: "You swept every resting level and handed that whole move to whoever was on the other side. You did not get 'the market price' — you became the market price, and a bad one."
          es: "Barriste todos los niveles en reposo y regalaste todo ese movimiento a quien estuviera al otro lado. No conseguiste 'el precio de mercado': te convertiste en el precio de mercado, y en uno malo."
      - id: b
        text:
          en: "The exchange repriced your order to protect the book."
          es: "El exchange reajustó tu orden para proteger el libro."
      - id: c
        text:
          en: "Thin liquidity liquidated part of your position."
          es: "La escasa liquidez liquidó parte de tu posición."
      - id: d
        text:
          en: "Nothing unusual — that is the normal cost of any market order."
          es: "Nada raro: es el coste normal de cualquier orden de mercado."
    explanation:
      en: "On thin books, break large orders up, use limits, or simply size down. And remember thin liquidity widens slippage — it does not, by itself, liquidate you."
      es: "En libros poco profundos, divide las órdenes grandes, usa límites o simplemente reduce el tamaño. Y recuerda que la escasa liquidez amplía el slippage: por sí sola no te liquida."
  - id: thin-book-defence
    kind: multi_select
    prompt:
      en: "Select ALL the sensible defences when you have to trade a thin, illiquid market."
      es: "Selecciona TODAS las defensas sensatas cuando tienes que operar un mercado poco profundo e ilíquido."
    options:
      - id: a
        correct: true
        text: { en: "Prefer limit orders so you name your price.", es: "Prefiere órdenes límite para fijar tú el precio." }
      - id: b
        correct: true
        text:
          en: "Size down so you are not forced to eat the whole book."
          es: "Reduce el tamaño para no verte obligado a comerte todo el libro."
      - id: c
        correct: true
        text: { en: "Break a large order up rather than sending it in one clip.", es: "Divide una orden grande en vez de enviarla de una vez." }
      - id: d
        correct: true
        text:
          en: "Never assume a market order fills near the last printed price when the book behind it is empty."
          es: "Nunca supongas que una orden de mercado se ejecutará cerca del último precio impreso si el libro detrás está vacío."
      - id: e
        text:
          en: "Use a larger market order, so it clears the thin levels in one move."
          es: "Usa una orden de mercado más grande, para despejar los niveles poco profundos de una vez."
    explanation:
      en: "How much you slip depends on how much size is resting near the price. Every defence here is a way of not needing more liquidity than the book actually has."
      es: "Cuánto slippage sufres depende de cuánto tamaño descansa cerca del precio. Todas estas defensas son formas de no necesitar más liquidez de la que el libro tiene."
