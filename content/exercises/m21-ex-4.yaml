type: quiz
variants:
  - id: expiry-moves-the-perp
    prompt:
      en: "A perpetual never expires. Why does a quarterly futures settlement move it anyway?"
      es: "Un perpetuo no vence nunca. ¿Por qué lo mueve entonces la liquidación de un futuro trimestral?"
    options:
      - id: a
        text:
          en: "The exchange settles the perpetual against the quarterly's final price."
          es: "El exchange liquida el perpetuo contra el precio final del trimestral."
      - id: b
        correct: true
        text:
          en: "Positions built on the gap must be closed, and they close on the perp."
          es: "Las posiciones montadas sobre el hueco hay que cerrarlas, y cierran en el perpetuo."
      - id: c
        text:
          en: "Funding is suspended around settlement, which frees price to move."
          es: "El funding se suspende en la liquidación, lo que libera al precio."
      - id: d
        text:
          en: "It does not: perpetual and quarterly markets are entirely independent."
          es: "No lo mueve: el mercado perpetuo y el trimestral son independientes."
    explanation:
      en: "A dated contract converges to spot at settlement, so every position built on the difference between it and the perp — carry trades, calendar spreads, all of m21-l1 — has to be closed or rolled at that moment, and those closures land where the liquidity is, which is the perp. The basis re-anchors, and the flow doing it is mechanical: it happens because a date arrived, not because anybody changed their mind. Options expiries do the same thing through released market-maker hedges."
      es: "Un contrato con fecha converge al spot en la liquidación, así que toda posición montada sobre la diferencia entre él y el perpetuo —carries, spreads de calendario, toda m21-l1— hay que cerrarla o rolarla en ese momento, y esos cierres caen donde está la liquidez, que es el perpetuo. La base se reancla, y el flujo que lo hace es mecánico: ocurre porque llegó una fecha, no porque nadie haya cambiado de opinión. Los vencimientos de opciones hacen lo mismo a través de las coberturas que sueltan los creadores de mercado."
  - id: outage-risk
    prompt:
      en: "When is an exchange most likely to slow down or stop responding?"
      es: "¿Cuándo es más probable que un exchange se ralentice o deje de responder?"
    options:
      - id: a
        text:
          en: "At random — outages have no relationship to market activity."
          es: "Al azar: las caídas no tienen relación con la actividad del mercado."
      - id: b
        text:
          en: "During the quiet weekend hours, when maintenance is usually scheduled."
          es: "En las horas tranquilas del fin de semana, cuando suele haber mantenimiento."
      - id: c
        correct: true
        text:
          en: "When volume spikes — which is when your position needs attention."
          es: "Cuando se dispara el volumen, que es cuando tu posición necesita atención."
      - id: d
        text:
          en: "Just after a large expiry, once the mechanical flow has been processed."
          es: "Justo después de un vencimiento grande, procesado ya el flujo mecánico."
    explanation:
      en: "Venues degrade under load, and load is highest exactly when everyone is trying to act — so 'I cannot close' arrives at the worst possible moment, by construction rather than by bad luck. The liquidation engine, meanwhile, does not go down when the app does: your margin is still being checked whether or not you can log in. That is the whole argument for a stop RESTING on the exchange rather than in your head, and for a size that survives a move you cannot react to."
      es: "Las plataformas se degradan bajo carga, y la carga es máxima justo cuando todo el mundo intenta actuar, así que el «no puedo cerrar» llega en el peor momento posible por construcción y no por mala suerte. El motor de liquidación, mientras tanto, no se cae cuando se cae la app: tu margen se sigue comprobando puedas o no entrar. Ese es el argumento entero a favor de un stop PUESTO en el exchange en vez de en tu cabeza, y de un tamaño que sobreviva a un movimiento al que no puedas reaccionar."
  - id: conditions-mould
    kind: true_false
    prompt:
      en: "A calendar of unlocks, listings and expiries is a schedule of price directions you can trade from."
      es: "Un calendario de unlocks, listings y vencimientos es una agenda de direcciones de precio que se pueden operar."
    answer: false
    explanation:
      en: "It is a schedule of CONDITIONS: how liquid the book will be, how volatile the hours around a date, who is likely to be forced to trade. That is the same mould as m19's open interest and funding and m16's squeeze, and mistaking it for a direction is how calendars cost people money. What a public date does reliably tell you is that the market has had time to prepare for it."
      es: "Es una agenda de CONDICIONES: cuánta liquidez habrá en el libro, cuánta volatilidad en las horas alrededor de una fecha, quién es probable que se vea obligado a operar. Es el mismo molde que el interés abierto y el funding de m19 y el squeeze de m16, y confundirlo con una dirección es como los calendarios le cuestan dinero a la gente. Lo que sí te dice con fiabilidad una fecha pública es que el mercado ha tenido tiempo de prepararse."
  - id: which-risk-where
    kind: matching
    prompt:
      en: "Match each scheduled or operational event to the mechanism behind it."
      es: "Empareja cada evento programado u operativo con el mecanismo que lo explica."
    pairs:
      - id: unlock
        left: { en: "A token unlock", es: "Un desbloqueo de tokens" }
        right:
          en: "Public supply becoming transferable on a known date."
          es: "Oferta pública que pasa a ser transferible en una fecha conocida."
      - id: listing
        left: { en: "'Sell the news'", es: "«Vender la noticia»" }
        right:
          en: "The positioned selling into the flow the event brings."
          es: "Los posicionados vendiendo contra el flujo que trae el evento."
      - id: expiry
        left: { en: "A quarterly expiry", es: "Un vencimiento trimestral" }
        right:
          en: "Hedges unwinding, and the basis re-anchoring on the perp."
          es: "Coberturas deshaciéndose y la base reanclándose en el perpetuo."
      - id: outage
        left: { en: "An outage in volatility", es: "Una caída en plena volatilidad" }
        right:
          en: "Load peaking exactly when you need to close a position."
          es: "La carga en su pico justo cuando necesitas cerrar una posición."
    explanation:
      en: "Every one of them has a mechanism you can name, which is what separates them from folklore — and not one of them names a direction. They tell you what kind of market is coming, which is enough to decide whether to be in it, at what size, and with what already resting on the exchange."
      es: "Todos tienen un mecanismo que se puede nombrar, que es lo que los separa del folclore, y ninguno nombra una dirección. Te dicen qué clase de mercado viene, que es suficiente para decidir si estar dentro, con qué tamaño y con qué dejado ya puesto en el exchange."
