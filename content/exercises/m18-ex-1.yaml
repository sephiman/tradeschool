# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: what-it-measures
    prompt:
      en: "What does the crypto Fear & Greed index actually measure?"
      es: "¿Qué mide realmente el índice de miedo y codicia de cripto?"
    options:
      - id: a
        text:
          en: "The exact direction price will take over the next several days."
          es: "La dirección exacta que tomará el precio en los próximos días."
      - id: b
        correct: true
        text:
          en: "The market's recent mood, blended into a single 0–100 score."
          es: "El ánimo reciente del mercado, mezclado en una sola cifra de 0 a 100."
      - id: c
        text:
          en: "The total amount of leverage currently open across all exchanges."
          es: "El apalancamiento total abierto ahora mismo en todos los exchanges."
      - id: d
        text:
          en: "A guaranteed signal of the exact moment the market will reverse."
          es: "Una señal garantizada del momento exacto en que el mercado girará."
    explanation:
      en: "The index is a lagging, backward-looking composite — volatility, momentum, social media, dominance and search trends — on a 0–100 scale. It summarises how the market has felt lately; it does not forecast direction, does not know when a turn is coming, and reads nobody's actual positioning."
      es: "El índice es un compuesto rezagado y retrospectivo —volatilidad, momentum, redes sociales, dominancia y tendencias de búsqueda— en una escala de 0 a 100. Resume cómo se ha sentido el mercado últimamente; no pronostica dirección, no sabe cuándo llega un giro y no lee el posicionamiento real de nadie."
  - id: half-from-price
    prompt:
      en: "Roughly half of the Fear & Greed score comes from which two inputs?"
      es: "¿De qué dos ingredientes procede aproximadamente la mitad de la puntuación de miedo y codicia?"
    options:
      - id: a
        correct: true
        text:
          en: "Volatility and market momentum, both derived from price."
          es: "Volatilidad y momentum de mercado, ambos derivados del precio."
      - id: b
        text:
          en: "The number of active wallets recorded on-chain over the window."
          es: "El número de carteras activas registradas on-chain en la ventana."
      - id: c
        text:
          en: "Verified surveys of every trader's real positioning across venues."
          es: "Encuestas verificadas del posicionamiento real de cada trader."
      - id: d
        text:
          en: "The interest-rate decisions taken by the major central banks."
          es: "Las decisiones de tipos de interés de los grandes bancos centrales."
    explanation:
      en: "Volatility and momentum together make up about half the score, and both are computed from price. That is why the index is largely a re-description of recent price action rather than an independent measure of emotion — it never surveys anyone, never reads the chain, and never looks at macro policy."
      es: "La volatilidad y el momentum suman juntos casi la mitad de la puntuación, y ambos se calculan a partir del precio. Por eso el índice es, en gran medida, una redescripción de la acción de precio reciente y no una medida independiente de la emoción: no encuesta a nadie, no lee la cadena y no mira la política macro."
  - id: blend-inputs
    kind: multi_select
    prompt:
      en: "Select ALL of the inputs that the crypto Fear & Greed index actually blends into its score."
      es: "Selecciona TODOS los ingredientes que el índice de miedo y codicia de cripto mezcla realmente en su puntuación."
    options:
      - id: a
        correct: true
        text:
          en: "Volatility — how sharply price is swinging versus its recent average."
          es: "Volatilidad: con qué brusquedad oscila el precio frente a su media reciente."
      - id: b
        correct: true
        text:
          en: "Market momentum and volume."
          es: "Momentum y volumen de mercado."
      - id: c
        correct: true
        text:
          en: "The volume and tone of social-media posts about crypto."
          es: "El volumen y el tono de las publicaciones sobre cripto en redes sociales."
      - id: d
        correct: true
        text:
          en: "Bitcoin dominance — money moving into or out of BTC within crypto."
          es: "La dominancia de Bitcoin: dinero que entra o sale de BTC dentro de cripto."
      - id: e
        correct: true
        text:
          en: "Search trends — spikes in terms like \"bitcoin\" or panic searches."
          es: "Las tendencias de búsqueda: picos en términos como \"bitcoin\" o búsquedas de pánico."
      - id: f
        text:
          en: "The total open leverage across every exchange."
          es: "El apalancamiento abierto total en todos los exchanges."
      - id: g
        text:
          en: "A verified survey of every trader's real positioning."
          es: "Una encuesta verificada del posicionamiento real de cada trader."
      - id: h
        text:
          en: "Central-bank interest-rate decisions."
          es: "Las decisiones de tipos de interés de los bancos centrales."
    explanation:
      en: "The index blends volatility, momentum and volume, social media, Bitcoin dominance and search trends. It does not read anyone's real positioning, total leverage or macro policy — and note that volatility and momentum are just price, so roughly half the score is recent price action."
      es: "El índice mezcla volatilidad, momentum y volumen, redes sociales, dominancia de Bitcoin y tendencias de búsqueda. No lee el posicionamiento real de nadie, ni el apalancamiento total, ni la política macro; y fíjate en que la volatilidad y el momentum son solo precio, así que casi la mitad de la puntuación es acción de precio reciente."
  - id: lagging-or-forecast
    kind: true_false
    prompt:
      en: "The Fear & Greed index is a lagging read of how the market has felt lately, not a forecast of where price goes next."
      es: "El índice de miedo y codicia es una lectura rezagada de cómo se ha sentido el mercado últimamente, no un pronóstico de hacia dónde irá el precio."
    answer: true
    explanation:
      en: "True. It summarises the recent past — and since about half of it is computed from price, it largely re-describes what the chart already showed. It knows nothing about the future, the next turn, or how much room is left."
      es: "Cierto. Resume el pasado reciente y, como cerca de la mitad se calcula a partir del precio, en buena medida vuelve a describir lo que el gráfico ya mostraba. No sabe nada del futuro, del próximo giro ni de cuánto recorrido queda."
  - id: zero-vs-hundred
    prompt:
      en: "On the index's 0–100 scale, what do the two ends represent?"
      es: "En la escala de 0 a 100 del índice, ¿qué representan los dos extremos?"
    options:
      - id: a
        correct: true
        text:
          en: "0 is extreme fear; 100 is extreme greed, and the middle says little."
          es: "0 es miedo extremo; 100 es codicia extrema."
      - id: b
        text:
          en: "0 is extreme greed and 100 is extreme fear, the other way round."
          es: "0 es codicia extrema y 100 miedo extremo, justo al revés."
      - id: c
        text:
          en: "0 means the market is closed and 100 that it is fully open."
          es: "0 significa que el mercado está cerrado y 100 que está abierto."
      - id: d
        text:
          en: "The number is the percentage chance that price rises tomorrow."
          es: "El número es la probabilidad en porcentaje de que el precio suba mañana."
    explanation:
      en: "The scale runs from 0 (extreme fear) to 100 (extreme greed). It is a reading of mood, not a probability of tomorrow's direction — and crypto never closes, so there is nothing on the scale about the market being open."
      es: "La escala va de 0 (miedo extremo) a 100 (codicia extrema). Es una lectura de ánimo, no una probabilidad de la dirección de mañana, y el cripto nunca cierra, así que nada en la escala habla de que el mercado esté abierto."
  - id: why-re-description
    prompt:
      en: "Why can the index fairly be called \"recent price action dressed up as emotion\"?"
      es: "¿Por qué se puede llamar al índice, con razón, \"acción de precio reciente disfrazada de emoción\"?"
    options:
      - id: a
        text:
          en: "Because it is built only from social-media posts, which mirror price."
          es: "Porque se construye solo con publicaciones de redes, que reflejan el precio."
      - id: b
        text:
          en: "Because a central authority sets the number to match the chart."
          es: "Porque una autoridad central fija el número para que cuadre con el gráfico."
      - id: c
        correct: true
        text:
          en: "Volatility and momentum — about half the score — come straight from price."
          es: "La volatilidad y el momentum —casi la mitad— salen directamente del precio."
      - id: d
        text:
          en: "Because it is a pure survey of emotions with no price data in it at all."
          es: "Porque es una encuesta pura de emociones sin ningún dato de precio."
    explanation:
      en: "Two of its biggest inputs are just transformations of price, so a large part of the 'emotion' score is really a re-description of what price recently did. Nobody sets the number by hand, and social media is only one of several inputs — worth remembering, and not a flaw in the index so much as a limit on what it can independently tell you."
      es: "Dos de sus mayores ingredientes son solo transformaciones del precio, así que buena parte de la puntuación de 'emoción' es en realidad una redescripción de lo que hizo el precio hace poco. Nadie fija el número a mano, y las redes sociales son solo uno de varios ingredientes: conviene recordarlo, y no es tanto un defecto del índice como un límite a lo que puede decirte por su cuenta."
  - id: input-weights-match
    kind: matching
    prompt:
      en: "Match each Fear & Greed input to what it reads and why it is in the index."
      es: "Empareja cada entrada del índice de Miedo y Codicia con lo que lee y por qué está en el índice."
    pairs:
      - id: vol
        left: { en: "Volatility (~25%)", es: "Volatilidad (~25%)" }
        right:
          en: "Calm, orderly moves read as confidence; sudden, violent swings read as panic. Computed entirely from the price series."
          es: "Los movimientos tranquilos y ordenados se leen como confianza; los bruscos y violentos, como pánico. Se calcula por completo con la serie de precios."
      - id: social
        left: { en: "Social media (~15%)", es: "Redes sociales (~15%)" }
        right:
          en: "The volume and tone of posts — the signature of a crowd that is emotionally, not analytically, engaged."
          es: "El volumen y el tono de las publicaciones: la firma de una multitud implicada emocionalmente, no analíticamente."
      - id: dom
        left: { en: "Bitcoin dominance", es: "Dominancia de Bitcoin" }
        right:
          en: "Money fleeing to the 'safe' corner of crypto reads as fear; chasing riskier alts reads as greed."
          es: "El dinero huyendo al rincón 'seguro' del cripto se lee como miedo; perseguir alts más riesgosas, como codicia."
      - id: search
        left: { en: "Search trends", es: "Tendencias de búsqueda" }
        right:
          en: "A spike in 'is bitcoin dead' is fear; a surge in 'buy bitcoin' is greed."
          es: "Un pico de '¿ha muerto bitcoin?' es miedo; una subida de 'comprar bitcoin' es codicia."
    explanation:
      en: "It is a composite, not one clean measurement. And note that volatility plus momentum/volume — both derived from price itself — are together about half the score."
      es: "Es un compuesto, no una medición limpia. Y fíjate en que la volatilidad más el momentum/volumen, ambos derivados del propio precio, son juntos la mitad de la puntuación."
  - id: worked-88
    prompt:
      en: "BTC grinds smoothly from 40,000 to 60,000 over three weeks with only shallow dips, and the index prints 88 — extreme greed. What actually produced that reading?"
      es: "BTC sube suavemente de 40.000 a 60.000 en tres semanas con solo caídas leves, y el índice marca 88: codicia extrema. ¿Qué produjo realmente esa lectura?"
    options:
      - id: a
        text:
          en: "An independent survey of the emotional state of active traders."
          es: "Una encuesta independiente del estado emocional de los traders activos."
      - id: b
        correct: true
        text:
          en: "The rising price fed most of the inputs at once."
          es: "El precio al alza alimentó a la vez la mayoría de las entradas."
      - id: c
        text:
          en: "A forecast that price will keep on rising for three more weeks."
          es: "Un pronóstico de que el precio seguirá subiendo tres semanas más."
      - id: d
        text:
          en: "Falling volatility on its own, which is the only input that matters."
          es: "La caída de la volatilidad sola, la única entrada que importa."
    explanation:
      en: "Low orderly volatility, strong momentum and volume, celebratory posts, spiking searches — the price did the work, and the index did not independently discover euphoria. That is why a fresh price high and an extreme-greed reading almost always arrive together: they are largely the same event described twice, from a composite of several inputs rather than one."
      es: "Volatilidad baja y ordenada, momentum y volumen fuertes, publicaciones celebratorias, búsquedas al alza: el trabajo lo hizo el precio, y el índice no descubrió la euforia por su cuenta. Por eso un nuevo máximo de precio y una lectura de codicia extrema casi siempre llegan juntos: son en gran medida el mismo evento descrito dos veces, desde un compuesto de varias entradas y no de una sola."
  - id: alt-local-sentiment
    prompt:
      en: "The market-wide index reads a calm 50, but one thin-book altcoin's holders are wildly euphoric. What does that tell you about the index?"
      es: "El índice del mercado marca un tranquilo 50, pero los holders de una altcoin de libro poco profundo están en plena euforia. ¿Qué te dice eso sobre el índice?"
    options:
      - id: a
        text:
          en: "That the index is broken and ought to be ignored entirely from now on."
          es: "Que el índice está roto y hay que ignorarlo por completo a partir de ahora."
      - id: b
        text:
          en: "That the alt's crowd must be wrong, since the broad market is calm."
          es: "Que la multitud de la alt se equivoca, ya que el mercado amplio está tranquilo."
      - id: c
        correct: true
        text:
          en: "It tracks Bitcoin and the broad market, so it averages local extremes away."
          es: "Sigue a Bitcoin y al mercado amplio, así que promedia y borra los extremos locales."
      - id: d
        text:
          en: "That alt sentiment always leads the market-wide index by a fixed lag."
          es: "Que el sentimiento de las alts siempre adelanta al índice con un retardo fijo."
    explanation:
      en: "In alts, sentiment is more local, faster and more extreme than the one dashboard number suggests: on a thin book a handful of orders moves price and sentiment violently. The index is doing exactly what it was built to do — it is a market-wide average, and averages hide precisely the local extremes you are trading into."
      es: "En las alts el sentimiento es más local, más rápido y más extremo de lo que sugiere ese único número del panel: en un libro poco profundo, un puñado de órdenes mueve el precio y el sentimiento con violencia. El índice hace exactamente aquello para lo que se construyó: es una media del mercado, y las medias esconden justo los extremos locales en los que estás operando."
