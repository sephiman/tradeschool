type: quiz
variants:
  - id: abandonment-criterion
    prompt:
      en: "What makes a usable criterion for abandoning a system?"
      es: "¿Qué hace que un criterio para abandonar un sistema sea utilizable?"
    options:
      - id: a
        text:
          en: "A run of losses long enough that continuing stops feeling defensible."
          es: "Una racha de pérdidas lo bastante larga como para no poder defenderla."
      - id: b
        correct: true
        text:
          en: "A measured deviation from expectancy, written down before you start."
          es: "Una desviación medida respecto a la esperanza, escrita antes de empezar."
      - id: c
        text:
          en: "Any drawdown at all, since a working system should not lose money."
          es: "Cualquier drawdown, ya que un sistema que funciona no debería perder."
      - id: d
        text:
          en: "A month without new highs on the equity curve, whatever the trade count."
          es: "Un mes sin máximos nuevos en la curva de capital, sean las que sean."
    explanation:
      en: "In the short run a valid system having a bad run is indistinguishable from a broken one — both are losses and both feel identical — so the decision cannot be made while it hurts, by the person it is hurting. What works is a number fixed in advance: a drawdown deeper than the backtest's worst, or an observed expectancy that has sat below its claimed value over a sample large enough to mean something. And keep the third possibility in view: most often the system is fine and you stopped following it, which only the journal can tell you."
      es: "A corto plazo, un sistema válido en mala racha no se distingue de uno roto —los dos son pérdidas y los dos se sienten igual—, así que la decisión no puede tomarse mientras duele ni puede tomarla quien lo está sufriendo. Lo que funciona es un número fijado de antemano: un drawdown más profundo que el peor del backtest, o una esperanza observada que lleva por debajo de la declarada durante una muestra lo bastante grande como para significar algo. Y no pierdas de vista la tercera posibilidad: lo más frecuente es que el sistema esté bien y hayas dejado de seguirlo, y eso solo te lo puede decir el diario."
  - id: why-forward-test
    prompt:
      en: "A system passed a clean train/test split on years of history. Why run it forward on demo or minimum size before real money?"
      es: "Un sistema ha pasado una partición limpia de entrenamiento y prueba sobre años de histórico. ¿Por qué ponerlo a rodar en demo o a tamaño mínimo antes del dinero real?"
    options:
      - id: a
        text:
          en: "To gather the hundreds of extra trades a valid win rate needs."
          es: "Para reunir los cientos de operaciones extra que pide un win rate válido."
      - id: b
        text:
          en: "Because a backtest cannot cover the most recent market regime."
          es: "Porque un backtest no puede cubrir el régimen de mercado más reciente."
      - id: c
        correct: true
        text:
          en: "The live market has frictions and a trader in it; the history had neither."
          es: "El mercado real tiene fricciones y un trader dentro; el histórico no tenía ninguno."
      - id: d
        text:
          en: "It is a formality most professionals skip once the split is clean."
          es: "Es un trámite que casi todos los profesionales se saltan si la partición está limpia."
    explanation:
      en: "A simulation has no frictions and no you. Forward-testing is where the stop-limit that does not fill (m21), the spread you actually cross, the slippage and the accumulated funding all show up — and where you discover that live you skip the trade after two losses and widen a stop at 3 a.m. Demo has an honest limit of its own: costing nothing, it does not test the psychology, which is exactly why m24-l2 steps to minimum REAL size rather than staying on demo."
      es: "Una simulación no tiene fricciones ni te tiene a ti. El forward-testing es donde aparecen el stop-limit que no se ejecuta (m21), el spread que cruzas de verdad, el slippage y el funding acumulado, y donde descubres que el tú real se salta la operación tras dos pérdidas y amplía un stop a las tres de la mañana. La demo tiene su propio límite honesto: como no cuesta nada, no pone a prueba la psicología, y por eso justamente m24-l2 pasa a tamaño REAL mínimo en lugar de quedarse en demo."
  - id: which-explanation
    kind: ordering
    prompt:
      en: "Your system is 12R below where its expectancy said it would be. Order the checks, from the one that costs nothing to the one that ends the system."
      es: "Tu sistema va 12R por debajo de donde decía su esperanza. Ordena las comprobaciones, de la que no cuesta nada a la que termina con el sistema."
    items:
      - id: followed
        position: 1
        text:
          en: "Read the journal: were these trades actually the system's rules?"
          es: "Lee el diario: ¿esas operaciones eran de verdad las reglas del sistema?"
      - id: sample
        position: 2
        text:
          en: "Count the trades: is the sample big enough to mean anything yet?"
          es: "Cuenta las operaciones: ¿la muestra ya es lo bastante grande para significar algo?"
      - id: criterion
        position: 3
        text:
          en: "Compare against the criterion you wrote down before you started."
          es: "Compara con el criterio que escribiste antes de empezar."
      - id: stop
        position: 4
        text:
          en: "Stop trading it, and take it back to a backtest on data it has not seen."
          es: "Deja de operarlo y llévalo de vuelta a un backtest con datos que no haya visto."
    explanation:
      en: "Cheapest first: most 'broken systems' are systems that stopped being followed, and only the journal can tell those apart. Then sample size, because a couple of dozen trades below expectancy is inside the noise. Only then does the pre-written criterion get consulted — and only if it is met does the system come off the market. Reversing this order means abandoning a working system in a normal drawdown, which is the most expensive way to end up with no system at all."
      es: "Lo más barato primero: la mayoría de los «sistemas rotos» son sistemas que se dejaron de seguir, y eso solo lo distingue el diario. Después el tamaño de la muestra, porque un par de docenas de operaciones por debajo de la esperanza está dentro del ruido. Solo entonces se consulta el criterio escrito de antemano, y solo si se cumple sale el sistema del mercado. Invertir ese orden significa abandonar un sistema que funciona en un drawdown normal, que es la forma más cara de acabar sin ningún sistema."
