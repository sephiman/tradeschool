# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: gross-vs-net-2pct
    prompt:
      en: "The price of your long moved +2% from entry to exit. You paid a taker fee on both fills plus some funding while it was open. Compared with that +2% gross move, your net PnL on the trade is:"
      es: "El precio de tu long se movió +2 % de la entrada a la salida. Pagaste comisión taker en ambas ejecuciones más algo de funding mientras estuvo abierta. Comparado con ese movimiento bruto de +2 %, tu PnL neto en la operación es:"
    options:
      - id: a
        text:
          en: "Exactly +2% — the price move is what lands in your balance."
          es: "Exactamente +2 %: el movimiento del precio es lo que llega a tu saldo."
      - id: b
        correct: true
        text:
          en: "Smaller — both fees and the funding come out of the gross move."
          es: "Menor: las dos comisiones y el funding salen del movimiento bruto."
      - id: c
        text:
          en: "Larger, because funding pays you for carrying a long position."
          es: "Mayor, porque el funding te paga por llevar una posición larga."
      - id: d
        text:
          en: "Impossible to say without knowing your win rate over the period."
          es: "Imposible de decir sin conocer tu tasa de acierto en el periodo."
    explanation:
      en: "The +2% is the gross price move. Net keeps that move minus the open fee, minus the close fee, minus any funding — normally below the gross, and on a small move the fees alone can turn a winner into a loser. Funding can be positive or negative, so it does not 'always' pay longs, and none of this depends on your record across other trades."
      es: "El +2 % es el movimiento bruto del precio. El neto conserva ese movimiento menos la comisión de apertura, menos la de cierre, menos cualquier funding: normalmente por debajo del bruto, y en un movimiento pequeño las comisiones por sí solas pueden convertir una ganadora en perdedora. El funding puede ser positivo o negativo, así que no 'siempre' paga a los longs, y nada de esto depende de tu historial en otras operaciones."
  - id: maker-vs-taker
    prompt:
      en: "You want to minimise trading fees on a position you're in no hurry to open. Which statement about maker vs taker fees is correct?"
      es: "Quieres minimizar comisiones en una posición que no tienes prisa por abrir. ¿Qué afirmación sobre las comisiones maker vs taker es correcta?"
    options:
      - id: a
        text:
          en: "Taker orders are cheaper, because they execute instantly."
          es: "Las órdenes taker son más baratas, porque se ejecutan al instante."
      - id: b
        text:
          en: "The two rates are identical; the label only affects execution speed."
          es: "Las dos tarifas son idénticas; la etiqueta solo afecta a la velocidad."
      - id: c
        text:
          en: "Fees come out of your margin, so low leverage keeps them small."
          es: "Las comisiones salen de tu margen, así que poco apalancamiento las reduce."
      - id: d
        correct: true
        text:
          en: "A resting limit order adds liquidity and pays the lower maker rate."
          es: "Una orden límite en espera aporta liquidez y paga la tarifa maker, más baja."
    explanation:
      en: "Maker orders rest in the book and add liquidity, so they get the lower rate; takers cross the spread, remove liquidity and pay more — speed is what you are paying for, not what makes it cheap. Fees are charged on notional, not on margin, so leverage multiplies them rather than dodging them."
      es: "Las órdenes maker descansan en el libro y aportan liquidez, así que consiguen la tarifa más baja; las taker cruzan el spread, retiran liquidez y pagan más: la velocidad es lo que pagas, no lo que la abarata. Las comisiones se cobran sobre el nocional, no sobre el margen, así que el apalancamiento las multiplica en vez de esquivarlas."
  - id: two-pct-is-not-pnl
    kind: true_false
    prompt:
      en: "\"The price of my long moved +2% from entry to exit, so my net PnL on the trade is +2%.\""
      es: "«El precio de mi long se movió +2 % de la entrada a la salida, así que mi PnL neto en la operación es +2 %.»"
    answer: false
    explanation:
      en: "The +2% is the gross price move. Your net keeps that move minus the open fee, minus the close fee, minus any funding — normally less than the gross, and on a small move the fees alone can turn it negative."
      es: "El +2 % es el movimiento bruto del precio. Tu neto conserva ese movimiento menos la comisión de apertura, menos la de cierre, menos cualquier funding: normalmente menos que el bruto, y en un movimiento pequeño las comisiones por sí solas pueden dejarlo en negativo."
  - id: fee-terms-match
    kind: matching
    prompt:
      en: "Match each term to what it describes."
      es: "Empareja cada término con lo que describe."
    pairs:
      - id: maker
        left:
          en: "Maker fee"
          es: "Comisión maker"
        right:
          en: "The lower rate, charged when a resting limit order adds liquidity to the book."
          es: "La tarifa más baja, cobrada cuando una orden límite en espera aporta liquidez al libro."
      - id: taker
        left:
          en: "Taker fee"
          es: "Comisión taker"
        right:
          en: "The higher rate, charged when a market order removes liquidity."
          es: "La tarifa más alta, cobrada cuando una orden a mercado retira liquidez."
      - id: notional
        left:
          en: "Notional"
          es: "Nocional"
        right:
          en: "Position size × price — the base the fee is charged on, not your margin."
          es: "Tamaño de la posición × precio: la base sobre la que se cobra la comisión, no tu margen."
      - id: funding
        left:
          en: "Funding"
          es: "Funding"
        right:
          en: "A periodic payment between longs and shorts that can be positive or negative."
          es: "Un pago periódico entre longs y shorts que puede ser positivo o negativo."
    explanation:
      en: "Makers add liquidity and pay less; takers remove it and pay more. Fees are charged on notional (so leverage multiplies them), and funding is a separate periodic transfer that can go either way."
      es: "Los maker aportan liquidez y pagan menos; los taker la retiran y pagan más. Las comisiones se cobran sobre el nocional (así que el apalancamiento las multiplica), y el funding es una transferencia periódica aparte que puede ir en cualquier dirección."
  - id: what-reduces-net
    kind: multi_select
    prompt:
      en: "For a long trade that closed in profit, select ALL of the following that reduced your net result versus the gross price move."
      es: "En una operación long que cerró en ganancia, selecciona TODO lo siguiente que redujo tu resultado neto frente al movimiento bruto del precio."
    options:
      - id: a
        correct: true
        text:
          en: "The fee paid on the fill that opened the position."
          es: "La comisión pagada en la ejecución que abrió la posición."
      - id: b
        correct: true
        text:
          en: "The fee paid again on the fill that closed it."
          es: "La comisión pagada otra vez en la ejecución que la cerró."
      - id: c
        correct: true
        text:
          en: "Funding you paid over the windows it stayed open."
          es: "El funding que pagaste en las ventanas que estuvo abierta."
      - id: d
        text:
          en: "The gross upward move in the price itself."
          es: "El propio movimiento bruto al alza del precio."
      - id: e
        text:
          en: "A take-profit order you placed that never filled."
          es: "Una orden de take-profit que colocaste y nunca se ejecutó."
    explanation:
      en: "Net = gross move − open fee − close fee − funding paid. The gross move is the source of the profit, not a deduction from it, and an order that never filled cost nothing at all. The real drags are the fee you pay twice and the funding that accrues for as long as you hold."
      es: "Neto = movimiento bruto − comisión de apertura − comisión de cierre − funding pagado. El movimiento bruto es la fuente de la ganancia, no un descuento sobre ella, y una orden que nunca se ejecutó no costó nada. El lastre real son la comisión que pagas dos veces y el funding que se acumula mientras mantienes."
  - id: paid-twice
    prompt:
      en: "Your taker fee is 0.05%, charged on notional. You open and later close a position with 10,000 USDT of notional on each fill. Ignoring the price change, roughly how much do you pay in fees over the round trip?"
      es: "Tu comisión taker es del 0,05 %, cobrada sobre el nocional. Abres y más tarde cierras una posición con 10 000 USDT de nocional en cada ejecución. Ignorando el cambio de precio, ¿cuánto pagas aproximadamente en comisiones en el ida y vuelta?"
    options:
      - id: a
        text:
          en: "About 5 USDT — the fee is charged once per position, on the open."
          es: "Unos 5 USDT: la comisión se cobra una vez por posición, al abrir."
      - id: b
        correct: true
        text:
          en: "About 10 USDT — 5 to open the position and 5 more to close it again."
          es: "Unos 10 USDT: 5 al abrir y 5 al cerrar."
      - id: c
        text:
          en: "Nothing until you close, and only if the trade ends in profit."
          es: "Nada hasta cerrar, y solo si la operación acaba en ganancia."
      - id: d
        text:
          en: "It depends on leverage — more leverage means a lower fee bill."
          es: "Depende del apalancamiento: más apalancamiento, menos comisiones."
    explanation:
      en: "0.05% of 10,000 is 5 USDT per fill, and the fee lands on both the open and the close, so about 10 USDT round trip. It is charged on notional whether the trade wins or loses, and leverage raises the bill by letting you carry a bigger notional — it never lowers it."
      es: "El 0,05 % de 10 000 son 5 USDT por ejecución, y la comisión cae tanto en la apertura como en el cierre, así que unos 10 USDT en el ida y vuelta. Se cobra sobre el nocional gane o pierda la operación, y el apalancamiento sube la factura al permitirte llevar más nocional: nunca la baja."
  - id: funding-not-always-longs
    kind: true_false
    prompt:
      en: "Whether funding costs you or pays you depends on which side the market is crowding into, not on whether you are long."
      es: "Que el funding te cueste o te pague depende de hacia qué lado se amontona el mercado, no de si estás largo."
    answer: true
    explanation:
      en: "True. A positive rate means the perp is above spot and longs pay shorts; a negative rate means the reverse and longs receive. Being long is not a reward or a penalty in itself — being on the crowded side is."
      es: "Cierto. Una tasa positiva significa que el perp está por encima del spot y los longs pagan a los shorts; una negativa significa lo contrario y los longs cobran. Ir largo no es en sí una recompensa ni un castigo: lo es estar en el lado saturado."
  - id: net-settlement-steps
    kind: ordering
    prompt:
      en: "Put the costs and credits of a leveraged round trip in the order they actually hit your account."
      es: "Ordena los costes y abonos de una operación completa apalancada según el orden en que golpean tu cuenta."
    items:
      - id: open
        position: 1
        text:
          en: "You pay a fee on the opening fill, charged on notional — the taker rate if you crossed the spread."
          es: "Pagas una comisión en la ejecución de apertura, calculada sobre el nocional: la tasa taker si cruzaste el spread."
      - id: funding
        position: 2
        text:
          en: "Every funding window you stay open, a payment moves between you and the other side."
          es: "En cada ventana de funding que sigues abierto, un pago se mueve entre tú y el otro lado."
      - id: closefee
        position: 3
        text:
          en: "You pay a fee again on the closing fill — the round trip is two fees, not one."
          es: "Pagas comisión otra vez en la ejecución de cierre: el viaje de ida y vuelta son dos comisiones, no una."
      - id: net
        position: 4
        text:
          en: "What survives of the gross move is booked as net realized PnL: gross − fees − funding."
          es: "Lo que sobrevive del movimiento bruto se contabiliza como PnL neto realizado: bruto − comisiones − funding."
    explanation:
      en: "The gross price move is only the raw material. Everything in between is subtracted before anything lands in your balance — which is why a barely-positive move can net a loss."
      es: "El movimiento bruto del precio es solo la materia prima. Todo lo de en medio se resta antes de que algo llegue a tu saldo, y por eso un movimiento apenas positivo puede acabar en pérdida."
  - id: three-percentages
    prompt:
      en: "You go long 1 BTC at 20,000 with 5× leverage (4,000 margin), hold three days and close at 20,400. Fees are 22.22 USDT and funding cost 18 USDT. Which set of numbers describes the trade?"
      es: "Te pones largo 1 BTC en 20.000 con 5× de apalancamiento (4.000 de margen), lo mantienes tres días y cierras en 20.400. Las comisiones son 22,22 USDT y el funding costó 18 USDT. ¿Qué conjunto de números describe la operación?"
    options:
      - id: a
        text:
          en: "+2% gross and +2% net, since fees and funding come out of margin instead."
          es: "+2% bruto y +2% neto, ya que comisiones y funding salen del margen aparte."
      - id: b
        correct: true
        text:
          en: "+2% gross on notional, +1.80% net on notional, +9.0% net on margin."
          es: "+2% bruto sobre nocional, +1,80% neto sobre nocional, +9,0% neto sobre margen."
      - id: c
        text:
          en: "+2% gross, +1.80% net on notional and on margin — leverage changes nothing."
          es: "+2% bruto, +1,80% neto sobre nocional y sobre margen: el apalancamiento no cambia nada."
      - id: d
        text:
          en: "+10% gross on margin and +9.0% net, with the fees charged on margin."
          es: "+10% bruto sobre margen y +9,0% neto, con las comisiones cobradas sobre el margen."
    explanation:
      en: "Gross PnL is 400; net is 400 − 22.22 − 18 = 359.78. That is 1.80% of the 20,000 notional and 9.0% of the 4,000 margin — three different percentages for one trade, and only net-on-margin is what your balance actually did. Costs are charged against notional, which is exactly why leverage magnifies them alongside the gain."
      es: "El PnL bruto es 400; el neto es 400 − 22,22 − 18 = 359,78. Eso es el 1,80% del nocional de 20.000 y el 9,0% del margen de 4.000: tres porcentajes distintos para una operación, y solo el neto sobre margen es lo que hizo de verdad tu saldo. Los costes se cobran contra el nocional, y por eso el apalancamiento los amplifica junto a la ganancia."
  - id: small-move-loss
    prompt:
      en: "Same 20,000 USDT notional position and same three-day hold, but the move is only +0.15% (+30 USDT gross). Fees are ~22 USDT and funding ~18 USDT. What is the result?"
      es: "La misma posición de 20.000 USDT de nocional y los mismos tres días, pero el movimiento es solo +0,15% (+30 USDT brutos). Las comisiones son ~22 USDT y el funding ~18 USDT. ¿Cuál es el resultado?"
    options:
      - id: a
        text:
          en: "A small profit of about 30 USDT, matching the gross move."
          es: "Un beneficio pequeño de unos 30 USDT, igual al movimiento bruto."
      - id: b
        text:
          en: "Break-even, because the costs scale down with the smaller move."
          es: "Empate, porque los costes bajan con el movimiento más pequeño."
      - id: c
        correct: true
        text:
          en: "A loss of about 10 USDT — green gross number, red balance."
          es: "Una pérdida de unos 10 USDT: número bruto verde, saldo rojo."
      - id: d
        text:
          en: "A profit, since funding is refunded on trades that close green."
          es: "Un beneficio, ya que el funding se devuelve en operaciones en verde."
    explanation:
      en: "30 − 22 − 18 = −10. Costs do not scale with how right you were: they are fixed against notional and time held, so an identical position with a thinner move keeps the same bill and turns a winner into a real loser. Nothing is refunded for closing in profit."
      es: "30 − 22 − 18 = −10. Los costes no escalan con lo acertado que estuviste: son fijos contra el nocional y el tiempo mantenido, así que una posición idéntica con un movimiento más fino conserva la misma factura y convierte una ganadora en perdedora real. No se devuelve nada por cerrar en positivo."
  - id: breakeven-round-trip
    kind: true_false
    prompt:
      en: "At a 0.055% taker fee, price needs to move about 0.055% of notional for a round trip to break even."
      es: "Con una comisión taker del 0,055%, el precio necesita moverse en torno al 0,055% del nocional para que una operación completa quede en equilibrio."
    answer: false
    explanation:
      en: "You pay the fee twice — once to open, once to close — so break-even needs about 0.11% of notional before any funding. At 5× leverage that is 0.55% of your margin gone before you are even."
      es: "Pagas la comisión dos veces, al abrir y al cerrar, así que el equilibrio exige en torno al 0,11% del nocional antes de contar el funding. Con 5× de apalancamiento eso son un 0,55% de tu margen perdidos antes de empatar."
