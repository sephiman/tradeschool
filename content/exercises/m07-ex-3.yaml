# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: unrealized-is-provisional
    prompt:
      en: "Your open long shows +250 USDT of unrealized PnL. Which statement is true?"
      es: "Tu long abierto muestra +250 USDT de PnL no realizado. ¿Qué afirmación es cierta?"
    options:
      - id: a
        text:
          en: "It is 250 USDT already in your balance — you could withdraw it now."
          es: "Son 250 USDT ya en tu saldo: podrías retirarlos ahora mismo."
      - id: b
        correct: true
        text:
          en: "It is a mark-to-market estimate; nothing lands until you close."
          es: "Es una estimación a precio de mercado; nada llega hasta que cierras."
      - id: c
        text:
          en: "It is locked in at 250 and can no longer decrease from here."
          es: "Está fijado en 250 y ya no puede bajar de ahí."
      - id: d
        text:
          en: "It becomes real once the next funding payment is settled."
          es: "Se vuelve real cuando se salda el siguiente pago de funding."
    explanation:
      en: "Unrealized PnL is what you'd have if you closed at the current price. It moves every tick and becomes a real balance change only when you close — a green number on an open position can still evaporate, and no funding interval or elapsed time banks it for you."
      es: "El PnL no realizado es lo que tendrías si cerraras al precio actual. Se mueve en cada tick y solo se convierte en un cambio real de saldo cuando cierras: un número verde en una posición abierta todavía puede evaporarse, y ningún intervalo de funding ni el paso del tiempo te lo ingresa."
  - id: when-realized
    prompt:
      en: "At what moment does a position's PnL become realized?"
      es: "¿En qué momento el PnL de una posición pasa a estar realizado?"
    options:
      - id: a
        correct: true
        text:
          en: "When you close the position, or the part of it that you close."
          es: "Cuando cierras la posición, o la parte de ella que cierres."
      - id: b
        text:
          en: "Automatically, at the end of every funding interval that passes."
          es: "Automáticamente, al final de cada intervalo de funding que pasa."
      - id: c
        text:
          en: "The instant the unrealized figure first turns green on the screen."
          es: "En cuanto la cifra no realizada se pone verde por primera vez."
      - id: d
        text:
          en: "When price touches your take-profit, even if the order never fills."
          es: "Cuando el precio toca tu take-profit, aunque la orden no se ejecute."
    explanation:
      en: "PnL is realized only on closing. Until then it is unrealized and provisional, no matter how large it is, how long it has stayed positive, or how close price came to your target — a level that is touched but not filled has changed nothing."
      es: "El PnL solo se realiza al cerrar. Hasta entonces es no realizado y provisional, por grande que sea, por mucho tiempo que lleve en positivo o por cerca que el precio haya pasado de tu objetivo: un nivel tocado pero no ejecutado no ha cambiado nada."
  - id: unrealized-not-withdrawable
    kind: true_false
    prompt:
      en: "Unrealized PnL on an open position is money already in your balance that you could withdraw right now."
      es: "El PnL no realizado de una posición abierta es dinero que ya está en tu saldo y que podrías retirar ahora mismo."
    answer: false
    explanation:
      en: "Unrealized PnL is only a mark-to-market estimate of what you'd get if you closed at the current price. Nothing settles into your withdrawable balance until you actually close the position."
      es: "El PnL no realizado es solo una estimación a precio de mercado de lo que obtendrías si cerraras al precio actual. Nada se materializa en tu saldo retirable hasta que cierras de verdad la posición."
  - id: pnl-terms-match
    kind: matching
    prompt:
      en: "Match each term to its meaning."
      es: "Empareja cada término con su significado."
    pairs:
      - id: unreal
        left:
          en: "Unrealized PnL"
          es: "PnL no realizado"
        right:
          en: "A mark-to-market estimate on a position that is still open — it keeps moving."
          es: "Una estimación a precio de mercado de una posición que sigue abierta: no para de moverse."
      - id: real
        left:
          en: "Realized PnL"
          es: "PnL realizado"
        right:
          en: "The locked-in change to your balance at the moment you close."
          es: "El cambio fijado en tu saldo en el momento en que cierras."
      - id: liq
        left:
          en: "Liquidation"
          es: "Liquidación"
        right:
          en: "The exchange force-closing your position when margin no longer covers it."
          es: "El exchange cerrando a la fuerza tu posición cuando el margen ya no la cubre."
    explanation:
      en: "Unrealized PnL is provisional and moves tick by tick; realized PnL is the settled balance change on closing; liquidation is a forced close by the exchange, never just any sale you choose to make."
      es: "El PnL no realizado es provisional y se mueve tick a tick; el PnL realizado es el cambio de saldo materializado al cerrar; la liquidación es un cierre forzoso del exchange, nunca una venta cualquiera que decidas hacer tú."
  - id: what-is-unrealized
    kind: multi_select
    prompt:
      en: "Select ALL statements that are true of the unrealized PnL shown on an open position."
      es: "Selecciona TODAS las afirmaciones que son ciertas del PnL no realizado que muestra una posición abierta."
    options:
      - id: a
        correct: true
        text:
          en: "It changes with every tick of the price."
          es: "Cambia con cada tick del precio."
      - id: b
        correct: true
        text:
          en: "It becomes a real balance change only when you close."
          es: "Solo se convierte en un cambio real de saldo cuando cierras."
      - id: c
        correct: true
        text:
          en: "It is what the exchange watches to judge whether margin still covers you."
          es: "Es lo que vigila el exchange para juzgar si el margen todavía te cubre."
      - id: d
        text:
          en: "It has already been credited to your balance and cannot fall from here."
          es: "Ya se ha abonado a tu saldo y no puede bajar desde aquí."
    explanation:
      en: "Unrealized PnL moves every tick, only settles on closing, and is exactly the figure the exchange uses for margin and liquidation. What it is NOT is money already banked — it can still shrink or reverse, and that is precisely why it can get you closed."
      es: "El PnL no realizado se mueve en cada tick, solo se materializa al cerrar y es justo la cifra que el exchange usa para el margen y la liquidación. Lo que NO es: dinero ya ingresado; todavía puede encogerse o darse la vuelta, y precisamente por eso puede hacer que te cierren."
  - id: partial-close-realizes
    prompt:
      en: "You hold a long and close half of it while it's in profit, leaving the other half open. What happens to your PnL?"
      es: "Mantienes un long y cierras la mitad mientras va en ganancia, dejando la otra mitad abierta. ¿Qué pasa con tu PnL?"
    options:
      - id: a
        text:
          en: "Nothing is realized until you close the entire position at once."
          es: "Nada se realiza hasta que cierras la posición entera de una vez."
      - id: b
        text:
          en: "The whole position's PnL is realized the moment you touch any of it."
          es: "El PnL de toda la posición se realiza en cuanto tocas cualquier parte."
      - id: c
        correct: true
        text:
          en: "The half you closed is realized; the rest stays unrealized."
          es: "La mitad que cerraste se realiza; el resto sigue sin realizar."
      - id: d
        text:
          en: "Half the PnL is realized, but locked until funding next settles."
          es: "La mitad del PnL se realiza, pero bloqueada hasta el próximo funding."
    explanation:
      en: "Closing part of a position realizes the PnL on exactly that part and credits it to your balance; the portion still open remains unrealized and keeps moving with price. Realization is tied to closing — not to the whole position, and not to any funding interval."
      es: "Cerrar parte de una posición realiza el PnL de justo esa parte y lo abona a tu saldo; la porción que sigue abierta continúa sin realizar y se mueve con el precio. La realización va ligada al cierre: no a la posición entera, ni a ningún intervalo de funding."
  - id: peak-vs-close
    prompt:
      en: "Your long peaked at +400 USDT of unrealized PnL. You didn't close. You finally close when it shows +60 USDT. Ignoring fees, what is your realized PnL on the trade?"
      es: "Tu long llegó a marcar un máximo de +400 USDT de PnL no realizado. No cerraste. Al final cierras cuando muestra +60 USDT. Ignorando comisiones, ¿cuál es tu PnL realizado en la operación?"
    options:
      - id: a
        text:
          en: "+400 USDT — the peak is the figure you locked in for the trade."
          es: "+400 USDT: el máximo es la cifra que fijaste para la operación."
      - id: b
        text:
          en: "+460 USDT — the peak that accrued plus the amount at the close."
          es: "+460 USDT: el máximo acumulado más la cantidad del cierre."
      - id: c
        text:
          en: "0 — you missed the peak, so the trade nets out to nothing at all."
          es: "0: te perdiste el máximo, así que la operación no deja nada."
      - id: d
        correct: true
        text:
          en: "+60 USDT — you realize whatever it shows when you close."
          es: "+60 USDT: realizas lo que muestre en el momento de cerrar."
    explanation:
      en: "Only the number at the moment you close becomes realized. The +400 peak was unrealized and never settled, so it accrued nothing and adds nothing — a green number on an open position can evaporate before you take it. Missing the peak does not void the trade either: the +60 is genuinely yours."
      es: "Solo el número del momento en que cierras pasa a estar realizado. El máximo de +400 era no realizado y nunca se materializó, así que no acumuló nada ni suma nada: un número verde en una posición abierta puede evaporarse antes de que lo cojas. Perderte el máximo tampoco anula la operación: los +60 son tuyos de verdad."
  - id: weather-climate
    prompt:
      en: "What is the useful habit for telling unrealized and realized PnL apart?"
      es: "¿Cuál es el hábito útil para distinguir el PnL no realizado del realizado?"
    options:
      - id: a
        correct: true
        text:
          en: "Treat unrealized PnL as weather and realized PnL as climate."
          es: "Trata el PnL no realizado como el tiempo y el realizado como el clima."
      - id: b
        text:
          en: "Treat them the same, since the exchange derives both from one price."
          es: "Trátalos igual, ya que el exchange saca ambos de un mismo precio."
      - id: c
        text:
          en: "Treat the unrealized figure as the reliable one, as it updates constantly."
          es: "Trata la cifra no realizada como la fiable, porque se actualiza sin parar."
      - id: d
        text:
          en: "Record the peak unrealized figure: it is what the position was truly worth."
          es: "Registra el máximo no realizado: es lo que la posición valió de verdad."
    explanation:
      en: "The weather is loud and changes constantly; only the climate goes into your record. Unrealized PnL is a mark-to-market estimate that the next candle can erase, and updating constantly is what makes it noisy rather than reliable. Realized PnL is a final, booked change in your balance — the only one that belongs in a journal, and the peak never belongs there at all."
      es: "El tiempo es ruidoso y cambia constantemente; solo el clima entra en tu registro. El PnL no realizado es una estimación a precio de mercado que la siguiente vela puede borrar, y actualizarse sin parar es lo que lo hace ruidoso, no fiable. El realizado es un cambio final y contabilizado en tu saldo: el único que pertenece a un diario, y el máximo no pertenece ahí en absoluto."
  - id: unrealized-asymmetry
    kind: true_false
    prompt:
      en: "An unrealized loss is just as provisional as an unrealized gain — it cannot cost you anything until you choose to close."
      es: "Una pérdida no realizada es tan provisional como una ganancia no realizada: no puede costarte nada hasta que decidas cerrar."
    answer: false
    explanation:
      en: "The asymmetry cuts against you. Unrealized loss is exactly what the exchange watches to decide whether your margin still covers the position: let it grow far enough and you are force-closed at a loss you did realize, whether you wanted to or not."
      es: "La asimetría va en tu contra. La pérdida no realizada es precisamente lo que vigila el exchange para decidir si tu margen aún cubre la posición: si crece lo suficiente, te cierran por la fuerza con una pérdida que sí realizaste, quieras o no."
  - id: pnl-lifecycle
    kind: ordering
    prompt:
      en: "Put the life of a position's PnL in order, from opening to the final record."
      es: "Ordena la vida del PnL de una posición, desde la apertura hasta el registro final."
    items:
      - id: mark
        position: 1
        text:
          en: "While the position is open, the exchange recomputes unrealized PnL tick by tick against the mark price."
          es: "Mientras la posición está abierta, el exchange recalcula el PnL no realizado tick a tick contra el mark price."
      - id: close
        position: 2
        text:
          en: "You close the position (or part of it)."
          es: "Cierras la posición (o parte de ella)."
      - id: book
        position: 3
        text:
          en: "The estimate stops being an estimate and becomes a booked change in your balance."
          es: "La estimación deja de ser una estimación y se convierte en un cambio contabilizado en tu saldo."
      - id: still
        position: 4
        text:
          en: "The number stops moving — there is nothing left to mark, because the trade is over."
          es: "El número deja de moverse: no queda nada que marcar, porque la operación ha terminado."
    explanation:
      en: "Nothing settles and no money moves while the position is open, however loud the green number gets. Only closing turns the mark-to-market estimate into something in your balance."
      es: "Nada se liquida y ningún dinero se mueve mientras la posición está abierta, por muy llamativo que sea el número verde. Solo al cerrar la estimación a mercado se convierte en algo en tu saldo."
