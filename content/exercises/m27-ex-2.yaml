# SPDX-License-Identifier: AGPL-3.0-only
# Scenario variants with given numbers — still a quiz, no chart component (see m27-ex-1's note).
type: quiz
variants:
  - id: imbalance-3to1
    prompt:
      en: "The book shows **120 BTC** resting on the bid at 60,000 and **40 BTC** on the ask at 60,100. What does that imbalance suggest?"
      es: "El libro muestra **120 BTC** en reposo al bid en 60.000 y **40 BTC** al ask en 60.100. ¿Qué sugiere ese desequilibrio?"
    options:
      - id: a
        text:
          en: "There are three times as many buyers as sellers, so price will rise soon."
          es: "Hay tres veces más compradores que vendedores, así que subirá."
      - id: b
        correct: true
        text:
          en: "More passive willingness to buy nearby, so up is the cheaper direction."
          es: "Más disposición pasiva a comprar cerca: subir es más barato."
      - id: c
        text:
          en: "120 BTC of buying has just been executed against 40 BTC of selling."
          es: "Se acaban de ejecutar 120 BTC de compra contra 40 BTC de venta."
      - id: d
        text:
          en: "The spread is 100, which is the only thing those two numbers tell you."
          es: "El spread es 100, que es lo único que te dicen esos dos números."
    explanation:
      en: "It takes far more aggressive selling to push down through 120 BTC of bids than aggressive buying to lift through a 40 BTC ask — so up is the cheaper direction to move right now. That is a statement about resistance to movement, not a prediction: those orders are unexecuted and cancellable, the largest size is often hidden in icebergs, and the imbalance may simply be a consequence of the move that already happened."
      es: "Hace falta mucha más venta agresiva para empujar hacia abajo a través de 120 BTC de bids que compra agresiva para levantar a través de un ask de 40 BTC, así que ahora mismo subir es la dirección más barata de mover. Eso es una afirmación sobre la resistencia al movimiento, no una predicción: esas órdenes están sin ejecutar y son cancelables, el tamaño más grande suele estar escondido en icebergs, y el desequilibrio puede ser simplemente una consecuencia del movimiento que ya ocurrió."
  - id: imbalance-before-release
    prompt:
      en: "That same book — 120 BTC bid, 40 BTC ask — is sitting ninety seconds before a scheduled CPI release. What typically happens to it?"
      es: "Ese mismo libro —120 BTC al bid, 40 BTC al ask— está ahí noventa segundos antes de una publicación programada del IPC. ¿Qué le suele pasar?"
    options:
      - id: a
        text:
          en: "The bid side thickens further, since buyers position ahead of good news."
          es: "El lado bid engorda más, ya que los compradores se posicionan antes."
      - id: b
        text:
          en: "It stays as it is; scheduled events move price but never the resting book."
          es: "Se queda igual; los eventos mueven el precio pero nunca el libro."
      - id: c
        text:
          en: "The exchange freezes the book until the release has actually printed."
          es: "El exchange congela el libro hasta que la publicación haya salido."
      - id: d
        correct: true
        text:
          en: "Both sides thin out and the spread widens as makers pull their quotes."
          es: "Los dos lados se adelgazan y el spread se ensancha al retirarse."
    explanation:
      en: "Market makers earn the spread by resting orders on both sides; their risk is being filled just before a big move. Ahead of a known event with an unknown outcome, that risk spikes predictably, so the rational response is to cancel or widen their quotes — and the imbalance you were reading largely evaporates with them. This is the mechanism behind m15's symptom: the widening spread and evaporating liquidity around a release."
      es: "Los creadores de mercado ganan el spread manteniendo órdenes en reposo en los dos lados; su riesgo es quedar llenos justo antes de un movimiento grande. Ante un evento conocido con resultado desconocido, ese riesgo se dispara de forma predecible, así que la respuesta racional es cancelar o ensanchar sus cotizaciones, y el desequilibrio que estabas leyendo se evapora con ellas. Este es el mecanismo detrás del síntoma de m15: el spread que se ensancha y la liquidez que se evapora alrededor de una publicación."
  - id: first-move-into-vacuum
    prompt:
      en: "The CPI number prints and price gaps 1.2% in four seconds on unremarkable size, then gives most of it back within the minute. What happened?"
      es: "Sale el número del IPC y el precio salta un 1,2 % en cuatro segundos con un tamaño poco llamativo, y después devuelve la mayor parte en menos de un minuto. ¿Qué pasó?"
    options:
      - id: a
        correct: true
        text:
          en: "Market orders hit an almost empty book, and depth refilled after."
          es: "Las órdenes golpearon un libro casi vacío y la profundidad volvió."
      - id: b
        text:
          en: "A very large participant bought hard and then sold it all back again."
          es: "Un participante muy grande compró fuerte y lo vendió todo luego."
      - id: c
        text:
          en: "The market priced the news, then found it had misread the number."
          es: "El mercado valoró la noticia y luego vio que la había leído mal."
      - id: d
        text:
          en: "Wash trading inflated it; no real trades happened at those prices."
          es: "El wash trading lo infló; no hubo operaciones reales a esos precios."
    explanation:
      en: "The give-away is 'unremarkable size'. A thin book means there is nothing there to absorb incoming market orders, so price traverses many levels cheaply; when the makers returned and depth refilled, the spike retraced. That first move often is not the market's opinion of the news at all — it is a thin book being crossed, which is exactly why m15's advice was to stand aside rather than to predict the release."
      es: "La pista es 'un tamaño poco llamativo'. Un libro poco profundo significa que no hay nada ahí que absorba las órdenes a mercado que llegan, así que el precio atraviesa muchos niveles a bajo coste; cuando los creadores de mercado volvieron y la profundidad se rellenó, el pico se retrajo. Ese primer movimiento a menudo no es la opinión del mercado sobre la noticia: es un libro poco profundo siendo cruzado, y justo por eso el consejo de m15 era quedarse al margen en lugar de predecir la publicación."
  - id: wall-pulled
    prompt:
      en: "A 400 BTC bid wall has sat at 60,000 all morning. Price drifts down to 60,050 and the wall disappears within a second. What is the honest read?"
      es: "Un muro de compra de 400 BTC lleva toda la mañana en 60.000. El precio baja hasta 60.050 y el muro desaparece en un segundo. ¿Cuál es la lectura honesta?"
    options:
      - id: a
        text:
          en: "The 400 BTC were filled, so heavy buying just occurred at 60,000."
          es: "Los 400 BTC se llenaron, así que hubo compra fuerte en 60.000."
      - id: b
        correct: true
        text:
          en: "The support was never a commitment — it was cancellable, and cancelled."
          es: "El soporte nunca fue un compromiso: era cancelable, y se canceló."
      - id: c
        text:
          en: "A data glitch — a wall that large cannot be withdrawn once approached."
          es: "Un fallo de datos: un muro tan grande no se puede retirar así."
      - id: d
        text:
          en: "It confirms 60,000 as support, since it defended the level all morning."
          es: "Confirma 60.000 como soporte, ya que defendió el nivel toda la mañana."
    explanation:
      en: "Note that price never reached 60,000, so nothing was filled — the order was withdrawn exactly when it was about to matter. This is why leaning on a wall, and especially placing a stop just under one, is dangerous: walls get pulled precisely when they would have been tested. Never let an order someone can cancel for free be the reason your risk sits where it does."
      es: "Fíjate en que el precio nunca llegó a 60.000, así que no se llenó nada: la orden se retiró justo cuando iba a importar. Por esto apoyarse en un muro, y sobre todo poner un stop justo debajo de uno, es peligroso: los muros se retiran justo cuando iban a ser testeados. Nunca dejes que una orden que alguien puede cancelar gratis sea la razón de que tu riesgo esté donde está."
  - id: spread-cost
    prompt:
      en: "A market normally shows a 1 basis point spread. Ninety seconds before an FOMC decision it shows 25 basis points. What has changed, and what does it cost you?"
      es: "Un mercado muestra normalmente un spread de 1 punto básico. Noventa segundos antes de una decisión de la Fed muestra 25 puntos básicos. ¿Qué ha cambiado y qué te cuesta?"
    options:
      - id: a
        text:
          en: "Volatility rose, so the wider spread is compensation you receive."
          es: "La volatilidad subió, así que el spread ancho es compensación."
      - id: b
        text:
          en: "The exchange has raised its taker fees temporarily for the event."
          es: "El exchange ha subido sus comisiones taker por el evento."
      - id: c
        text:
          en: "Nothing meaningful: the spread is a display convention, not a cost."
          es: "Nada relevante: el spread es una convención, no un coste real."
      - id: d
        correct: true
        text:
          en: "Makers withdrew depth, and any market order you send now pays that gap."
          es: "Los makers retiraron profundidad y tu orden paga ese hueco ya."
    explanation:
      en: "The spread is what a taker pays to cross the book, so a 25x wider spread is a 25x more expensive round trip before any price movement at all — a cost you pay, not compensation you receive. Combine that with the near-empty book behind it and you have the least favourable conditions of the day for a market order: maximum spread and maximum slippage, in exchange for the least reliable information."
      es: "El spread es lo que paga un taker por cruzar el libro, así que un spread 25 veces más ancho es una ida y vuelta 25 veces más cara antes de cualquier movimiento de precio: un coste que pagas, no una compensación que recibes. Súmale el libro casi vacío que hay detrás y tienes las condiciones menos favorables del día para una orden a mercado: el máximo de spread y el máximo de slippage, a cambio de la información menos fiable."
  - id: deep-vs-thin-fill
    prompt:
      en: "Two venues both display 60,000. Venue A has 200 BTC resting within 0.1% of price; venue B has 8 BTC. You need to buy 50 BTC at market. What should you expect?"
      es: "Dos exchanges muestran los dos 60.000. El exchange A tiene 200 BTC en reposo dentro del 0,1 % del precio; el exchange B tiene 8. Necesitas comprar 50 BTC a mercado. ¿Qué deberías esperar?"
    options:
      - id: a
        correct: true
        text:
          en: "A fills near 60,000; B walks the book far higher for the same order."
          es: "A llena cerca de 60.000; B recorre el libro mucho más arriba."
      - id: b
        text:
          en: "Both fill at 60,000, since that is the price both venues display."
          es: "Los dos llenan en 60.000, que es el precio que ambos muestran."
      - id: c
        text:
          en: "B fills better, because less resting size means less competition."
          es: "B llena mejor, porque menos tamaño en reposo es menos competencia."
      - id: d
        text:
          en: "Neither fills; an order larger than displayed depth is rejected."
          es: "Ninguno llena; una orden mayor que la profundidad se rechaza."
    explanation:
      en: "The displayed price is only the price of the *first* unit. Everything after that is filled at successively worse levels until the order is complete, so what matters for a large order is depth, not the quoted price — the same order costs materially more on B despite the identical screen price. This is why 'the price is the same on both exchanges' is not the same claim as 'the trade costs the same on both exchanges'."
      es: "El precio mostrado es solo el precio de la *primera* unidad. Todo lo que va después se llena en niveles sucesivamente peores hasta completar la orden, así que lo que importa para una orden grande es la profundidad, no el precio cotizado: la misma orden cuesta bastante más en B pese al precio idéntico en pantalla. Por esto 'el precio es el mismo en los dos exchanges' no es la misma afirmación que 'la operación cuesta lo mismo en los dos exchanges'."
  - id: book-is-revocable
    kind: multi_select
    prompt:
      en: "Which of these limit how much you should trust a book's visible imbalance? Select all that apply."
      es: "¿Cuáles de estas cosas limitan cuánto deberías fiarte del desequilibrio visible de un libro? Selecciona todas las que correspondan."
    options:
      - id: a
        correct: true
        text:
          en: "Resting orders can be cancelled for free, at any moment"
          es: "Las órdenes en reposo se cancelan gratis en cualquier momento"
      - id: b
        correct: true
        text:
          en: "The largest participants hide their real size behind icebergs"
          es: "Los más grandes esconden su tamaño real detrás de icebergs"
      - id: c
        correct: true
        text:
          en: "The imbalance may be a consequence of the move that already happened"
          es: "El desequilibrio puede ser consecuencia del movimiento ya ocurrido"
      - id: d
        text:
          en: "Exchanges publish the book only once per minute"
          es: "Los exchanges publican el libro solo una vez por minuto"
    explanation:
      en: "The first three are exactly why imbalance is the flimsiest reading in this block: revocable, incomplete, and possibly backward-looking rather than a cause of the next move. The fourth is not a real limitation — book data streams continuously and in near real time, so being stale is not the problem."
      es: "Las tres primeras son justo por qué el desequilibrio es la lectura más flojita de este bloque: revocable, incompleto y posiblemente retrospectivo en vez de causa del siguiente movimiento. La cuarta no es una limitación real: los datos del libro se transmiten de forma continua y casi en tiempo real, así que estar desactualizado no es el problema."
  - id: wall-as-stop
    kind: true_false
    prompt:
      en: "A 400 BTC bid wall sitting below your long is a sound place to tuck your stop under."
      es: "Un muro de compra de 400 BTC por debajo de tu largo es un buen sitio para colocar el stop justo debajo."
    answer: false
    explanation:
      en: "Walls get pulled, and they get pulled precisely when they would have been tested. Never let a resting order that someone can cancel for free be the reason your risk sits where it does."
      es: "Los muros se retiran, y se retiran precisamente cuando iban a ser puestos a prueba. Nunca dejes que una orden en reposo que alguien puede cancelar gratis sea la razón de dónde está tu riesgo."
  - id: depth-vs-direction-match
    kind: matching
    prompt:
      en: "Match each thing the book shows you to what it actually means."
      es: "Empareja cada cosa que muestra el libro con lo que realmente significa."
    pairs:
      - id: thin
        left: { en: "A thin ask side above price", es: "Un lado vendedor con poca profundidad por encima del precio" }
        right:
          en: "Up is cheap *today* — a statement about what it currently costs to move price, not about where price is going."
          es: "Subir es barato *hoy*: una afirmación sobre lo que cuesta ahora mover el precio, no sobre a dónde va el precio."
      - id: wall
        left: { en: "A conspicuous wall resting at one price", es: "Un muro llamativo en reposo en un precio" }
        right:
          en: "Someone is *currently showing* size here — never that someone will definitely trade here."
          es: "Alguien está *mostrando ahora* tamaño aquí; nunca que alguien vaya a operar aquí con seguridad."
      - id: iceberg
        left: { en: "A modest bid that keeps refilling as it is eaten", es: "Una demanda modesta que se rellena cada vez que se la comen" }
        right:
          en: "An iceberg — genuine size hiding, deliberately invisible in the book."
          es: "Un iceberg: tamaño genuino escondido, deliberadamente invisible en el libro."
    explanation:
      en: "Everything resting there is revocable, and a good deal of what matters is not in the book at all. Depth tells you the current cost of moving price, never the direction it will move."
      es: "Todo lo que descansa ahí es revocable, y buena parte de lo que importa no está en el libro. La profundidad te dice el coste actual de mover el precio, nunca la dirección en la que se moverá."
  - id: stand-aside
    prompt:
      en: "You are flat and a CPI print is thirty seconds away. What does understanding the book mechanism actually buy you?"
      es: "Estás fuera del mercado y falta medio minuto para un dato de IPC. ¿Qué te aporta realmente entender el mecanismo del libro?"
    options:
      - id: a
        text:
          en: "A read on direction, since imbalance shows which way the vacuum breaks."
          es: "Una lectura de dirección: el desequilibrio dice hacia dónde romperá."
      - id: b
        correct: true
        text:
          en: "The discipline to do nothing — it is the worst moment to be a taker."
          es: "La disciplina de no hacer nada: el peor momento para ser taker."
      - id: c
        text:
          en: "Confidence to size up, because the move is going to be a large one."
          es: "Confianza para subir el tamaño, porque el movimiento será grande."
      - id: d
        text:
          en: "A guarantee your stop will fill at its price during the first spike."
          es: "La garantía de que tu stop se ejecutará a su precio en el pico."
    explanation:
      en: "That first violent candle into a vacuum is not a signal; it is an artefact of the book being empty, so it carries no direction to read and no guarantee that a stop fills where it sits. Trading it pays maximum spread and slippage for the least reliable information in the day, which is why understanding the mechanism mostly pays off as the discipline to stand aside."
      es: "Esa primera vela violenta contra el vacío no es una señal: es un artefacto de un libro vacío, así que no lleva dirección que leer ni garantía de que un stop se ejecute donde está. Operarla paga el máximo de spread y slippage por la información menos fiable del día, y por eso entender el mecanismo se cobra sobre todo en la disciplina de quedarse al margen."
