# SPDX-License-Identifier: AGPL-3.0-only
# Scenario variants with given numbers — still a quiz, no chart component (see m27-ex-1's note).
type: quiz
variants:
  - id: imbalance-3to1
    prompt:
      en: "The book shows **120 BTC** resting on the bid at 60,000 and **40 BTC** on the ask at 60,100. What does that imbalance suggest?"
      es: "El libro muestra **120 BTC** en reposo al bid en 60.000 y **40 BTC** al ask en 60.100. ¿Qué sugiere ese desequilibrio?"
    options:
      - id: a
        correct: true
        text:
          en: "There is more passive willingness to buy than to sell nearby, so price is currently easier to move up than down — a statement about resistance to movement, not a forecast."
          es: "Hay más disposición pasiva a comprar que a vender en las cercanías, así que ahora mismo el precio es más fácil de mover hacia arriba que hacia abajo: una afirmación sobre la resistencia al movimiento, no un pronóstico."
      - id: b
        text:
          en: "There are three times as many buyers as sellers, so price will rise."
          es: "Hay tres veces más compradores que vendedores, así que el precio subirá."
      - id: c
        text:
          en: "120 BTC of buying has just been executed against 40 BTC of selling."
          es: "Se acaban de ejecutar 120 BTC de compra contra 40 BTC de venta."
      - id: d
        text:
          en: "The spread is 100, which is the only thing those two numbers tell you."
          es: "El spread es 100, que es lo único que te dicen esos dos números."
    explanation:
      en: "It takes far more aggressive selling to push down through 120 BTC of bids than aggressive buying to lift through a 40 BTC ask — so up is the cheaper direction to move right now. That is not a prediction: those orders are unexecuted and cancellable, the largest size is often hidden in icebergs, and the imbalance may simply be a consequence of the move that already happened."
      es: "Hace falta mucha más venta agresiva para empujar hacia abajo a través de 120 BTC de bids que compra agresiva para levantar a través de un ask de 40 BTC, así que ahora mismo subir es la dirección más barata de mover. Eso no es una predicción: esas órdenes están sin ejecutar y son cancelables, el tamaño más grande suele estar escondido en icebergs, y el desequilibrio puede ser simplemente una consecuencia del movimiento que ya ocurrió."
  - id: imbalance-before-release
    prompt:
      en: "That same book — 120 BTC bid, 40 BTC ask — is sitting ninety seconds before a scheduled CPI release. What typically happens to it?"
      es: "Ese mismo libro —120 BTC al bid, 40 BTC al ask— está ahí noventa segundos antes de una publicación programada del IPC. ¿Qué le suele pasar?"
    options:
      - id: a
        correct: true
        text:
          en: "Both sides thin out and the spread widens as market makers pull their quotes, so the imbalance you were reading largely evaporates."
          es: "Los dos lados se adelgazan y el spread se ensancha cuando los creadores de mercado retiran sus cotizaciones, así que el desequilibrio que estabas leyendo se evapora en buena medida."
      - id: b
        text:
          en: "The bid side thickens further, since buyers position ahead of good news."
          es: "El lado bid se engorda más, ya que los compradores se posicionan antes de una buena noticia."
      - id: c
        text:
          en: "It stays exactly as it is; scheduled events affect price but never the resting book."
          es: "Se queda exactamente como está; los eventos programados afectan al precio pero nunca al libro en reposo."
      - id: d
        text:
          en: "The exchange freezes the book until the release has printed."
          es: "El exchange congela el libro hasta que la publicación haya salido."
    explanation:
      en: "Market makers earn the spread by resting orders on both sides; their risk is being filled just before a big move. Ahead of a known event with an unknown outcome, that risk spikes predictably, so the rational response is to cancel or widen their quotes. This is the mechanism behind m15's symptom — the widening spread and evaporating liquidity around a release."
      es: "Los creadores de mercado ganan el spread manteniendo órdenes en reposo en los dos lados; su riesgo es quedar llenos justo antes de un movimiento grande. Ante un evento conocido con resultado desconocido, ese riesgo se dispara de forma predecible, así que la respuesta racional es cancelar o ensanchar sus cotizaciones. Este es el mecanismo detrás del síntoma de m15: el spread que se ensancha y la liquidez que se evapora alrededor de una publicación."
  - id: first-move-into-vacuum
    prompt:
      en: "The CPI number prints and price gaps 1.2% in four seconds on unremarkable size, then gives most of it back within the minute. What happened?"
      es: "Sale el número del IPC y el precio salta un 1,2 % en cuatro segundos con un tamaño poco llamativo, y después devuelve la mayor parte en menos de un minuto. ¿Qué pasó?"
    options:
      - id: a
        correct: true
        text:
          en: "Market orders hit a book with almost nothing resting in it, so price jumped several levels on modest size; when the makers returned and depth refilled, the spike retraced."
          es: "Las órdenes a mercado golpearon un libro casi sin nada en reposo, así que el precio saltó varios niveles con un tamaño modesto; cuando los creadores de mercado volvieron y la profundidad se rellenó, el pico se retrajo."
      - id: b
        text:
          en: "A very large participant bought aggressively and then changed their mind and sold it all back."
          es: "Un participante muy grande compró agresivamente y luego cambió de opinión y lo vendió todo de vuelta."
      - id: c
        text:
          en: "The market correctly priced the news and then discovered it had misread the number."
          es: "El mercado valoró correctamente la noticia y luego descubrió que había leído mal el número."
      - id: d
        text:
          en: "Wash trading inflated the move; no real trades took place at those prices."
          es: "El wash trading infló el movimiento; no hubo operaciones reales a esos precios."
    explanation:
      en: "The give-away is 'unremarkable size'. A thin book means there is nothing there to absorb incoming market orders, so price traverses many levels cheaply. That first move often is not the market's opinion of the news at all — it is a thin book being crossed, which is exactly why m15's advice was to stand aside rather than to predict the release."
      es: "La pista es 'un tamaño poco llamativo'. Un libro fino significa que no hay nada ahí que absorba las órdenes a mercado que llegan, así que el precio atraviesa muchos niveles a bajo coste. Ese primer movimiento a menudo no es la opinión del mercado sobre la noticia: es un libro fino siendo cruzado, y justo por eso el consejo de m15 era quedarse al margen en lugar de predecir la publicación."
  - id: wall-pulled
    prompt:
      en: "A 400 BTC bid wall has sat at 60,000 all morning. Price drifts down to 60,050 and the wall disappears within a second. What is the honest read?"
      es: "Un muro de compra de 400 BTC lleva toda la mañana en 60.000. El precio baja hasta 60.050 y el muro desaparece en un segundo. ¿Cuál es la lectura honesta?"
    options:
      - id: a
        correct: true
        text:
          en: "The support you were counting on was never a commitment — it was cancellable, and it was cancelled exactly when it was about to matter."
          es: "El soporte con el que contabas nunca fue un compromiso: era cancelable, y se canceló justo cuando iba a importar."
      - id: b
        text:
          en: "The 400 BTC were filled, which means heavy buying just occurred at 60,000."
          es: "Los 400 BTC se llenaron, lo que significa que acaba de haber una compra fuerte en 60.000."
      - id: c
        text:
          en: "A data glitch — a wall that large cannot be withdrawn once price approaches it."
          es: "Un fallo de datos: un muro tan grande no se puede retirar una vez que el precio se le acerca."
      - id: d
        text:
          en: "It confirms 60,000 as strong support, since the order defended the level all morning."
          es: "Confirma 60.000 como soporte fuerte, ya que la orden defendió el nivel toda la mañana."
    explanation:
      en: "Note that price never reached 60,000, so nothing was filled — the order was withdrawn. This is why leaning on a wall, and especially placing a stop just under one, is dangerous: walls get pulled precisely when they would have been tested. Never let an order someone can cancel for free be the reason your risk sits where it does."
      es: "Fíjate en que el precio nunca llegó a 60.000, así que no se llenó nada: la orden se retiró. Por esto apoyarse en un muro, y sobre todo poner un stop justo debajo de uno, es peligroso: los muros se retiran justo cuando iban a ser testeados. Nunca dejes que una orden que alguien puede cancelar gratis sea la razón de que tu riesgo esté donde está."
  - id: spread-cost
    prompt:
      en: "A market normally shows a 1 basis point spread. Ninety seconds before an FOMC decision it shows 25 basis points. What has changed, and what does it cost you?"
      es: "Un mercado muestra normalmente un spread de 1 punto básico. Noventa segundos antes de una decisión de la Fed muestra 25 puntos básicos. ¿Qué ha cambiado y qué te cuesta?"
    options:
      - id: a
        correct: true
        text:
          en: "Makers have withdrawn depth ahead of the event, and any market order you send now pays that much wider gap immediately — the worst moment to be a taker."
          es: "Los makers han retirado profundidad antes del evento, y cualquier orden a mercado que envíes ahora paga ese hueco mucho más ancho de inmediato: el peor momento para ser taker."
      - id: b
        text:
          en: "Volatility has already risen, so the wider spread is compensation you receive rather than a cost you pay."
          es: "La volatilidad ya ha subido, así que el spread más ancho es una compensación que recibes en vez de un coste que pagas."
      - id: c
        text:
          en: "The exchange has raised its fees temporarily for the event."
          es: "El exchange ha subido sus comisiones temporalmente por el evento."
      - id: d
        text:
          en: "Nothing meaningful — the spread is a display convention and does not affect fill prices."
          es: "Nada relevante: el spread es una convención de visualización y no afecta a los precios de ejecución."
    explanation:
      en: "The spread is what a taker pays to cross the book, so a 25x wider spread is a 25x more expensive round trip before any price movement at all. Combine that with the near-empty book behind it and you have the least favourable conditions of the day for a market order — maximum spread and maximum slippage, in exchange for the least reliable information."
      es: "El spread es lo que paga un taker por cruzar el libro, así que un spread 25 veces más ancho es una ida y vuelta 25 veces más cara antes de cualquier movimiento de precio. Súmale el libro casi vacío que hay detrás y tienes las condiciones menos favorables del día para una orden a mercado: el máximo de spread y el máximo de slippage, a cambio de la información menos fiable."
  - id: deep-vs-thin-fill
    prompt:
      en: "Two venues both display 60,000. Venue A has 200 BTC resting within 0.1% of price; venue B has 8 BTC. You need to buy 50 BTC at market. What should you expect?"
      es: "Dos sitios muestran los dos 60.000. El sitio A tiene 200 BTC en reposo dentro del 0,1 % del precio; el sitio B tiene 8. Necesitas comprar 50 BTC a mercado. ¿Qué deberías esperar?"
    options:
      - id: a
        correct: true
        text:
          en: "A fills close to 60,000; B walks the book far higher, so the same order costs materially more there despite the identical screen price."
          es: "En A se llena cerca de 60.000; en B recorre el libro mucho más arriba, así que la misma orden cuesta bastante más ahí a pesar del precio idéntico en pantalla."
      - id: b
        text:
          en: "Both fill at 60,000, since that is the price both venues are displaying."
          es: "Los dos se llenan en 60.000, ya que ese es el precio que muestran los dos sitios."
      - id: c
        text:
          en: "B fills better, because less resting size means less competition for your order."
          es: "B se llena mejor, porque menos tamaño en reposo significa menos competencia para tu orden."
      - id: d
        text:
          en: "Neither fills; an order larger than the displayed depth is always rejected."
          es: "Ninguno se llena; una orden mayor que la profundidad mostrada siempre se rechaza."
    explanation:
      en: "The displayed price is only the price of the *first* unit. Everything after that is filled at successively worse levels until the order is complete, so what matters for a large order is depth, not the quoted price. This is why 'the price is the same on both exchanges' is not the same claim as 'the trade costs the same on both exchanges'."
      es: "El precio mostrado es solo el precio de la *primera* unidad. Todo lo que va después se llena en niveles sucesivamente peores hasta completar la orden, así que lo que importa para una orden grande es la profundidad, no el precio cotizado. Por esto 'el precio es el mismo en los dos exchanges' no es la misma afirmación que 'la operación cuesta lo mismo en los dos exchanges'."
  - id: book-is-revocable
    kind: multi_select
    prompt:
      en: "Which of these limit how much you should trust a book's visible imbalance? Select all that apply."
      es: "¿Cuáles de estas cosas limitan cuánto deberías fiarte del desequilibrio visible de un libro? Selecciona todas las que correspondan."
    options:
      - id: a
        correct: true
        text:
          en: "Resting orders can be cancelled for free, at any moment"
          es: "Las órdenes en reposo se pueden cancelar gratis, en cualquier momento"
      - id: b
        correct: true
        text:
          en: "The largest participants often hide their real size behind icebergs"
          es: "Los participantes más grandes a menudo esconden su tamaño real detrás de icebergs"
      - id: c
        correct: true
        text:
          en: "The imbalance may be a consequence of the move that already happened, not a cause of the next one"
          es: "El desequilibrio puede ser una consecuencia del movimiento que ya ocurrió, no una causa del siguiente"
      - id: d
        text:
          en: "Exchanges publish the book only once per minute, so it is always badly out of date"
          es: "Los exchanges publican el libro solo una vez por minuto, así que siempre está muy desactualizado"
    explanation:
      en: "The first three are exactly why imbalance is the flimsiest reading in this block. The fourth is not a real limitation: book data streams continuously and in near real time — being stale is not the problem. Being revocable, incomplete, and possibly backward-looking is."
      es: "Las tres primeras son justo por qué el desequilibrio es la lectura más flojita de este bloque. La cuarta no es una limitación real: los datos del libro se transmiten de forma continua y casi en tiempo real; estar desactualizado no es el problema. Ser revocable, incompleto y posiblemente retrospectivo, sí."
  - id: wall-as-stop
    kind: true_false
    prompt:
      en: "A 400 BTC bid wall sitting below your long is a sound place to tuck your stop under."
      es: "Un muro de compra de 400 BTC por debajo de tu largo es un buen sitio para colocar el stop justo debajo."
    answer: false
    explanation:
      en: "Walls get pulled, and they get pulled precisely when they would have been tested. Never let a resting order that someone can cancel for free be the reason your risk sits where it does."
      es: "Los muros se retiran, y se retiran precisamente cuando iban a ser puestos a prueba. Nunca dejes que una orden en reposo que alguien puede cancelar gratis sea la razón de dónde está tu riesgo."
  - id: depth-vs-direction-match
    kind: matching
    prompt:
      en: "Match each thing the book shows you to what it actually means."
      es: "Empareja cada cosa que muestra el libro con lo que realmente significa."
    pairs:
      - id: thin
        left: { en: "A thin ask side above price", es: "Un lado de venta fino por encima del precio" }
        right:
          en: "Up is cheap *today* — a statement about what it currently costs to move price, not about where price is going."
          es: "Subir es barato *hoy*: una afirmación sobre lo que cuesta ahora mover el precio, no sobre a dónde va el precio."
      - id: wall
        left: { en: "A conspicuous wall resting at one price", es: "Un muro llamativo en reposo en un precio" }
        right:
          en: "Someone is *currently showing* size here — never that someone will definitely trade here."
          es: "Alguien está *mostrando ahora* tamaño aquí; nunca que alguien vaya a operar aquí con seguridad."
      - id: iceberg
        left: { en: "A modest bid that keeps refilling as it is eaten", es: "Una demanda modesta que se rellena cada vez que se la comen" }
        right:
          en: "An iceberg — genuine size hiding, deliberately invisible in the book."
          es: "Un iceberg: tamaño genuino escondido, deliberadamente invisible en el libro."
    explanation:
      en: "Everything resting there is revocable, and a good deal of what matters is not in the book at all. Depth tells you the current cost of moving price, never the direction it will move."
      es: "Todo lo que descansa ahí es revocable, y buena parte de lo que importa no está en el libro. La profundidad te dice el coste actual de mover el precio, nunca la dirección en la que se moverá."
  - id: stand-aside
    prompt:
      en: "You are flat and a CPI print is thirty seconds away. What does understanding the book mechanism actually buy you?"
      es: "Estás fuera del mercado y falta medio minuto para un dato de IPC. ¿Qué te aporta realmente entender el mecanismo del libro?"
    options:
      - id: a
        correct: true
        text:
          en: "The discipline to do nothing — trading that first candle pays maximum spread and slippage for the least reliable information in the day."
          es: "La disciplina de no hacer nada: operar esa primera vela paga el máximo spread y slippage por la información menos fiable del día."
      - id: b
        text:
          en: "A read on direction, since the imbalance shows which way the vacuum will break."
          es: "Una lectura de dirección, ya que el desequilibrio muestra hacia dónde romperá el vacío."
      - id: c
        text:
          en: "Confidence to size up, because the move will be large."
          es: "Confianza para aumentar el tamaño, porque el movimiento será grande."
      - id: d
        text:
          en: "A guarantee that your stop will fill at its price during the spike."
          es: "La garantía de que tu stop se ejecutará a su precio durante el pico."
    explanation:
      en: "That first violent candle into a vacuum is not a signal; it is an artefact of the book being empty. Understanding the mechanism mostly pays off as the discipline to stand aside."
      es: "Esa primera vela violenta contra el vacío no es una señal: es un artefacto de un libro vacío. Entender el mecanismo se cobra sobre todo en la disciplina de quedarse al margen."
