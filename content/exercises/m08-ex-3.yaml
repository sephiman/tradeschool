# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: uptrend-structure
    prompt:
      en: "Each successive peak is higher than the one before it, and each dip bottoms out above the previous dip. How is this structure best described?"
      es: "Cada pico sucesivo es más alto que el anterior, y cada retroceso hace suelo por encima del retroceso previo. ¿Cómo se describe mejor esta estructura?"
    options:
      - id: a
        text:
          en: "A change of character, since price keeps climbing to new ground."
          es: "Un cambio de carácter, ya que el precio sigue subiendo a terreno nuevo."
      - id: b
        correct: true
        text:
          en: "An uptrend — a ladder of higher highs and higher lows, step by step."
          es: "Una tendencia alcista: máximos más altos y mínimos más altos."
      - id: c
        text:
          en: "A downtrend, whose lower highs and lower lows are read upside down."
          es: "Una bajista, cuyos máximos y mínimos decrecientes se leen al revés."
      - id: d
        text:
          en: "A range, because price oscillates up and down between turns."
          es: "Un rango, porque el precio oscila arriba y abajo entre giros."
    explanation:
      en: "Higher highs plus higher lows is the definition of an uptrend, and the oscillation between them is the trend advancing, not going nowhere. A change of character is the OPPOSITE — the break of that pattern, a first lower low — and a downtrend is its mirror, not the same picture read differently."
      es: "Máximos más altos más mínimos más altos es la definición de tendencia alcista, y la oscilación entre ellos es la tendencia avanzando, no quedándose quieta. Un cambio de carácter es lo CONTRARIO —la ruptura de ese patrón, un primer mínimo más bajo— y una bajista es su espejo, no la misma imagen leída de otro modo."
  - id: choch-first-lower-low
    prompt:
      en: "You have been in a clean uptrend of higher highs and higher lows. Price now drops and makes its first lower low, closing below the previous higher low. What does this tell you?"
      es: "Vienes de una tendencia alcista limpia de máximos más altos y mínimos más altos. Ahora el precio cae y hace su primer mínimo más bajo, cerrando por debajo del mínimo más alto anterior. ¿Qué te dice esto?"
    options:
      - id: a
        text:
          en: "A downtrend has definitely begun; expect steadily lower prices now."
          es: "Ha empezado con seguridad una bajista; espera precios cada vez más bajos."
      - id: b
        text:
          en: "Nothing meaningful — one lower low is always just a pullback."
          es: "Nada relevante: un solo mínimo más bajo siempre es solo un pullback."
      - id: c
        text:
          en: "That support and resistance stop applying once structure breaks."
          es: "Que soportes y resistencias dejan de aplicar al romperse la estructura."
      - id: d
        correct: true
        text:
          en: "A change of character: the uptrend's pattern has stopped working."
          es: "Un cambio de carácter: el patrón alcista ha dejado de funcionar."
    explanation:
      en: "The first lower low breaks the uptrend's rule — that is a change of character, and it is the earliest honest warning you get. It is not a guarantee: it can still resolve as a deep pullback that resumes, so it is a question to watch rather than a confirmed reversal. Dismissing it entirely is the other error, and levels keep working regardless."
      es: "El primer mínimo más bajo rompe la regla de la tendencia alcista: eso es un cambio de carácter, y es el aviso honesto más temprano que recibes. No es una garantía: aún puede resolverse como un pullback profundo que se reanuda, así que es una pregunta que vigilar más que un giro confirmado. Descartarlo del todo es el otro error, y los niveles siguen funcionando igual."
  - id: downtrend-structure
    prompt:
      en: "Each rally tops out below the previous peak, and each drop bottoms out below the previous low. How is this structure best described?"
      es: "Cada rebote hace techo por debajo del pico anterior, y cada caída hace suelo por debajo del mínimo anterior. ¿Cómo se describe mejor esta estructura?"
    options:
      - id: a
        correct: true
        text:
          en: "A downtrend — a sequence of lower highs and lower lows."
          es: "Una tendencia bajista: una secuencia de máximos más bajos y mínimos más bajos."
      - id: b
        text:
          en: "A change of character on every swing, as price keeps dropping."
          es: "Un cambio de carácter en cada swing, mientras el precio sigue cayendo."
      - id: c
        text:
          en: "A range, because price oscillates between two prices repeatedly."
          es: "Un rango, porque el precio oscila entre dos precios repetidamente."
      - id: d
        text:
          en: "An uptrend that happens to be pulling back for the moment."
          es: "Una tendencia alcista que resulta estar corrigiendo de momento."
    explanation:
      en: "Lower highs plus lower lows is the mirror of an uptrend: a downtrend. A change of character would be the OPPOSITE of that pattern — the first higher high — not more of the same down structure, and each successive low being lower is exactly what a range does not do."
      es: "Máximos más bajos más mínimos más bajos es el espejo de una tendencia alcista: una tendencia bajista. Un cambio de carácter sería lo CONTRARIO de ese patrón —el primer máximo más alto—, no más de la misma estructura bajista, y que cada mínimo sucesivo sea más bajo es justo lo que un rango no hace."
  - id: structure-terms-match
    kind: matching
    prompt:
      en: "Match each market-structure term to what it means."
      es: "Empareja cada término de estructura de mercado con su significado."
    pairs:
      - id: up
        left:
          en: "Uptrend"
          es: "Tendencia alcista"
        right:
          en: "Higher highs and higher lows (HH/HL)"
          es: "Máximos más altos y mínimos más altos (HH/HL)"
      - id: dn
        left:
          en: "Downtrend"
          es: "Tendencia bajista"
        right:
          en: "Lower highs and lower lows (LH/LL)"
          es: "Máximos más bajos y mínimos más bajos (LH/LL)"
      - id: ch
        left:
          en: "Change of character (CHoCH)"
          es: "Cambio de carácter (CHoCH)"
        right:
          en: "The first swing that violates the trend's pattern"
          es: "El primer swing que viola el patrón de la tendencia"
      - id: pb
        left:
          en: "Pullback"
          es: "Pullback"
        right:
          en: "A counter-move within a trend, not a reversal"
          es: "Un movimiento en contra dentro de una tendencia, no un giro"
    explanation:
      en: "An uptrend is HH/HL and a downtrend is its mirror, LH/LL. A pullback is the counter-move inside a trend (an HL forming in an uptrend); a change of character is the first swing that breaks the trend's rule — a warning, not a confirmed reversal."
      es: "Una tendencia alcista es HH/HL y una bajista es su espejo, LH/LL. Un pullback es el movimiento en contra dentro de una tendencia (un HL formándose en una alcista); un cambio de carácter es el primer swing que rompe la regla de la tendencia: un aviso, no un giro confirmado."
  - id: choch-downtrend-direction
    kind: true_false
    prompt:
      en: "In a downtrend, the change of character is the first higher high — a lower low would simply continue the trend."
      es: "En una tendencia bajista, el cambio de carácter es el primer máximo más alto; un mínimo más bajo simplemente continuaría la tendencia."
    answer: true
    explanation:
      en: "True. A downtrend is made of lower highs and lower lows, so another lower low is the pattern working as advertised. The change of character is always the first swing that breaks the trend's own rule — which in a downtrend means breaking upward."
      es: "Cierto. Una tendencia bajista está formada por máximos más bajos y mínimos más bajos, así que otro mínimo más bajo es el patrón funcionando como toca. El cambio de carácter es siempre el primer swing que rompe la regla de la propia tendencia, que en una bajista significa romper al alza."
  - id: pullback-not-reversal
    prompt:
      en: "In a clean uptrend, price dips to a low that is still above the previous higher low, then rallies to a fresh higher high. What was that dip?"
      es: "En una tendencia alcista limpia, el precio cae a un mínimo que sigue estando por encima del mínimo más alto anterior, y luego sube a un nuevo máximo más alto. ¿Qué fue esa caída?"
    options:
      - id: a
        text:
          en: "A change of character, because price dropped for a while first."
          es: "Un cambio de carácter, porque el precio cayó durante un rato antes."
      - id: b
        text:
          en: "A confirmed reversal into a downtrend that then failed to follow through."
          es: "Un giro confirmado a bajista que luego no tuvo continuidad."
      - id: c
        text:
          en: "A fakeout of support, since price traded down into the level."
          es: "Un fakeout del soporte, ya que el precio bajó hasta el nivel."
      - id: d
        correct: true
        text:
          en: "A pullback — the trend caught its breath and resumed."
          es: "Un pullback: la tendencia tomó aire y se reanudó."
    explanation:
      en: "The dip held above the prior higher low and the trend then made a new higher high, so the staircase continued intact. A change of character would have required a lower low; nothing was reversed and no level was broken and reclaimed, so there is no fakeout to name either."
      es: "La caída se mantuvo por encima del mínimo más alto previo y la tendencia luego hizo un nuevo máximo más alto, así que la escalera continuó intacta. Un cambio de carácter habría requerido un mínimo más bajo; no se giró nada ni se rompió y recuperó ningún nivel, así que tampoco hay ningún fakeout que nombrar."
  - id: choch-is-reversal-myth
    kind: true_false
    prompt:
      en: "A change of character, on its own, confirms that the trend has reversed."
      es: "Un cambio de carácter, por sí solo, confirma que la tendencia se ha girado."
    answer: false
    explanation:
      en: "False. A change of character is the first evidence the old trend's rule has stopped working — a reason to watch, not a confirmed reversal. It often precedes a range or a longer transition, and one lower low in an uptrend can still be a deep pullback that resumes."
      es: "Falso. Un cambio de carácter es el primer indicio de que la regla de la vieja tendencia ha dejado de funcionar: un motivo para vigilar, no un giro confirmado. A menudo precede a un rango o a una transición más larga, y un solo mínimo más bajo en una tendencia alcista aún puede ser un pullback profundo que se reanuda."
  - id: staircase-numbers
    prompt:
      en: "A chart reads: low 100, high 110, dip to 104, high 118, dip to 109, high 126 — then price falls from 126 through 109 to a low of 106. What has just happened?"
      es: "Un gráfico marca: mínimo 100, máximo 110, retroceso a 104, máximo 118, retroceso a 109, máximo 126; luego el precio cae desde 126 atravesando 109 hasta un mínimo de 106. ¿Qué acaba de ocurrir?"
    options:
      - id: a
        text:
          en: "Nothing structural — 106 is still comfortably above the original low of 100."
          es: "Nada estructural: 106 sigue holgadamente por encima del mínimo original de 100."
      - id: b
        correct: true
        text:
          en: "A change of character — the first lower low of the whole run."
          es: "Un cambio de carácter: el primer mínimo decreciente de toda la secuencia."
      - id: c
        text:
          en: "A confirmed downtrend, now that price has made a lower low."
          es: "Una tendencia bajista confirmada, ahora que hizo un mínimo decreciente."
      - id: d
        text:
          en: "A perfectly normal higher low, so the uptrend remains intact."
          es: "Un mínimo creciente perfectamente normal, así que la alcista sigue intacta."
    explanation:
      en: "The whole uptrend rested on one mechanism: every dip being bought above the previous dip. Breaking 109 is the first time that visibly failed — the buyers did not show up where they had been showing up. What matters is the sequence, not the distance from the original low, and one broken rule is evidence the pattern stopped working, not yet a new trend."
      es: "Toda la tendencia alcista se apoyaba en un mecanismo: que cada retroceso se compraba por encima del anterior. Romper 109 es la primera vez que eso falla visiblemente: los compradores no aparecieron donde venían apareciendo. Lo que importa es la secuencia, no la distancia al mínimo original, y una regla rota es indicio de que el patrón dejó de funcionar, todavía no una tendencia nueva."
  - id: choch-confirmation
    kind: multi_select
    prompt:
      en: "You have a change of character in an uptrend. Select ALL of the following that would help answer the question it raises — has control actually changed?"
      es: "Tienes un cambio de carácter en una tendencia alcista. Selecciona TODO lo que ayudaría a responder la pregunta que plantea: ¿ha cambiado realmente el control?"
    options:
      - id: a
        correct: true
        text:
          en: "A lower high printed after the lower low."
          es: "Un máximo decreciente impreso después del mínimo decreciente."
      - id: b
        correct: true
        text:
          en: "A failed attempt to reclaim the broken level."
          es: "Un intento fallido de recuperar el nivel roto."
      - id: c
        correct: true
        text:
          en: "A second break that confirms the first one."
          es: "Una segunda ruptura que confirma la primera."
      - id: d
        text:
          en: "The single lower low by itself — it already answers it."
          es: "El único mínimo decreciente por sí solo: ya lo responde."
      - id: e
        text:
          en: "A doji printed anywhere on the chart after the break."
          es: "Un doji impreso en cualquier parte del gráfico tras la ruptura."
    explanation:
      en: "One CHoCH is a broken pattern, not a new trend — strong trends print the odd lower low inside a deep pullback all the time, which is precisely why the break alone cannot be the answer. Treat it as a question and wait for structure to answer it; a lone candle shape anywhere on the chart says nothing about who is in control."
      es: "Un CHoCH es un patrón roto, no una tendencia nueva: las tendencias fuertes imprimen algún mínimo decreciente dentro de un retroceso profundo continuamente, y por eso la ruptura sola no puede ser la respuesta. Trátalo como una pregunta y espera a que la estructura la conteste; una vela suelta en cualquier parte del gráfico no dice nada sobre quién manda."
  - id: pullback-uncertainty
    kind: true_false
    prompt:
      en: "At the moment a dip forms, you can tell whether it is a pullback within the trend or the start of a reversal."
      es: "En el momento en que se forma un retroceso, puedes saber si es un retroceso dentro de la tendencia o el inicio de una reversión."
    answer: false
    explanation:
      en: "Only the next swing settles it. A dip to 109 that turns back up into a new high *was* a pullback; the same dip that keeps going and breaks the prior low was the first crack. Live, they look identical."
      es: "Solo la siguiente oscilación lo resuelve. Un retroceso a 109 que se gira al alza hacia un nuevo máximo *era* un retroceso; el mismo retroceso que sigue y rompe el mínimo previo era la primera grieta. En vivo, se ven idénticos."
  - id: chart-reading-order
    kind: ordering
    prompt:
      en: "Put the steps for reading a chart's structure in order."
      es: "Ordena los pasos para leer la estructura de un gráfico."
    items:
      - id: zones
        position: 1
        text:
          en: "Mark the obvious zones first — the ones a stranger would circle. If you have to squint, it isn't a level."
          es: "Marca primero las zonas obvias: las que un desconocido rodearía. Si tienes que entrecerrar los ojos, no es un nivel."
      - id: swings
        position: 2
        text:
          en: "Read the swing sequence: HH/HL, LH/LL, or a messy range with neither."
          es: "Lee la secuencia de oscilaciones: HH/HL, LH/LL, o un rango desordenado sin ninguna de las dos."
      - id: close
        position: 3
        text:
          en: "At a level, wait for the close — beyond and holding is a breakout; beyond then back inside is a fakeout."
          es: "En un nivel, espera el cierre: más allá y sosteniéndose es ruptura; más allá y de vuelta dentro es ruptura falsa."
      - id: confirm
        position: 4
        text:
          en: "Let the market confirm before you rename a pullback a reversal — the change of character is the earliest honest warning, no earlier."
          es: "Deja que el mercado confirme antes de rebautizar un retroceso como reversión: el cambio de carácter es el aviso honesto más temprano, no antes."
    explanation:
      en: "Structure is read outside-in: levels, then the sequence between them, then what price does when the two meet. Acting on the first sign instead of the confirmed one is the root of both classic misreads."
      es: "La estructura se lee de fuera hacia dentro: niveles, luego la secuencia entre ellos, luego qué hace el precio cuando ambos se encuentran. Actuar en la primera señal en vez de en la confirmada es la raíz de los dos errores clásicos."
