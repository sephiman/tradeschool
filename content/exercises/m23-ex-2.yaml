# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: fee-toll-scalping
    prompt:
      en: "Why does a high-frequency scalping style tend to face the biggest drag from fees?"
      es: "¿Por qué un estilo de scalping de alta frecuencia tiende a sufrir el mayor lastre por comisiones?"
    options:
      - id: a
        text:
          en: "Scalpers use higher leverage, and more leverage raises the fee rate charged."
          es: "Los scalpers usan más apalancamiento, y más apalancamiento sube la tasa."
      - id: b
        text:
          en: "Fees are a fixed monthly charge and scalpers get billed for more months."
          es: "Las comisiones son un cargo mensual fijo y a los scalpers se les factura más."
      - id: c
        text:
          en: "Scalpers hold overnight, so the exchange charges a fee for every night."
          es: "Los scalpers mantienen de noche, y el exchange cobra por cada noche."
      - id: d
        correct: true
        text:
          en: "Fees are charged on entry and exit, so many trades multiply the toll."
          es: "Se cobra al entrar y al salir: muchas operaciones multiplican el peaje."
    explanation:
      en: "A fee is paid every time you open and close, so cost scales with the number of trades — not with leverage, not with the calendar, and not with time held. Doing hundreds of round-trips a day stacks that toll up fast, and a scalper is usually flat overnight anyway."
      es: "Se paga una comisión cada vez que abres y cierras, así que el coste escala con el número de operaciones, no con el apalancamiento, ni con el calendario, ni con el tiempo mantenido. Hacer cientos de idas y vueltas al día acumula ese peaje muy rápido, y un scalper suele estar plano por la noche de todos modos."
  - id: funding-time-swing
    prompt:
      en: "A swing trader holding a perpetual futures position for several days is most exposed to which cost that a scalper largely avoids?"
      es: "Un swing trader que mantiene una posición en futuros perpetuos varios días está más expuesto a qué coste que un scalper esquiva en buena medida?"
    options:
      - id: a
        text:
          en: "Trading fees, since holding longer is billed for every hour it stays open."
          es: "Las comisiones, ya que mantener más tiempo se cobra por cada hora abierta."
      - id: b
        text:
          en: "The spread, which grows wider the longer a position remains open."
          es: "El spread, que se ensancha cuanto más tiempo sigue abierta la posición."
      - id: c
        text:
          en: "A daily account-maintenance charge levied by the exchange on holders."
          es: "Un cargo diario de mantenimiento de cuenta que impone el exchange."
      - id: d
        correct: true
        text:
          en: "Funding, exchanged every few hours and adding up across days."
          es: "El funding, intercambiado cada pocas horas y acumulado a lo largo de días."
    explanation:
      en: "Funding scales with time held: crossing many 8-hour payments over days is a real cost (or credit) for a swing trader. Fees and the spread, by contrast, are per-fill, so they hit the scalper hardest, not the holder — and neither the spread nor any maintenance charge accrues just because a position stays open."
      es: "El funding escala con el tiempo mantenido: cruzar muchos pagos de 8 horas durante días es un coste (o ingreso) real para un swing trader. Las comisiones y el spread, en cambio, son por ejecución, así que golpean más al scalper, no a quien mantiene, y ni el spread ni ningún cargo de mantenimiento se acumulan solo porque una posición siga abierta."
  - id: cost-scaling-match
    kind: matching
    prompt:
      en: "Match each cost to what makes it grow."
      es: "Empareja cada coste con lo que lo hace crecer."
    pairs:
      - id: fees
        left: { en: "Trading fees", es: "Comisiones de trading" }
        right:
          en: "Scale with the number of trades you make."
          es: "Escalan con el número de operaciones que haces."
      - id: funding
        left: { en: "Funding", es: "Funding" }
        right:
          en: "Scales with how long you hold the position."
          es: "Escala con cuánto tiempo mantienes la posición."
      - id: spread
        left: { en: "The spread", es: "El spread" }
        right:
          en: "A per-fill cost you cross going in and again coming out."
          es: "Un coste por ejecución que cruzas al entrar y otra vez al salir."
    explanation:
      en: "Fees and the spread are paid on every fill, so they scale with the number of trades — the scalper's burden. Funding is exchanged periodically, so it scales with time held — the swing trader's burden. Knowing which cost tracks which axis is the whole point."
      es: "Las comisiones y el spread se pagan en cada ejecución, así que escalan con el número de operaciones: la carga del scalper. El funding se intercambia periódicamente, así que escala con el tiempo mantenido: la carga del swing trader. Saber qué coste sigue a qué eje es lo que importa."
  - id: more-trades-more-profit
    kind: true_false
    prompt:
      en: "Trading more often does not add edge; it only makes you pay the fee-and-spread toll more times."
      es: "Operar más a menudo no añade ventaja; solo hace que pagues más veces el peaje de comisiones y spread."
    answer: true
    explanation:
      en: "True, and the opposite belief — that scalping earns more simply because it makes more trades — is the most expensive beginner assumption in the module. Frequency is a cost, not a strategy."
      es: "Cierto, y la creencia contraria —que el scalping gana más simplemente porque hace más operaciones— es la suposición de principiante más cara del módulo. La frecuencia es un coste, no una estrategia."
  - id: scalper-avoids-funding
    prompt:
      en: "On perpetual futures, why does funding barely affect a scalper?"
      es: "En los futuros perpetuos, ¿por qué el funding apenas afecta a un scalper?"
    options:
      - id: a
        correct: true
        text:
          en: "They are rarely still in a position when the funding clock ticks."
          es: "Rara vez siguen en posición cuando salta el reloj del funding."
      - id: b
        text:
          en: "Exchanges exempt scalpers from funding because they trade so often."
          es: "Los exchanges eximen del funding a los scalpers por operar tanto."
      - id: c
        text:
          en: "Funding is only ever charged on positions held over a weekend."
          es: "El funding solo se cobra en posiciones mantenidas un fin de semana."
      - id: d
        text:
          en: "High trade frequency automatically cancels out any funding owed."
          es: "La alta frecuencia cancela automáticamente cualquier funding debido."
    explanation:
      en: "Funding is exchanged every few hours, commonly every 8. Because a scalper's positions last seconds to minutes, they are usually flat when the clock ticks, so funding barely touches them. There is no exemption for anyone, it runs every interval rather than only at weekends, and nothing about trade count cancels a payment you owe."
      es: "El funding se intercambia cada pocas horas, habitualmente cada 8. Como las posiciones de un scalper duran de segundos a minutos, suele estar plano cuando salta el reloj, así que el funding apenas le afecta. No hay exención para nadie, se cobra en cada intervalo y no solo los fines de semana, y nada relacionado con el número de operaciones cancela un pago que debes."
  - id: higher-win-rate-breakeven
    prompt:
      en: "Why does a high-frequency style need a genuinely higher win rate just to break even?"
      es: "¿Por qué un estilo de alta frecuencia necesita un win rate genuinamente más alto solo para no perder?"
    options:
      - id: a
        text:
          en: "Because trading more often automatically means more leverage and more risk."
          es: "Porque operar más a menudo implica automáticamente más apalancamiento y riesgo."
      - id: b
        text:
          en: "Because funding gets charged more often the more trades that you place."
          es: "Porque el funding se cobra más a menudo cuantas más operaciones colocas."
      - id: c
        text:
          en: "It does not — win rate has nothing to do with how often you trade at all."
          es: "No lo necesita: el win rate no tiene que ver con la frecuencia de operar."
      - id: d
        correct: true
        text:
          en: "Its edge must first cover the stacked fees and spreads of every round-trip."
          es: "Su ventaja debe cubrir antes las comisiones y spreads de cada ida y vuelta."
    explanation:
      en: "Before a scalper makes a cent, their edge has to beat the entire stack of fees and spreads from all those round-trips — a cost problem, not a leverage or funding one. Frequency does not change what leverage you choose, and funding is charged by the clock rather than by the trade."
      es: "Antes de ganar un céntimo, la ventaja de un scalper tiene que superar toda la pila de comisiones y spreads de esas idas y vueltas: un problema de costes, no de apalancamiento ni de funding. La frecuencia no cambia el apalancamiento que elijas, y el funding se cobra por reloj y no por operación."
  - id: three-bills
    prompt:
      en: "A 10,000 USDT position captures a 3% gross move (300 USDT). Taker fee 0.04% per fill (8 USDT per round-trip); funding 0.03% per interval (3 USDT). Scalper: 15 round-trips, no funding. Day trader: 1 round-trip, no funding. Swing: 1 round-trip, 6 funding intervals. Who keeps what?"
      es: "Una posición de 10.000 USDT captura un movimiento bruto del 3% (300 USDT). Comisión taker del 0,04% por ejecución (8 USDT por ida y vuelta); funding del 0,03% por intervalo (3 USDT). Scalper: 15 idas y vueltas, sin funding. Intradía: 1 ida y vuelta, sin funding. Swing: 1 ida y vuelta, 6 intervalos de funding. ¿Cuánto se queda cada uno?"
    options:
      - id: a
        text:
          en: "All three keep 300 — the costs come out of margin, not out of profit."
          es: "Los tres se quedan 300: los costes salen del margen, no del beneficio."
      - id: b
        text:
          en: "Scalper 292, day trader 274, swing trader 180 — frequency pays off."
          es: "Scalper 292, intradía 274, swing 180: la frecuencia compensa."
      - id: c
        text:
          en: "Scalper 180, day trader 274, swing 292 — funding is smaller than fees."
          es: "Scalper 180, intradía 274, swing 292: el funding pesa menos que las comisiones."
      - id: d
        correct: true
        text:
          en: "Scalper 180 USDT, day trader 292 USDT and swing trader 274 USDT in total."
          es: "Scalper 180, intradía 292, swing 274."
    explanation:
      en: "Scalper: 300 − 120 in fees = 180. Day trader: 300 − 8 = 292. Swing: 300 − 8 − 18 = 274. Same move, and the gap is entirely cost — fees punished the scalper's many round-trips, funding taxed the swing trader's multi-day hold, and the day trader, in and out once with nothing held over, kept the most of this particular move."
      es: "Scalper: 300 − 120 de comisiones = 180. Intradía: 300 − 8 = 292. Swing: 300 − 8 − 18 = 274. El mismo movimiento, y la diferencia es puro coste: las comisiones castigaron las muchas idas y vueltas del scalper, el funding gravó la tenencia de varios días del swing, y el intradía, entrando y saliendo una vez sin mantener nada, se quedó con lo máximo de este movimiento concreto."
  - id: cost-clocks
    kind: multi_select
    prompt:
      en: "Select ALL statements about the two costs that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre los dos costes."
    options:
      - id: a
        correct: true
        text:
          en: "Fees are charged per fill, so one round-trip pays the toll twice."
          es: "Las comisiones se cobran por ejecución: una ida y vuelta paga dos veces."
      - id: b
        correct: true
        text:
          en: "Fees scale with the number of trades, not the size of the move."
          es: "Las comisiones escalan con el número de operaciones, no con el movimiento."
      - id: c
        correct: true
        text:
          en: "Funding scales with time held, because it is charged on a clock."
          es: "El funding escala con el tiempo mantenido, porque se cobra por reloj."
      - id: d
        correct: true
        text:
          en: "Funding only exists on perpetuals — spot and dated futures have none."
          es: "El funding solo existe en perpetuos: el spot y los futuros con fecha no tienen."
      - id: e
        text:
          en: "Funding is a fee the exchange keeps for providing you with leverage."
          es: "El funding es una comisión que el exchange se queda por darte apalancamiento."
    explanation:
      en: "One cost tracks how often you trade, the other how long you hold — and each style is punished by a different one. The swing trader's funding bill is a feature of the instrument, not of holding in general, and it moves between traders rather than into the exchange's pocket."
      es: "Un coste sigue la frecuencia con la que operas y el otro cuánto tiempo mantienes, y cada estilo es castigado por uno distinto. La factura de funding del swing es una característica del instrumento, no de mantener en general, y se mueve entre traders, no al bolsillo del exchange."
  - id: spread-on-top
    kind: true_false
    prompt:
      en: "The worked cost comparison understates the scalper's true drag, because the spread crossed on every fill sits on top of the explicit fee."
      es: "La comparación de costes del ejemplo subestima el lastre real del scalper, porque el spread que se cruza en cada ejecución se suma a la comisión explícita."
    answer: true
    explanation:
      en: "True on both counts: the spread is an extra cost per fill, and the example also idealised the scalper by assuming they reassembled one clean 300 USDT move from 15 pieces — a real scalper takes 15 separate bets instead."
      es: "Cierto por dos razones: el spread es un coste extra por ejecución, y el ejemplo además idealizó al scalper suponiendo que reconstruía un movimiento limpio de 300 USDT con 15 piezas; un scalper real toma 15 apuestas separadas."
