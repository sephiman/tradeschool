# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: risk-per-trade
    prompt:
      en: "You size every trade to risk 1% of a 10,000 USDT account. What does that 1% actually cap?"
      es: "Dimensionas cada operación para arriesgar el 1% de una cuenta de 10.000 USDT. ¿Qué limita en realidad ese 1%?"
    options:
      - id: a
        correct: true
        text:
          en: "The money you lose if the trade hits your stop — 100 USDT."
          es: "El dinero que pierdes si la operación toca tu stop: 100 USDT."
      - id: b
        text:
          en: "Your total allowed losses across the whole of the trading month."
          es: "El total de pérdidas que te permites en todo el mes de operativa."
      - id: c
        text:
          en: "The size of the position, so you may only buy 100 USDT worth of it."
          es: "El tamaño de la posición: solo puedes comprar 100 USDT en valor."
      - id: d
        text:
          en: "The fee that the exchange charges you in order to open the trade."
          es: "La comisión que el exchange te cobra por abrir la operación."
    explanation:
      en: "The 1% is your loss budget if the stop is hit, not the position's notional and not a monthly cap. With a stop in place the position can be worth many times 100 USDT — the stop distance is what decides how many units that budget buys."
      es: "El 1% es tu presupuesto de pérdida si salta el stop, no el nominal de la posición ni un límite mensual. Con un stop puesto, la posición puede valer muchas veces 100 USDT: la distancia del stop es lo que decide cuántas unidades compra ese presupuesto."
  - id: r-multiples-net
    prompt:
      en: "You risk a fixed 1R on every trade. Over ten trades you take six losses at your stop and four wins of +2R each. What is your net result in R?"
      es: "Arriesgas un 1R fijo en cada operación. En diez operaciones tienes seis pérdidas en tu stop y cuatro ganancias de +2R cada una. ¿Cuál es tu resultado neto en R?"
    options:
      - id: a
        text:
          en: "−2R — you lost more trades than you won, so you must be down overall."
          es: "−2R: perdiste más operaciones de las que ganaste, luego estás en negativo."
      - id: b
        text:
          en: "+8R — count only the four winners, since the losers cost nothing."
          es: "+8R: cuenta solo las cuatro ganadoras, ya que las perdedoras no cuestan."
      - id: c
        correct: true
        text:
          en: "+2R in total — six −1R losses against four +2R wins nets out to plus two."
          es: "+2R: seis pérdidas de −1R frente a cuatro ganancias de +2R."
      - id: d
        text:
          en: "0R — the wins and the losses cancel each other out exactly."
          es: "0R: las ganancias y las pérdidas se anulan exactamente."
    explanation:
      en: "R-multiples fold win rate and payoff into one figure: 6 × (−1R) + 4 × (+2R) = −6R + 8R = +2R. A losing majority is still profitable when the winners are bigger than the losers — exactly what thinking in R lets you see, and why counting wins alone or counting trades alone both mislead."
      es: "Los múltiplos R combinan win rate y payoff en una sola cifra: 6 × (−1R) + 4 × (+2R) = −6R + 8R = +2R. Una mayoría de operaciones perdedoras sigue siendo rentable cuando las ganadoras son mayores que las perdedoras: justo lo que pensar en R te deja ver, y por qué contar solo ganadoras o solo operaciones engaña igual."
  - id: sizing-steps
    kind: ordering
    prompt:
      en: "Put the position-sizing steps in the correct order, from first to last."
      es: "Ordena los pasos de dimensionado de la posición, del primero al último."
    items:
      - { id: budget, position: 1, text: { en: "Set the risk budget in money: equity × risk % (10,000 × 1% = 100 USDT).", es: "Fija el presupuesto de riesgo en dinero: capital × % de riesgo (10.000 × 1% = 100 USDT)." } }
      - { id: stop, position: 2, text: { en: "Place the stop where the idea is proven wrong and measure the entry-to-stop distance.", es: "Coloca el stop donde la idea queda invalidada y mide la distancia de la entrada al stop." } }
      - { id: size, position: 3, text: { en: "Divide the risk budget by the stop distance to get the position size.", es: "Divide el presupuesto de riesgo entre la distancia del stop para obtener el tamaño de la posición." } }
      - { id: open, position: 4, text: { en: "Open the position at exactly that size — even if it comes out disappointingly small.", es: "Abre la posición exactamente con ese tamaño, aunque salga decepcionantemente pequeño." } }
    explanation:
      en: "The stop defines the risk and the risk defines the size, never the reverse. You fix the money you are willing to lose, read the stop distance off the chart, and let the division hand you the size. Choosing a size first and discovering the risk afterwards is the beginner mistake this order prevents."
      es: "El stop define el riesgo y el riesgo define el tamaño, nunca al revés. Fijas el dinero que estás dispuesto a perder, lees la distancia del stop en el gráfico y dejas que la división te entregue el tamaño. Elegir primero un tamaño y descubrir el riesgo después es el error de principiante que este orden evita."
  - id: stop-sets-size
    prompt:
      en: "Two trades on the same account each risk 1%. Trade A's stop is 2% from entry; trade B's stop is 5% from entry. For the same 1% risk, which trade takes the larger position?"
      es: "Dos operaciones en la misma cuenta arriesgan cada una el 1%. El stop de la operación A está a un 2% de la entrada; el de la B, a un 5%. Para el mismo 1% de riesgo, ¿qué operación toma la posición más grande?"
    options:
      - id: a
        text:
          en: "Trade B — the wider stop gives it more room, so it deserves more size."
          es: "La B: el stop más ancho le da más margen y merece más tamaño."
      - id: b
        text:
          en: "They take the same size, since both of them risk exactly 1% of equity."
          es: "Toman el mismo tamaño, ya que ambas arriesgan justo el 1% del capital."
      - id: c
        correct: true
        text:
          en: "Trade A — the tighter stop loses less per unit, so it buys more units."
          es: "La A: el stop ajustado pierde menos por unidad y compra más unidades."
      - id: d
        text:
          en: "You cannot tell without first knowing each trade's reward target."
          es: "No se puede saber sin conocer antes el objetivo de cada operación."
    explanation:
      en: "Position size = risk budget ÷ stop distance. The tighter stop (2%) loses less per unit, so a fixed budget buys more units and a larger position; the wider stop (5%) forces a smaller one. Same risk, different size — decided entirely by the stop distance, and the reward target plays no part in it."
      es: "Tamaño de posición = presupuesto de riesgo ÷ distancia del stop. El stop más ajustado (2%) pierde menos por unidad, así que un presupuesto fijo compra más unidades y una posición mayor; el más ancho (5%) fuerza una más pequeña. Mismo riesgo, distinto tamaño: lo decide por completo la distancia del stop, y el objetivo de recompensa no interviene."
  - id: r-multiple-meanings
    kind: matching
    prompt:
      en: "Match each R-multiple term to what it means."
      es: "Empareja cada término de múltiplos R con lo que significa."
    pairs:
      - { id: unit, left: { en: "R", es: "R" }, right: { en: "The money you put at risk on a single trade", es: "El dinero que pones en riesgo en una sola operación" } }
      - { id: loss, left: { en: "−1R", es: "−1R" }, right: { en: "A loss at your stop", es: "Una pérdida en tu stop" } }
      - { id: win, left: { en: "+3R", es: "+3R" }, right: { en: "A win of three times the amount you risked", es: "Una ganancia de tres veces lo que arriesgaste" } }
      - { id: setup, left: { en: "A 3R setup", es: "Un setup de 3R" }, right: { en: "A trade whose target sits three stop-distances from entry", es: "Una operación cuyo objetivo está a tres distancias de stop de la entrada" } }
    explanation:
      en: "Once every trade risks the same amount, that amount — R — becomes the unit of measure. Results and targets are read as multiples of it, which lets you judge a system by its shape rather than by the dollar figure of any single trade."
      es: "Cuando cada operación arriesga la misma cantidad, esa cantidad —R— se convierte en la unidad de medida. Los resultados y los objetivos se leen como múltiplos de ella, lo que te deja juzgar un sistema por su forma en vez de por la cifra en dólares de una sola operación."
  - id: win-rate-myth
    kind: true_false
    prompt:
      en: "A system that wins only 40% of its trades is profitable if the winners average +2R and the losers −1R."
      es: "Un sistema que gana solo el 40% de sus operaciones es rentable si las ganadoras promedian +2R y las perdedoras −1R."
    answer: true
    explanation:
      en: "True: 0.4 × 2R − 0.6 × 1R = +0.2R per trade. Profit depends on payoff as much as win rate, which is why win rate alone tells you almost nothing without the R-multiples beside it."
      es: "Cierto: 0,4 × 2R − 0,6 × 1R = +0,2R por operación. La rentabilidad depende del payoff tanto como del win rate, y por eso el win rate por sí solo no dice casi nada sin los múltiplos R al lado."
  - id: frequency-dimension
    prompt:
      en: "Two traders both risk 1% per trade. One takes 3 trades a week, the other 15 a day. What does the frequency change?"
      es: "Dos traders arriesgan ambos el 1% por operación. Uno hace 3 operaciones a la semana, el otro 15 al día. ¿Qué cambia la frecuencia?"
    options:
      - id: a
        correct: true
        text:
          en: "How fast a normal losing streak arrives, and hits the account."
          es: "La velocidad a la que llega una racha perdedora normal y golpea la cuenta."
      - id: b
        text:
          en: "The sizing formula, which needs a frequency term for fast styles."
          es: "La fórmula de dimensionado, que necesita un término de frecuencia."
      - id: c
        text:
          en: "Nothing: 1% per trade is 1% per trade, so both carry identical risk."
          es: "Nada: un 1% por operación es un 1%, y ambos cargan el mismo riesgo."
      - id: d
        text:
          en: "The maximum loss per trade, which grows with the number of trades."
          es: "La pérdida máxima por operación, que crece con el número de operaciones."
    explanation:
      en: "The formula does not change and the per-trade loss is fixed; the honest choice of fraction is what moves. A normal eight-loss streak is roughly 8% of the account either way, but the fast trader meets it before dinner while the slow one meets it spread over a month. That is one honest reason faster styles sit at the low end — 0.5% rather than 1% — and cap the day as well as the trade."
      es: "La fórmula no cambia y la pérdida por operación es fija; lo que se mueve es la elección honesta de la fracción. Una racha normal de ocho pérdidas es en torno al 8% de la cuenta en los dos casos, pero el trader rápido se la encuentra antes de cenar y el lento repartida en un mes. Esa es una razón honesta para que los estilos rápidos se queden en la parte baja —0,5% en vez de 1%— y limiten el día además de la operación."
  - id: leverage-same-size
    prompt:
      en: "Same trade, same 1% risk, same entry and same stop distance, taken at 5× and then at 20×. What is different between the two versions?"
      es: "La misma operación, el mismo riesgo del 1%, la misma entrada y la misma distancia de stop, tomada a 5× y luego a 20×. ¿Qué es distinto entre las dos versiones?"
    options:
      - id: a
        text:
          en: "The 20× version holds four times the position and risks four times the money."
          es: "La de 20× lleva cuatro veces la posición y arriesga cuatro veces el dinero."
      - id: b
        correct: true
        text:
          en: "Only the collateral posted and how far liquidation sits from the stop."
          es: "Solo el colateral depositado y a qué distancia queda la liquidación del stop."
      - id: c
        text:
          en: "The 20× version needs a wider stop, since higher leverage moves faster."
          es: "La de 20× necesita un stop más ancho, ya que el apalancamiento va más rápido."
      - id: d
        text:
          en: "Nothing at all — the leverage setting has no effect on anything here."
          es: "Nada en absoluto: el ajuste de apalancamiento no afecta a nada aquí."
    explanation:
      en: "Size = risk budget ÷ stop distance, and neither input mentions leverage: 100 ÷ 2,000 = 0.05 BTC at 5× and at 20×, losing exactly 100 USDT at the stop either way. What the setting changes is the margin posted (600 vs 150 USDT on a 3,000 notional) and the liquidation price — 48,300 at 5×, 57,300 at 20× — that is, how much room is left behind your stop. The stop belongs where the idea is wrong, not where the leverage is comfortable."
      es: "Tamaño = presupuesto de riesgo ÷ distancia del stop, y ninguno de los dos datos menciona el apalancamiento: 100 ÷ 2.000 = 0,05 BTC a 5× y a 20×, perdiendo exactamente 100 USDT en el stop en ambos casos. Lo que cambia el ajuste es el margen depositado (600 frente a 150 USDT sobre un nocional de 3.000) y el precio de liquidación —48.300 a 5×, 57.300 a 20×—, es decir, cuánto espacio queda detrás de tu stop. El stop va donde la idea es errónea, no donde el apalancamiento va cómodo."
  - id: liquidation-inside-stop
    prompt:
      en: "Long from 60,000 with your stop at 58,000. You crank the leverage until the liquidation price computes to 58,300. What have you done?"
      es: "Largo desde 60.000 con tu stop en 58.000. Subes el apalancamiento hasta que el precio de liquidación sale en 58.300. ¿Qué has hecho?"
    options:
      - id: a
        text:
          en: "Nothing important — the stop at 58,000 still protects you first."
          es: "Nada importante: el stop en 58.000 sigue protegiéndote primero."
      - id: b
        text:
          en: "Reduced your risk, because the position is now closed sooner than before."
          es: "Reducir tu riesgo, porque la posición se cierra antes que antes."
      - id: c
        correct: true
        text:
          en: "Made liquidation the effective stop, 300 points before your own."
          es: "Convertir la liquidación en el stop efectivo, 300 puntos antes que el tuyo."
      - id: d
        text:
          en: "Increased your position size, which is why the liquidation price moved."
          es: "Aumentar el tamaño de posición, y por eso se movió la liquidación."
    explanation:
      en: "With liquidation at 58,300 and the stop at 58,000, price hits the exchange's forced close first: you lose the planned exit and the position cannot be re-opened at your intended price — that is more risk, not less. The size never changed; only the margin behind it did. That crossing point is the whole criterion for picking leverage, and a violent wick can fill you further out than your stop price, so leave real room rather than 300 points."
      es: "Con la liquidación en 58.300 y el stop en 58.000, el precio llega primero al cierre forzado del exchange: pierdes la salida planificada y la posición no se puede reabrir a tu precio previsto; eso es más riesgo, no menos. El tamaño no cambió, solo el margen que hay detrás. Ese punto de cruce es todo el criterio para elegir apalancamiento, y una mecha violenta puede ejecutarte más lejos que tu precio de stop, así que deja margen real y no 300 puntos."
  - id: leverage-risk-myth
    kind: true_false
    prompt:
      en: "Taking the same trade — same entry, same stop, same 1% risk — at 20× instead of 5× makes it four times riskier."
      es: "Tomar la misma operación —misma entrada, mismo stop, mismo riesgo del 1%— a 20× en vez de a 5× la hace cuatro veces más arriesgada."
    answer: false
    explanation:
      en: "The money at risk is set by the position size and the stop, and the size came from the stop, not the leverage: 100 USDT is lost at the stop in both versions. Leverage is a capital-efficiency setting (600 vs 150 USDT of margin). Its real danger is different in kind, not four times bigger: pushed far enough, the liquidation price creeps inside your stop distance and the exchange takes over your exit."
      es: "El dinero en riesgo lo fijan el tamaño de la posición y el stop, y el tamaño salió del stop, no del apalancamiento: se pierden 100 USDT en el stop en las dos versiones. El apalancamiento es un ajuste de eficiencia del capital (600 frente a 150 USDT de margen). Su peligro real es de otra naturaleza, no cuatro veces mayor: llevado lo bastante lejos, el precio de liquidación se mete dentro de tu distancia de stop y el exchange se queda con tu salida."
