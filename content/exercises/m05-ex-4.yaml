# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: isolated-loss
    prompt:
      en: "You open a single position using **isolated** margin and it gets liquidated. What do you lose?"
      es: "Abres una única posición usando margen **aislado** (isolated) y se liquida. ¿Qué pierdes?"
    options:
      - id: a
        correct: true
        text:
          en: "Exactly the margin you allocated to that position, and nothing more."
          es: "Exactamente el margen que asignaste a esa posición, y nada más."
      - id: b
        text:
          en: "Nothing — a position on isolated margin cannot be liquidated at all."
          es: "Nada: una posición con margen aislado no puede liquidarse en absoluto."
      - id: c
        text:
          en: "Your entire account balance, since all your funds back every position."
          es: "El saldo completo de tu cuenta, ya que todos tus fondos respaldan cada posición."
      - id: d
        text:
          en: "Only the exchange's trading fees; the allocated margin is returned."
          es: "Solo las comisiones del exchange; el margen asignado se devuelve."
    explanation:
      en: "Isolated margin ring-fences one position: a liquidation costs you exactly the allocated margin, and the rest of your account is untouched. Staking the whole balance is what *cross* margin does. And isolated positions absolutely can be liquidated — that is the point of the cap, and the margin is spent, not refunded."
      es: "El margen aislado acota una posición: una liquidación te cuesta exactamente el margen asignado, y el resto de tu cuenta queda intacto. Poner en juego todo el saldo es lo que hace el margen *cruzado*. Y las posiciones aisladas sí pueden liquidarse: ese es el sentido del límite, y el margen se gasta, no se devuelve."
  - id: leverage-amplifies
    prompt:
      en: "Which statement about using higher leverage is true?"
      es: "¿Qué afirmación sobre usar más apalancamiento es cierta?"
    options:
      - id: a
        correct: true
        text:
          en: "It scales gains and losses alike, and moves your liquidation closer."
          es: "Escala igual ganancias y pérdidas, y acerca tu liquidación."
      - id: b
        text:
          en: "It increases your expected profit, since each move is worth more."
          es: "Aumenta tu beneficio esperado, ya que cada movimiento vale más."
      - id: c
        text:
          en: "It reduces your risk of being liquidated, by freeing up margin."
          es: "Reduce tu riesgo de liquidación, al liberar margen."
      - id: d
        text:
          en: "It lowers the exchange's trading fees on the resulting notional."
          es: "Reduce las comisiones del exchange sobre el nocional resultante."
    explanation:
      en: "Leverage does not change whether the price moves your way, so it does not raise expected return — it scales both directions symmetrically. The freed-up margin is exactly the cushion you just gave up: a thinner cushion puts liquidation closer, so a smaller adverse move now closes you out. Fees are charged on notional and do not fall either."
      es: "El apalancamiento no cambia si el precio se mueve a tu favor, así que no aumenta el rendimiento esperado: escala las dos direcciones por igual. El margen que libera es justo el colchón que acabas de ceder: un colchón más fino acerca la liquidación, así que ahora un movimiento adverso menor te cierra. Las comisiones se cobran sobre el nocional y tampoco bajan."
  - id: cross-margin-def
    prompt:
      en: "What does trading a position on **cross** margin mean for your account?"
      es: "¿Qué significa operar una posición con margen **cruzado** (cross) para tu cuenta?"
    options:
      - id: a
        text:
          en: "Only the margin you allocate to that one position is ever at risk."
          es: "Solo el margen que asignas a esa única posición está en riesgo."
      - id: b
        correct: true
        text:
          en: "Your whole balance backs it, so one bad trade can drag it all down."
          es: "Todo tu saldo la respalda, así que una mala operación se lo lleva todo."
      - id: c
        text:
          en: "The exchange splits your balance evenly across all open positions."
          es: "El exchange reparte tu saldo a partes iguales entre las posiciones abiertas."
      - id: d
        text:
          en: "Cross margin removes the risk of being liquidated entirely."
          es: "El margen cruzado elimina por completo el riesgo de ser liquidado."
    explanation:
      en: "Cross margin uses your entire account balance as collateral: a winner can subsidise a loser, but a single bad move can pull the whole balance toward liquidation. Ring-fencing one position's margin is what isolated does; nothing is split evenly, and nothing here removes liquidation — cross just moves the line further out while raising the stake behind it."
      es: "El margen cruzado usa el saldo de toda tu cuenta como colateral: una posición ganadora puede subvencionar a una perdedora, pero un solo mal movimiento puede arrastrar todo el saldo hacia la liquidación. Acotar el margen de una posición es lo que hace el aislado; nada se reparte a partes iguales, y nada de esto elimina la liquidación: el cruzado solo aleja la línea mientras sube la apuesta que hay detrás."
  - id: isolated-not-immune
    kind: true_false
    prompt:
      en: "An isolated-margin position can still be liquidated; what isolation bounds is how much that liquidation costs you."
      es: "Una posición con margen aislado sí puede liquidarse; lo que el aislamiento acota es cuánto te cuesta esa liquidación."
    answer: true
    explanation:
      en: "True. Isolation is a cap on the loss, not immunity from the forced close: you lose exactly the margin you allocated, and the rest of the account is untouched."
      es: "Cierto. El aislamiento es un límite a la pérdida, no inmunidad frente al cierre forzoso: pierdes exactamente el margen que asignaste, y el resto de la cuenta queda intacto."
  - id: leverage-expected-profit
    kind: true_false
    prompt:
      en: "Using higher leverage increases the expected profit of a trade."
      es: "Usar más apalancamiento aumenta el beneficio esperado de una operación."
    answer: false
    explanation:
      en: "Leverage doesn't change whether — or how far — the price moves your way, so it doesn't raise expected return. It scales gains and losses symmetrically and pushes your liquidation closer; after fees and the risk of being liquidated by ordinary noise, high leverage usually makes expected outcomes worse."
      es: "El apalancamiento no cambia si —ni cuánto— se mueve el precio a tu favor, así que no aumenta el rendimiento esperado. Escala ganancias y pérdidas de forma simétrica y acerca tu liquidación; tras las comisiones y el riesgo de que te liquide el ruido normal, un apalancamiento alto suele empeorar los resultados esperados."
  - id: margin-mode-match
    kind: matching
    prompt:
      en: "Match each choice to what it does to your risk."
      es: "Empareja cada elección con lo que le hace a tu riesgo."
    pairs:
      - id: isolated
        left:
          en: "Isolated margin"
          es: "Margen aislado (isolated)"
        right:
          en: "Caps the loss from one position to the margin you allocated to it."
          es: "Limita la pérdida de una posición al margen que le asignaste."
      - id: cross
        left:
          en: "Cross margin"
          es: "Margen cruzado (cross)"
        right:
          en: "Puts your entire account balance on the line for the position."
          es: "Pone en juego el saldo de toda tu cuenta por la posición."
      - id: higher-lev
        left:
          en: "Higher leverage"
          es: "Más apalancamiento"
        right:
          en: "A thinner margin cushion, so your liquidation sits closer."
          es: "Un colchón de margen más fino, así que tu liquidación queda más cerca."
      - id: lower-lev
        left:
          en: "Lower leverage"
          es: "Menos apalancamiento"
        right:
          en: "A bigger cushion and more room before a forced close."
          es: "Un colchón mayor y más margen antes de un cierre forzoso."
    explanation:
      en: "Isolated bounds a single position's loss; cross stakes the whole balance. Leverage doesn't change those modes — it sets how thick your cushion is: more leverage, thinner cushion, closer liquidation."
      es: "El aislado acota la pérdida de una sola posición; el cruzado pone en juego todo el saldo. El apalancamiento no cambia esos modos: fija el grosor de tu colchón: más apalancamiento, colchón más fino, liquidación más cerca."
  - id: cushion-by-leverage
    kind: matching
    prompt:
      en: "Match each leverage setting to roughly how large an adverse price move it takes to reach your liquidation."
      es: "Empareja cada nivel de apalancamiento con la magnitud aproximada del movimiento adverso necesario para llegar a tu liquidación."
    pairs:
      - id: x10
        left: { en: "10×", es: "10×" }
        right: { en: "A cushion of roughly 10% of price.", es: "Un colchón de aproximadamente el 10% del precio." }
      - id: x20
        left: { en: "20×", es: "20×" }
        right: { en: "A cushion of roughly 5% of price — noise on most assets.", es: "Un colchón de aproximadamente el 5% del precio: ruido en la mayoría de activos." }
      - id: x50
        left: { en: "50×", es: "50×" }
        right: { en: "A cushion of barely 2% of price.", es: "Un colchón de apenas el 2% del precio." }
      - id: x100
        left: { en: "100×", es: "100×" }
        right:
          en: "A cushion of about 1% of price — an alt that swings 10% on an ordinary day breaches it in seconds."
          es: "Un colchón de en torno al 1% del precio: una alt que se mueve un 10% en un día normal lo rompe en segundos."
    explanation:
      en: "Higher leverage means a thinner cushion, so a smaller adverse move forces you out. The high tiers are available because they generate liquidations and fees, not because they help you."
      es: "Más apalancamiento significa un colchón más fino, así que un movimiento adverso menor te saca. Los niveles altos están disponibles porque generan liquidaciones y comisiones, no porque te ayuden."
  - id: cross-whole-account
    prompt:
      en: "A beginner with 3,000 USDT in the account opens on cross margin \"for the extra cushion\", thinking of it as a 500 USDT trade. One sharp move goes against them. What is actually at risk?"
      es: "Un principiante con 3.000 USDT en la cuenta abre en margen cruzado \"por el colchón extra\", pensando que es una operación de 500 USDT. Un movimiento brusco va en su contra. ¿Qué está realmente en riesgo?"
    options:
      - id: a
        text:
          en: "Only the 500 they mentally allocated to the idea."
          es: "Solo los 500 que asignaron mentalmente a la idea."
      - id: b
        text:
          en: "The 500 plus the maintenance margin the venue requires."
          es: "Los 500 más el margen de mantenimiento que exige el venue."
      - id: c
        text:
          en: "Nothing, because a cross-margin position cannot be liquidated."
          es: "Nada, porque una posición en margen cruzado no puede liquidarse."
      - id: d
        correct: true
        text:
          en: "The entire 3,000 — on cross, the whole account is collateral."
          es: "Los 3.000 completos: en cruzado, toda la cuenta es colateral."
    explanation:
      en: "The stake they had in mind and the money actually at risk were never the same number: the loss keeps eating past the 500, because on cross there is no boundary around a single position. Cross buys depth of cushion by putting the full balance on the line; isolated converts a blow-up into a bounded, known loss."
      es: "La apuesta que tenían en mente y el dinero realmente en riesgo nunca fueron el mismo número: la pérdida sigue comiéndose más allá de los 500, porque en cruzado no hay frontera alrededor de una sola posición. El cruzado compra colchón poniendo todo el saldo en juego; el aislado convierte un reventón en una pérdida acotada y conocida."
  - id: leverage-truths
    kind: multi_select
    prompt:
      en: "Select ALL statements about leverage that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre el apalancamiento."
    options:
      - id: a
        correct: true
        text:
          en: "It scales how much position you control per dollar of margin."
          es: "Escala cuánta posición controlas por cada dólar de margen."
      - id: b
        correct: true
        text:
          en: "It scales gains and losses symmetrically and identically."
          es: "Escala ganancias y pérdidas de forma simétrica e idéntica."
      - id: c
        correct: true
        text:
          en: "It shortens the distance to a forced close."
          es: "Acorta la distancia hasta un cierre forzoso."
      - id: d
        text:
          en: "It shrinks the price move the trade needs to work."
          es: "Reduce el movimiento de precio que la operación necesita."
      - id: e
        text:
          en: "It raises the expected return of a genuinely good trade."
          es: "Eleva el rendimiento esperado de una operación realmente buena."
    explanation:
      en: "A good trade is good and a bad trade is bad, at 2× or at 50× — the price still has to move the same direction, the same amount, before the idea works. Leverage is more risk per correct call, not more edge."
      es: "Una buena operación es buena y una mala es mala, a 2× o a 50×: el precio sigue teniendo que moverse en la misma dirección y la misma cantidad antes de que la idea funcione. El apalancamiento es más riesgo por acierto, no más ventaja."
  - id: liquidated-cant-recover
    prompt:
      en: "Why is being liquidated by ordinary noise worse than simply being down the same amount at lower leverage?"
      es: "¿Por qué ser liquidado por ruido normal es peor que simplemente estar perdiendo lo mismo con menos apalancamiento?"
    options:
      - id: a
        text:
          en: "Liquidation fees end up being larger than the underlying loss itself."
          es: "Las comisiones de liquidación acaban siendo mayores que la propia pérdida."
      - id: b
        correct: true
        text:
          en: "A closed position cannot recover when price comes back."
          es: "Una posición cerrada no puede recuperarse cuando el precio vuelve."
      - id: c
        text:
          en: "The exchange bars you from reopening that pair for a cooling period."
          es: "El exchange te veta reabrir ese par durante un periodo de enfriamiento."
      - id: d
        text:
          en: "Liquidations are reported to other venues, worsening your later fills."
          es: "Las liquidaciones se reportan a otros venues y empeoran tus ejecuciones."
    explanation:
      en: "This is the whole cost of thin cushions: the same 20× that doubles your upside on paper is why a 5% pullback — noise, on most assets — can end the trade at a loss you can never recover, before your thesis ever plays out. The loss is permanent not because of a penalty, but because the position no longer exists to benefit from the move back."
      es: "Ahí está todo el coste de los colchones finos: ese mismo 20× que duplica tu potencial en el papel es por lo que un retroceso del 5% (ruido en la mayoría de activos) puede terminar la operación con una pérdida irrecuperable, antes de que tu tesis se cumpla. La pérdida es permanente no por una penalización, sino porque la posición ya no existe para aprovechar la vuelta."
