# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: phase-events-order
    kind: ordering
    prompt:
      en: "Walk one accumulation range from start to finish. Put these plain-language events in the order they happen (phases A to E)."
      es: "Recorre un rango de acumulación de principio a fin. Ordena estos eventos, en lenguaje llano, según ocurren (fases A a E)."
    items:
      - id: stop
        position: 1
        text: { en: "The prior downtrend stops: a final flush, a sharp bounce, and a retest draw the range's support and resistance", es: "La tendencia bajista previa se detiene: una purga final, un rebote brusco y un retroceso dibujan el soporte y la resistencia del rango" }
      - id: churn
        position: 2
        text: { en: "A long, boring churn between support and resistance builds the cause", es: "Un ir y venir largo y aburrido entre soporte y resistencia construye la causa" }
      - id: spring
        position: 3
        text: { en: "A spring: price stabs below support, then snaps back inside, and a quieter test holds", es: "Un spring: el precio pincha por debajo del soporte, vuelve rápido hacia dentro y una prueba más tranquila aguanta" }
      - id: edge
        position: 4
        text: { en: "Price makes higher lows and presses toward the top of the range", es: "El precio hace mínimos crecientes y presiona hacia la parte alta del rango" }
      - id: markup
        position: 5
        text: { en: "Price breaks above resistance and holds: the markup leaves the range", es: "El precio rompe por encima de la resistencia y aguanta: el markup abandona el rango" }
    explanation:
      en: "This is phases A–E told as events. The trend stops and the box forms (A), the cause is built through long churn (B), the spring tests the floor near the end (C), demand starts winning as price walks toward the ceiling (D), and finally the markup leaves the range (E). Note the spring is a phase-C test near the end — not the beginning — and the markup only comes after the range is done."
      es: "Son las fases A–E contadas como eventos. La tendencia se detiene y se forma la caja (A), se construye la causa con un ir y venir largo (B), el spring pone a prueba el suelo cerca del final (C), la demanda empieza a ganar mientras el precio camina hacia el techo (D) y por fin el markup abandona el rango (E). Fíjate en que el spring es una prueba de la fase C cerca del final, no del principio, y el markup solo llega cuando el rango ha terminado."
  - id: event-meaning-match
    kind: matching
    prompt:
      en: "Match each range event to its correct reading."
      es: "Empareja cada evento del rango con su lectura correcta."
    pairs:
      - id: spring
        left: { en: "Spring", es: "Spring" }
        right: { en: "False break below support that recovers; sits in accumulation and hints at a markup", es: "Ruptura falsa por debajo del soporte que se recupera; vive en la acumulación e insinúa un markup" }
      - id: upthrust
        left: { en: "Upthrust", es: "Upthrust" }
        right: { en: "False break above resistance that fails back inside; a sign of distribution, warning of a markdown", es: "Ruptura falsa por encima de la resistencia que fracasa y vuelve hacia dentro; señal de distribución, que avisa de un markdown" }
      - id: utad
        left: { en: "UTAD (upthrust after distribution)", es: "UTAD (upthrust after distribution)" }
        right: { en: "The decisive phase-C upthrust that marks the top, distinct from smaller inconclusive pokes earlier in phase B", es: "El upthrust decisivo de la fase C que marca el techo, distinto de los asomos menores y no concluyentes de la fase B" }
    explanation:
      en: "The spring and the upthrust are mirror images across support and resistance: one fakes a break below the floor (accumulation, bullish), the other fakes a break above the ceiling (distribution, bearish). The UTAD is not a separate event but the *decisive* phase-C upthrust that marks a distribution top — it gets its own name to distinguish it from the smaller, inconclusive upthrusts that can appear earlier in phase B."
      es: "El spring y el upthrust son imágenes espejo a través del soporte y la resistencia: uno finge una ruptura por debajo del suelo (acumulación, alcista) y el otro finge una ruptura por encima del techo (distribución, bajista). El UTAD no es un evento aparte, sino el upthrust *decisivo* de la fase C que marca un techo de distribución; recibe nombre propio para distinguirlo de los upthrusts menores y no concluyentes que pueden aparecer antes, en la fase B."
  - id: phase-of-test
    prompt:
      en: "In which phase of the range does the spring (or upthrust) appear?"
      es: "¿En qué fase del rango aparece el spring (o el upthrust)?"
    options:
      - id: a
        text:
          en: "Phase A — it is what stops the prior trend and gets the range started."
          es: "Fase A: es lo que detiene la tendencia previa y pone en marcha el rango."
      - id: b
        correct: true
        text:
          en: "Phase C — the test, near the end, before the range resolves."
          es: "Fase C: la prueba, cerca del final, antes de que el rango se resuelva."
      - id: c
        text:
          en: "Phase E — it is the decisive break that finally leaves the range behind."
          es: "Fase E: es la ruptura decisiva que por fin abandona el rango."
      - id: d
        text:
          en: "Phase B — it is the whole long, choppy churn through the middle."
          es: "Fase B: es todo el ir y venir largo y errático de la parte central."
    explanation:
      en: "The spring and upthrust are phase-C tests: they come near the end of the range, after the long phase-B churn has built the cause, and before phase D and the final break. A common mistake is to place them at the start — phase A is what stops the prior trend — or to confuse the phase-E break that leaves the range with the phase-C false break that fails back inside."
      es: "El spring y el upthrust son pruebas de la fase C: llegan cerca del final del rango, después de que el ir y venir largo de la fase B haya construido la causa, y antes de la fase D y la ruptura final. Un error común es colocarlos al principio —la fase A es lo que detiene la tendencia previa— o confundir la ruptura de la fase E que abandona el rango con la ruptura falsa de la fase C que vuelve hacia dentro."
  - id: utad-definition
    prompt:
      en: "What is a UTAD?"
      es: "¿Qué es un UTAD?"
    options:
      - id: a
        text:
          en: "A false break below support that recovers, sitting in accumulation before a markup."
          es: "Una ruptura falsa bajo soporte que se recupera, en acumulación antes de un markup."
      - id: b
        text:
          en: "A confirmed breakout above resistance proving a fresh markup has begun."
          es: "Una ruptura confirmada sobre la resistencia que prueba que empezó un markup."
      - id: c
        correct: true
        text:
          en: "The decisive phase-C false break above resistance that tops a distribution."
          es: "La ruptura falsa decisiva de la fase C sobre la resistencia que corona una distribución."
      - id: d
        text:
          en: "The long, choppy middle of a distribution range, where the cause gets built."
          es: "El medio largo y errático de una distribución, donde se construye la causa."
    explanation:
      en: "UTAD stands for 'upthrust after distribution', and it precedes a markdown. The first option describes a spring, accumulation's mirror event; the second is exactly the misconception a UTAD exploits — it only looks like a breakout while large players sell into the trapped buyers; the last is phase B, not the phase-C test."
      es: "UTAD significa «upthrust after distribution», y precede a un markdown. La primera opción describe un spring, el evento espejo de la acumulación; la segunda es justo el error que un UTAD explota —solo parece una ruptura mientras los grandes participantes venden a los compradores atrapados—; la última es la fase B, no la prueba de la fase C."
  - id: distribution-mirror-tf
    kind: true_false
    prompt:
      en: "Distribution is accumulation upside down: an upthrust after an uptrend warns of a markdown, just as a spring after a downtrend hints at a markup."
      es: "La distribución es la acumulación del revés: un upthrust tras una tendencia alcista avisa de un markdown, igual que un spring tras una tendencia bajista insinúa un markup."
    answer: true
    explanation:
      en: "True. The two schematics are mirror images phase for phase. Accumulation forms after a downtrend, is tested by a spring below support, and resolves upward into a markup. Distribution forms after an uptrend, is tested by an upthrust above resistance, and resolves downward into a markdown. Same trap, opposite direction."
      es: "Verdadero. Los dos esquemas son imágenes espejo fase por fase. La acumulación se forma tras una tendencia bajista, se pone a prueba con un spring por debajo del soporte y se resuelve al alza en un markup. La distribución se forma tras una tendencia alcista, se pone a prueba con un upthrust por encima de la resistencia y se resuelve a la baja en un markdown. La misma trampa en dirección contraria."
  - id: spring-certainty-tf
    kind: true_false
    prompt:
      en: "The moment price stabs below range support, you can be certain it is a spring and that a markup is coming."
      es: "En el momento en que el precio pincha por debajo del soporte del rango, puedes estar seguro de que es un spring y de que viene un markup."
    answer: false
    explanation:
      en: "False, and this is where the schematic burns people. A stab below support that keeps falling was never a spring — it was just a real breakdown. You only earn the label 'spring' once price recovers and holds back inside. Live, the two look identical; the certainty is hindsight bias. Treat an unconfirmed break as a question, not an answer."
      es: "Falso, y aquí es donde el esquema hace daño. Un pinchazo por debajo del soporte que sigue cayendo nunca fue un spring: fue solo una ruptura bajista real. Solo te ganas la etiqueta de «spring» cuando el precio se recupera y aguanta hacia dentro. En directo, los dos casos son idénticos; esa certeza es sesgo de retrospectiva. Trata una ruptura sin confirmar como una pregunta, no como una respuesta."
  - id: phase-b-role
    prompt:
      en: "During phase B — the long, boring churn between support and resistance — what is actually happening?"
      es: "Durante la fase B —el ir y venir largo y aburrido entre soporte y resistencia—, ¿qué ocurre en realidad?"
    options:
      - id: a
        correct: true
        text:
          en: "Large players quietly build or unload over many sessions, building the cause."
          es: "Los grandes construyen o sueltan en silencio muchas sesiones: construyen la causa."
      - id: b
        text:
          en: "The spring has already fired, so the range is essentially finished by now."
          es: "El spring ya se ha disparado, así que el rango está prácticamente acabado."
      - id: c
        text:
          en: "Nothing meaningful — the market idles and wakes up only when it breaks out."
          es: "Nada relevante: el mercado se para y solo despierta cuando rompe."
      - id: d
        text:
          en: "Price is trending: phase B is the markup or the markdown itself."
          es: "El precio está en tendencia: la fase B es el markup o el markdown en sí."
    explanation:
      en: "Phase B is the heart of the accumulation or distribution: a big order worked patiently over many sessions of two-way churn, so it fills without spiking price, transferring supply a little at a time. The longer the churn, the bigger the cause it builds. Calling the range 'nothing' is the beginner's read; the spring comes later, in phase C; and the trend is phase E, not B."
      es: "La fase B es el corazón de la acumulación o la distribución: una orden grande trabajada con paciencia a lo largo de muchas sesiones de ir y venir, para que se llene sin disparar el precio, traspasando oferta poco a poco. Cuanto más largo el ir y venir, mayor la causa que construye. Llamar «nada» al rango es la lectura de principiante; el spring llega después, en la fase C; y la tendencia es la fase E, no la B."
  - id: phase-b-churn
    prompt:
      en: "In the example range, price spends six weeks oscillating between roughly 41,000 and 46,000 on unremarkable activity. Why is this the phase where the real work happens?"
      es: "En el rango de ejemplo, el precio pasa seis semanas oscilando entre unos 41.000 y 46.000 con actividad poco llamativa. ¿Por qué es esta la fase en la que ocurre el trabajo real?"
    options:
      - id: a
        text:
          en: "Nothing happens in phase B; it is the pause before phase C does the real work."
          es: "En la fase B no ocurre nada; es la pausa antes de que la fase C haga el trabajo."
      - id: b
        text:
          en: "It is where the stop-losses get triggered, and that is what builds the cause."
          es: "Es donde se disparan los stop-loss, y eso es lo que construye la causa."
      - id: c
        text:
          en: "Volume peaks here, which is the reason the move that follows is a large one."
          es: "El volumen es máximo aquí, y por eso el movimiento posterior es grande."
      - id: d
        correct: true
        text:
          en: "A large buyer must work the size patiently, buying the dips over many cycles."
          es: "Un gran comprador debe trabajar el tamaño con paciencia, comprando las caídas."
    explanation:
      en: "Lifting 41,000 to 47,000 in one go would spike price against the buyer, so they buy patiently on the dips and every cycle transfers a little more supply from tired sellers to patient buyers. Wyckoff calls this building the cause: the more churn, the bigger the eventual move it can pay for. Six weeks in a 41,000–46,000 band is not 'nothing happening' — it is the accumulation itself, and the stops fire later, in phase C."
      es: "Llevar 41.000 a 47.000 de una vez dispararía el precio en contra del comprador, así que compra con paciencia en las caídas y cada ciclo transfiere un poco más de oferta de vendedores cansados a compradores pacientes. Wyckoff llama a esto construir la causa: cuanto más movimiento lateral, mayor el movimiento que puede pagar después. Seis semanas en una banda de 41.000-46.000 no es «que no pase nada»: es la acumulación misma, y los stops saltan más tarde, en la fase C."
  - id: phase-d-vs-b
    prompt:
      en: "What visibly distinguishes phase D from phase B in the same range?"
      es: "¿Qué distingue visiblemente la fase D de la fase B en el mismo rango?"
    options:
      - id: a
        text:
          en: "Phase D is always shorter in duration than phase B turns out to be."
          es: "La fase D siempre dura menos de lo que acaba durando la fase B."
      - id: b
        correct: true
        text:
          en: "The slope: phase B churns flat, phase D walks uphill on higher lows."
          es: "La pendiente: la B se mueve plana, la D sube con mínimos crecientes."
      - id: c
        text:
          en: "Phase D happens below the support line, while phase B happens above it."
          es: "La fase D ocurre bajo la línea de soporte y la fase B por encima."
      - id: d
        text:
          en: "Only phase D contains a spring; phase B never has one in it."
          es: "Solo la fase D contiene un spring; la fase B nunca tiene uno."
    explanation:
      en: "Higher lows at 44,000 then 45,500, pressing repeatedly against a flat ceiling, are the fingerprint of the shift in control: once supply is gone, buyers no longer need to be patient, so demand overwhelms what little selling appears and each pullback is shallower than the last. Both phases sit inside the same range, neither has a fixed length, and the spring belongs to phase C."
      es: "Mínimos crecientes en 44.000 y luego 45.500, presionando una y otra vez contra un techo plano, son la huella del cambio de control: agotada la oferta, los compradores ya no necesitan paciencia, así que la demanda supera la poca venta que aparece y cada retroceso es más superficial que el anterior. Ambas fases viven dentro del mismo rango, ninguna tiene duración fija, y el spring pertenece a la fase C."
  - id: depth-vs-recovery
    kind: multi_select
    prompt:
      en: "Phase C in a thin crypto book is easy to fake. Select ALL statements that follow from that."
      es: "La fase C en un libro cripto poco profundo es fácil de falsear. Selecciona TODAS las afirmaciones que se derivan de eso."
    options:
      - id: a
        correct: true
        text:
          en: "The recovery matters more than the depth of the stab below."
          es: "La recuperación importa más que la profundidad del pinchazo."
      - id: b
        correct: true
        text:
          en: "Demand a clean snap-back inside before you trust the spring."
          es: "Exige un regreso limpio al interior antes de fiarte del spring."
      - id: c
        correct: true
        text:
          en: "A 'spring' printed at 3 a.m. on a Sunday deserves more suspicion."
          es: "Un 'spring' impreso a las 3 de la madrugada de un domingo da más sospecha."
      - id: d
        text:
          en: "A deeper stab below support is stronger proof of accumulation."
          es: "Un pinchazo más profundo bajo el soporte prueba mejor la acumulación."
      - id: e
        text:
          en: "You can label the break a spring the moment that it happens."
          es: "Puedes etiquetar la ruptura como spring en el momento en que ocurre."
    explanation:
      en: "A deep wick on a thin book is cheap to produce, so depth proves nothing on its own — which is exactly why a deeper stab is weaker evidence, not stronger. A stab below support that keeps falling was never a spring; it was a breakdown. You only earn the label once price recovers and holds, and live the two look identical."
      es: "Una mecha profunda en un libro fino es barata de producir, así que la profundidad no prueba nada por sí sola, y por eso un pinchazo más profundo es un indicio más débil, no más fuerte. Un pinchazo bajo el soporte que sigue cayendo nunca fue un spring: fue una ruptura. Solo te ganas la etiqueta cuando el precio recupera y se sostiene, y en vivo ambos se ven idénticos."
