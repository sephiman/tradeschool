# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: body-meaning
    prompt:
      en: "On a candlestick, what does the body represent?"
      es: "En una vela, ¿qué representa el cuerpo?"
    options:
      - id: a
        text:
          en: "The full range between the high and the low of the period."
          es: "El rango completo entre el máximo y el mínimo del periodo."
      - id: b
        correct: true
        text:
          en: "The range between the price it opened at and the price it closed at."
          es: "El rango entre el precio al que abrió y el precio al que cerró."
      - id: c
        text:
          en: "The total volume that traded during the period."
          es: "El volumen total que se operó durante el periodo."
      - id: d
        text:
          en: "The distance from the previous candle's close."
          es: "La distancia respecto al cierre de la vela anterior."
    explanation:
      en: "The body spans open to close. The high-to-low span is the whole candle including its wicks, not the body — mixing the two up is the classic beginner error. Volume is a separate series entirely, and a candle is measured against itself, not the one before it."
      es: "El cuerpo va de la apertura al cierre. El recorrido de máximo a mínimo es la vela entera con sus mechas, no el cuerpo: confundir ambos es el error clásico de principiante. El volumen es una serie aparte, y una vela se mide contra sí misma, no contra la anterior."
  - id: wick-story
    prompt:
      en: "A candle opens at 95, falls to a low of 90, then recovers to close at 99, with a high of 101. Which statement is correct?"
      es: "Una vela abre en 95, cae a un mínimo de 90 y luego se recupera hasta cerrar en 99, con un máximo de 101. ¿Qué afirmación es correcta?"
    options:
      - id: a
        text:
          en: "Bearish, because the price dropped all the way down to 90 during the period."
          es: "Bajista, porque el precio cayó hasta 90 durante el periodo."
      - id: b
        text:
          en: "Its body runs from 90 to 101, the full span it covered."
          es: "Su cuerpo va de 90 a 101, todo el recorrido que cubrió."
      - id: c
        text:
          en: "Its colour depends on whether it closed above the previous candle."
          es: "Su color depende de si cerró por encima de la vela anterior."
      - id: d
        correct: true
        text:
          en: "Bullish, with a lower wick: sellers reached 90 and buyers closed it at 99."
          es: "Alcista, con mecha inferior: los vendedores llegaron a 90 y los compradores cerraron en 99."
    explanation:
      en: "Colour is close versus open on the same candle: 99 closed above the 95 open, so it is bullish. The dip to 90 is the lower wick — price that was reached and then rejected — and the body runs 95 to 99, not 90 to 101."
      es: "El color es cierre frente a apertura de la misma vela: 99 cerró por encima de la apertura en 95, así que es alcista. La caída a 90 es la mecha inferior —precio alcanzado y luego rechazado— y el cuerpo va de 95 a 99, no de 90 a 101."
  - id: candle-parts
    kind: matching
    prompt:
      en: "Match each part of a candlestick to what it represents."
      es: "Empareja cada parte de una vela con lo que representa."
    pairs:
      - id: body
        left: { en: "Body", es: "Cuerpo" }
        right:
          en: "The range from the open to the close."
          es: "El rango de la apertura al cierre."
      - id: upper-wick
        left: { en: "Upper wick", es: "Mecha superior" }
        right:
          en: "Price pushed up to the high, then rejected back down before the close."
          es: "Precio empujado hasta el máximo y luego rechazado hacia abajo antes del cierre."
      - id: lower-wick
        left: { en: "Lower wick", es: "Mecha inferior" }
        right:
          en: "Price pushed down to the low, then rejected back up before the close."
          es: "Precio empujado hasta el mínimo y luego rechazado hacia arriba antes del cierre."
      - id: close
        left: { en: "Close", es: "Cierre" }
        right:
          en: "The price both sides were willing to leave on the table when the period ended."
          es: "El precio que ambos lados estuvieron dispuestos a dejar sobre la mesa cuando terminó el periodo."
    explanation:
      en: "The body is open-to-close; the wicks are the rejected extremes reaching up to the high and down to the low; the close is the period's final, most-weighted price."
      es: "El cuerpo va de apertura a cierre; las mechas son los extremos rechazados que llegan hasta el máximo y hasta el mínimo; el cierre es el precio final del periodo, al que se da más peso."
  - id: candle-tells
    kind: multi_select
    prompt:
      en: "Select ALL of the things a single candle tells you directly."
      es: "Selecciona TODO lo que una sola vela te dice directamente."
    options:
      - id: a
        correct: true
        text:
          en: "The price the period opened at and the price it closed at."
          es: "El precio al que abrió el periodo y aquel al que cerró."
      - id: b
        correct: true
        text:
          en: "The highest and lowest prices reached during the period."
          es: "Los precios máximo y mínimo alcanzados durante el periodo."
      - id: c
        text:
          en: "How many units changed hands while the candle formed."
          es: "Cuántas unidades cambiaron de manos mientras se formaba."
      - id: d
        text:
          en: "Where price is headed in the period that follows."
          es: "Hacia dónde va el precio en el periodo siguiente."
    explanation:
      en: "A candle carries only its four OHLC prices for its window. How many units changed hands is volume — a separate series drawn under the price, not read off the bar — and nothing on a single candle forecasts the next one."
      es: "Una vela solo lleva sus cuatro precios OHLC de su ventana. Cuántas unidades cambiaron de manos es el volumen —una serie aparte que se dibuja bajo el precio, no algo que se lea en la barra— y nada en una sola vela predice la siguiente."
  - id: colour-myth
    kind: true_false
    prompt:
      en: "A candle's colour compares its own close with its own open, not with the previous candle's close."
      es: "El color de una vela compara su propio cierre con su propia apertura, no con el cierre de la vela anterior."
    answer: true
    explanation:
      en: "True, and it is why a green candle can still close below the previous candle's close. Colour is a one-bar fact; read the actual levels rather than the colour alone."
      es: "Cierto, y por eso una vela verde puede cerrar aun así por debajo del cierre de la vela previa. El color es un hecho de una sola vela: lee los niveles reales, no solo el color."
  - id: close-weight
    prompt:
      en: "Why do most traders weight the close more heavily than the open, high or low?"
      es: "¿Por qué la mayoría de los traders da más peso al cierre que a la apertura, el máximo o el mínimo?"
    options:
      - id: a
        correct: true
        text:
          en: "It is where both sides settled when the period ended."
          es: "Es donde ambos lados quedaron cuando el periodo terminó."
      - id: b
        text:
          en: "It is always the highest price reached during the period."
          es: "Siempre es el precio más alto alcanzado durante el periodo."
      - id: c
        text:
          en: "It predicts where the next candle will open and close."
          es: "Predice dónde abrirá y cerrará la próxima vela."
      - id: d
        text:
          en: "It is the average of the period's high and its low."
          es: "Es la media del máximo y el mínimo del periodo."
    explanation:
      en: "The close is the price both sides were willing to leave on the table at the end of the period, which is why it is weighted most. It is not the high, not the mid-point of the range, and it forecasts nothing about the bar that follows."
      es: "El cierre es el precio que ambos lados estuvieron dispuestos a dejar sobre la mesa al final del periodo, y por eso se le da más peso. No es el máximo, ni el punto medio del rango, y no predice nada de la vela siguiente."
  - id: two-candles-story
    prompt:
      en: "Candle A opens at 100, runs up to 108, falls to 96 and closes at 101. Candle B opens at 108 and closes at 101 with no lower wick. Both end near 101 — what is the difference?"
      es: "La vela A abre en 100, sube a 108, cae a 96 y cierra en 101. La vela B abre en 108 y cierra en 101 sin mecha inferior. Ambas terminan cerca de 101: ¿cuál es la diferencia?"
    options:
      - id: a
        correct: true
        text:
          en: "Opposite stories: A was bought back from 96, B was not."
          es: "Historias opuestas: A fue recomprada desde 96, B no."
      - id: b
        text:
          en: "A is more bearish, because it reached the lower price of the two."
          es: "A es más bajista, porque alcanzó el precio más bajo de las dos."
      - id: c
        text:
          en: "None that matters — both closed at 101, so both say the same thing."
          es: "Ninguna que importe: ambas cerraron en 101, así que dicen lo mismo."
      - id: d
        text:
          en: "B is more bullish, because its body is the larger of the two."
          es: "B es más alcista, porque su cuerpo es el mayor de las dos."
    explanation:
      en: "Reading only the close, or only the colour, would flatten these two into 'the same thing'. The long lower wick on A is buyers stepping in at 96 and lifting price all the way back; B's full body is steady selling with nobody defending the lows. Reaching a lower price is not itself bearish when the price was rejected, and a bigger body is not bullish when it points down."
      es: "Leer solo el cierre, o solo el color, aplanaría estas dos en 'lo mismo'. La mecha inferior larga de A son compradores entrando en 96 y devolviendo el precio del todo; el cuerpo entero de B es venta sostenida sin nadie defendiendo los mínimos. Alcanzar un precio más bajo no es bajista si ese precio fue rechazado, y un cuerpo mayor no es alcista si apunta hacia abajo."
  - id: wick-against-you
    kind: true_false
    prompt:
      en: "A long wick that runs against your position is bad news, because price reached that level."
      es: "Una mecha larga que va en contra de tu posición es mala señal, porque el precio alcanzó ese nivel."
    answer: false
    explanation:
      en: "A wick is *rejected* price — it went there and got pushed back before the period ended. Against your position that is often good news. The body and close are the signal; the wick is the failed attempt."
      es: "Una mecha es precio *rechazado*: fue allí y lo empujaron de vuelta antes de cerrar el periodo. En contra de tu posición suele ser buena señal. El cuerpo y el cierre son la señal; la mecha es el intento fallido."
  - id: volume-breakouts
    prompt:
      en: "Two breakouts to a new high look identical on the chart. The first prints on three times the recent average volume, the second on half of it. What does that tell you?"
      es: "Dos rupturas a un nuevo máximo se ven idénticas en el gráfico. La primera imprime tres veces el volumen medio reciente; la segunda, la mitad. ¿Qué te dice eso?"
    options:
      - id: a
        text:
          en: "Nothing — the candles are identical, so the breakouts are equivalent."
          es: "Nada: las velas son idénticas, así que las rupturas son equivalentes."
      - id: b
        correct: true
        text:
          en: "The first has capital committed behind it; the second is a few trades in a quiet hour."
          es: "La primera tiene capital comprometido detrás; la segunda son unas pocas operaciones en una hora tranquila."
      - id: c
        text:
          en: "The second is more bullish, since it took less volume to lift price."
          es: "La segunda es más alcista, porque hizo falta menos volumen para subir."
      - id: d
        text:
          en: "High volume means the breakout is guaranteed to continue upward."
          es: "Un volumen alto significa que la ruptura seguirá subiendo con seguridad."
    explanation:
      en: "'Price broke to a new high' and 'price broke to a new high on the strongest volume in weeks' are completely different statements. A move with many participants behind it is harder to unwind; a thin one is easy to reverse, and taking less volume to move price is a sign of an empty book, not of strength. Volume is context, never a signal by itself and never a guarantee."
      es: "'El precio rompió a un nuevo máximo' y 'el precio rompió a un nuevo máximo con el mayor volumen en semanas' son afirmaciones completamente distintas. Un movimiento con mucha gente detrás cuesta más deshacerlo; uno fino se revierte fácil, y que haga falta menos volumen para mover el precio es señal de libro vacío, no de fuerza. El volumen es contexto, nunca una señal por sí mismo ni una garantía."
  - id: volume-facts
    kind: multi_select
    prompt:
      en: "Select ALL statements about volume that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre el volumen."
    options:
      - id: a
        correct: true
        text:
          en: "It measures participation — how much changed hands in the candle."
          es: "Mide la participación: cuánto cambió de manos en la vela."
      - id: b
        correct: true
        text:
          en: "A high-volume move is harder to unwind, since many now hold there."
          es: "Un movimiento con volumen alto cuesta más deshacerlo: muchos tienen posición ahí."
      - id: c
        correct: true
        text:
          en: "A thin-volume move is easier to reverse: little conviction behind it."
          es: "Un movimiento con volumen fino se revierte fácil: hay poca convicción."
      - id: d
        text:
          en: "On its own it tells you the direction the move is about to take."
          es: "Por sí solo te dice la dirección que va a tomar el movimiento."
      - id: e
        text:
          en: "It is a complete trading signal, needing no price context at all."
          es: "Es una señal de trading completa, sin necesidad de contexto de precio."
    explanation:
      en: "Price tells you where trades happened; volume tells you how many people agreed. It is context for a move — it has no direction of its own, and it is never a signal without the price action it sits under."
      es: "El precio te dice dónde ocurrieron las operaciones; el volumen, cuánta gente estuvo de acuerdo. Es contexto para un movimiento: no tiene dirección propia y nunca es una señal sin la acción del precio sobre la que se apoya."
