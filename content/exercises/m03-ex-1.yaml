# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: body-meaning
    prompt:
      en: "On a candlestick, what does the body represent?"
      es: "En una vela, ¿qué representa el cuerpo?"
    options:
      - id: a
        correct: true
        text:
          en: "The range between the open and the close."
          es: "El rango entre la apertura y el cierre."
      - id: b
        text:
          en: "The full range between the high and the low."
          es: "El rango completo entre el máximo y el mínimo."
      - id: c
        text:
          en: "The total volume traded during the period."
          es: "El volumen total operado durante el periodo."
      - id: d
        text:
          en: "The distance from the previous candle's close."
          es: "La distancia respecto al cierre de la vela anterior."
    explanation:
      en: "The body spans open to close. The high-to-low span is the whole candle including its wicks, not the body — mixing the two up is the classic beginner error."
      es: "El cuerpo va de la apertura al cierre. El recorrido de máximo a mínimo es la vela entera con sus mechas, no el cuerpo: confundir ambos es el error clásico de principiante."
  - id: wick-story
    prompt:
      en: "A candle opens at 95, falls to a low of 90, then recovers to close at 99, with a high of 101. Which statement is correct?"
      es: "Una vela abre en 95, cae a un mínimo de 90 y luego se recupera hasta cerrar en 99, con un máximo de 101. ¿Qué afirmación es correcta?"
    options:
      - id: a
        correct: true
        text:
          en: "It is bullish (close above open) with a lower wick — sellers pushed it to 90 but buyers closed it higher."
          es: "Es alcista (cierre por encima de la apertura) con una mecha inferior: los vendedores la llevaron a 90 pero los compradores la cerraron más arriba."
      - id: b
        text:
          en: "It is bearish, because price dropped to 90 during the period."
          es: "Es bajista, porque el precio cayó a 90 durante el periodo."
      - id: c
        text:
          en: "Its body runs from 90 to 101."
          es: "Su cuerpo va de 90 a 101."
      - id: d
        text:
          en: "Its colour depends only on whether it closed above the previous candle."
          es: "Su color depende solo de si cerró por encima de la vela anterior."
    explanation:
      en: "Colour is close versus open: 99 closed above the 95 open, so it is bullish. The dip to 90 is the lower wick — price that was rejected — and the body runs 95 to 99, not 90 to 101."
      es: "El color es cierre frente a apertura: 99 cerró por encima de la apertura en 95, así que es alcista. La caída a 90 es la mecha inferior —precio rechazado— y el cuerpo va de 95 a 99, no de 90 a 101."
  - id: candle-parts
    kind: matching
    prompt:
      en: "Match each part of a candlestick to what it represents."
      es: "Empareja cada parte de una vela con lo que representa."
    pairs:
      - id: body
        left: { en: "Body", es: "Cuerpo" }
        right:
          en: "The range from the open to the close."
          es: "El rango de la apertura al cierre."
      - id: upper-wick
        left: { en: "Upper wick", es: "Mecha superior" }
        right:
          en: "Price pushed up to the high, then rejected back down before the close."
          es: "Precio empujado hasta el máximo y luego rechazado hacia abajo antes del cierre."
      - id: lower-wick
        left: { en: "Lower wick", es: "Mecha inferior" }
        right:
          en: "Price pushed down to the low, then rejected back up before the close."
          es: "Precio empujado hasta el mínimo y luego rechazado hacia arriba antes del cierre."
      - id: close
        left: { en: "Close", es: "Cierre" }
        right:
          en: "The price both sides were willing to leave on the table when the period ended."
          es: "El precio que ambos lados estuvieron dispuestos a dejar sobre la mesa cuando terminó el periodo."
    explanation:
      en: "The body is open-to-close; the wicks are the rejected extremes reaching up to the high and down to the low; the close is the period's final, most-weighted price."
      es: "El cuerpo va de apertura a cierre; las mechas son los extremos rechazados que llegan hasta el máximo y hasta el mínimo; el cierre es el precio final del periodo, al que se da más peso."
  - id: candle-tells
    kind: multi_select
    prompt:
      en: "Select ALL of the things a single candle tells you directly."
      es: "Selecciona TODO lo que una sola vela te dice directamente."
    options:
      - id: a
        correct: true
        text:
          en: "The price at which the period opened and the price at which it closed."
          es: "El precio al que el periodo abrió y el precio al que cerró."
      - id: b
        correct: true
        text:
          en: "The highest and lowest prices reached during the period."
          es: "Los precios máximo y mínimo alcanzados durante el periodo."
      - id: c
        text:
          en: "How many units changed hands during the period."
          es: "Cuántas unidades cambiaron de manos durante el periodo."
      - id: d
        text:
          en: "Where price will move in the next period."
          es: "Hacia dónde se moverá el precio en el próximo periodo."
    explanation:
      en: "A candle carries only its four OHLC prices for its window. How many units changed hands is volume — a separate series — and nothing on a single candle forecasts the next one."
      es: "Una vela solo lleva sus cuatro precios OHLC de su ventana. Cuántas unidades cambiaron de manos es el volumen —una serie aparte— y nada en una sola vela predice la siguiente."
  - id: colour-myth
    kind: true_false
    prompt:
      en: "A candle's colour tells you whether it closed above the previous candle's close."
      es: "El color de una vela te dice si cerró por encima del cierre de la vela anterior."
    answer: false
    explanation:
      en: "Colour is close-versus-open on the same candle, not versus the previous candle. A green candle can still close below the previous candle's close — read the actual levels, not the colour alone."
      es: "El color es cierre frente a apertura de la misma vela, no frente a la vela anterior. Una vela verde puede cerrar aun así por debajo del cierre de la vela previa: lee los niveles reales, no solo el color."
  - id: close-weight
    prompt:
      en: "Why do most traders weight the close more heavily than the open, high or low?"
      es: "¿Por qué la mayoría de los traders da más peso al cierre que a la apertura, el máximo o el mínimo?"
    options:
      - id: a
        correct: true
        text:
          en: "It is the price both sides were willing to leave on the table when the period ended."
          es: "Es el precio que ambos lados estuvieron dispuestos a dejar sobre la mesa cuando el periodo terminó."
      - id: b
        text:
          en: "It is always the highest price reached during the period."
          es: "Siempre es el precio más alto alcanzado durante el periodo."
      - id: c
        text:
          en: "It predicts the open of the next candle."
          es: "Predice la apertura de la próxima vela."
      - id: d
        text:
          en: "It is the average of the high and the low."
          es: "Es la media del máximo y el mínimo."
    explanation:
      en: "The close is the price both sides settled on at the end of the period, which is why it is weighted most. It is not the high, not the mid-point, and it forecasts nothing."
      es: "El cierre es el precio en el que ambos lados quedaron al final del periodo, y por eso se le da más peso. No es el máximo, ni el punto medio, y no predice nada."
  - id: two-candles-story
    prompt:
      en: "Candle A opens at 100, runs up to 108, falls to 96 and closes at 101. Candle B opens at 108 and closes at 101 with no lower wick. Both end near 101 — what is the difference?"
      es: "La vela A abre en 100, sube a 108, cae a 96 y cierra en 101. La vela B abre en 108 y cierra en 101 sin mecha inferior. Ambas terminan cerca de 101: ¿cuál es la diferencia?"
    options:
      - id: a
        correct: true
        text:
          en: "Opposite stories: A shows price dumped to 96 and bought all the way back, B shows steady selling with nobody defending the lows."
          es: "Historias opuestas: A muestra un precio tirado hasta 96 y recomprado del todo, B muestra venta sostenida sin nadie defendiendo los mínimos."
      - id: b
        text:
          en: "None that matters — both closed at 101, so both say the same thing."
          es: "Ninguna que importe: ambas cerraron en 101, así que dicen lo mismo."
      - id: c
        text:
          en: "A is more bearish, because it reached the lower price of the two."
          es: "A es más bajista, porque alcanzó el precio más bajo de las dos."
      - id: d
        text:
          en: "B is more bullish, because its body is larger."
          es: "B es más alcista, porque su cuerpo es más grande."
    explanation:
      en: "Reading only the close, or only the colour, would flatten these two into 'the same thing'. The long lower wick on A is buyers stepping in at 96; B's full body is selling with no defence."
      es: "Leer solo el cierre, o solo el color, aplanaría estas dos en 'lo mismo'. La mecha inferior larga de A son compradores entrando en 96; el cuerpo entero de B es venta sin defensa."
  - id: wick-against-you
    kind: true_false
    prompt:
      en: "A long wick that runs against your position is bad news, because price reached that level."
      es: "Una mecha larga que va en contra de tu posición es mala señal, porque el precio alcanzó ese nivel."
    answer: false
    explanation:
      en: "A wick is *rejected* price — it went there and got pushed back before the period ended. Against your position that is often good news. The body and close are the signal; the wick is the failed attempt."
      es: "Una mecha es precio *rechazado*: fue allí y lo empujaron de vuelta antes de cerrar el periodo. En contra de tu posición suele ser buena señal. El cuerpo y el cierre son la señal; la mecha es el intento fallido."
  - id: volume-breakouts
    prompt:
      en: "Two breakouts to a new high look identical on the chart. The first prints on three times the recent average volume, the second on half of it. What does that tell you?"
      es: "Dos rupturas a un nuevo máximo se ven idénticas en el gráfico. La primera imprime tres veces el volumen medio reciente; la segunda, la mitad. ¿Qué te dice eso?"
    options:
      - id: a
        correct: true
        text:
          en: "The first has capital committed behind it and is harder to unwind; the second is a handful of trades in a quiet hour and is far easier to reverse."
          es: "La primera tiene capital comprometido detrás y es más difícil de deshacer; la segunda son unas pocas operaciones en una hora tranquila y es mucho más fácil de revertir."
      - id: b
        text:
          en: "Nothing — the candles are identical, so the breakouts are equivalent."
          es: "Nada: las velas son idénticas, así que las rupturas son equivalentes."
      - id: c
        text:
          en: "The second is more bullish, since it took less volume to push price up."
          es: "La segunda es más alcista, ya que hizo falta menos volumen para empujar el precio."
      - id: d
        text: { en: "High volume means the breakout is guaranteed to continue.", es: "Un volumen alto significa que la ruptura seguirá con seguridad." }
    explanation:
      en: "'Price broke to a new high' and 'price broke to a new high on the strongest volume in weeks' are completely different statements. Volume is context, not a signal by itself — and never a guarantee."
      es: "'El precio rompió a un nuevo máximo' y 'el precio rompió a un nuevo máximo con el mayor volumen en semanas' son afirmaciones completamente distintas. El volumen es contexto, no una señal por sí mismo, y nunca una garantía."
  - id: volume-facts
    kind: multi_select
    prompt:
      en: "Select ALL statements about volume that are TRUE."
      es: "Selecciona TODAS las afirmaciones ciertas sobre el volumen."
    options:
      - id: a
        correct: true
        text:
          en: "It measures participation — how much changed hands during the candle."
          es: "Mide la participación: cuánto cambió de manos durante la vela."
      - id: b
        correct: true
        text:
          en: "A move on high volume is harder to unwind, because many people now hold positions there."
          es: "Un movimiento con volumen alto es más difícil de deshacer, porque mucha gente tiene ahora posiciones ahí."
      - id: c
        correct: true
        text:
          en: "A move on thin volume is easier to reverse — little conviction is behind it."
          es: "Un movimiento con volumen fino es más fácil de revertir: hay poca convicción detrás."
      - id: d
        text: { en: "On its own it tells you the direction of the move.", es: "Por sí solo te dice la dirección del movimiento." }
      - id: e
        text: { en: "It is a complete trading signal without price context.", es: "Es una señal de trading completa sin contexto de precio." }
    explanation:
      en: "Price tells you where trades happened; volume tells you how many people agreed. It is context for a move, never a direction or a signal on its own."
      es: "El precio te dice dónde ocurrieron las operaciones; el volumen, cuánta gente estuvo de acuerdo. Es contexto para un movimiento, nunca una dirección ni una señal por sí solo."
