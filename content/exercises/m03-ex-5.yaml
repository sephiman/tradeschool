# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: uptrend-def
    prompt:
      en: "What defines an uptrend?"
      es: "¿Qué define una tendencia alcista?"
    options:
      - id: a
        text:
          en: "Today's candle is green and closed near its high."
          es: "La vela de hoy es verde y cerró cerca de su máximo."
      - id: b
        correct: true
        text:
          en: "A sequence of higher highs and higher lows."
          es: "Una secuencia de máximos más altos y mínimos más altos."
      - id: c
        text:
          en: "Price is trading above its moving average right now."
          es: "El precio cotiza ahora por encima de su media móvil."
      - id: d
        text:
          en: "Price went up sharply over the last hour of trading."
          es: "El precio subió con fuerza en la última hora de negociación."
    explanation:
      en: "A trend is a structure, not a single move: an uptrend is higher highs AND higher lows. A green candle, a position above a moving average, or one fast hour are all single observations — none of them says anything about the sequence of swings, and each can be true in the middle of a range or a downtrend."
      es: "Una tendencia es una estructura, no un solo movimiento: una tendencia alcista son máximos más altos Y mínimos más altos. Una vela verde, estar por encima de una media móvil o una hora rápida son observaciones sueltas: ninguna dice nada de la secuencia de oscilaciones, y todas pueden ser ciertas en medio de un rango o de una tendencia bajista."
  - id: broken-structure
    prompt:
      en: "Price rallies to 100, pulls back to 92, pushes to 108, then falls to 89. What has happened to the uptrend?"
      es: "El precio sube a 100, retrocede a 92, empuja hasta 108 y luego cae a 89. ¿Qué le ha pasado a la tendencia alcista?"
    options:
      - id: a
        text:
          en: "It is still perfectly intact, because 108 was a brand-new high."
          es: "Sigue perfectamente intacta, porque 108 fue un máximo totalmente nuevo."
      - id: b
        text:
          en: "It became a downtrend the moment price first dipped to 92."
          es: "Se convirtió en bajista en cuanto el precio cayó por primera vez a 92."
      - id: c
        text:
          en: "Nothing is decided until price closes below the 100 round number."
          es: "Nada se decide hasta que el precio cierre bajo el número redondo de 100."
      - id: d
        correct: true
        text:
          en: "Broken — the 89 low undercuts the previous higher low of 92."
          es: "Rota: el mínimo de 89 perfora el mínimo más alto anterior de 92."
    explanation:
      en: "An uptrend needs higher lows as well as higher highs, so a new high at 108 does not immunise it: the 89 low sits below the prior 92 low and the higher-low sequence is broken. The earlier dip to 92 was itself a higher low and did no damage, and structure is read off swing points, not off round numbers."
      es: "Una tendencia alcista necesita mínimos más altos además de máximos más altos, así que un nuevo máximo en 108 no la inmuniza: el mínimo de 89 queda por debajo del previo de 92 y la secuencia de mínimos crecientes se rompe. La caída anterior a 92 era en sí un mínimo más alto y no hizo daño, y la estructura se lee en los puntos de giro, no en números redondos."
  - id: one-hh-myth
    kind: true_false
    prompt:
      en: "A single higher high after a downtrend is not enough to confirm that a new uptrend has begun."
      es: "Un único máximo más alto tras una tendencia bajista no basta para confirmar que ha comenzado una nueva tendencia alcista."
    answer: true
    explanation:
      en: "True. An uptrend needs a sequence — higher highs AND higher lows — and a single push up is easily one bounce inside a continuing downtrend or a range."
      es: "Cierto. Una tendencia alcista necesita una secuencia —máximos más altos Y mínimos más altos— y un solo empujón al alza es fácilmente un rebote dentro de una bajista que continúa o de un rango."
  - id: regime-match
    kind: matching
    prompt:
      en: "Match each market regime to the structure that defines it."
      es: "Empareja cada régimen de mercado con la estructura que lo define."
    pairs:
      - id: up
        left: { en: "Uptrend", es: "Tendencia alcista" }
        right:
          en: "Higher highs and higher lows."
          es: "Máximos más altos y mínimos más altos."
      - id: down
        left: { en: "Downtrend", es: "Tendencia bajista" }
        right:
          en: "Lower highs and lower lows."
          es: "Máximos más bajos y mínimos más bajos."
      - id: range
        left: { en: "Range", es: "Rango" }
        right:
          en: "Roughly equal highs and lows, with no net progress."
          es: "Máximos y mínimos parecidos, sin avance neto."
    explanation:
      en: "Trends step in one direction — up = higher highs and higher lows, down = lower highs and lower lows. A range makes roughly equal highs and lows and goes nowhere net."
      es: "Las tendencias escalan en una dirección: alcista = máximos y mínimos más altos, bajista = máximos y mínimos más bajos. Un rango hace máximos y mínimos parecidos y no avanza en neto."
  - id: range-traits
    kind: multi_select
    prompt:
      en: "Select ALL of the following that describe a range."
      es: "Selecciona TODO lo siguiente que describe un rango."
    options:
      - id: a
        correct: true
        text:
          en: "Highs land at roughly similar levels each time."
          es: "Los máximos caen a niveles parecidos cada vez."
      - id: b
        correct: true
        text:
          en: "Lows land at roughly similar levels each time."
          es: "Los mínimos caen a niveles parecidos cada vez."
      - id: c
        correct: true
        text:
          en: "There is no net progress in either direction."
          es: "No hay avance neto en ninguna dirección."
      - id: d
        text:
          en: "Each peak is clearly above the peak that came before it."
          es: "Cada pico está claramente por encima del pico anterior."
      - id: e
        text:
          en: "Price makes strong, sustained progress in one direction."
          es: "El precio avanza de forma fuerte y sostenida en una dirección."
    explanation:
      en: "A range has roughly equal highs, roughly equal lows and no net progress — the moves cancel out. Rising peaks or sustained one-way progress are the definition of a trend, which is the other regime entirely."
      es: "Un rango tiene máximos parecidos, mínimos parecidos y ningún avance neto: los movimientos se cancelan. Picos crecientes o un avance sostenido en un sentido son la definición de una tendencia, que es justo el otro régimen."
  - id: why-regime
    prompt:
      en: "Why is 'trending or ranging?' the first question to ask a chart?"
      es: "¿Por qué '¿tendencia o rango?' es la primera pregunta que hacerle a un gráfico?"
    options:
      - id: a
        text:
          en: "Because a ranging market can never begin to trend afterwards."
          es: "Porque un mercado en rango nunca puede pasar a tendencia después."
      - id: b
        text:
          en: "Because trends are far more common than ranges in practice."
          es: "Porque las tendencias son mucho más frecuentes que los rangos."
      - id: c
        text:
          en: "Because the regime hands you the exact price target to aim at."
          es: "Porque el régimen te da el objetivo de precio exacto al que apuntar."
      - id: d
        correct: true
        text:
          en: "Because tactics that work in a trend get shredded in a range."
          es: "Porque las tácticas que funcionan en tendencia fallan en rango."
    explanation:
      en: "The regime decides which tactics make sense: ride pullbacks in a trend, fade the edges in a range. Get it wrong and you buy range tops or fight strong trends. Ranges are in fact the more common state, regimes change all the time, and no regime ever gives you a price target."
      es: "El régimen decide qué tácticas tienen sentido: montar los retrocesos en tendencia, operar contra los extremos en rango. Equivócate y comprarás techos de rango o pelearás contra tendencias fuertes. En realidad los rangos son el estado más común, los regímenes cambian continuamente y ninguno te da nunca un objetivo de precio."
  - id: classify-order
    kind: ordering
    prompt:
      en: "Order the steps for deciding whether a chart is trending or ranging, first to last."
      es: "Ordena los pasos para decidir si un gráfico está en tendencia o en rango, del primero al último."
    items:
      - id: tf
        position: 1
        text:
          en: "Choose the timeframe you are actually trading."
          es: "Elige la temporalidad en la que operas de verdad."
      - id: mark
        position: 2
        text:
          en: "Mark the recent swing highs and swing lows."
          es: "Marca los máximos y mínimos de giro recientes."
      - id: compare
        position: 3
        text:
          en: "Check whether those highs and lows step up, step down, or stay roughly flat."
          es: "Comprueba si esos máximos y mínimos suben, bajan o quedan más o menos planos."
      - id: conclude
        position: 4
        text:
          en: "Conclude uptrend, downtrend, or range."
          es: "Concluye tendencia alcista, tendencia bajista o rango."
    explanation:
      en: "Structure is timeframe-specific, so fix the timeframe first, then read the swing points on it, compare how they line up, and only then name the regime."
      es: "La estructura depende de la temporalidad, así que fija primero la temporalidad, luego lee los puntos de giro en ella, compara cómo se alinean y solo entonces nombra el régimen."
  - id: swing-points
    prompt:
      en: "What is a swing high, and why do swing points matter?"
      es: "¿Qué es un máximo de oscilación (swing high) y por qué importan los puntos de oscilación?"
    options:
      - id: a
        correct: true
        text:
          en: "A peak with lower candles either side — the skeleton of structure."
          es: "Un pico con velas más bajas a ambos lados: el esqueleto de la estructura."
      - id: b
        text:
          en: "The highest price of the week, which anchors every level below it."
          es: "El precio más alto de la semana, que ancla todos los niveles de abajo."
      - id: c
        text:
          en: "Any green candle that closes above the one immediately before it."
          es: "Cualquier vela verde que cierre por encima de la inmediatamente anterior."
      - id: d
        text:
          en: "The midpoint between a range's floor and its ceiling."
          es: "El punto medio entre el suelo y el techo de un rango."
    explanation:
      en: "A swing high is a local pivot — a peak with lower candles on either side — and everything structural is read off these pivots: higher highs and higher lows for an uptrend, lower highs and lower lows for a downtrend. It is not a calendar extreme, not any green candle, and not a derived midpoint. Without swing points there is no structure to read."
      es: "Un máximo de oscilación es un pivote local —un pico con velas más bajas a ambos lados— y todo lo estructural se lee de estos pivotes: máximos y mínimos crecientes para una tendencia alcista, decrecientes para una bajista. No es un extremo del calendario, ni cualquier vela verde, ni un punto medio calculado. Sin puntos de oscilación no hay estructura que leer."
  - id: regime-tactics-match
    kind: matching
    prompt:
      en: "Match each regime to the tactic that fits it."
      es: "Empareja cada régimen con la táctica que le corresponde."
    pairs:
      - id: trend
        left: { en: "A clear trend", es: "Una tendencia clara" }
        right:
          en: "Trade with it: buy the pullbacks in an uptrend, sell the bounces in a downtrend, and let it run."
          es: "Opera a favor: compra los retrocesos en tendencia alcista, vende los rebotes en bajista, y déjala correr."
      - id: range
        left: { en: "A range", es: "Un rango" }
        right:
          en: "Fade the edges — lean against resistance, buy near support — and take profit quickly."
          es: "Opera contra los extremos: apóyate contra la resistencia, compra cerca del soporte, y toma beneficio rápido."
      - id: wrong
        left: { en: "The wrong tactic for the regime", es: "La táctica equivocada para el régimen" }
        right:
          en: "Buying a 'breakout' inside a range usually just buys the top of the box; fading a strong trend gets you run over."
          es: "Comprar una 'ruptura' dentro de un rango suele ser comprar el techo de la caja; operar contra una tendencia fuerte te arrolla."
    explanation:
      en: "Tactics are regime-specific, and using the wrong one is how accounts bleed out. That is why 'trending or ranging?' comes before 'up or down?'."
      es: "Las tácticas son específicas del régimen, y usar la equivocada es como se desangran las cuentas. Por eso '¿tendencia o rango?' va antes de '¿arriba o abajo?'."
  - id: nested-regimes
    kind: true_false
    prompt:
      en: "A market can be a clean daily uptrend built out of dozens of hourly ranges."
      es: "Un mercado puede ser una tendencia alcista diaria limpia construida con docenas de rangos horarios."
    answer: true
    explanation:
      en: "Trend and range are nested, which is why the question is 'trending or ranging, *on my timeframe*?' Pick the timeframe you trade and read structure there consistently, rather than flipping zoom levels to justify a position you already hold."
      es: "Tendencia y rango están anidados, y por eso la pregunta es '¿tendencia o rango, *en mi temporalidad*?'. Elige la temporalidad que operas y lee la estructura ahí de forma consistente, en vez de saltar de zoom para justificar una posición que ya tienes."
