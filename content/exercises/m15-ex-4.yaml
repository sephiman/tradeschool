# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: third-touch
    prompt:
      en: "Price has touched your candidate trendline twice. What does the third touch add that the first two could not?"
      es: "El precio ha tocado tu línea candidata dos veces. ¿Qué añade el tercer toque que no podían añadir los dos primeros?"
    options:
      - id: a
        text:
          en: "A third data point, which makes the slope statistically significant."
          es: "Un tercer dato, que vuelve la pendiente estadísticamente significativa."
      - id: b
        correct: true
        text:
          en: "Evidence: two points always fit a line, three had to be predicted by it."
          es: "Evidencia: dos puntos siempre encajan en una recta, tres tuvo que predecirlos."
      - id: c
        text:
          en: "Permission to steepen the line so it fits the third low more exactly."
          es: "Permiso para inclinar más la línea y que encaje mejor con el tercer mínimo."
      - id: d
        text:
          en: "Nothing at all — two touches is the standard definition of a trendline."
          es: "Nada en absoluto: dos toques es la definición estándar de línea de tendencia."
    explanation:
      en: "Any two points define a line, so the first two touches are geometry rather than information — you would have got a line from any two lows you picked. The third visit is the first thing the line predicted rather than fitted: price came back to roughly where the line said and turned there. Until then, what you have is a candidate."
      es: "Dos puntos cualesquiera definen una recta, así que los dos primeros toques son geometría, no información: habrías obtenido una línea con dos mínimos cualesquiera. La tercera visita es lo primero que la línea predijo en vez de ajustar: el precio volvió aproximadamente adonde decía la línea y giró ahí. Hasta entonces, lo que tienes es una candidata."
  - id: anchoring
    prompt:
      en: "You are drawing a rising support line. Some lows have long wicks, others do not. How do you anchor?"
      es: "Estás trazando un soporte ascendente. Unos mínimos tienen mechas largas y otros no. ¿Cómo te anclas?"
    options:
      - id: a
        text:
          en: "Wick on the deep lows, body on the shallow ones, so the line stays clean."
          es: "Mecha en los mínimos profundos y cuerpo en los suaves, para que la línea quede limpia."
      - id: b
        text:
          en: "Whichever gives the line the most touches — touches are what validate it."
          es: "Lo que dé más toques a la línea: los toques son lo que la valida."
      - id: c
        correct: true
        text:
          en: "Pick one criterion before you start drawing, and use it at every anchor."
          es: "Elige un criterio antes de empezar a trazar y úsalo en todos los anclajes."
      - id: d
        text:
          en: "Always wicks: they are the true extremes of what the market actually traded."
          es: "Siempre mechas: son los extremos verdaderos de lo que el mercado negoció."
    explanation:
      en: "Wicks or bodies are both defensible; mixing them is not, because mixing is precisely how a line gets fitted to a thesis — you take the wick where the wick is convenient and the body where the body is. Declare the criterion first and keep it, and the line becomes something that can disagree with you. This course anchors on closes and says so, which is what makes that choice checkable."
      es: "Mechas o cuerpos son las dos defendibles; mezclarlas no, porque mezclar es exactamente como se ajusta una línea a una tesis: coges la mecha donde te conviene la mecha y el cuerpo donde te conviene el cuerpo. Declara el criterio antes y mantenlo, y la línea pasa a ser algo que puede llevarte la contraria. Este curso se ancla en los cierres y lo dice, que es lo que hace comprobable esa elección."
  - id: redraw
    kind: true_false
    prompt:
      en: "A trendline you have had to move three times this month is fine, as long as the current version fits the recent lows."
      es: "Una línea de tendencia que has tenido que mover tres veces este mes está bien, mientras la versión actual encaje con los mínimos recientes."
    answer: false
    explanation:
      en: "A line refitted whenever it stops fitting will describe the past forever and predict nothing, because you are re-deriving it from the data it is supposed to be tested against. The test is whether the line you drew a month ago still describes what has happened since. If it does not, the answer is that the rhythm ended — not that you need better anchors."
      es: "Una línea reajustada cada vez que deja de encajar describirá el pasado eternamente y no predecirá nada, porque la estás volviendo a derivar de los mismos datos contra los que debería contrastarse. La prueba es si la línea que trazaste hace un mes sigue describiendo lo que ha pasado desde entonces. Si no lo hace, la respuesta es que el ritmo se acabó, no que te hacen falta mejores anclajes."
  - id: channel-bet
    prompt:
      en: "You have drawn a clean channel: four touches on the floor, three on the ceiling. What exactly are you betting on if you trade it?"
      es: "Has trazado un canal limpio: cuatro toques en el suelo y tres en el techo. ¿A qué estás apostando exactamente si lo operas?"
    options:
      - id: a
        text:
          en: "That the parallel is correctly placed, which the seven touches already show."
          es: "A que la paralela está bien colocada, que es lo que ya muestran los siete toques."
      - id: b
        text:
          en: "That price is currently nearer the floor than the ceiling of the channel."
          es: "A que el precio está ahora más cerca del suelo que del techo del canal."
      - id: c
        text:
          en: "That the market has more buyers than sellers for as long as the channel lasts."
          es: "A que el mercado tiene más compradores que vendedores mientras dure el canal."
      - id: d
        correct: true
        text:
          en: "That a regularity which has held so far carries on holding after you act."
          es: "A que una regularidad cumplida hasta ahora siga cumpliéndose después de entrar."
    explanation:
      en: "Everything the seven touches establish sits to the left of your decision; everything you get paid for sits to the right of it. The channel describes a regularity that HAS held, and trading it assumes that regularity persists — an assumption nothing on the chart can support, because a chart only contains the past. A well-drawn channel is unusually good at hiding this, because it looks like a machine."
      es: "Todo lo que establecen los siete toques está a la izquierda de tu decisión; todo lo que te pagan está a la derecha. El canal describe una regularidad que SÍ se ha cumplido, y operarlo supone que esa regularidad continúa: una suposición que nada del gráfico puede sostener, porque un gráfico solo contiene el pasado. Un canal bien trazado es especialmente bueno escondiendo esto, porque parece una máquina."
  - id: drawing-steps
    kind: ordering
    prompt:
      en: "Put the steps for drawing and then using a trendline in order."
      es: "Ordena los pasos para trazar y luego usar una línea de tendencia."
    items:
      - id: rhythm
        position: 1
        text:
          en: "Check there is a rhythm at all — a range has no rate of advance to describe."
          es: "Comprueba que hay ritmo: un rango no tiene ritmo de avance que describir."
      - id: criterion
        position: 2
        text:
          en: "Declare the anchor, wicks or bodies, and hold to it for every touch."
          es: "Declara el anclaje, mechas o cuerpos, y mantenlo en todos los toques."
      - id: validate
        position: 3
        text:
          en: "Wait for the third visit before calling the candidate a line."
          es: "Espera a la tercera visita antes de llamar línea a la candidata."
      - id: project
        position: 4
        text:
          en: "Project it forward, and judge a break on the body and the volume."
          es: "Proyéctala y juzga la ruptura por el cuerpo y por el volumen."
    explanation:
      en: "The order is the discipline. Every step exists to stop you drawing what you already believe: the first refuses the tool where it has nothing to describe, the second removes the freedom that lets a line be fitted to a thesis, the third makes the line predict something, and the fourth borrows the break test from m08-l1 and m14 unchanged."
      es: "El orden es la disciplina. Cada paso existe para impedirte dibujar lo que ya dabas por sentado: el primero rechaza la herramienta donde no tiene nada que describir, el segundo quita la libertad que permite ajustar una línea a una tesis, el tercero obliga a la línea a predecir algo y el cuarto toma prestada la prueba de ruptura de m08-l1 y m14 sin cambiarla."
  - id: break-evidence
    kind: multi_select
    prompt:
      en: "Price has moved through a validated trendline. Select ALL the observations that count as evidence of a genuine break."
      es: "El precio ha atravesado una línea de tendencia validada. Selecciona TODAS las observaciones que cuentan como evidencia de una ruptura genuina."
    options:
      - id: a
        correct: true
        text:
          en: "A candle body closed beyond the projected line."
          es: "Un cuerpo de vela cerró al otro lado de la línea proyectada."
      - id: b
        correct: true
        text:
          en: "Volume on that candle clearly exceeded the recent baseline."
          es: "El volumen de esa vela superó claramente la referencia reciente."
      - id: c
        text:
          en: "A long wick reached well past the line before closing back."
          es: "Una mecha larga llegó bastante más allá antes de volver a cerrar dentro."
      - id: d
        text:
          en: "The line had been touched many times, so a lot was riding on it."
          es: "La línea se había tocado muchas veces, así que había mucho en juego."
    explanation:
      en: "The two that count are the two m08-l1 and m14 already asked for: the body decides, and participation has to be behind it. A wick past the line is not evidence in either direction, and here it is worth even less than it would be at a horizontal level. And the number of prior touches makes the line more watched, not more likely to hold — a crowded line is where the stops are."
      es: "Las dos que cuentan son las dos que ya pedían m08-l1 y m14: decide el cuerpo, y tiene que haber participación detrás. Una mecha más allá de la línea no es evidencia en ninguna dirección, y aquí vale aún menos de lo que valdría en un nivel horizontal. Y el número de toques previos hace la línea más mirada, no más probable de aguantar: una línea concurrida es donde están los stops."
