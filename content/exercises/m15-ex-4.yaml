# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: risk-on
    prompt:
      en: "Over the last several years, how has Bitcoin mostly behaved relative to traditional markets?"
      es: "En los últimos años, ¿cómo se ha comportado Bitcoin sobre todo en relación con los mercados tradicionales?"
    options:
      - id: a
        correct: true
        text:
          en: "Largely as a risk-on asset — rising when investors embrace risk, falling when they flee to safety."
          es: "En gran medida como un activo risk-on: sube cuando los inversores asumen riesgo y baja cuando huyen hacia la seguridad."
      - id: b
        text:
          en: "As a safe haven uncorrelated with stocks, rising when markets fall."
          es: "Como un refugio seguro sin correlación con las acciones, que sube cuando los mercados caen."
      - id: c
        text:
          en: "As a mechanical mirror image of the S&P 500, always moving in the exact opposite direction."
          es: "Como un espejo mecánico del S&P 500, moviéndose siempre en la dirección exactamente opuesta."
      - id: d
        text:
          en: "Completely detached from macro — interest rates and the dollar do not touch it."
          es: "Completamente ajeno a la macro: los tipos de interés y el dólar no le afectan."
    explanation:
      en: "Bitcoin has traded largely as a risk-on asset, moving in loose sympathy with tech stocks. It is a tendency and context, not a mechanical rule or a proven safe haven."
      es: "Bitcoin ha cotizado en gran medida como un activo risk-on, en sintonía laxa con las acciones tecnológicas. Es una tendencia y un contexto, no una regla mecánica ni un refugio demostrado."
  - id: dxy
    prompt:
      en: "A strong, rising US dollar index (DXY) has broadly tended to coincide with what for crypto?"
      es: "Un índice del dólar (DXY) fuerte y al alza ha tendido en general a coincidir con ¿qué para cripto?"
    options:
      - id: a
        correct: true
        text:
          en: "Weakness in crypto and other risk assets — an inverse tendency."
          es: "Debilidad en cripto y en el resto de activos de riesgo: una tendencia inversa."
      - id: b
        text:
          en: "Strength in crypto — the two reliably rise together."
          es: "Fortaleza en cripto: los dos suben de forma fiable a la vez."
      - id: c
        text:
          en: "No relationship at all — crypto ignores the dollar entirely."
          es: "Ninguna relación: cripto ignora por completo al dólar."
      - id: d
        text:
          en: "A guaranteed crypto crash on the very same day the dollar rises."
          es: "Un desplome garantizado de cripto el mismo día en que sube el dólar."
    explanation:
      en: "A strong dollar has broadly coincided with weakness in risk assets, crypto included. It is an inverse tendency and context, not a mechanical seesaw or a same-day trigger."
      es: "Un dólar fuerte ha coincidido en general con debilidad en los activos de riesgo, cripto incluida. Es una tendencia inversa y de contexto, no un balancín mecánico ni un gatillo del mismo día."
  - id: safe-haven-myth
    kind: true_false
    prompt:
      en: "Over recent years, Bitcoin has behaved as an uncorrelated safe haven, reliably rising when stock markets fall."
      es: "En los últimos años, Bitcoin se ha comportado como un refugio seguro sin correlación, subiendo de forma fiable cuando caen los mercados de acciones."
    answer: false
    explanation:
      en: "The opposite is closer to the truth. Bitcoin has traded largely as a risk-on asset, moving in loose sympathy with tech stocks rather than against them — it has tended to fall, not rise, when investors flee risk."
      es: "Lo cierto es más bien lo contrario. Bitcoin ha cotizado en gran medida como un activo risk-on, en sintonía laxa con las acciones tecnológicas en vez de en su contra: ha tendido a caer, no a subir, cuando los inversores huyen del riesgo."
  - id: interest-rates
    prompt:
      en: "Central banks raise interest rates sharply. All else equal, what does the lesson say this tends to do to crypto?"
      es: "Los bancos centrales suben los tipos de interés con fuerza. En igualdad de condiciones, ¿qué dice la lección que esto tiende a hacerle a cripto?"
    options:
      - id: a
        correct: true
        text:
          en: "Money tends to leave — safe cash and bonds now pay more, so speculative assets look relatively less attractive."
          es: "El dinero tiende a salir: el efectivo seguro y los bonos ahora pagan más, así que los activos especulativos parecen relativamente menos atractivos."
      - id: b
        text:
          en: "Money tends to flow in, because higher rates make crypto pay more interest."
          es: "El dinero tiende a entrar, porque tipos más altos hacen que cripto pague más interés."
      - id: c
        text:
          en: "Nothing — crypto is immune to interest-rate policy."
          es: "Nada: cripto es inmune a la política de tipos de interés."
      - id: d
        text:
          en: "Crypto's issuance schedule speeds up to compensate."
          es: "El calendario de emisión de cripto se acelera para compensar."
    explanation:
      en: "Higher rates make safe cash and bonds pay more, so speculative assets — crypto very much included — become relatively less attractive and money tends to leave. Crypto is among the most sensitive assets to this cost of money."
      es: "Tipos más altos hacen que el efectivo seguro y los bonos paguen más, así que los activos especulativos —cripto muy incluida— se vuelven relativamente menos atractivos y el dinero tiende a salir. Cripto está entre los activos más sensibles a este coste del dinero."
  - id: risk-off-flows
    prompt:
      en: "In a risk-off episode, where does capital typically flow?"
      es: "En un episodio risk-off, ¿hacia dónde fluye normalmente el capital?"
    options:
      - id: a
        correct: true
        text:
          en: "Toward assets that protect capital — cash, short-term government bonds, sometimes the dollar."
          es: "Hacia activos que protegen el capital: efectivo, bonos de Estado a corto plazo, a veces el dólar."
      - id: b
        text:
          en: "Toward crypto and tech stocks, the classic safe havens."
          es: "Hacia cripto y las acciones tecnológicas, los refugios seguros clásicos."
      - id: c
        text:
          en: "Toward small-cap altcoins, which hold up best under stress."
          es: "Hacia las altcoins pequeñas, que aguantan mejor bajo estrés."
      - id: d
        text:
          en: "Nowhere — capital simply disappears from every market."
          es: "A ningún sitio: el capital simplemente desaparece de todos los mercados."
    explanation:
      en: "Risk-off means money flows toward assets that protect capital if things go badly — cash and short-term government bonds. Crypto sits firmly at the risk-on end, so it tends to be sold, not bought, in these moments."
      es: "Risk-off significa que el dinero fluye hacia activos que protegen el capital si las cosas van mal: efectivo y bonos de Estado a corto plazo. Cripto está firmemente en el extremo risk-on, así que en esos momentos tiende a venderse, no a comprarse."
  - id: macro-match
    kind: matching
    prompt:
      en: "Match each macro condition to the mood it has broadly tended to coincide with for crypto."
      es: "Empareja cada condición macro con el ánimo con el que ha tendido a coincidir en general para cripto."
    pairs:
      - id: rates-up
        left:
          en: "Central banks raising interest rates"
          es: "Bancos centrales subiendo los tipos de interés"
        right:
          en: "Money leaving speculative assets like crypto"
          es: "Dinero que sale de activos especulativos como cripto"
      - id: dxy-up
        left:
          en: "A strong, rising dollar (DXY)"
          es: "Un dólar fuerte y al alza (DXY)"
        right:
          en: "Broad weakness in crypto and other risk assets"
          es: "Debilidad generalizada en cripto y otros activos de riesgo"
      - id: risk-on
        left:
          en: "A risk-on mood"
          es: "Un ánimo risk-on"
        right:
          en: "Money flowing toward stocks and crypto"
          es: "Dinero que fluye hacia las acciones y cripto"
      - id: risk-off
        left:
          en: "A risk-off mood"
          es: "Un ánimo risk-off"
        right:
          en: "Money flowing to cash and short-term government bonds"
          es: "Dinero que fluye hacia el efectivo y los bonos de Estado a corto plazo"
    explanation:
      en: "Rising rates and a strong dollar have broadly coincided with weakness in crypto; a risk-on mood sends money toward stocks and crypto, a risk-off mood toward cash and bonds. All are tendencies and context, never mechanical laws."
      es: "Los tipos al alza y un dólar fuerte han coincidido en general con debilidad en cripto; un ánimo risk-on lleva el dinero hacia las acciones y cripto, un ánimo risk-off hacia el efectivo y los bonos. Todo son tendencias y contexto, nunca leyes mecánicas."
  - id: event-volatility
    prompt:
      en: "A scheduled macro release (an FOMC rate decision, a CPI print) is coming in an hour. In trading terms, what does that date on the calendar mark?"
      es: "Falta una hora para una publicación macro programada (una decisión de tipos del FOMC, un dato de IPC). Desde el punto de vista del trading, ¿qué marca esa fecha en el calendario?"
    options:
      - id: a
        correct: true
        text:
          en: "A known volatility regime — a scheduled jump in uncertainty, into which spreads widen and books thin as market makers step back."
          es: "Un régimen de volatilidad conocido: un salto programado de incertidumbre, ante el cual los spreads se ensanchan y los libros se afinan porque los creadores de mercado se retiran."
      - id: b
        text:
          en: "A reliable direction — these events resolve up often enough to trade the announcement itself."
          es: "Una dirección fiable: estos eventos se resuelven al alza lo bastante a menudo como para operar el propio anuncio."
      - id: c
        text:
          en: "Nothing for crypto — macro releases only move stocks and bonds, not a 24/7 market."
          es: "Nada para cripto: las publicaciones macro solo mueven acciones y bonos, no un mercado 24/7."
      - id: d
        text:
          en: "A guaranteed calm — liquidity always deepens ahead of a known event."
          es: "Una calma garantizada: la liquidez siempre se profundiza antes de un evento conocido."
    explanation:
      en: "A scheduled event is a volatility regime you can see coming. Right before it, market makers pull quotes rather than get run over by the reaction, so spreads widen and books thin — the worst possible liquidity for a fill, in exactly the window everyone is watching."
      es: "Un evento programado es un régimen de volatilidad que ves venir. Justo antes, los creadores de mercado retiran cotizaciones para que la reacción no los arrolle, así que los spreads se ensanchan y los libros se afinan: la peor liquidez posible para una ejecución, justo en la ventana que todos vigilan."
  - id: event-rule
    prompt:
      en: "You cannot predict tomorrow's CPI number. What is the disciplined way to treat the print?"
      es: "No puedes predecir el dato de IPC de mañana. ¿Cuál es la forma disciplinada de tratar la publicación?"
    options:
      - id: a
        correct: true
        text:
          en: "Be flat or small into an event you can't price — the reaction, not your analysis, will set the next move."
          es: "Estar plano o pequeño ante un evento que no puedes valorar: la reacción, no tu análisis, fijará el siguiente movimiento."
      - id: b
        text:
          en: "Size up — the extra volatility is a bigger opportunity, so it deserves a bigger position."
          es: "Aumentar el tamaño: la volatilidad extra es una oportunidad mayor, así que merece una posición mayor."
      - id: c
        text:
          en: "Place a tight stop just beyond the current price and hold full size through the release."
          es: "Colocar un stop ajustado justo pasado el precio actual y mantener el tamaño completo durante la publicación."
      - id: d
        text:
          en: "Ignore the calendar entirely; a good setup is a good setup regardless of the date."
          es: "Ignorar el calendario por completo; un buen setup es un buen setup sin importar la fecha."
    explanation:
      en: "If you can't price the outcome, don't let it price you: go flat or shrink size. A tight stop is worse than useless when the spread gaps through it on the print — you get the loss without the protection. The edge is in setups you can read, not in coin-flips with the whole market watching."
      es: "Si no puedes valorar el resultado, no dejes que él te valore a ti: ponte plano o reduce el tamaño. Un stop ajustado es peor que inútil cuando el spread lo atraviesa de golpe en el dato: te llevas la pérdida sin la protección. La ventaja está en setups que puedes leer, no en caras-o-cruces con todo el mercado mirando."
  - id: liq-shelf-print
    kind: true_false
    prompt:
      en: "Holding a leveraged position whose liquidation price sits just past a visible cluster of stops is a fine thing to carry into an FOMC announcement."
      es: "Mantener una posición apalancada cuyo precio de liquidación queda justo pasado un cúmulo visible de stops es algo perfectamente asumible para llevar a un anuncio del FOMC."
    answer: false
    explanation:
      en: "That is the worst place to be into a scheduled shock. A liquidation shelf just past a stop cluster is exactly what a violent, thin-book reaction reaches for — the print supplies the volatility, the shelf supplies the fuel. Flatten or cut leverage so a single spike can't force you out at the worst price."
      es: "Ese es el peor sitio posible ante un shock programado. Una repisa de liquidación justo pasado un cúmulo de stops es precisamente lo que busca una reacción violenta y de libro poco profundo: el dato aporta la volatilidad y la repisa el combustible. Aplana o reduce el apalancamiento para que un solo pico no pueda expulsarte al peor precio."
