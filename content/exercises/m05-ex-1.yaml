type: calculation
formula: initial_margin
prompt:
  en: "You open a long on BTC at an entry price of **{entry}** USDT, buying **{quantity}** BTC at **{leverage}×** leverage. How much initial margin (in USDT) must you post to open the position?"
  es: "Abres un long en BTC a un precio de entrada de **{entry}** USDT, comprando **{quantity}** BTC con **{leverage}×** de apalancamiento. ¿Cuánto margen inicial (en USDT) debes depositar para abrir la posición?"
params:
  entry: { kind: int_range, min: 20000, max: 70000, step: 1000 }
  quantity: { kind: choice, values: ["0.1", "0.5", "1", "2"] }
  leverage: { kind: choice, values: ["5", "10", "20", "25", "50"] }
tolerance: { rel: "0.005" }
round: 2
unit: USDT
explanation:
  en: "Initial margin = (entry × quantity) / leverage — the position's notional value divided by your leverage. It is what you post to open the trade; higher leverage means a smaller deposit for the same position, not a bigger gain."
  es: "Margen inicial = (entrada × cantidad) / apalancamiento: el valor nocional de la posición dividido entre tu apalancamiento. Es lo que depositas para abrir la operación; más apalancamiento significa un depósito menor para la misma posición, no una ganancia mayor."
