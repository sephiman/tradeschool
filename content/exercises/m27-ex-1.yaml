# SPDX-License-Identifier: AGPL-3.0-only
type: quiz
variants:
  - id: move-stop-away
    prompt:
      en: "You are long from 60.300 with a stop at 59.300. Price falls to 59.500 and looks likely to hit the stop. You slide the stop down to 58.000 to 'give it room'. What did you just do?"
      es: "Estás largo desde 60.300 con el stop en 59.300. El precio cae a 59.500 y parece que va a tocar el stop. Deslizas el stop a 58.000 para «darle espacio». ¿Qué acabas de hacer?"
    options:
      - id: a
        text:
          en: "Sound risk management: a wider stop lets a good trade survive normal noise."
          es: "Buena gestión del riesgo: un stop más ancho deja sobrevivir al ruido normal."
      - id: b
        text:
          en: "Cut the risk, since price now needs a bigger move against you to close it."
          es: "Reducir el riesgo, ya que ahora hace falta un movimiento mayor en contra."
      - id: c
        text:
          en: "Nothing structural: the stop is a soft marker you re-price as context changes."
          es: "Nada estructural: el stop es una marca blanda que repones según el contexto."
      - id: d
        correct: true
        text:
          en: "Abandoned the plan and uncapped the risk, which is the cardinal sin of live management."
          es: "Abandonar el plan y quitar el tope al riesgo: el pecado capital en vivo."
    explanation:
      en: "Moving a stop away from price is the cardinal sin of live management: it turns a known, budgeted loss into an open-ended one. It does not reduce risk — the position size is unchanged, so a wider stop is a strictly bigger loss in money. The stop only ever moves in the trade's favour; widening it is how a 1% risk becomes a liquidation."
      es: "Mover el stop en contra es el pecado capital de la gestión en vivo: convierte una pérdida conocida y presupuestada en una abierta. No reduce el riesgo: el tamaño de la posición no cambia, así que un stop más ancho es una pérdida estrictamente mayor en dinero. El stop solo se mueve a favor; ensancharlo es como un riesgo del 1% se vuelve una liquidación."
  - id: breakeven-legit
    prompt:
      en: "Long from 60.300, stop 59.300. Price rises to 62.300, then pulls back and forms a clear higher low at 61.200. Moving your stop up to break-even (60.300) is:"
      es: "Largo desde 60.300, stop 59.300. El precio sube a 62.300, luego retrocede y forma un mínimo más alto claro en 61.200. Subir tu stop a break-even (60.300) es:"
    options:
      - id: a
        text:
          en: "Fear — a stop at entry only proves you do not trust your own analysis."
          es: "Miedo: un stop en la entrada solo demuestra que no confías en tu análisis."
      - id: b
        correct: true
        text:
          en: "Legitimate — the new higher low is structure that now protects the entry."
          es: "Legítimo: la nueva estructura ahora protege la entrada."
      - id: c
        text:
          en: "The cardinal sin, since any stop move after entry abandons the written plan."
          es: "El pecado capital, ya que mover el stop tras entrar abandona el plan escrito."
      - id: d
        text:
          en: "Pointless — a break-even stop can only ever produce a zero result."
          es: "Inútil: un stop en break-even solo puede producir un resultado de cero."
    explanation:
      en: "The stop moving in the trade's favour, justified by fresh structure, is exactly the legitimate case: the higher low at 61.200 is the chart's own evidence that 60.300 should no longer trade. The rule forbids moving a stop AWAY, not moving it up behind a confirmed low, and a break-even stop still leaves the whole upside to target open."
      es: "El stop moviéndose a favor de la operación, justificado por estructura nueva, es justo el caso legítimo: el mínimo más alto en 61.200 es la prueba del propio gráfico de que 60.300 ya no debería negociarse. La regla prohíbe mover el stop EN CONTRA, no subirlo tras un mínimo confirmado, y un stop en break-even deja intacto todo el recorrido al objetivo."
  - id: breakeven-fear
    prompt:
      en: "Long from 60.300, stop 59.300, target 64.000. One green candle prints to 60.600 (still well inside the range, no new structure). You snap the stop to break-even. Most likely result?"
      es: "Largo desde 60.300, stop 59.300, objetivo 64.000. Se imprime una vela verde hasta 60.600 (aún dentro del rango, sin estructura nueva). Pegas el stop a break-even. ¿Resultado más probable?"
    options:
      - id: a
        text:
          en: "You have locked in a guaranteed profit and removed the downside entirely."
          es: "Has asegurado un beneficio garantizado y eliminado del todo el riesgo."
      - id: b
        text:
          en: "Nothing changes, because a stop only matters once price trades near it."
          es: "Nada cambia, porque un stop solo importa cuando el precio ya lo roza."
      - id: c
        text:
          en: "The trade needs a smaller move to reach target now that the risk is gone."
          es: "La operación necesita menos recorrido al objetivo ahora que no hay riesgo."
      - id: d
        correct: true
        text:
          en: "A noise wick taps 60.300, stops you out, and the move runs without you."
          es: "Una mecha de ruido toca 60.300 y el movimiento corre sin ti."
    explanation:
      en: "Moving to break-even before any new structure chokes the trade: 60.300 is still inside the band price is oscillating in, so you have placed the stop where noise alone will reach it. You exit for zero — not a profit — and the position is gone before the idea had room to play out. Break-even is earned by a higher low, not by the first green candle."
      es: "Mover a break-even antes de cualquier estructura nueva ahoga la operación: 60.300 sigue dentro de la banda en la que oscila el precio, así que has puesto el stop donde el ruido solo ya llega. Sales por cero —no con beneficio— y la posición desaparece antes de que la idea tuviera espacio. El break-even se gana con un mínimo más alto, no con la primera vela verde."
  - id: do-nothing
    prompt:
      en: "Your trade is open and drifting sideways between entry and target. Nothing about the structure has changed. What is usually the correct action?"
      es: "Tu operación está abierta y deambula de lado entre la entrada y el objetivo. Nada de la estructura ha cambiado. ¿Cuál suele ser la acción correcta?"
    options:
      - id: a
        text:
          en: "Close it — flat price after entry means the read has already failed."
          es: "Cerrarla: un precio plano tras entrar significa que la lectura ya falló."
      - id: b
        text:
          en: "Add to the position so the average entry improves while price is cheap."
          es: "Añadir a la posición para mejorar la entrada media mientras está barata."
      - id: c
        correct: true
        text:
          en: "Nothing — the plan is already made, and the trade needs room and time to work."
          es: "Ninguna: el plan ya está hecho y la operación necesita espacio y tiempo."
      - id: d
        text:
          en: "Tighten the stop just under price to bank the small unrealised gain."
          es: "Apretar el stop justo bajo el precio para asegurar la ganancia latente."
    explanation:
      en: "Most of the time the right live-management action is none. Boredom is not a signal: the plan already set the stop and the target, and sideways drift is what the middle of a trade looks like. Closing early, averaging in, and choking the stop are all the same impulse — doing something because waiting is uncomfortable."
      es: "La mayor parte del tiempo la acción de gestión correcta es ninguna. El aburrimiento no es una señal: el plan ya fijó el stop y el objetivo, y el vaivén lateral es el aspecto normal de la mitad de una operación. Cerrar antes, promediar y ahogar el stop son el mismo impulso: hacer algo porque esperar incomoda."
  - id: stop-direction-tf
    kind: true_false
    prompt:
      en: "Once a trade is live, the stop may only move in the trade's favour: up for a long, down for a short."
      es: "Una vez que la operación está en vivo, el stop solo puede moverse a favor: arriba en un largo, abajo en un corto."
    answer: true
    explanation:
      en: "This is the one inviolable rule of live management. Moving the stop away from price, however good the story feels in the moment, uncaps your risk and breaks the plan."
      es: "Es la única regla inviolable de la gestión en vivo. Mover el stop en contra, por muy buena que suene la historia en el momento, quita el tope al riesgo y rompe el plan."
  - id: legit-actions-multi
    kind: multi_select
    prompt:
      en: "Select ALL of the following that are legitimate live-management actions (not fear or improvisation)."
      es: "Selecciona TODAS las siguientes que sean acciones de gestión en vivo legítimas (no miedo ni improvisación)."
    options:
      - id: a
        correct: true
        text:
          en: "Trailing the stop up behind a confirmed higher low."
          es: "Subir el stop tras un mínimo más alto confirmado."
      - id: b
        correct: true
        text:
          en: "Taking a partial exit at a milestone set in the plan."
          es: "Tomar un parcial en un hito fijado en el plan."
      - id: c
        correct: true
        text:
          en: "Doing nothing while the structure is unchanged."
          es: "No hacer nada mientras la estructura no cambia."
      - id: d
        text:
          en: "Widening the stop so a losing trade has more room to recover its ground."
          es: "Ensanchar el stop para que una operación perdedora tenga más recorrido."
    explanation:
      en: "Break-even behind new structure, a planned partial, and doing nothing are all valid, because each was either decided in advance or justified by the chart. Widening the stop is the one move that is never legitimate — it is the cardinal sin, and 'more room' is the story it always tells."
      es: "Break-even tras estructura nueva, un parcial planificado y no hacer nada son todos válidos, porque cada uno se decidió de antemano o lo justifica el gráfico. Ensanchar el stop es el único movimiento que nunca es legítimo: es el pecado capital, y «más espacio» es la historia que siempre cuenta."
  - id: partial-tradeoff
    prompt:
      en: "You take half your position off at +2R and let the rest run. What is the honest trade-off of this partial exit?"
      es: "Quitas la mitad de tu posición en +2R y dejas correr el resto. ¿Cuál es el compromiso honesto de esta salida parcial?"
    options:
      - id: a
        text:
          en: "It strictly increases expectancy, since banked profit can never be given back."
          es: "Aumenta la esperanza sin más, ya que el beneficio asegurado no se devuelve."
      - id: b
        text:
          en: "It is the same move as widening the stop, only expressed in position size."
          es: "Es el mismo movimiento que ensanchar el stop, dicho en tamaño de posición."
      - id: c
        text:
          en: "It guarantees the remaining half reaches the target, since it now rides free."
          es: "Garantiza que la mitad restante llega al objetivo, porque ya va sin riesgo."
      - id: d
        correct: true
        text:
          en: "It banks progress and lowers the emotional stakes, but it lowers your average R too."
          es: "Asegura avance y baja la carga emocional, pero también baja tu R media."
    explanation:
      en: "Partials are a legitimate tool but not a free win: they cap the upside on the portion you sold, so over many trades the average R comes down in exchange for lower emotional stakes and a smoother equity curve. That is a choice, and it belongs in the plan rather than in the heat of the moment."
      es: "Los parciales son una herramienta legítima pero no un regalo: limitan el recorrido de la parte que vendiste, así que en muchas operaciones la R media baja a cambio de menos carga emocional y una curva más suave. Es una elección, y pertenece al plan, no al calor del momento."
  - id: daily-stop-scenario
    prompt:
      en: "Your plan says: risk 1% per trade (100 USDT on a 10.000 USDT account) and a daily stop at −2% (200 USDT). Today you have taken two full stop-outs, so you are −200 USDT. An hour later a textbook setup appears. What does the plan say you do?"
      es: "Tu plan dice: arriesgar el 1% por operación (100 USDT en una cuenta de 10.000 USDT) y un freno diario en −2% (200 USDT). Hoy has encajado dos stops completos, así que estás en −200 USDT. Una hora después aparece un setup de manual. ¿Qué dice el plan que hagas?"
    options:
      - id: a
        text:
          en: "Take it at normal size — the daily stop only caps oversized positions."
          es: "Tomarla al tamaño normal: el freno solo limita posiciones sobredimensionadas."
      - id: b
        correct: true
        text:
          en: "Stop for the day: the daily limit is already hit, whatever this setup looks like."
          es: "Parar por hoy: el freno diario ya está alcanzado, parezca lo que parezca."
      - id: c
        text:
          en: "Take it at double size — a quality setup is the fastest way back to even."
          es: "Tomarla al doble: un setup de calidad es la vía rápida de volver a cero."
      - id: d
        text:
          en: "Take it after moving the daily stop to −4% so the risk fits the budget."
          es: "Tomarla tras mover el freno a −4% para que el riesgo entre en el presupuesto."
    explanation:
      en: "The daily stop is not a suggestion and it does not judge setups: once realised PnL hits −X% you close the charts regardless of what is on screen. Its whole value is that it does not consult you at the moment you are least able to answer, and 'but this one is high quality' is exactly the argument it exists to overrule."
      es: "El freno diario no es una sugerencia y no juzga setups: cuando el PnL realizado toca el −X%, cierras los gráficos sin importar lo que haya en pantalla. Todo su valor es que no te consulta en el momento en que menos capaz eres de responder, y «pero esta es de calidad» es justo el argumento que existe para desautorizar."
  - id: daily-stop-adjust-tf
    kind: true_false
    prompt:
      en: "The X in your daily stop is a personal number, but it is chosen in the plan before a losing day and never edited during one."
      es: "La X de tu freno diario es un número personal, pero se elige en el plan antes de un día perdedor y nunca se edita durante él."
    answer: true
    explanation:
      en: "Editing the limit while you are down is the override the rule was built to prevent: the person who just lost 3% is the least qualified person to decide how much more they may lose."
      es: "Editar el límite mientras vas perdiendo es exactamente la excepción que la regla existe para evitar: quien acaba de perder un 3% es la persona menos cualificada para decidir cuánto más puede perder."
