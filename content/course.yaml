      es: 'Órdenes en reposo en lugar de operaciones ejecutadas: profundidad y slippage, muros, spoofing e icebergs, el desequilibrio como lectura de saturación y el mecanismo detrás del libro que se adelgaza antes de una publicación programada en m15. Conceptual, con las herramientas reales nombradas.'
