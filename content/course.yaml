    title:
      en: 'Trading styles: scalping, day trading, swing'
      es: 'Estilos de trading: scalping, day trading, swing'
    summary:
      en: 'What changes across timeframes: funding weight, fees eating the edge, 24/7 market, time and mental demands. Then the two charts a style quietly hands you — the higher frame for context, the lower for execution — and the pullback one of them calls a trend.'
      es: 'Qué cambia entre temporalidades: peso del funding, comisiones que se comen el edge, mercado 24/7, exigencia mental. Y luego los dos gráficos que te da el estilo sin decirlo —la temporalidad mayor para el contexto, la menor para la ejecución— y el pullback que una de ellas llama tendencia.'
