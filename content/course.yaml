# SPDX-License-Identifier: AGPL-3.0-only
# TradeSchool course manifest — course → blocks → modules → lessons → exercises (stable ids, order = list position).
# IDs are globally unique; a future course must namespace its ids (see content/README.md).
# `key` is the permanent identity (seeds, progress, glossary origins): chosen once, NEVER renamed.
# It is written explicitly where it differs from the id — the 2026-08-10 renumbering — and defaults
# to the id everywhere else.
course:
  id: crypto-futures
  title:
    en: "Crypto Perpetual Futures: The Beginner's Guide"
    es: 'Futuros perpetuos cripto: la guía de iniciación'
  # The book's short name: the cover and the app print the full title, the PDF's running footer prints this.
  subtitle:
    en: The Beginner's Guide
    es: La guía de iniciación
  description:
    en: 'From zero to your first trading plan: reading the market, sizing positions, and managing risk.'
    es: 'De cero a tu primer plan de trading: leer el mercado, dimensionar posiciones y gestionar el riesgo.'
