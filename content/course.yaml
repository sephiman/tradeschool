# SPDX-License-Identifier: AGPL-3.0-only
# TradeSchool course manifest — canonical structure, order (list position) and advisory
# prerequisites (`assumes`). Localized labels live here; lesson prose lives in content/<lang>/lessons/.
# Phase 1 authored m01/m06/m12; Phase 2 authored the remaining 20 modules (this file wires them).
blocks:
- id: block-a
  title:
    en: Foundations
    es: Fundamentos
  modules:
  - id: m01
    title:
      en: What crypto is
      es: Qué es cripto
    summary:
      en: Blockchain at user level; Bitcoin vs altcoins vs stablecoins; what confers value and what doesn't.
      es: Blockchain a nivel de usuario; Bitcoin vs altcoins vs stablecoins; qué da valor y qué no.
    assumes: []
    lessons:
    - id: m01-l1
      title:
        en: What crypto actually is
        es: Qué es realmente cripto
      exercises:
      - id: m01-ex-1
        type: quiz
      - id: m01-ex-2
        type: quiz
  - id: m02
    title:
      en: Exchanges and custody
      es: Exchanges y custodia
    summary:
      en: 'CEX vs DEX, spot, basic orders, the order book, custody and ''not your keys''. Security: 2FA, read-only API keys.'
      es: 'CEX vs DEX, spot, órdenes básicas, el libro de órdenes, custodia y ''not your keys''. Seguridad: 2FA, API keys de solo lectura.'
    assumes:
    - m01
    lessons:
    - id: m02-l1
      title:
        en: What an exchange is and who holds your coins
        es: Qué es un exchange y quién guarda tus monedas
      exercises:
      - id: m02-ex-1
        type: quiz
      - id: m02-ex-2
        type: quiz
      - id: m02-ex-3
        type: quiz
      - id: m02-ex-4
        type: quiz
  - id: m03
    title:
      en: Reading the market
      es: Leer el mercado
    summary:
      en: OHLC candles, timeframes, volume, trend vs range, support and resistance without mysticism.
      es: Velas OHLC, temporalidades, volumen, tendencia vs rango, soportes y resistencias sin misticismo.
    assumes:
    - m01
    - m02
    lessons:
    - id: m03-l1
      title:
        en: Reading a price chart
        es: Leer un gráfico de precio
      exercises:
