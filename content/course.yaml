  # m21 closes block D, after tokenomics. Both of its lessons are the far side of something m19 taught
  # — the carry IS m19-l1's basis and funding read from the seller's chair, and the calendar is the
  # third and last outing of m19's "conditions, never direction" mould — and m21-l2 reads a token
  # unlock as a calendar event, leaning on m20's tokenomics. As m34 it sat BEFORE m20 and that lean was
  # a forward reference; the 2026-08-10 renumbering moved it here, which fixed it. `assumes` stays the
  # short advisory list (m04, m19): m20 is a pointer rather than a prerequisite.
  - id: m21
    key: m34
    title:
      en: The market around the chart
      es: El mercado alrededor del gráfico
    summary:
      en: 'The two things that move price from outside the chart, both with mechanics you can read: the cash-and-carry, sold as free money and actually a thin-margin business whose short leg can be liquidated in a rally that its own spot leg is winning; and the calendar of unlocks, listings, expiries and outages, none of which predicts direction and all of which predicts conditions.'
      es: 'Las dos cosas que mueven el precio desde fuera del gráfico, las dos con mecánica legible: el cash-and-carry, que se vende como dinero gratis y es un negocio de margen fino cuya pata corta puede liquidarse en un rally que su propia pata de spot está ganando; y el calendario de unlocks, listings, vencimientos y caídas de servicio, que no predice ninguna dirección y sí predice las condiciones.'
    assumes:
    - m04
    - m06
    - m19
    lessons:
    - id: m21-l1
      key: m34-l1
