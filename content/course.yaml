# SPDX-License-Identifier: AGPL-3.0-only
# TradeSchool course manifest — course → blocks → modules → lessons → exercises (stable ids, order = list position).
# IDs are globally unique; a future course must namespace its ids (see content/README.md).
course:
  id: crypto-futures
  title:
    en: Crypto Futures, from Zero
    es: Futuros de cripto, desde cero
  description:
    en: From absolute zero to a complete trading plan for crypto perpetual futures — read the market, size positions, manage risk, and run a disciplined process.
    es: 'Desde cero absoluto hasta un plan de trading completo para futuros perpetuos de cripto: leer el mercado, dimensionar posiciones, gestionar el riesgo y seguir un proceso disciplinado.'
blocks:
- id: block-a
  title:
    en: Foundations
    es: Fundamentos
  modules:
  - id: m01
    title:
      en: What crypto is
      es: Qué es cripto
    summary:
      en: Blockchain at user level; Bitcoin vs altcoins vs stablecoins; what confers value and what doesn't.
      es: Blockchain a nivel de usuario; Bitcoin vs altcoins vs stablecoins; qué da valor y qué no.
    assumes: []
    lessons:
    - id: m01-l1
      title:
        en: What crypto actually is
        es: Qué es realmente cripto
      exercises:
      - id: m01-ex-1
        type: quiz
      - id: m01-ex-2
        type: quiz
  - id: m02
    title:
      en: Exchanges and custody
      es: Exchanges y custodia
    summary:
      en: 'CEX vs DEX, spot, basic orders, the order book, custody and ''not your keys''. Security: 2FA, read-only API keys.'
      es: 'CEX vs DEX, spot, órdenes básicas, el libro de órdenes, custodia y ''not your keys''. Seguridad: 2FA, API keys de solo lectura.'
    assumes:
    - m01
    lessons:
    - id: m02-l1
      title:
