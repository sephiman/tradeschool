  # m28 is block E's capstone: m25 states expectancy as a claim, m28 is how the claim gets tested, and
  # it leans on m26's streak psychology (the abandonment criterion) and m27's journal (the sample). As
  # m33 it sat between m25 and m26 — BEFORE the two modules it treats as known — because the old
  # ids-never-renumber rule made mid-block insertion the least-bad option; the 2026-08-10 renumbering
  # (content/README.md) moved it after its dependencies and gave it the id the position reads as.
  - id: m28
    key: m33
    title:
      en: Validating a system
      es: Validar un sistema
    summary:
      en: 'm25''s expectancy is a testable claim, and untested it is worth nothing: the honest manual backtest, why twenty trades cannot tell a system from a coin, overfitting as the cardinal sin, forward-testing as the last filter, and an abandonment criterion fixed before the drawdown that would make you want one.'
      es: 'La esperanza de m25 es una afirmación comprobable y, sin comprobar, no vale nada: el backtest manual honesto, por qué veinte operaciones no distinguen un sistema de una moneda, el sobreajuste como pecado capital, el forward-testing como último filtro y un criterio de abandono fijado antes del drawdown que te haría quererlo.'
    assumes:
    - m22
    - m25
    lessons:
    - id: m28-l1
      key: m33-l1
      title:
        en: Validating a system
        es: Validar un sistema
