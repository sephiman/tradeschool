    title:
      en: What order flow adds
      es: Qué añade el flujo de órdenes
    summary:
      en: 'A candle is an aggregate that hides who was pressing: maker vs taker, the aggressor, and delta as the number OHLCV throws away. Plus the block''s own map — what it teaches with generated charts and what it honestly cannot.'
      es: 'Una vela es un agregado que esconde quién presionaba: maker vs taker, el agresor y el delta como el número que el OHLCV descarta. Además el mapa del bloque: qué enseña con gráficos generados y qué, honestamente, no puede.'
