id: fig-m24-trade-anatomy
kind: chart
caption:
  en: 'One trade, drawn. The confluence level is tested twice as resistance, broken,
    and comes back as support; price pierces it with a rejection wick and closes back
    above. The three plan lines were fixed before entering: entry at that close, stop
    under the wick, target at the prior high the impulse printed. The prices are generated
    — this lesson''s worked numbers stay in the text.'
  es: 'Una operación, dibujada. El nivel de confluencia se testea dos veces como resistencia,
    se rompe y vuelve como soporte; el precio lo perfora con una mecha de rechazo y
    cierra de vuelta por encima. Las tres líneas del plan quedaron fijadas antes de
    entrar: entrada en ese cierre, stop bajo la mecha, objetivo en el máximo previo
    que imprimió el impulso. Los precios están generados: los números trabajados de
    esta lección viven en el texto.'
