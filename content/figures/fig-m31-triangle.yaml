id: fig-m31-triangle
kind: chart
caption:
  en: 'A symmetric triangle: the same convergence, split evenly between the two lines instead
    of carried by one. The ceiling comes down as fast as the floor comes up, so nothing about
    the shape points anywhere — which is the honest version of what every converging pattern
    tells you. Same mechanic as the wedge, different share of the work.'
  es: 'Un triángulo simétrico: la misma convergencia, repartida a partes iguales entre las dos
    líneas en lugar de cargada por una. El techo baja tan rápido como sube el suelo, así que
    nada en la figura apunta a ningún sitio, que es la versión honesta de lo que te dice
    cualquier patrón convergente. La misma mecánica que la cuña, con otro reparto del trabajo.'
panels:
