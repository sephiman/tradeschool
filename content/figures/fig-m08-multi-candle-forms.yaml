id: fig-m08-multi-candle-forms
kind: chart
caption:
  en: 'The same two mechanics wearing more names. Morning / evening star: a rejection
    told across three candles instead of one. Harami: a small candle swallowed by the
    prior range — compression after an impulse. Tweezers: two candles rejected at the
    same level — a double rejection.'
  es: 'Las mismas dos mecánicas con más nombres. Estrella de la mañana / del atardecer:
    un rechazo contado en tres velas en vez de una. Harami: una vela pequeña engullida
    por el rango anterior —compresión tras un impulso—. Pinzas: dos velas rechazadas
    en el mismo nivel —un doble rechazo—.'
