id: fig-m30-origin-zone
kind: chart
caption:
  en: 'What the dialect calls an order block, read as mechanics. A range high tested twice,
    then the last down candles before the move (the shaded zone, marked "origin"), then a
    close clean past that high — the break, BOS. Price comes back to the zone, trades into it,
    holds it and leaves. The zone is not magic: the size that caused the impulse was
    working there and could not all get filled, so the remainder is what the return found.'
  es: 'Lo que el dialecto llama order block, leído como mecánica. Un máximo de rango testeado
    dos veces, luego las últimas velas bajistas antes del movimiento (la zona sombreada,
    marcada "origen") y después un cierre limpio por encima de ese máximo: la ruptura, BOS.
    El precio vuelve a la zona, entra en ella, la respeta y se va. La zona
    no tiene nada de mágico: el tamaño que causó el impulso estaba trabajando ahí y no pudo
    llenarse del todo, así que lo que encontró la vuelta es el resto.'
panels:
- generator: pattern_chart
  injector: origin_zone
  target: zone_respected
  # Seeds across the figures built on these injectors are picked to land on DIFFERENT base-price tiers —
  # every injector draws its anchor from the same five-tier table with the same two opening draws, so two
  # figures sharing a seed print the same prices to the cent. This one takes the 1,850 tier; the m30
  # imbalance figure takes the 27,000 one.
  seed: 16
  n: 150
  indicator: none
  resolution:
    # The zone held, so the figure shows what that bought: the move continuing away from it. This is the
    # half an exercise must cut — `m30-ex-1` stops at the return and asks what it did.
    direction: up
    strength: 0.1
