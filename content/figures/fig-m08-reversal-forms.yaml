id: fig-m08-reversal-forms
kind: chart
caption:
  en: 'The two mechanics at a level. Hammer: sellers pushed to the low, were absorbed,
    and lost — a rejection at support. Shooting star: the same rejection inverted at
    resistance. Bullish / bearish engulfing: one side steamrolled the prior candle''s
    whole range — an overrun.'
  es: 'Las dos mecánicas en un nivel. Martillo: los vendedores empujaron al mínimo,
    fueron absorbidos y perdieron —un rechazo en soporte—. Estrella fugaz: el mismo
    rechazo invertido en resistencia. Envolvente alcista / bajista: un lado arrolló
    todo el rango de la vela anterior —un overrun—.'
