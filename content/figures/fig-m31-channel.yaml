id: fig-m31-channel
kind: chart
caption:
  en: 'The rhythm with a band, both ways up, and ending two different ways. Left: a rising
    channel — the line drawn through the lows, a parallel projected from the highs, price
    alternating between them — that ends by losing the line it was built on. Right: the same
    construction on a falling market, where the drawn line is the ceiling and the parallel
    the floor, ending by accelerating out through that floor. Which line a channel leaves
    through is a property of each instance, not of channels: either ending is available to
    either slope, and the two mean different things — an acceleration, or the rhythm giving
    out. The channel describes the regularity that HAS held; trading it is a bet that the
    regularity continues, and that bet is the part no chart can show you.'
  es: 'El ritmo con banda, en los dos sentidos y terminando de dos maneras distintas.
    Izquierda: un canal alcista —la línea trazada por los mínimos, una paralela proyectada
    desde los máximos, el precio alternando entre ambas— que acaba perdiendo la línea sobre
    la que estaba construido. Derecha: la misma construcción en un mercado bajista, donde la
    línea trazada es el techo y la paralela es el suelo, y que acaba acelerando y saliendo
    por ese suelo. Por qué línea se va un canal es una propiedad de cada instancia, no de los
    canales: los dos finales están disponibles para cualquier pendiente, y significan cosas
    distintas —una aceleración, o el ritmo agotándose—. El canal describe la regularidad que
    SÍ se ha cumplido; operarlo es apostar a que la regularidad continúa, y esa apuesta es la
    parte que ningún gráfico puede enseñarte.'
panels:
# Both directions, because this family is bidirectional from birth — see the note in
# `trend_channel.py` and the guard in `test_chart_diagonals.py` §4. The two panels do NOT share a
# seed: unlike m08's breakout/fakeout pair, the point here is not "identical chart, one difference"
# but "the same construction, mirrored", so they are two independent instances on two tiers.
#
# And they carry DIFFERENT ENDINGS on purpose. The first version of this figure resolved both panels
# with their own slope — the rising channel out of its top, the falling one out of its bottom — and a
# reader took the pair to mean "channels break in their own direction", which is not a rule this
# course endorses. Two panels cannot cover both exit modes AND both exit directions at once, so the
# variety spent here is the MODE, which is the part that carries a mechanism; the caption and
# m31-l1's prose say in words that the direction is not the claim. (The same trap the m32 pair avoids
# by resolving one expansion down and the other up.)
- generator: pattern_chart
  injector: trend_channel
  # A rising channel that ends by losing its own floor: the rhythm gave out. Same seed and therefore
  # the same tier and anchors as the with-slope version this replaced — only the ending changed.
  target: channel_failed
  seed: 6
  n: 150
  indicator: none
  resolution:
    direction: down
    strength: 0.12
- generator: pattern_chart
  injector: trend_channel
  # ...and a falling channel that ends the other way, accelerating out through its far edge.
  target: channel_broken
  seed: 24
  n: 150
  indicator: none
  resolution:
    direction: down
    strength: 0.12
