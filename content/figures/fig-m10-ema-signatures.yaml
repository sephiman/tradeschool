id: fig-m10-ema-signatures
kind: chart
caption:
  en: 'The three EMA signatures. Uptrend: fast above slow, both rising, price above.
    Downtrend: the mirror. Range: the EMAs flat and intertwined while price chops
    across them — where they whipsaw.'
  es: 'Las tres firmas de las EMA. Alcista: la rápida sobre la lenta, ambas subiendo,
    precio por encima. Bajista: la imagen espejo. Rango: las EMA planas y entrelazadas
    mientras el precio las cruza —donde dan sierra—.'
