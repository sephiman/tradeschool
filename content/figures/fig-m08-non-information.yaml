caption:
  en: 'What does NOT mean anything. Doji: open and close almost equal — nobody won,
    indecision, not a signal. Small-range candle: a tiny bar after movement — compression,
    the market waiting. Reading these as reversals is reading noise.'
  es: 'Lo que NO significa nada. Doji: apertura y cierre casi iguales —nadie ganó,
    indecisión, no una señal—. Vela de rango pequeño: una barra diminuta tras el
    movimiento —compresión, el mercado esperando—. Leerlas como giros es leer ruido.'
