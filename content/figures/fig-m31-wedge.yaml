id: fig-m31-wedge
kind: chart
caption:
  en: 'A rising wedge: two lines going the same way, the floor steeper than the ceiling, so
    the space between them closes. Read what each swing costs — price keeps making higher
    highs, but by less each time, against a ceiling that gives less each time. That is
    m08-l2''s compression candle at the scale of a pattern. The resolution direction the
    textbooks attach to this shape is a separate claim, and the lesson separates it.'
  es: 'Una cuña ascendente: dos líneas en el mismo sentido, con el suelo más inclinado que el
    techo, de modo que el espacio entre ambas se cierra. Fíjate en lo que cuesta cada swing:
    el precio sigue haciendo máximos más altos, pero cada vez por menos, contra un techo que
    cada vez concede menos. Eso es la vela de compresión de m08-l2 a escala de patrón. La
    dirección de resolución que los manuales asocian a esta figura es otra afirmación
    distinta, y la lección las separa.'
panels:
- generator: pattern_chart
  injector: converging_lines
  target: rising_wedge
  # The 27,000 tier; the triangle figure beside it takes 480.
  seed: 0
  n: 150
  indicator: none
  resolution:
    # The conventional break for this shape, shown as ONE instance rather than as a rule — which is
    # exactly the distinction the lesson draws around it. The caption says so and so does the prose.
    direction: down
    strength: 0.10
