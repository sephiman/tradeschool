id: fig-m15-trendline
key: fig-m31-trendline  # pre-renumber identity (2026-08-10); never renamed
kind: chart
caption:
  en: 'A validated trendline and the break that ends it. Four times price came back to the
    same rising line and turned; the line is drawn through those visits and projected
    forward — that projection, not the drawn segment, is what the break is judged against.
    The decision is a BODY closing clearly below it on a clear surge of volume, and the
    closing stretch is what that bought. A wick through the same line would have been
    nothing at all.'
  es: 'Una línea de tendencia validada y la ruptura que la termina. Cuatro veces volvió el
    precio a la misma línea ascendente y giró; la línea se traza por esas visitas y se
    proyecta hacia delante, y es esa proyección —no el segmento dibujado— contra la que se
    juzga la ruptura. La decisión es un CUERPO que cierra claramente por debajo con un
    repunte claro de volumen, y el tramo final es lo que eso compró. Una mecha que
    atravesara esa misma línea no habría sido nada.'
panels:
# Seeds across this family's figures are picked to land on DIFFERENT base-price tiers, the same
# discipline the m34 figures document: every injector draws its anchor from one five-tier table with
# the same two opening draws, so two figures sharing a seed print the same prices to the cent.
# This one takes the 9,500 tier and a RISING line; the channel figure takes 1,850 and 480.
- generator: pattern_chart
  injector: trend_channel
  target: line_break
  seed: 4
  n: 150
  indicator: none
  resolution:
    # Down and away: the trend the line supported is over, which is the half an exercise must cut.
    # Stated explicitly because the direction depends on the seed's own rising/falling draw, exactly
    # as it does for the m08 fakeout figure.
    direction: down
    strength: 0.13
