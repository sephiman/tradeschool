id: fig-m17-liquidity-sweep
kind: chart
caption:
  en: 'The pool below a shelf, taken. A low that held twice has stop-losses and liquidation
    prices parked just under it; one violent wick reaches through that band and price
    is back above the level within a candle. The tell is the reclaim: a genuine break
    holds beyond the line, a sweep pierces it and comes straight back.'
  es: 'La bolsa bajo una repisa, tomada. Un mínimo que ha aguantado dos veces tiene
    stop-loss y precios de liquidación aparcados justo debajo; una sola mecha violenta
    atraviesa esa banda y el precio vuelve por encima del nivel en una vela. La pista
    es la recuperación: una ruptura genuina aguanta más allá de la línea, un barrido
    la perfora y vuelve de inmediato.'
panels:
- generator: pattern_chart
  injector: liquidity_sweep
  target: liquidity_sweep
  # Seeds across the figures built on these injectors are picked to land on DIFFERENT base-price tiers.
  # Each of them draws its level at `base`, so two figures sharing a seed print the same anchor to the
  # cent — three charts labelled 2016.67 read as a bug, whatever else is different about them.
  seed: 2
  n: 150
  indicator: none
  resolution:
    direction: up
    strength: 0.1
