id: fig-m23-timeframes
key: fig-m20-timeframes  # pre-renumber identity (2026-08-10); never renamed
kind: chart
caption:
  en: 'ONE stretch of price, drawn twice. The lower panel is the 1h chart; the upper one is the
    same bars in fours — every 4h candle opens where the first of its four opened, closes where
    the fourth closed, and reaches the highest high and lowest low any of them made. Nothing
    was added and nothing was removed. Read the right-hand edge on the 1h alone and you see a
    rally: higher lows, higher highs, some four hundred points off the bottom. Read it on the
    4h and the same bars are one candle of pullback inside a fall that has not stopped —
    price is still far below where the leg began, and the last stretch shows what that
    pullback was worth. The lower frame was not wrong about its rally. It was answering a
    smaller question than the one being asked.'
  es: 'Un mismo tramo de precio, dibujado dos veces. El panel de abajo es el gráfico de 1h; el
    de arriba son esas mismas barras de cuatro en cuatro: cada vela de 4h abre donde abrió la
    primera de sus cuatro, cierra donde cerró la cuarta y alcanza el máximo más alto y el
    mínimo más bajo que hiciera cualquiera de ellas. No se ha añadido nada y no se ha quitado
    nada. Mira el borde derecho solo en 1h y ves un rally: mínimos crecientes, máximos
    crecientes, unos cuatrocientos puntos desde el suelo. Míralo en 4h y esas mismas barras
    son una vela de pullback dentro de una caída que no se ha detenido: el precio sigue muy
    por debajo de donde empezó el tramo, y el último trecho enseña lo que valía ese pullback.
    La temporalidad menor no se equivocaba sobre su rally. Contestaba a una pregunta más
    pequeña que la que se estaba haciendo.'
panels:
# ONE panel, and it carries two charts: the second is the `context` the injector aggregates out of
# this one, not an independent instance. That is the whole claim — a two-panel figure of the m19-l1
# kind would be two seeds that merely look related, and this one has to be the SAME candles.
#
# The higher frame falls, deliberately. A pullback inside an UPtrend is the shape every reader already
# has a name for ("buy the dip"), so the figure that teaches the error uses the one that has to be
# read rather than recognised: the lower frame rallies, and the rally is what gets bought.
- generator: pattern_chart
  injector: multi_timeframe
  target: pullback_against_trend
  # The 9,500 tier. 160 lower bars aggregate to exactly 40 upper ones, and the appended resolution
  # adds 24 more of the first and 6 of the second — both whole numbers, which is what the warm-up and
  # the window length are chosen for (see `multi_timeframe.RATIO`).
  seed: 8
  n: 160
  indicator: none
  # No `resolution` block: which way this instance resolves is a property of its own seed, and the
  # injector's `resolution_hint` already knows it — the higher frame resumes, which IS the lesson.
