<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TradeSchool</title>
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Apply persisted theme before React mounts to avoid a flash of the wrong theme. Keep in sync
      // with resolve()/applyToDocument() in src/lib/theme.tsx: "oled" implies "dark" (it is the dark
      // theme plus a delta), and the system preference resolves to dark or light — never to oled.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var oled = stored === "oled";
          var dark = oled || stored === "dark" || ((!stored || stored === "system") && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
          if (oled) {
            document.documentElement.classList.add("oled");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100 oled:bg-oled-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
