# SPDX-License-Identifier: AGPL-3.0-only
[project]
name = "tradeschool"
version = "0.1.0"
description = "TradeSchool — interactive crypto futures trading academy (Sephilabs)"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
authors = [{ name = "Sephilabs" }]

# House rule: latest stable across all libraries; do not pin minor versions.
# uv.lock captures the resolved set for reproducible builds.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]",
    "pwdlib[argon2]",
    "slowapi",
    "python-multipart",
    "pyyaml",
    "numpy",
]

[project.scripts]
tradeschool = "tradeschool.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers[postgresql]",
    "asgi-lifespan",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeschool"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; don't fight its formatting.
"alembic/versions/*" = ["E501"]
# Formula explanations intentionally use the math glyphs × and − in the step-by-step display.
"src/tradeschool/exercises/formulas.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["slowapi.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
